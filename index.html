<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',Roboto,sans-serif;color:#fff}
#game-container{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden}
#game-canvas{display:block;width:100%;height:100%;background:#16213e;position:absolute;inset:0}
#ui-layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:2}
#ui-layer>*{pointer-events:auto}
#top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.1);z-index:10}
#currency-display,#level-display{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;color:#ffd166}
#level-display{color:#4ecdc4}
.icon-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:4px 8px;border-radius:8px;color:#fff}
.icon-btn:active{background:rgba(255,255,255,.1)}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;padding:20px;padding-top:70px;background:rgba(26,26,46,.95);backdrop-filter:blur(12px);z-index:5;overflow-y:auto}
.screen.active{display:flex}
#lobby h1{font-size:42px;margin-bottom:30px;background:linear-gradient(135deg,#ff6b35,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.lobby-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.main-btn{padding:16px 24px;font-size:18px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#ff6b35,#ff8c42);color:#fff;cursor:pointer;box-shadow:0 4px 15px rgba(255,107,53,.4)}
.main-btn:active{transform:scale(.96)}
.main-btn:disabled{opacity:.5;cursor:not-allowed}
.secondary-btn{padding:12px 20px;font-size:16px;font-weight:600;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.secondary-btn:active{background:rgba(255,255,255,.15)}
#order-panel{background:rgba(255,107,53,.15);border:1px solid rgba(255,107,53,.3);border-radius:16px;padding:16px;margin:10px;width:calc(100% - 20px);max-width:500px}
#order-items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.order-item{background:rgba(255,255,255,.1);padding:6px 12px;border-radius:20px;font-size:14px}
#order-timer{font-size:18px;font-weight:700;color:#ffd166}
#ingredients-panel{margin:10px;width:calc(100% - 20px);max-width:500px}
#ingredients-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:10px}
.ingredient-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:12px;cursor:pointer}
.ingredient-btn:active{background:rgba(255,255,255,.15);transform:scale(.95)}
.ingredient-btn .emoji{font-size:28px}
#burger-assembly{margin:10px;width:calc(100% - 20px);max-width:500px}
#burger-stack{min-height:120px;border:2px dashed rgba(255,255,255,.2);border-radius:12px;padding:10px;margin:10px 0;display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.burger-layer{width:80%;min-height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333;font-weight:700;padding:2px}
#levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;max-height:60vh;overflow-y:auto;width:100%;max-width:500px;padding:10px}

#tasks-list{width:100%;max-width:500px;display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto}

@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}

    }
};
let currentLang = 'ru';
function t(key){ return i18n[currentLang][key] || key; }

/* ============================================================
   VK BRIDGE WRAPPER
============================================================ */
const VKBridge = {
    available: typeof vkBridge !== 'undefined',
    init(){
        if(!this.available){ console.warn('VK Bridge не загружен'); return; }
        vkBridge.send('VKWebAppInit').catch(e=>console.warn(e));
        this.setupViewHandlers();
    },
    async saveData(key, value){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppStorageSet',{key, value:JSON.stringify(value)}); return true; }
        catch(e){ console.warn('save error',e); return false; }
    },
    async loadData(key){
        if(!this.available) return null;
        try{
            const r = await vkBridge.send('VKWebAppStorageGet',{keys:[key]});
            if(r.keys && r.keys[0] && r.keys[0].value) return JSON.parse(r.keys[0].value);
            return null;
        }catch(e){ console.warn('load error',e); return null; }
    },
    async clearAllData(){
        if(!this.available) return false;
        try{
            const r = await vkBridge.send('VKWebAppStorageGetKeys',{count:1000, offset:0});
            if(r.keys){
                for(const k of r.keys){
                    await vkBridge.send('VKWebAppStorageSet',{key:k, value:''});
                }
            }
            return true;
        }catch(e){ console.warn('clear error',e); return false; }
    },
    async showInterstitial(){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppShowNativeAds',{ad_format:'interstitial'}); return true; }
        catch(e){ console.warn('interstitial error',e); return false; }
    },
    async showRewarded(){
        if(!this.available) return false;
        try{
            const r = await vkBridge.send('VKWebAppShowNativeAds',{ad_format:'reward'});
            return r && r.result === true;
        }catch(e){ console.warn('reward error',e); return false; }
    },
    async showBanner(){
        if(!this.available) return;
        try{
            await vkBridge.send('VKWebAppGetLaunchParams');
            await vkBridge.send('VKWebAppShowBannerAd',{banner_location:'bottom'});
        }catch(e){ console.warn('banner error',e); }
    },
    async inviteFriends(){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppShowInviteBox'); return true; }
        catch(e){ console.warn('invite error',e); return false; }
    },
    setupViewHandlers(){
        if(!this.available) return;
        try{
            vkBridge.subscribe(e=>{
                if(!e || !e.detail) return;
                if(e.detail.type === 'VKWebAppViewHide'){
                    AudioManager.pauseMusic();
                    if(window.Game) Game.pause();
                } else if(e.detail.type === 'VKWebAppViewRestore'){
                    AudioManager.resumeMusic();
                    if(window.Game) Game.resume();
                }
            });
        }catch(e){ console.warn(e); }

        document.addEventListener('visibilitychange',()=>{
            if(document.hidden){ AudioManager.pauseMusic(); if(window.Game) Game.pause(); }
            else { AudioManager.resumeMusic(); if(window.Game) Game.resume(); }
        });
        window.addEventListener('blur',()=>AudioManager.pauseMusic());
        window.addEventListener('focus',()=>AudioManager.resumeMusic());
    }
};

/* ============================================================
   AUDIO MANAGER
============================================================ */
const AudioManager = {
    musicEnabled: true,
    musicPlaying: false,
    audioContext: null,
    musicTimer: null,
    notes: [262, 294, 330, 349, 392, 440, 494, 523],

    init(){
        const initAudio = ()=>{
            if(!this.audioContext){
                try{ this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
                catch(e){ console.warn(e); }
            }
            if(this.audioContext && this.audioContext.state === 'suspended') this.audioContext.resume();
            document.removeEventListener('touchstart', initAudio);
            document.removeEventListener('click', initAudio);
        };
        document.addEventListener('touchstart', initAudio, {once:true});
        document.addEventListener('click', initAudio, {once:true});
    },

    playNote(){
        if(!this.musicPlaying || !this.musicEnabled || !this.audioContext) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = this.notes[Math.floor(Math.random()*this.notes.length)];
        const now = this.audioContext.currentTime;
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(gain); gain.connect(this.audioContext.destination);
        osc.start(now); osc.stop(now + 0.6);
        this.musicTimer = setTimeout(()=>this.playNote(), 700);
    },

    startMusic(){
        if(!this.musicEnabled || this.musicPlaying || !this.audioContext) return;
        this.musicPlaying = true;
        this.playNote();
    },

    stopMusic(){
        this.musicPlaying = false;
        if(this.musicTimer){ clearTimeout(this.musicTimer); this.musicTimer = null; }
    },

    pauseMusic(){ this.stopMusic(); },
    resumeMusic(){ if(this.musicEnabled) this.startMusic(); },
    toggleMusic(enabled){
        this.musicEnabled = enabled;
        if(enabled) this.startMusic();
        else this.stopMusic();
    },

    playSound(type){
        if(!this.audioContext) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        const now = this.audioContext.currentTime;
        if(type === 'click'){
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if(type === 'correct'){
            osc.frequency.value = 523;
            osc.frequency.linearRampToValueAtTime(1046, now + 0.2);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if(type === 'error'){
            osc.type = 'sawtooth';
            osc.frequency.value = 200;
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if(type === 'coin'){
            osc.frequency.value = 1200;
            osc.frequency.linearRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        }
        osc.connect(gain); gain.connect(this.audioContext.destination);
    }
};

        {id:'bacon',      name:'Бекон',          emoji:'🥓'}
    ],
    premiumIngredients: [
        {id:'double_patty', name:'Двойная котлета', emoji:'🥩', price:500},
        {id:'cheddar',      name:'Чеддер',          emoji:'🧀', price:400},
        {id:'avocado',      name:'Авокадо',         emoji:'🥑', price:800},
        {id:'truffle',      name:'Трюфель',         emoji:'🍄', price:1500},
        {id:'gold_leaf',    name:'Золотой лист',    emoji:'✨', price:3000}
    ],
    all(){ return this.baseIngredients.concat(this.premiumIngredients); },

    getLevel(n){
        const ingredientCount = Math.min(3 + Math.floor(n / 100), 8);
        const timeLimit = Math.max(60 - Math.floor(n / 10) * 2, 20);
        const reward = 50 + n * 10;
        let available = [...this.baseIngredients];
        if(n > 200) available = available.concat(this.premiumIngredients.slice(0,2));
        if(n > 350) available = available.concat(this.premiumIngredients.slice(2,4));

        const shuffled = [...available].sort(()=>Math.random()-0.5);
        const order = [];
        for(let i=0; i<Math.min(ingredientCount, shuffled.length); i++){
            order.push(shuffled[i].id);
        }
        return {
            level:n, order, timeLimit, reward,
            availableIngredients: available.map(i=>i.id)
        };
    },

    getColor(id){
        const c = {
            bun_bottom:'#d4a574', bun_top:'#d4a574', patty:'#8b4513', cheese:'#ffd700',
            lettuce:'#90ee90', tomato:'#ff6347', onion:'#dda0dd', pickle:'#6b8e23',
            sauce:'#ff4500', bacon:'#b22222', double_patty:'#654321', cheddar:'#ffa500',
            avocado:'#556b2f', truffle:'#2f2f2f', gold_leaf:'#ffd700'
        };
        return c[id] || '#ccc';
    }
};

    taskPool: [
        {id:'serve_5',          type:'serve',           target:5,  reward:100, text:'Подайте 5 бургеров'},
        {id:'serve_10',         type:'serve',           target:10, reward:200, text:'Подайте 10 бургеров'},

        {id:'perfect_3',        type:'perfect',         target:3,  reward:150, text:'Соберите 3 идеальных бургера'},
        {id:'perfect_5',        type:'perfect',         target:5,  reward:300, text:'Соберите 5 идеальных бургеров'},
        {id:'earn_500',         type:'earn',            target:500,reward:150, text:'Заработайте 500 монет'},
        {id:'earn_1000',        type:'earn',            target:1000,reward:300,text:'Заработайте 1000 монет'},
        {id:'complete_3_levels',type:'complete_levels', target:3,  reward:200, text:'Пройдите 3 уровня'},
        {id:'complete_5_levels',type:'complete_levels', target:5,  reward:400, text:'Пройдите 5 уровней'},
        {id:'use_ing_10',       type:'use_ingredient',  target:10, reward:100, text:'Используйте 10 ингредиентов'},
        {id:'use_ing_25',       type:'use_ingredient',  target:25, reward:250, text:'Используйте 25 ингредиентов'},
        {id:'invite_friend',    type:'invite',          target:1,  reward:500, text:'Пригласите друга'}
    ],
    dailyTasks: [],
    progress: {},
    lastUpdate: null,

    init(saved){
        const today = new Date().toDateString();
        if(saved && saved.lastTaskUpdate === today && saved.dailyTasks){
            this.dailyTasks = saved.dailyTasks;
            this.progress = saved.taskProgress || {};
            this.lastUpdate = today;
        } else {
            this.generateDailyTasks();
        }
    },
    generateDailyTasks(){
        const shuffled = [...this.taskPool].sort(()=>Math.random()-0.5);
        this.dailyTasks = shuffled.slice(0,10).map(t=>({...t, completed:false, claimed:false}));
        this.progress = {};
        this.lastUpdate = new Date().toDateString();
    },
    updateProgress(type, amount=1){
        this.dailyTasks.forEach(task=>{
            if(task.completed || task.type !== type) return;
            this.progress[task.id] = (this.progress[task.id] || 0) + amount;
            if(this.progress[task.id] >= task.target){
                task.completed = true;
                GameState.save();
                if(window.Game) Game.showToast('✓ ' + task.text);
            }
        });
    },
    claimReward(taskId){
        const task = this.dailyTasks.find(t=>t.id === taskId);
        if(task && task.completed && !task.claimed){
            task.claimed = true;
            GameState.coins += task.reward;
            GameState.save();
            AudioManager.playSound('coin');
            return task.reward;
        }
        return 0;
    },
    getSaveData(){
        return { lastTaskUpdate: this.lastUpdate, dailyTasks: this.dailyTasks, taskProgress: this.progress };
    }
};

/* ============================================================
   AFK ROOM
============================================================ */
const AFKRoom = {
    active: false,
    interval: null,
    accumulatedCoins: 0,
    totalMinutes: 0,
    rate: 1,

    start(){
        if(this.active) return;
        this.active = true;
        this.accumulatedCoins = 0;
        this.updateUI();
        this.interval = setInterval(()=>{
            if(!this.active) return;
            this.accumulatedCoins += this.rate;
            this.totalMinutes += 1;
            GameState.coins += this.rate;
            GameState.save();
            this.updateUI();
        }, 60000);
    },
    stop(){
        this.active = false;
        if(this.interval){ clearInterval(this.interval); this.interval = null; }
    },
    updateUI(){
        const r = document.getElementById('afk-rate');
        const e = document.getElementById('afk-earned');
        const tm = document.getElementById('afk-total');
        if(r) r.textContent = this.rate;
        if(e) e.textContent = this.accumulatedCoins;
        if(tm) tm.textContent = this.totalMinutes;
    },
    upgradeRate(){ this.rate += 1; }
};

   GAME STATE

const GameState = {
    coins: 0,
    currentLevel: 1,
    maxLevel: 1,
    completedLevels: [],
    musicEnabled: true,
    language: 'ru',
    purchasedIngredients: [],
    hasCoffeeMachine: false,
    hasLemonadeMachine: false,
    lastDailyReward: null,
    tutorialCompleted: false,
    totalBurgersServed: 0,
    totalPerfectBurgers: 0,
    totalCoinsEarned: 0,
    _saveTimeout: null,

    async load(){
        const saved = await VKBridge.loadData('burger_game_save');
        if(!saved) return false;
        this.coins = saved.coins || 0;
        this.currentLevel = saved.currentLevel || 1;
        this.maxLevel = saved.maxLevel || 1;
        this.completedLevels = saved.completedLevels || [];
        this.musicEnabled = saved.musicEnabled !== false;
        this.language = saved.language || 'ru';
        this.purchasedIngredients = saved.purchasedIngredients || [];
        this.hasCoffeeMachine = saved.hasCoffeeMachine || false;
        this.hasLemonadeMachine = saved.hasLemonadeMachine || false;
        this.lastDailyReward = saved.lastDailyReward || null;
        this.tutorialCompleted = saved.tutorialCompleted || false;
        this.totalBurgersServed = saved.totalBurgersServed || 0;
        this.totalPerfectBurgers = saved.totalPerfectBurgers || 0;
        this.totalCoinsEarned = saved.totalCoinsEarned || 0;
        if(saved.tasks) Tasks.init(saved.tasks);
        else Tasks.init(null);
        if(saved.afk){
            AFKRoom.totalMinutes = saved.afk.totalMinutes || 0;
            AFKRoom.rate = saved.afk.rate || 1;
        }
        return true;
    },

    save(){
        // Дебаунс сохранения, чтобы не спамить VK
        if(this._saveTimeout) clearTimeout(this._saveTimeout);
        this._saveTimeout = setTimeout(async()=>{
            const data = {
                coins: this.coins, currentLevel: this.currentLevel, maxLevel: this.maxLevel,
                completedLevels: this.completedLevels, musicEnabled: this.musicEnabled,
                language: this.language, purchasedIngredients: this.purchasedIngredients,
                hasCoffeeMachine: this.hasCoffeeMachine, hasLemonadeMachine: this.hasLemonadeMachine,
                lastDailyReward: this.lastDailyReward, tutorialCompleted: this.tutorialCompleted,
                totalBurgersServed: this.totalBurgersServed, totalPerfectBurgers: this.totalPerfectBurgers,
                totalCoinsEarned: this.totalCoinsEarned,
                tasks: Tasks.getSaveData(),
                afk: { totalMinutes: AFKRoom.totalMinutes, rate: AFKRoom.rate }
            };
            await VKBridge.saveData('burger_game_save', data);
        }, 500);
    }
};

============================================================ */
class BurgerGame {
    constructor(){
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.currentOrder = [];
        this.currentBurger = [];
        this.timeLeft = 60;
        this.timerInterval = null;
        this.gameActive = false;
        this.paused = false;
        this.animationFrame = null;
        this.lastTime = 0;
        this.backgroundOffset = 0;
        this.currentReward = 0;
        this.availableIngredients = [];
        this.tutorialStep = 0;
    }

    async init(){
        this.resizeCanvas();
        window.addEventListener('resize', ()=>this.resizeCanvas());

        VKBridge.init();
        const hasSave = await GameState.load();

        AudioManager.toggleMusic(GameState.musicEnabled);
        document.getElementById('music-toggle').checked = GameState.musicEnabled;
        document.getElementById('language-select').value = GameState.language;
        currentLang = GameState.language;
        this.applyLanguage();

        if(!hasSave) Tasks.init(null);

        this.setupEventListeners();
        this.updateCurrencyDisplay();
        VKBridge.showBanner();

        if(!GameState.tutorialCompleted){
            this.showTutorialPrompt();
        } else {
            this.showScreen('lobby');
        }

        this.lastTime = performance.now();
        this.gameLoop(this.lastTime);
    }

    applyLanguage(){
        document.getElementById('game-title').textContent = t('game_title');
        document.getElementById('play-btn').textContent = t('play');
        document.getElementById('levels-btn').textContent = t('levels');
        document.getElementById('tasks-btn').textContent = t('tasks');
        document.getElementById('afk-btn').textContent = t('afk_room');
        document.getElementById('daily-btn').textContent = t('daily_reward');
        document.getElementById('shop-btn').textContent = t('shop');
        document.getElementById('invite-btn').textContent = t('invite_friends');
        document.getElementById('serve-btn').textContent = t('serve');
        document.getElementById('clear-btn').textContent = t('clear');
        document.getElementById('double-reward-btn').textContent = t('double_reward');
        document.getElementById('next-level-btn').textContent = t('next_level');
        document.getElementById('back-lobby-btn').textContent = t('back_lobby');
        document.getElementById('tutorial-next').textContent = t('tutorial_next');
        document.getElementById('tutorial-skip').textContent = t('tutorial_skip');
        document.getElementById('daily-claim').textContent = t('claim');
        document.getElementById('levels-back').textContent = t('back');
        document.getElementById('tasks-back').textContent = t('back');
        document.getElementById('afk-back').textContent = t('back');
        document.getElementById('daily-back').textContent = t('back');
        document.getElementById('shop-back').textContent = t('back');
        document.getElementById('settings-back').textContent = t('back');
        document.getElementById('promo-btn').textContent = t('activate');
        document.getElementById('promo-input').placeholder = t('promo_code');
    }

    resizeCanvas(){
        const dpr = window.devicePixelRatio || 1;
        const rect = this.canvas.getBoundingClientRect();
        this.canvas.width = rect.width * dpr;
        this.canvas.height = rect.height * dpr;
        this.ctx.setTransform(1,0,0,1,0,0);
        this.ctx.scale(dpr, dpr);
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
        this.canvas._w = rect.width;
        this.canvas._h = rect.height;
    }

    gameLoop(timestamp){
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;
        if(!this.paused){
            this.update(dt);
            this.render();
        }
        this.animationFrame = requestAnimationFrame(t=>this.gameLoop(t));
    }

    update(dt){
        this.backgroundOffset = (this.backgroundOffset + dt * 20) % 40;
    }

    render(){
        const w = this.canvas._w || 300;
        const h = this.canvas._h || 300;
        const grad = this.ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(1, '#16213e');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, w, h);

        this.ctx.fillStyle = 'rgba(255,255,255,0.02)';
        const tile = 40;
        const off = this.backgroundOffset;
        for(let x = -tile; x < w + tile; x += tile){
            for(let y = -tile; y < h + tile; y += tile){
                this.ctx.fillRect(x + off, y, tile - 2, tile - 2);
            }
        }
    }

    showScreen(id){
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        const el = document.getElementById(id);
        if(el) el.classList.add('active');
    }

    setupEventListeners(){
        const bind = (id, fn)=>{
            const el = document.getElementById(id);
            if(el) el.addEventListener('click', ()=>{ AudioManager.playSound('click'); fn(); });
        };

        bind('play-btn', ()=>this.startLevel(GameState.currentLevel));
        bind('levels-btn', ()=>{ this.renderLevelsGrid(); this.showScreen('levels-screen'); });
        bind('tasks-btn', ()=>{ this.renderTasks(); this.showScreen('tasks-screen'); });
        bind('afk-btn', ()=>{ this.showScreen('afk-screen'); AFKRoom.start(); AFKRoom.updateUI(); });
        bind('daily-btn', ()=>{ this.checkDailyReward(); this.showScreen('daily-screen'); });
        bind('shop-btn', ()=>{ this.renderShop(); this.showScreen('shop-screen'); });
        bind('invite-btn', ()=>{ VKBridge.inviteFriends(); Tasks.updateProgress('invite', 1); });
        bind('settings-btn', ()=>this.showScreen('settings-screen'));
        bind('settings-back', ()=>this.showScreen('lobby'));
        bind('levels-back', ()=>this.showScreen('lobby'));
        bind('tasks-back', ()=>this.showScreen('lobby'));
        bind('afk-back', ()=>{ AFKRoom.stop(); this.showScreen('lobby'); });
        bind('daily-back', ()=>this.showScreen('lobby'));
        bind('shop-back', ()=>this.showScreen('lobby'));
        bind('serve-btn', ()=>this.serveBurger());
        bind('clear-btn', ()=>this.clearBurger());
        bind('daily-claim', ()=>this.claimDailyReward());
        bind('promo-btn', ()=>this.handlePromoCode());
        bind('tutorial-next', ()=>this.nextTutorialStep());
        bind('tutorial-skip', ()=>this.skipTutorial());

        bind('next-level-btn', ()=>{
            const next = Math.min(GameState.currentLevel + 1, 500);
            this.startLevel(next);
        });
        bind('back-lobby-btn', ()=>this.showScreen('lobby'));

        document.getElementById('music-toggle').addEventListener('change', e=>{
            GameState.musicEnabled = e.target.checked;
            AudioManager.toggleMusic(e.target.checked);
            GameState.save();
        });
        document.getElementById('language-select').addEventListener('change', e=>{
            GameState.language = e.target.value;
            currentLang = e.target.value;
            this.applyLanguage();
            GameState.save();
        });

        document.getElementById('double-reward-btn').addEventListener('click', async ()=>{
            AudioManager.pauseMusic();
            const ok = await VKBridge.showRewarded();
            AudioManager.resumeMusic();
            if(ok){
                GameState.coins += this.currentReward;
                GameState.save();
                this.updateCurrencyDisplay();
                const btn = document.getElementById('double-reward-btn');
                btn.disabled = true;
                btn.textContent = '✓ Награда удвоена!';
            }
        });
    }

    async startLevel(levelNum){
        // Пауза и реклама перед уровнем
        this.paused = true;
        AudioManager.pauseMusic();
        await VKBridge.showInterstitial();
        AudioManager.resumeMusic();
        this.paused = false;

        GameState.currentLevel = levelNum;
        const data = Levels.getLevel(levelNum);

        this.currentOrder = data.order;
        this.currentBurger = [];
        this.timeLeft = data.timeLimit;
        this.currentReward = data.reward;
        this.availableIngredients = data.availableIngredients;

        this.renderOrder();
        this.renderIngredients();
        this.renderBurgerStack();
        this.updateTimerDisplay();
        this.showScreen('level-screen');
        this.gameActive = true;

        if(this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(()=>{
            if(!this.gameActive || this.paused) return;
            this.timeLeft--;
            this.updateTimerDisplay();
            if(this.timeLeft <= 0) this.failLevel();
        }, 1000);

        GameState.save();
    }

    renderOrder(){
        const c = document.getElementById('order-items');
        c.innerHTML = '';
        this.currentOrder.forEach(id=>{
            const ing = Levels.all().find(i=>i.id === id);
            if(!ing) return;
            const el = document.createElement('div');
            el.className = 'order-item';
            el.textContent = `${ing.emoji} ${ing.name}`;
            c.appendChild(el);
        });
    }

    renderIngredients(){
        const c = document.getElementById('ingredients-list');
        c.innerHTML = '';
        const all = Levels.all();
        this.availableIngredients.forEach(id=>{
            const ing = all.find(i=>i.id === id);
            if(!ing) return;
            const btn = document.createElement('button');
            btn.className = 'ingredient-btn';
            btn.innerHTML = `<span class="emoji">${ing.emoji}</span><span>${ing.name}</span>`;
            btn.addEventListener('click', ()=>this.addIngredient(id));
            c.appendChild(btn);
        });
    }

    addIngredient(id){
        if(!this.gameActive) return;
        this.currentBurger.push(id);
        this.renderBurgerStack();
        AudioManager.playSound('click');
        Tasks.updateProgress('use_ingredient', 1);
    }

    renderBurgerStack(){
        const c = document.getElementById('burger-stack');
        c.innerHTML = '';
        const all = Levels.all();
        this.currentBurger.forEach(id=>{
            const ing = all.find(i=>i.id === id);
            if(!ing) return;
            const layer = document.createElement('div');
            layer.className = 'burger-layer';
            layer.style.background = Levels.getColor(id);
            layer.textContent = ing.name;
            c.appendChild(layer);
        });
    }

    serveBurger(){
        if(!this.gameActive) return;
        const correct = this.arraysEqual(this.currentBurger, this.currentOrder);
        if(correct){
            AudioManager.playSound('correct');
            this.completeLevel();
        } else {
            AudioManager.playSound('error');
            this.showToast(t('wrong_order'));
            this.clearBurger();
        }
    }

    arraysEqual(a, b){
        if(a.length !== b.length) return false;
        const sa = [...a].sort();
        const sb = [...b].sort();
        return sa.every((v,i)=>v === sb[i]);
    }

    clearBurger(){
        this.currentBurger = [];
        this.renderBurgerStack();
    }

    completeLevel(){
        this.gameActive = false;
        clearInterval(this.timerInterval);

        GameState.coins += this.currentReward;
        GameState.totalCoinsEarned += this.currentReward;
        GameState.totalBurgersServed++;

        if(this.arraysEqual(this.currentBurger, this.currentOrder)){
            GameState.totalPerfectBurgers++;
            Tasks.updateProgress('perfect', 1);
        }
        if(!GameState.completedLevels.includes(GameState.currentLevel)){
            GameState.completedLevels.push(GameState.currentLevel);
        }
        if(GameState.currentLevel >= GameState.maxLevel){
            GameState.maxLevel = GameState.currentLevel + 1;
        }
        Tasks.updateProgress('serve', 1);
        Tasks.updateProgress('earn', this.currentReward);
        Tasks.updateProgress('complete_levels', 1);

        GameState.save();
        this.updateCurrencyDisplay();
        this.showLevelResult();
    }

    failLevel(){
        this.gameActive = false;
        clearInterval(this.timerInterval);
        this.showToast(t('time_out'));
        setTimeout(()=>this.showScreen('lobby'), 1400);
    }

    showLevelResult(){
        const stats = document.getElementById('result-stats');
        stats.innerHTML = `
            <p style="font-size:20px;color:#4ecdc4;font-weight:700">Уровень ${GameState.currentLevel} пройден!</p>
            <p style="color:#ffd166;font-weight:700;margin-top:10px">+${this.currentReward} 🪙</p>
        `;
        const btn = document.getElementById('double-reward-btn');
        btn.disabled = false;
        btn.textContent = t('double_reward');
        this.showScreen('result-screen');
    }

    updateTimerDisplay(){
        const el = document.getElementById('timer-value');
        if(el) el.textContent = Math.max(0, this.timeLeft);
    }

    renderLevelsGrid(){
        const c = document.getElementById('levels-grid');
        c.innerHTML = '';
        for(let i=1; i<=500; i++){
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            btn.textContent = i;
            if(GameState.completedLevels.includes(i)) btn.classList.add('completed');
            if(i > GameState.maxLevel){ btn.classList.add('locked'); btn.disabled = true; }
            btn.addEventListener('click', ()=>{ if(!btn.disabled) this.startLevel(i); });
            c.appendChild(btn);
        }
    }

    renderTasks(){
        const c = document.getElementById('tasks-list');
        c.innerHTML = '';
        Tasks.dailyTasks.forEach(task=>{
            const el = document.createElement('div');
            el.className = 'task-item' + (task.completed ? ' completed' : '');
            const prog = Tasks.progress[task.id] || 0;
            const progText = task.completed ? '✅' : `${prog}/${task.target}`;
            el.innerHTML = `
                <div style="flex:1;min-width:0">
                    <div style="font-size:14px">${task.text}</div>
                    <small style="color:#aaa">${progText}</small>
                </div>
                <div style="text-align:right">
                    <div style="color:#ffd166;font-weight:700">${task.reward} 🪙</div>
                    ${task.completed && !task.claimed ? `<button class="main-btn" data-tid="${task.id}" style="margin-top:6px;padding:6px 12px;font-size:12px">${t('claim')}</button>` : ''}
                    ${task.claimed ? '<div style="margin-top:6px">✅</div>' : ''}
                </div>
            `;
            c.appendChild(el);
        });
        c.querySelectorAll('button[data-tid]').forEach(btn=>{
            btn.addEventListener('click', ()=>{
                Tasks.claimReward(btn.dataset.tid);
                this.renderTasks();
                this.updateCurrencyDisplay();
            });
        });
    }

    checkDailyReward(){
        const today = new Date().toDateString();
        const status = document.getElementById('daily-status');
        const btn = document.getElementById('daily-claim');
        if(GameState.lastDailyReward === today){
            status.textContent = t('daily_claimed');
            btn.disabled = true;
        } else {
            status.textContent = t('daily_available');
            btn.disabled = false;
        }
    }

    claimDailyReward(){
        const today = new Date().toDateString();
        if(GameState.lastDailyReward === today) return;
        GameState.lastDailyReward = today;
        GameState.coins += 500;
        GameState.save();
        this.updateCurrencyDisplay();
        document.getElementById('daily-status').textContent = t('daily_claimed');
        document.getElementById('daily-claim').disabled = true;
        AudioManager.playSound('coin');
        this.showToast('+500 🪙');
    }

    renderShop(){
        const c = document.getElementById('shop-items');
        c.innerHTML = '';

        Levels.premiumIngredients.forEach(ing=>{
            const owned = GameState.purchasedIngredients.includes(ing.id);
            const el = document.createElement('div');
            el.className = 'shop-item';
            el.innerHTML = `
                <div style="font-size:32px">${ing.emoji}</div>
                <div style="font-size:12px">${ing.name}</div>
                <div class="price">${ing.price} 🪙</div>
                <button class="main-btn" ${owned ? 'disabled' : ''} style="font-size:12px;padding:8px 12px">
                    ${owned ? t('already_owned') : t('purchase')}
                </button>
            `;
            if(!owned){
                el.querySelector('button').addEventListener('click', ()=>{
                    if(GameState.coins >= ing.price){
                        GameState.coins -= ing.price;
                        GameState.purchasedIngredients.push(ing.id);
                        GameState.save();
                        this.updateCurrencyDisplay();
                        this.renderShop();
                        AudioManager.playSound('coin');
                    } else this.showToast(t('not_enough_coins'));
                });
            }
            c.appendChild(el);
        });

        if(!GameState.hasCoffeeMachine){
            const el = document.createElement('div');
            el.className = 'shop-item';
            el.innerHTML = `
                <div style="font-size:32px">☕</div>
                <div style="font-size:12px">Кофемашина</div>
                <div class="price">5000 🪙</div>
                <button class="main-btn" style="font-size:12px;padding:8px 12px">${t('purchase')}</button>
            `;
            el.querySelector('button').addEventListener('click', ()=>{
                if(GameState.coins >= 5000){
                    GameState.coins -= 5000;
                    GameState.hasCoffeeMachine = true;
                    GameState.save();
                    this.updateCurrencyDisplay();
                    this.renderShop();
                } else this.showToast(t('not_enough_coins'));
            });
            c.appendChild(el);
        }

        if(!GameState.hasLemonadeMachine){
            const el = document.createElement('div');
            el.className = 'shop-item';
            el.innerHTML = `
                <div style="font-size:32px">🍋</div>
                <div style="font-size:12px">Машина для лимонада</div>
                <div class="price">4000 🪙</div>
                <button class="main-btn" style="font-size:12px;padding:8px 12px">${t('purchase')}</button>
            `;
            el.querySelector('button').addEventListener('click', ()=>{
                if(GameState.coins >= 4000){
                    GameState.coins -= 4000;
                    GameState.hasLemonadeMachine = true;
                    GameState.save();
                    this.updateCurrencyDisplay();
                    this.renderShop();
                } else this.showToast(t('not_enough_coins'));
            });
            c.appendChild(el);
        }

        const cost = AFKRoom.rate * 1000;
        const el = document.createElement('div');
        el.className = 'shop-item';
        el.innerHTML = `
            <div style="font-size:32px">⚡</div>
            <div style="font-size:12px">+1 🪙 / мин в AFK</div>
            <div class="price">${cost} 🪙</div>
            <button class="main-btn" style="font-size:12px;padding:8px 12px">${t('purchase')}</button>
        `;
        el.querySelector('button').addEventListener('click', ()=>{
            if(GameState.coins >= cost){
                GameState.coins -= cost;
                AFKRoom.upgradeRate();
                GameState.save();
                this.updateCurrencyDisplay();
                this.renderShop();
            } else this.showToast(t('not_enough_coins'));
        });
        c.appendChild(el);
    }

    async handlePromoCode(){
        const input = document.getElementById('promo-input');
        const code = input.value.trim().toLowerCase();
        if(code === 'clear12'){
            await VKBridge.clearAllData();
            this.showToast(t('promo_clear'));
            setTimeout(()=>location.reload(), 1200);
        } else if(code === 'admin17'){
            GameState.coins += 1000000;
            GameState.save();
            this.updateCurrencyDisplay();
            this.showToast(t('promo_admin'));
        } else {
            this.showToast(t('promo_invalid'));
        }
        input.value = '';
    }

    showTutorialPrompt(){
        const modal = document.createElement('div');
        modal.className = 'modal-bg';
        modal.innerHTML = `<h2>${t('tutorial_prompt')}</h2>`;
        const yes = document.createElement('button');
        yes.className = 'main-btn';
        yes.textContent = t('tutorial_yes');
        yes.onclick = ()=>{ modal.remove(); this.startTutorial(); };
        const no = document.createElement('button');
        no.className = 'secondary-btn';
        no.textContent = t('tutorial_no');
        no.onclick = ()=>{ modal.remove(); this.skipTutorial(); };
        modal.appendChild(yes);
        modal.appendChild(no);
        document.body.appendChild(modal);
    }

    startTutorial(){
        this.tutorialStep = 0;
        this.showScreen('tutorial-screen');
        this.nextTutorialStep();
    }

    nextTutorialStep(){
        const steps = [
            t('tutorial_welcome'),
            t('tutorial_order'),
            t('tutorial_ingredients'),
            t('tutorial_serve'),
            t('tutorial_timer')
        ];
        if(this.tutorialStep >= steps.length){
            GameState.tutorialCompleted = true;
            GameState.save();
            this.showScreen('lobby');
            return;
        }
        document.getElementById('tutorial-title').textContent = t('tutorial_title');
        document.getElementById('tutorial-text').textContent = steps[this.tutorialStep];
        this.tutorialStep++;
    }

    skipTutorial(){
        GameState.tutorialCompleted = true;
        GameState.save();
        this.showScreen('lobby');
    }

    showToast(text){
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 2200);
    }

    updateCurrencyDisplay(){
        const c = document.getElementById('coin-count');
        const l = document.getElementById('level-number');
        if(c) c.textContent = GameState.coins;
        if(l) l.textContent = GameState.maxLevel;
    }

    pause(){ this.paused = true; }
    resume(){ this.paused = false; }
}

    AudioManager.init();
    Game = new BurgerGame();
    window.Game = Game;
    Game.init();
});
</script>
