<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<title>Магазин</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e1219;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#e8eef7}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- CUSTOM SCROLLBARS ---------- */
.modal-body::-webkit-scrollbar,
.tabs::-webkit-scrollbar,
.cat-sel::-webkit-scrollbar{width:8px;height:8px}
.modal-body::-webkit-scrollbar-track,
.tabs::-webkit-scrollbar-track,
.cat-sel::-webkit-scrollbar-track{background:#0f151d;border-radius:8px}
.modal-body::-webkit-scrollbar-thumb,
.tabs::-webkit-scrollbar-thumb,
.cat-sel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3b4d66,#2a3648);border-radius:8px;
  border:1px solid #1b2330}
.modal-body::-webkit-scrollbar-thumb:hover,
.tabs::-webkit-scrollbar-thumb:hover,
.cat-sel::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#4a89ff,#2d6cdf)}
.modal-body,.tabs,.cat-sel{scrollbar-width:thin;scrollbar-color:#3b4d66 #0f151d}

/* ---------- TOP BAR ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:6px;
  padding:0 8px;background:linear-gradient(180deg,rgba(14,18,25,.96),rgba(14,18,25,.72));
  backdrop-filter:blur(6px);z-index:20;pointer-events:auto}
.stat{display:flex;align-items:center;gap:5px;background:#1b2330;border:1px solid #2b3648;
  border-radius:12px;padding:5px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.stat svg{width:18px;height:18px;flex:none}
#moneyVal{color:#ffd257}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid #2b3648;background:#1b2330;
  color:#cfe0f5;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  transition:.15s;padding:0;flex:none}
.iconbtn:active{transform:scale(.93);background:#243044}
.iconbtn svg{width:21px;height:21px}
.badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#ff4d5e;
  color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:700}

/* ---------- BOTTOM BAR ---------- */
#bottombar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 8px 10px;
  background:linear-gradient(0deg,rgba(14,18,25,.98),rgba(14,18,25,.7));z-index:20}
.botbtn{flex:1;height:52px;border-radius:14px;border:1px solid #2b3648;background:#1b2330;color:#dce8f8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;
  font-weight:600;cursor:pointer;transition:.15s;padding:0}
.botbtn svg{width:22px;height:22px}
.botbtn:active{transform:scale(.95);background:#243044}
.botbtn.primary{background:linear-gradient(180deg,#2e7d5b,#1f5f44);border-color:#3aa477;color:#eafff4}

/* ---------- TUTORIAL BLOCKING ---------- */
body.tutorial-on .botbtn,body.tutorial-on .iconbtn{pointer-events:none;opacity:.35;filter:grayscale(.4)}
body.tutorial-on .botbtn.tutorial-active,body.tutorial-on .iconbtn.tutorial-active{
  pointer-events:auto;opacity:1;filter:none;
  box-shadow:0 0 0 2px #4a89ff,0 0 16px rgba(74,137,255,.7);
  animation:pulseGlow 1.6s ease-in-out infinite}
@keyframes pulseGlow{50%{box-shadow:0 0 0 2px #4a89ff,0 0 24px rgba(74,137,255,1)}}
body.tutorial-on #game{pointer-events:none}

/* ---------- BANNER ---------- */
#banner{position:absolute;left:0;right:0;bottom:0;height:0;z-index:19;pointer-events:none}

/* ---------- MODALS ---------- */
#modalRoot{position:absolute;inset:0;z-index:60;display:none}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,8,12,.72);backdrop-filter:blur(3px);padding:10px}
.modal-box{width:min(700px,96vw);max-height:86vh;background:#161d28;border:1px solid #2b3648;
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-bottom:1px solid #242e3d;background:#1b2330;flex:none}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.close-btn{width:34px;height:34px;border-radius:10px;border:none;background:#26313f;color:#cfe0f5;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.close-btn:active{background:#334052}
.modal-body{overflow-y:auto;padding:10px;flex:1;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;padding:8px 10px 0;flex:none;overflow-x:auto}
.tab{padding:8px 14px;border-radius:10px;background:#1b2330;border:1px solid #2b3648;color:#9fb0c5;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.active{background:#2d6cdf;border-color:#4a89ff;color:#fff}

/* ---------- ROWS ---------- */
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#1a212c;
  border:1px solid #232d3b;margin-bottom:7px}
.row .ic{width:38px;height:38px;flex:none;border-radius:9px;background:#0f151d;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.row .ic img{width:32px;height:32px;display:block}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:11px;color:#8798ad}
.row .pr{font-size:13px;font-weight:700;color:#ffd257;white-space:nowrap}
.btn{padding:8px 12px;border-radius:10px;border:none;background:#2d6cdf;color:#fff;font-weight:700;
  font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn.g{background:#2e8b57}
.btn.r{background:#c0392b}
.btn.y{background:#b8860b}
.btn.ghost{background:#26313f;color:#cfe0f5}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 9px;font-size:11.5px;border-radius:9px}

/* ---------- HINT / TOAST ---------- */
#hint{position:absolute;left:50%;transform:translateX(-50%);top:60px;z-index:30;max-width:92vw;
  background:rgba(28,60,110,.96);border:1px solid #4a89ff;border-radius:14px;padding:10px 14px;
  font-size:13.5px;font-weight:600;text-align:center;display:none;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#hint .hintrow{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;z-index:80;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,26,36,.96);border:1px solid #3a4a61;border-radius:12px;padding:9px 16px;
  font-size:13px;font-weight:600;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.5)}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ---------- OVERLAY ---------- */
#overlay{position:absolute;inset:0;z-index:100;background:rgba(6,9,14,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
.spinner{width:46px;height:46px;border:4px solid #2b3648;border-top-color:#4a89ff;border-radius:50%;
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- MISC ---------- */
.sec-title{font-size:12px;color:#8798ad;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  margin:12px 4px 7px}
.empty{text-align:center;color:#6d7d92;font-size:13px;padding:26px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#1a212c;border:1px solid #232d3b;
  border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:600;color:#9fb0c5}
.progressbar{height:7px;border-radius:4px;background:#0f151d;overflow:hidden;margin-top:6px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,#2d6cdf,#4a89ff);border-radius:4px;
  transition:width .3s}
input[type=text]{width:100%;padding:11px 13px;border-radius:11px;border:1px solid #2b3648;background:#0f151d;
  color:#e8eef7;font-size:14px;outline:none;font-family:inherit}
input[type=text]:focus{border-color:#4a89ff}
.switch{width:46px;height:26px;border-radius:14px;background:#2b3648;position:relative;cursor:pointer;
  transition:.2s;flex:none}
.switch.on{background:#2e8b57}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:.2s;display:block}
.switch.on i{left:23px}
.place-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:78px;z-index:40;display:none;
  background:rgba(28,60,110,.96);border:1px solid #4a89ff;border-radius:14px;padding:8px 10px;
  gap:8px;align-items:center;font-size:12.5px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.5)}
</style>
</head>

/* ------------------------------- 2. УТИЛИТЫ ------------------------------- */
const $ = s => document.querySelector(s);
const canvas = $('#game');
const ctx = canvas.getContext('2d');

function rnd(a, b){ return a + Math.random() * (b - a); }
function randInt(a, b){ return Math.floor(rnd(a, b + 1)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function hexToRgb(h){
  h = h.replace('#', '');
  if(h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function rgbToHex(r, g, b){
  return '#' + [r,g,b].map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
}
function shade(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  return rgbToHex(r+amt, g+amt, b+amt);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function fmt(n){
  if(n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if(n >= 1e4) return (n/1e3).toFixed(1) + 'K';
  return String(Math.floor(n));
}
function lerpAngle(a, b, k){
  let d = ((b - a + Math.PI) % (Math.PI*2)) - Math.PI;
  if(d < -Math.PI) d += Math.PI*2;
  return a + d * k;
}

/* --------------------------- 3. SVG-СПРАЙТЫ ------------------------------- */
const SPRITES = {};
function svgURI(s){ return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
function makeSprite(key, svg){
  if(SPRITES[key]) return SPRITES[key];
  const img = new Image();
  img.decoding = 'async';
  img.src = svgURI(svg);
  SPRITES[key] = img;
  return img;
}

      inner = `<rect x="22" y="26" width="56" height="64" rx="8" fill="${color}" stroke="${dark}" stroke-width="4"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${inner}</svg>`;
}

function prodSprite(p){ return makeSprite('p' + p.id, productSVG(p.shape, p.color)); }
function furnSprite(type){ return makeSprite('f' + type, furnitureSVG(type)); }

/* ------------------------------ 4. СОСТОЯНИЕ ------------------------------ */
let state = null;

function newState(){
  return {
    money: 600, lang: 'ru', music: true, tutorialDone: false,
    grid: [], warehouse: {}, decor: {wall: 0, window: 0},
    owned: {wall: [0], window: [0]},
    lastDaily: 0, streak: 0,
    tasks: [], tasksDate: '',
    ds: {sell:0, earn:0, serve:0, buy:0, place:0, stock:0, expand:0},
    playtime: 0, lastRewardIdx: 0,
    totalServed: 0, totalEarned: 0, adCount: 0, v: 2
  };
}

function initGrid(){
  state.grid = [];
  for(let y = 0; y < GH; y++){
    const row = [];
    for(let x = 0; x < GW; x++) row.push({u: false, t: null, stock: [], door: false});
    state.grid.push(row);
  }
  for(let y = 0; y < 6; y++) for(let x = 0; x < 6; x++) state.grid[y][x].u = true;
  state.grid[DOOR.y][DOOR.x].door = true;
  state.grid[1][1].t = 'shelf';
  state.grid[1][2].t = 'shelf';
  state.grid[1][3].t = 'shelf';
  state.grid[5][5].t = 'counter';
}

function cellAt(x, y){
  if(x < 0 || y < 0 || x >= GW || y >= GH) return null;
  return state.grid[y][x];
}
function walkable(x, y){
  const c = cellAt(x, y);
  if(!c || !c.u) return false;
  if(c.t) return false;
  return true;
}
function unlockedCount(){
  let n = 0;
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++) if(state.grid[y][x].u) n++;
  return n;
}
function expandPrice(){
  return Math.round(120 * Math.pow(1.16, unlockedCount() - 36));
}
function isAdjacentToUnlocked(x, y){
  const d = [[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx, dy] of d){
    const c = cellAt(x + dx, y + dy);
    if(c && c.u) return true;
  }
  return false;
}
function shelfCells(){
  const out = [];
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(c.u && (c.t === 'shelf' || c.t === 'rack' || c.t === 'fridge')) out.push({x, y, c});
  }
  return out;
}
function counterCells(){
  const out = [];
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(c.u && c.t === 'counter') out.push({x, y, c});
  }
  return out;
}
function shelfQty(c){ let n = 0; for(const s of c.stock) n += s.n; return n; }
function shelfCapacity(c){ return FURNITURE[c.t].cap; }
function canAccept(c, pid){
  const prod = PROD_BY_ID[pid];
  const acc = FURNITURE[c.t].accepts;
  if(acc && acc.indexOf(prod.cat) < 0) return false;
  return true;
}
function addToShelf(c, pid, count){
  const cap = shelfCapacity(c);
  let space = cap - shelfQty(c);
  if(space <= 0) return 0;
  const add = Math.min(space, count);
  let s = c.stock.find(s => s.id === pid);
  if(!s){ s = {id: pid, n: 0}; c.stock.push(s); }
  s.n += add;
  return add;
}
function takeFromShelf(c, pid, count){
  const s = c.stock.find(s => s.id === pid);
  if(!s) return 0;
  const take = Math.min(s.n, count);
  s.n -= take;
  if(s.n <= 0) c.stock = c.stock.filter(x => x !== s);
  return take;
}
function warehouseTotal(){
  let n = 0;
  for(const k in state.warehouse) n += state.warehouse[k];
  return n;
}

/* ------------------------- 5. СОХРАНЕНИЕ (VK) ----------------------------- */
const vk = (typeof window.vkBridge !== 'undefined') ? window.vkBridge : null;
let vkAvailable = !!vk;
function vkSend(method, params){
  if(!vk) return Promise.reject(new Error('no vk'));
  try { return vk.send(method, params || {}); }
  catch(e){ return Promise.reject(e); }
}

const memStore = {};
async function storageSet(key, value){
  if(vkAvailable){
    try { await vkSend('VKWebAppStorageSet', {key, value}); return; }
    catch(e){ vkAvailable = false; }
  }
  memStore[key] = value;
}
async function storageGet(keys){
  if(vkAvailable){
    try {
      const r = await vkSend('VKWebAppStorageGet', {keys});
      const out = {};
      (r.keys || []).forEach(k => out[k.key] = k.value);
      return out;
    } catch(e){ vkAvailable = false; }
  }
  const out = {};
  keys.forEach(k => out[k] = memStore[k] || '');
  return out;
}

function serialize(){
  let g = '';
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(!c.u) g += '.';
    else if(!c.t) g += '_';
    else g += {shelf:'S', rack:'R', fridge:'F', counter:'C'}[c.t];
  }
  const stocks = [];
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(c.stock && c.stock.length) stocks.push(x + ',' + y + ':' + c.stock.map(s => s.id + '-' + s.n).join('.'));
  }
  const wh = Object.keys(state.warehouse).filter(k => state.warehouse[k] > 0)
    .map(k => k + '-' + state.warehouse[k]).join(',');

  return {
    m: Math.floor(state.money), l: state.lang, mu: state.music ? 1 : 0,
    td: state.tutorialDone ? 1 : 0, g, st: stocks.join('|'), wh,
    dw: state.decor.wall, dn: state.decor.window,
    ow: state.owned.wall, on: state.owned.window,
    ld: state.lastDaily, sk: state.streak,
    tk: state.tasks, tkd: state.tasksDate, ds: state.ds,
    pt: Math.floor(state.playtime), lr: state.lastRewardIdx,
    ts: state.totalServed, te: Math.floor(state.totalEarned), ac: state.adCount
  };
}

function deserialize(o){
  state.money = o.m || 600;
  state.lang = o.l || 'ru';
  state.music = o.mu === 1;
  state.tutorialDone = !!o.td;
  state.decor.wall = o.dw || 0;
  state.decor.window = o.dn || 0;
  state.owned.wall = o.ow || [0];
  state.owned.window = o.on || [0];
  state.lastDaily = o.ld || 0;
  state.streak = o.sk || 0;
  state.tasks = o.tk || [];
  state.tasksDate = o.tkd || '';
  state.ds = o.ds || {sell:0, earn:0, serve:0, buy:0, place:0, stock:0, expand:0};
  state.playtime = o.pt || 0;
  state.lastRewardIdx = o.lr || 0;
  state.totalServed = o.ts || 0;
  state.totalEarned = o.te || 0;
  state.adCount = o.ac || 0;
  state.warehouse = {};

  initGrid();

  if(o.g && o.g.length === GW * GH){
    for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
      const ch = o.g[y * GW + x];
      const c = state.grid[y][x];
      c.u = ch !== '.';
      c.t = ch === 'S' ? 'shelf' : ch === 'R' ? 'rack' : ch === 'F' ? 'fridge' : ch === 'C' ? 'counter' : null;
      c.stock = [];
    }
  }
  if(o.st){
    o.st.split('|').forEach(part => {
      if(!part) return;
      const [pos, items] = part.split(':');
      const [x, y] = pos.split(',').map(Number);
      const c = cellAt(x, y);
      if(!c) return;
      (items || '').split('.').forEach(it => {
        const [id, n] = it.split('-').map(Number);
        if(PROD_BY_ID[id] && n > 0) c.stock.push({id, n});
      });
    });
  }
  if(o.wh){
    o.wh.split(',').forEach(part => {
      if(!part) return;
      const [id, n] = part.split('-').map(Number);
      if(PROD_BY_ID[id] && n > 0) state.warehouse[id] = n;
    });
  }
  state.grid[DOOR.y][DOOR.x].door = true;
}

let saveTimer = null;
function scheduleSave(){
  if(saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; saveGame(); }, 1200);
}
async function saveGame(){
  try {
    const data = JSON.stringify(serialize());
    const chunks = data.match(/.{1,3000}/g) || [''];
    await storageSet('sn', String(chunks.length));
    for(let i = 0; i < chunks.length; i++) await storageSet('s' + i, chunks[i]);
  } catch(e){}
}
async function loadGame(){
  try {
    const head = await storageGet(['sn']);
    const n = parseInt(head.sn || '0', 10);
    if(!n) return false;
    const keys = [];
    for(let i = 0; i < n; i++) keys.push('s' + i);
    const data = await storageGet(keys);
    let s = '';
    for(let i = 0; i < n; i++) s += (data['s' + i] || '');
    if(!s) return false;
    deserialize(JSON.parse(s));
    return true;
  } catch(e){ return false; }
}
async function wipeSave(){
  await storageSet('sn', '0');
  await storageSet('s0', '');
  state = newState();
  initGrid();
  checkDailyReset();
  updateHUD();
}

/* ------------------------------ 6. КЛИЕНТЫ -------------------------------- */
const SHIRT = ['#4a89ff','#e0575b','#43b581','#f0a93b','#a56bd6','#20b2aa','#e06fa0','#7f8c9b','#5a6fd6','#d97742'];
const SKIN  = ['#f2c9a0','#e0aa7a','#c98d5c','#9c6b45','#7a5136','#f7dcc0'];
const HAIR  = ['#2b1d13','#4a2f1c','#7a4a22','#b07a35','#1a1a1a','#8b8b8b'];

class Customer {
  constructor(){
    this.x = DOOR.x + 0.5;
    this.y = DOOR.y + 0.5;
    this.alpha = 0;
    this.speed = rnd(1.5, 2.2);
    this.shirt = pick(SHIRT);
    this.skin = pick(SKIN);
    this.hair = pick(HAIR);
    this.state = 'idle';
    this.path = [];
    this.cart = [];
    this.timer = 0;
    this.walk = 0;
    this.dir = 0;
    this.targetDir = 0;
    this.bob = 0;
    this.visited = [];
    this.wants = randInt(2, 4);
    this.bubble = null;
    this.bubbleT = 0;
    this.spot = null;
    this.dead = false;
    this.patience = 45;
    this.exitX = this.x;
  }

  moveTo(gx, gy){
    const path = findPath(Math.floor(this.x), Math.floor(this.y), gx, gy);
    if(path && path.length){ this.path = path; return true; }
    if(Math.floor(this.x) === gx && Math.floor(this.y) === gy){ this.path = []; return true; }
    return false;
  }

  update(dt){
    if(this.alpha < 1 && this.state !== 'gone') this.alpha = Math.min(1, this.alpha + dt * 2.5);

    if(this.bubbleT > 0){
      this.bubbleT -= dt;
      if(this.bubbleT <= 0) this.bubble = null;
    }

    if(this.state === 'gone'){
      this.alpha -= dt * 1.3;
      this.x -= dt * 1.2;
      this.bob = Math.sin(this.walk) * 0.045;
      this.walk += dt * 9;
      if(this.alpha <= 0) this.dead = true;
      return;
    }

    if(this.state === 'picking' || this.state === 'paying'){
      this.timer -= dt;
      if(this.timer <= 0) this.finishAction();
      return;
    }
    if(this.state === 'waiting'){
      this.timer -= dt;
      this.patience -= dt;
      if(this.patience <= 0){ this.leave(); return; }
      if(this.timer <= 0) this.tryCashier();
      return;
    }

    if(this.path.length){
      const tgt = this.path[0];
      const tx = tgt.x + 0.5, ty = tgt.y + 0.5;
      const dx = tx - this.x, dy = ty - this.y;
      const d = Math.hypot(dx, dy);
      const step = this.speed * dt;
      if(d <= step){
        this.x = tx; this.y = ty;
        this.path.shift();
      } else {
        this.x += dx / d * step;
        this.y += dy / d * step;
      }
      // плавный поворот по направлению движения
      if(d > 0.01){
        this.targetDir = Math.atan2(dy, dx);
      }
      this.dir = lerpAngle(this.dir, this.targetDir, Math.min(1, dt * 10));
      this.walk += dt * 11;
      this.bob = Math.sin(this.walk) * 0.045;
    } else {
      this.bob *= 0.85;
      this.dir = lerpAngle(this.dir, this.targetDir, Math.min(1, dt * 10));
      this.arrive();
    }
  }

  arrive(){
    if(this.state === 'toShelf'){
      this.state = 'picking';
      this.timer = rnd(1.3, 2.6);
      const cell = this.targetCell;
      if(cell && cell.stock.length){
        const s = pick(cell.stock);
        this.bubble = s.id;
        this.bubbleT = this.timer + 0.3;
      }
    } else if(this.state === 'toCashier'){
      this.state = 'paying';
      this.timer = rnd(1.1, 1.8);
    } else if(this.state === 'leaving'){
      this.state = 'gone';
    } else if(this.state === 'idle'){
      this.planShopping();
    }
  }

  finishAction(){
    if(this.state === 'picking'){
      const cell = this.targetCell;
      if(cell && cell.stock.length){
        const s = pick(cell.stock);
        if(takeFromShelf(cell, s.id, 1)){
          const p = PROD_BY_ID[s.id];
          this.cart.push({id: s.id, price: p.sell});
        }
        this.visited.push(this.targetX + ',' + this.targetY);
      }
      this.state = 'idle';
      if(this.cart.length >= this.wants || this.visited.length > 3){
        this.goToCashier();
      } else {
        this.planShopping();
      }
    } else if(this.state === 'paying'){
      let sum = 0;
      for(const it of this.cart) sum += it.price;
      state.money += sum;
      state.totalEarned += sum;
      state.ds.earn += sum;
      state.ds.serve += 1;
      state.totalServed += 1;
      if(this.spot) busySpots.delete(this.spot);
      this.spot = null;
      this.cart = [];
      toast('+' + fmt(sum) + ' \u20BF', '#7fd07f');
      updateHUD();
      scheduleSave();
      this.leave();
    }
  }

  planShopping(){
    const shelves = shelfCells().filter(s => s.c.stock.length > 0);
    const fresh = shelves.filter(s => this.visited.indexOf(s.x + ',' + s.y) < 0);
    const pool = fresh.length ? fresh : shelves;
    if(!pool.length){ this.leave(); return; }
    const target = pick(pool);
    const spots = adjacentWalkable(target.x, target.y);
    if(!spots.length){ this.visited.push(target.x + ',' + target.y); this.planShopping(); return; }
    const spot = pick(spots);
    this.targetCell = target.c;
    this.targetX = target.x;
    this.targetY = target.y;
    this.state = 'toShelf';
    if(!this.moveTo(spot.x, spot.y)){ this.leave(); }
  }

  goToCashier(){
    if(!this.cart.length){ this.leave(); return; }
    if(!counterCells().length){ this.leave(); return; }
    this.tryCashier();
  }

  tryCashier(){
    const spots = serviceSpots().filter(s => !busySpots.has(s.x + ',' + s.y));
    if(!spots.length){
      this.state = 'waiting';
      this.timer = rnd(0.8, 1.6);
      return;
    }
    let best = null, bd = 1e9;
    for(const s of spots){
      const d = Math.abs(s.x - this.x) + Math.abs(s.y - this.y);
      if(d < bd){ bd = d; best = s; }
    }
    busySpots.add(best.x + ',' + best.y);
    this.spot = best;
    this.state = 'toCashier';
    if(!this.moveTo(best.x, best.y)){
      busySpots.delete(best.x + ',' + best.y);
      this.spot = null;
      this.leave();
    }
  }

  leave(){
    if(this.spot){ busySpots.delete(this.spot); this.spot = null; }
    this.state = 'leaving';
    this.cart = [];
    if(!this.moveTo(DOOR.x, DOOR.y)){
      this.state = 'gone';
    }
  }
}

const busySpots = new Set();

function serviceSpots(){
  const out = [];
  for(const c of counterCells()){
    const adj = adjacentWalkable(c.x, c.y);
    for(const a of adj) out.push(a);
  }
  return out;
}
function adjacentWalkable(x, y){
  const out = [];
  const d = [[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx, dy] of d){
    const nx = x + dx, ny = y + dy;
    if(walkable(nx, ny)) out.push({x: nx, y: ny});
  }
  return out;
}

function findPath(sx, sy, gx, gy){
  if(sx === gx && sy === gy) return [];
  if(!walkable(gx, gy)) return null;
  const key = (x, y) => y * GW + x;
  const prev = new Int16Array(GW * GH).fill(-1);
  const seen = new Uint8Array(GW * GH);
  const q = [key(sx, sy)];
  seen[key(sx, sy)] = 1;
  const D = [[1,0],[-1,0],[0,1],[0,-1]];
  let found = false;
  while(q.length){
    const cur = q.shift();
    const cx = cur % GW, cy = (cur - cx) / GW;
    if(cx === gx && cy === gy){ found = true; break; }
    for(const [dx, dy] of D){
      const nx = cx + dx, ny = cy + dy;
      if(nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const k = key(nx, ny);
      if(seen[k]) continue;
      if(!walkable(nx, ny)) continue;
      seen[k] = 1;
      prev[k] = cur;
      q.push(k);
    }
  }
  if(!found) return null;
  const path = [];
  let cur = key(gx, gy);
  while(cur !== key(sx, sy)){
    const cx = cur % GW, cy = (cur - cx) / GW;
    path.unshift({x: cx, y: cy});
    cur = prev[cur];
    if(cur < 0) return null;
  }
  return path;
}

/* ------------------------ 6b. КАССИР (NPC) ------------------------------- */
const cashier = {
  x: 5.5, y: 5.5, // будет обновлено под ближайшую кассу
  skin: '#e0aa7a', hair: '#4a2f1c', shirt: '#2b5fae',
  bob: 0, walk: 0, anchorX: -1, anchorY: -1,
  update(dt){
    const counters = counterCells();
    if(!counters.length) return;
    // занимает кассу, ближайшую к центру
    let best = counters[0], bd = 1e9;
    for(const c of counters){
      const d = Math.abs(c.x - GW/2) + Math.abs(c.y - GH/2);
      if(d < bd){ bd = d; best = c; }
    }
    if(best.x !== this.anchorX || best.y !== this.anchorY){
      this.anchorX = best.x;
      this.anchorY = best.y;
      // встаём за прилавком: с противоположной стороны от входа (справой/верхней)
      let px = best.x + 0.5, py = best.y + 0.5;
      // Ищем направление от входа
      const dx = best.x - DOOR.x, dy = best.y - DOOR.y;
      if(Math.abs(dx) > Math.abs(dy)){
        px = best.x + 0.5 + (dx > 0 ? 0.0 : 0.0);
        py = best.y + 0.5 - 0.28;
      } else {
        px = best.x + 0.5 - 0.28;
        py = best.y + 0.5;
      }
      this.x = px;
      this.y = py;
    }
    // небольшое покачивание
    this.walk += dt * 2.5;
    this.bob = Math.sin(this.walk) * 0.02;
  }
};

/* ------------------------------ 7. ЗАДАНИЯ -------------------------------- */
function genTasks(){
  const list = [];
  const shuffled = TASK_DEFS.slice().sort(() => Math.random() - 0.5);
  for(let i = 0; i < 10; i++){
    const def = shuffled[i % shuffled.length];
    const target = randInt(def.min, def.max);
    list.push({t: def.id, target, reward: def.rew(target), claimed: false});
  }
  state.tasks = list;
  state.ds = {sell:0, earn:0, serve:0, buy:0, place:0, stock:0, expand:0};
  state.tasksDate = todayStr();
}
function checkDailyReset(){
  if(state.tasksDate !== todayStr() || !state.tasks.length) genTasks();
}
function taskText(task){
  const def = TASK_DEFS.find(d => d.id === task.t);
  if(!def) return '';
  const tmpl = state.lang === 'en' ? def.en : def.ru;
  return tmpl.replace('{n}', task.target);
}
function taskProgress(task){ return Math.min(task.target, state.ds[task.t] || 0); }
function tasksReadyCount(){
  let n = 0;
  for(const tk of state.tasks) if(!tk.claimed && taskProgress(tk) >= tk.target) n++;
  return n;
}

/* ------------------------------ 8. МУЗЫКА --------------------------------- */
const Music = {
  ctx: null, gain: null, timer: null, playing: false, enabled: true, step: 0,
  scale: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25],
  bass: [65.41, 73.42, 82.41, 98.00],
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = 0.12;
    this.gain.connect(this.ctx.destination);
  },
  start(){
    this.init();
    if(!this.ctx || this.playing || !this.enabled) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    this.playing = true;
    this.step = 0;
    this.tick();
    this.timer = setInterval(() => this.tick(), 420);
  },
  stop(){
    this.playing = false;
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
  },
  setEnabled(v){ this.enabled = v; if(v) this.start(); else this.stop(); },
  note(freq, dur, vol, type){
    if(!this.ctx || !this.playing) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(this.gain);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  },
  tick(){
    if(!this.playing) return;
    const s = this.step++;
    const n = this.scale[(s * 3 + (s >> 2)) % this.scale.length];
    this.note(n, 0.45, 0.055, 'triangle');
    if(s % 4 === 0){
      const b = this.bass[(s >> 2) % this.bass.length];
      this.note(b, 1.2, 0.07, 'sine');
      this.note(b * 1.5, 1.0, 0.035, 'sine');
    }
    if(s % 8 === 0) this.note(n * 2, 0.3, 0.025, 'sine');
  }
};

/* ------------------------------ 9. РЕНДЕР --------------------------------- */
let CS = 40, OX = 0, OY = 0;
const OUT_MARGIN = 28; // отступ для декоративной территории вокруг магазина

function resize(){
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const topbarH = $('#topbar').offsetHeight || 52;
  const bottombarH = $('#bottombar').offsetHeight || 70;
  const availH = h - topbarH - bottombarH - 8;
  const availW = w - 12;

  CS = Math.min((availW - OUT_MARGIN * 2) / GW, (availH - OUT_MARGIN * 2) / GH);
  CS = Math.max(14, CS);
  OX = (w - GW * CS) / 2;
  OY = topbarH + 4 + (availH - GH * CS) / 2;
}

function draw(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  // небо/фон
  const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
  skyGrad.addColorStop(0, '#0d1219');
  skyGrad.addColorStop(1, '#1a2330');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, h);

  drawOutside();
  drawWalls();
  drawFloor();

  ctx.save();
  ctx.scale(CS, CS);
  ctx.lineJoin = 'round';

  for(let y = 0; y < GH; y++){
    for(let x = 0; x < GW; x++){
      const c = state.grid[y][x];
      if(c.u && c.t) drawFurniture(x, y, c);
    }
  }

  if(placeMode){
    ctx.lineWidth = 0.06;
    for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
      const c = state.grid[y][x];
      if(!c.u) continue;
      if(placeMode.kind === 'furniture' && !c.t && !c.door){
        ctx.strokeStyle = 'rgba(74,137,255,.9)';
        ctx.strokeRect(x + 0.06, y + 0.06, 0.88, 0.88);
      }
      if(placeMode.kind === 'stock' && c.t && c.t !== 'counter' && shelfQty(c) < shelfCapacity(c)){
        ctx.strokeStyle = 'rgba(127,208,127,.85)';
        ctx.strokeRect(x + 0.06, y + 0.06, 0.88, 0.88);
      }
    }
  }

  // кассир рисуется до клиентов, чтобы клиенты были поверх, если стоят рядом
  drawCashier();

  for(const c of customers) drawCustomer(c);

  ctx.restore();
}

function drawOutside(){
  ctx.save();
  ctx.translate(OX, OY);
  const MB = OUT_MARGIN;
  const totalW = GW * CS, totalH = GH * CS;

  // тротуар
  const sideCol = '#5a6470';
  const sideCol2 = '#4f5864';
  ctx.fillStyle = sideCol;
  ctx.fillRect(-MB, -MB, totalW + MB * 2, totalH + MB * 2);
  ctx.fillStyle = sideCol2;
  ctx.fillRect(-MB, -MB, totalW + MB * 2, MB); // верхняя полоса
  ctx.fillRect(-MB, totalH, totalW + MB * 2, MB); // нижняя полоса
  ctx.fillRect(-MB, 0, MB, totalH); // левая
  ctx.fillRect(totalW, 0, MB, totalH); // правая

  // плитка тротуара (швы)
  ctx.strokeStyle = 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1;
  for(let x = -MB; x <= totalW + MB; x += 14){
    ctx.beginPath();
    ctx.moveTo(x, -MB); ctx.lineTo(x, 0); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, totalH); ctx.lineTo(x, totalH + MB); ctx.stroke();
  }
  for(let y = -MB; y <= totalH + MB; y += 14){
    ctx.beginPath();
    ctx.moveTo(-MB, y); ctx.lineTo(0, y); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(totalW, y); ctx.lineTo(totalW + MB, y); ctx.stroke();
  }

  // дорожка у входа
  const doorX = DOOR.x * CS;
  const doorY = (DOOR.y + 1) * CS;
  ctx.fillStyle = '#7f8a96';
  ctx.fillRect(doorX - 3, doorY, CS + 6, MB);
  ctx.strokeStyle = 'rgba(0,0,0,.28)';
  ctx.strokeRect(doorX - 3, doorY, CS + 6, MB);
  // разметка входа (пунктир)
  ctx.strokeStyle = 'rgba(255,255,255,.3)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(doorX + CS / 2, doorY + 2);
  ctx.lineTo(doorX + CS / 2, doorY + MB - 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // деревья сверху
  drawTreeCtx(-MB + 12, -MB + 12);
  drawTreeCtx(totalW - 12, -MB + 12);
  drawTreeCtx(totalW / 2, -MB + 10);

  // фонарь у двери
  drawLamp(-MB + 10, doorY + MB / 2);
  // скамейка справа
  drawBench(totalW + MB / 2, totalH / 2);

  // маленькие кустики
  drawBush(-MB - 4, totalH - MB / 2);
  drawBush(totalW + MB + 4, -MB / 2);

  ctx.restore();
}

function drawTreeCtx(x, y){
  ctx.save();
  ctx.translate(x, y);
  // ствол
  ctx.fillStyle = '#4a2f1c';
  ctx.fillRect(-2, 2, 4, 8);
  // крона
  ctx.fillStyle = '#3b7a3f';
  ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a8c4e';
  ctx.beginPath(); ctx.arc(-3, -2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -1, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5da063';
  ctx.beginPath(); ctx.arc(-1, -4, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawLamp(x, y){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#3a4149';
  ctx.fillRect(-1, -4, 2, 16);
  ctx.beginPath();
  ctx.arc(0, -6, 5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,235,150,.35)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, -6, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#fff1a8';
  ctx.fill();
  ctx.restore();
}
function drawBench(x, y){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#7a4a22';
  ctx.fillRect(-10, -3, 20, 3);
  ctx.fillRect(-10, 1, 20, 2);
  ctx.fillStyle = '#5d381a';
  ctx.fillRect(-9, -6, 2, 9);
  ctx.fillRect(7, -6, 2, 9);
  ctx.restore();
}
function drawBush(x, y){
  ctx.save();
  ctx.fillStyle = '#2f6334';
  ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3d7a42';
  ctx.beginPath(); ctx.arc(x - 3, y - 1, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 3, y - 1, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawWalls(){
  const wall = WALLS[state.decor.wall] || WALLS[0];
  ctx.fillStyle = wall.floor;
  ctx.fillRect(0, 0, GW * CS, GH * CS);
}

function drawFloor(){
  const wall = WALLS[state.decor.wall] || WALLS[0];
  const isNeon = state.decor.wall === 4;

  for(let y = 0; y < GH; y++){
    for(let x = 0; x < GW; x++){
      const c = state.grid[y][x];
      const px = x * CS, py = y * CS;
      if(c.u){
        ctx.fillStyle = (x + y) % 2 === 0 ? wall.floor : shade(wall.floor, -8);
        ctx.fillRect(px, py, CS, CS);
        ctx.strokeStyle = wall.line;
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, CS - 1, CS - 1);
        if(c.door){
          ctx.fillStyle = isNeon ? 'rgba(74,137,255,.3)' : 'rgba(74,137,255,.2)';
          ctx.fillRect(px + 1, py + 1, CS - 2, CS - 2);
          ctx.fillStyle = '#4a89ff';
          ctx.beginPath();
          ctx.arc(px + CS * 0.5, py + CS * 0.5, CS * 0.16, 0, Math.PI * 2);
          ctx.fill();
          // стрелка выхода
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px + CS * 0.5 + 6, py + CS * 0.5);
          ctx.lineTo(px + CS * 0.5 - 6, py + CS * 0.5);
          ctx.moveTo(px + CS * 0.5 - 6, py + CS * 0.5);
          ctx.lineTo(px + CS * 0.5 - 2, py + CS * 0.5 - 3);
          ctx.moveTo(px + CS * 0.5 - 6, py + CS * 0.5);
          ctx.lineTo(px + CS * 0.5 - 2, py + CS * 0.5 + 3);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = '#0b0f15';
        ctx.fillRect(px, py, CS, CS);
        if(isAdjacentToUnlocked(x, y)){
          const pr = expandPrice();
          ctx.strokeStyle = 'rgba(74,137,255,.35)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(px + 2, py + 2, CS - 4, CS - 4);
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(200,220,255,.4)';
          ctx.font = 'bold ' + Math.max(8, CS * 0.22) + 'px system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(fmt(pr), px + CS / 2, py + CS / 2);
        }
      }
    }
  }
  drawWindows();
}

function drawWindows(){
  const w = state.decor.window;
  const topY = -CS * 0.16;
  const count = 4;
  const ww = (GW * CS) / count;
  for(let i = 0; i < count; i++){
    const px = i * ww + ww * 0.15;
    const py = topY;
    const pw = ww * 0.7;
    const ph = CS * 0.14;
    if(w === 0){
      ctx.fillStyle = '#8fd3ff'; ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = '#5b8fb0'; ctx.lineWidth = 1.5; ctx.strokeRect(px, py, pw, ph);
    } else if(w === 1){
      ctx.fillStyle = '#a8e0ff'; ctx.fillRect(px, py, pw, ph * 1.3);
      ctx.strokeStyle = '#5b8fb0'; ctx.lineWidth = 1.5; ctx.strokeRect(px, py, pw, ph * 1.3);
      ctx.beginPath(); ctx.moveTo(px + pw / 2, py); ctx.lineTo(px + pw / 2, py + ph * 1.3); ctx.stroke();
    } else {
      const cols = ['#ff6b6b', '#ffd93d', '#6bcB77', '#4d96ff'];
      for(let j = 0; j < 4; j++){
        ctx.fillStyle = cols[(i + j) % 4];
        ctx.fillRect(px + (j % 2) * pw / 2, py + Math.floor(j / 2) * ph * 0.65, pw / 2, ph * 0.65);
      }
      ctx.strokeStyle = '#5b8fb0'; ctx.lineWidth = 1.5; ctx.strokeRect(px, py, pw, ph * 1.3);
    }
  }
}

function drawFurniture(gx, gy, c){
  const x = gx, y = gy;
  const img = furnSprite(c.t);
  if(img && img.complete && img.naturalWidth){
    ctx.drawImage(img, x + 0.06, y + 0.06, 0.88, 0.88);
  } else {
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(x + 0.08, y + 0.08, 0.84, 0.84);
  }

  if(c.t !== 'counter' && c.stock && c.stock.length){
    const total = shelfQty(c);
    const cap = shelfCapacity(c);
    let idx = 0;
    const maxShow = 6;
    for(let i = 0; i < c.stock.length && idx < maxShow; i++){
      const s = c.stock[i];
      const p = PROD_BY_ID[s.id];
      if(!p) continue;
      const spr = prodSprite(p);
      const show = s.n > 1 ? 2 : 1;
      for(let k = 0; k < show && idx < maxShow; k++){
        const px = x + 0.14 + (idx % 3) * 0.26;
        const py = y + 0.16 + Math.floor(idx / 3) * 0.34;
        if(spr && spr.complete && spr.naturalWidth){
          ctx.drawImage(spr, px, py, 0.22, 0.22);
        } else {
          ctx.fillStyle = p.color;
          ctx.fillRect(px, py, 0.22, 0.22);
        }
        idx++;
      }
    }
    const ratio = total / cap;
    if(ratio < 0.35){
      ctx.fillStyle = 'rgba(255,90,90,.9)';
      ctx.beginPath();
      ctx.arc(x + 0.86, y + 0.14, 0.06, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawCustomer(c){
  const x = c.x, y = c.y;
  ctx.save();
  ctx.globalAlpha = clamp(c.alpha, 0, 1);

  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath();
  ctx.ellipse(x, y + 0.28, 0.3, 0.13, 0, 0, Math.PI * 2);
  ctx.fill();

  const bob = c.bob;
  const walking = c.path.length > 0 || c.state === 'gone';

  // Весь "человечек" поворачивается целиком
  ctx.translate(x, y + bob);
  ctx.rotate(c.dir + Math.PI / 2); // смотрим вверх по-умолчанию

  // ноги
  if(walking){
    const legPhase = Math.sin(c.walk);
    ctx.fillStyle = '#2b3546';
    ctx.beginPath();
    ctx.ellipse(-0.12, 0.18 + legPhase * 0.05, 0.09, 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0.12, 0.18 - legPhase * 0.05, 0.09, 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#2b3546';
    ctx.beginPath();
    ctx.ellipse(-0.1, 0.18, 0.08, 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0.1, 0.18, 0.08, 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // тело
  ctx.fillStyle = c.shirt;
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.28, 0.24, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = shade(c.shirt, -50);
  ctx.lineWidth = 0.025;
  ctx.stroke();

  // руки (по бокам — сбоку относительно направления)
  ctx.fillStyle = c.skin;
  const swing = walking ? Math.sin(c.walk) * 0.03 : 0;
  ctx.beginPath();
  ctx.arc(-0.27, swing, 0.075, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0.27, -swing, 0.075, 0, Math.PI * 2);
  ctx.fill();

  // корзина — перед телом если идёт на кассу
  if(c.cart.length && (c.state === 'toCashier' || c.state === 'paying' || c.state === 'waiting')){
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(-0.1, -0.36, 0.2, 0.16);
    ctx.strokeStyle = '#8a6a10';
    ctx.lineWidth = 0.02;
    ctx.strokeRect(-0.1, -0.36, 0.2, 0.16);
  }

  // голова
  ctx.fillStyle = c.skin;
  ctx.beginPath();
  ctx.arc(0, -0.13, 0.17, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = shade(c.skin, -45);
  ctx.lineWidth = 0.02;
  ctx.stroke();

  // волосы (сверху, сдвинуты в направлении движения)
  ctx.fillStyle = c.hair;
  ctx.beginPath();
  ctx.arc(0, -0.16, 0.165, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -0.19, 0.16, 0.1, 0, 0, Math.PI * 2);
  ctx.fill();

  // глаза — на "лице", которое теперь смотрит в направлении движения
  ctx.fillStyle = '#1b2330';
  ctx.beginPath();
  ctx.arc(-0.06, -0.06, 0.026, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0.06, -0.06, 0.026, 0, Math.PI * 2);
  ctx.fill();

  // улыбка
  ctx.strokeStyle = '#5a3a20';
  ctx.lineWidth = 0.018;
  ctx.beginPath();
  ctx.arc(0, -0.02, 0.05, 0.15, Math.PI - 0.15);
  ctx.stroke();

  ctx.restore();

  // пузырь с товаром при выборе
  if(c.bubble && c.bubbleT > 0){
    const p = PROD_BY_ID[c.bubble];
    if(p){
      const bx = x, by = y - 0.62;
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      if(ctx.roundRect){
        ctx.beginPath(); ctx.roundRect(bx - 0.2, by - 0.2, 0.4, 0.4, 0.1); ctx.fill();
      } else {
        ctx.fillRect(bx - 0.2, by - 0.2, 0.4, 0.4);
      }
      ctx.strokeStyle = '#4a89ff';
      ctx.lineWidth = 0.025;
      ctx.stroke();
      const spr = prodSprite(p);
      if(spr && spr.complete && spr.naturalWidth){
        ctx.drawImage(spr, bx - 0.15, by - 0.15, 0.3, 0.3);
      }
      ctx.restore();
    }
  }

  // индикатор ожидания
  if(c.state === 'waiting'){
    ctx.fillStyle = 'rgba(255,210,87,.95)';
    ctx.font = 'bold 0.3px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('!', x, y - 0.5);
  }
}

function drawCashier(){
  const c = cashier;
  if(!c) return;
  ctx.save();
  ctx.globalAlpha = 1;

  // тень
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath();
  ctx.ellipse(c.x, c.y + 0.28, 0.3, 0.13, 0, 0, Math.PI * 2);
  ctx.fill();

  const x = c.x, y = c.y + c.bob;

  // ноги
  ctx.fillStyle = '#2b3546';
  ctx.beginPath();
  ctx.ellipse(x - 0.1, y + 0.18, 0.08, 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + 0.1, y + 0.18, 0.08, 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  // тело — форма кассира
  ctx.fillStyle = c.shirt;
  ctx.beginPath();
  ctx.ellipse(x, y, 0.28, 0.24, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = shade(c.shirt, -50);
  ctx.lineWidth = 0.025;
  ctx.stroke();

  // бейджик
  ctx.fillStyle = '#ffd257';
  ctx.fillRect(x - 0.06, y - 0.02, 0.12, 0.06);
  ctx.fillStyle = '#8a6a10';
  ctx.fillRect(x - 0.05, y, 0.1, 0.02);

  // руки (сложены перед телом)
  ctx.fillStyle = c.skin;
  ctx.beginPath();
  ctx.arc(x - 0.24, y - 0.02, 0.075, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 0.24, y - 0.02, 0.075, 0, Math.PI * 2);
  ctx.fill();

  // голова
  ctx.fillStyle = c.skin;
  ctx.beginPath();
  ctx.arc(x, y - 0.13, 0.17, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = shade(c.skin, -45);
  ctx.lineWidth = 0.02;
  ctx.stroke();

  // волосы
  ctx.fillStyle = c.hair;
  ctx.beginPath();
  ctx.arc(x, y - 0.16, 0.165, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x, y - 0.19, 0.16, 0.1, 0, 0, Math.PI * 2);
  ctx.fill();

  // глаза
  ctx.fillStyle = '#1b2330';
  ctx.beginPath();
  ctx.arc(x - 0.06, y - 0.1, 0.026, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 0.06, y - 0.1, 0.026, 0, Math.PI * 2);
  ctx.fill();

  // улыбка
  ctx.strokeStyle = '#5a3a20';
  ctx.lineWidth = 0.018;
  ctx.beginPath();
  ctx.arc(x, y - 0.07, 0.05, 0.15, Math.PI - 0.15);
  ctx.stroke();

  ctx.restore();
}

/* ------------------------------ 10. ЛОГИКА -------------------------------- */
const customers = [];
let spawnTimer = 3;

function updateWorld(dt){
  cashier.update(dt);
  for(const c of customers) c.update(dt);
  for(let i = customers.length - 1; i >= 0; i--){
    if(customers[i].dead) customers.splice(i, 1);
  }

  const shelves = shelfCells().filter(s => s.c.stock.length > 0);
  const counters = counterCells();
  const maxCust = Math.min(12, 3 + Math.floor(shelves.length / 2));

  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnTimer = Math.max(2.2, 8.5 - shelves.length * 0.35);
    if(customers.length < maxCust && shelves.length > 0 && counters.length > 0){
      customers.push(new Customer());
    }
  }
}

/* ------------------------------- 11. ВВОД ---------------------------------- */
function screenToCell(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const gx = Math.floor((x - OX) / CS);
  const gy = Math.floor((y - OY) / CS);
  if(gx < 0 || gy < 0 || gx >= GW || gy >= GH) return null;
  return {x: gx, y: gy};
}

let placeMode = null;

function onCellClick(gx, gy){
  // блок при обучении
  if(isTutorialBlocking()) return;

  const c = cellAt(gx, gy);
  if(!c) return;

  if(placeMode && placeMode.kind === 'furniture'){
    if(!c.u){ toast(t('noMoney')); return; }
    if(c.t || c.door){ toast('Занято'); return; }
    c.t = placeMode.type;
    c.stock = [];
    state.ds.place++;
    scheduleSave();
    toast(t('placed') + ': ' + fname(placeMode.type), '#7fd07f');
    placeMode = null;
    updatePlaceBar();
    updateHUD();
    return;
  }

  if(placeMode && placeMode.kind === 'stock'){
    if(!c.u || !c.t || c.t === 'counter'){ return; }
    if(!canAccept(c, placeMode.pid)){
      toast(catName(PROD_BY_ID[placeMode.pid].cat) + ' \u2260 ' + fname(c.t));
      return;
    }
    const avail = state.warehouse[placeMode.pid] || 0;
    if(avail <= 0){ toast(t('nothing')); return; }
    const added = addToShelf(c, placeMode.pid, avail);
    if(added > 0){
      state.warehouse[placeMode.pid] -= added;
      if(state.warehouse[placeMode.pid] <= 0) delete state.warehouse[placeMode.pid];
      state.ds.stock += added;
      scheduleSave();
      updateHUD();
      // проходим обучающий шаг 3
      if(tutorialStep === 3){
        tutorialStep = 4;
        updateTutorialBlock();
        showTutorialHint();
      }
    } else {
      toast(state.lang === 'en' ? 'Shelf full' : 'Полка заполнена');
      return;
    }
    if(!state.warehouse[placeMode.pid]){
      placeMode = null;
      updatePlaceBar();
    }
    return;
  }

  if(!c.u){
    if(!isAdjacentToUnlocked(gx, gy)){ toast('Слишком далеко'); return; }
    const price = expandPrice();
    if(state.money < price){ toast(t('noMoney')); return; }
    state.money -= price;
    c.u = true;
    state.ds.expand++;
    scheduleSave();
    updateHUD();
    toast('+1 ' + (state.lang === 'en' ? 'cell' : 'клетка'), '#7fd07f');
    return;
  }

  if(c.t && c.t !== 'counter'){
    openShelfInfo(gx, gy);
  }
}

function toast(msg, color){
  const box = $('#toast');
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  if(color){ d.style.borderColor = color; d.style.color = color; }
  box.appendChild(d);
  setTimeout(() => {
    d.style.transition = 'opacity .3s, transform .3s';
    d.style.opacity = '0';
    d.style.transform = 'translateY(-8px)';
    setTimeout(() => d.remove(), 320);
  }, 1500);
}

function updateHUD(){

function countFurniture(k){
  let n = 0;
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(c.u && c.t === k) n++;
  }
  return n;
}

function autoStock(){
  const shelves = shelfCells();
  let moved = 0;
  const ids = Object.keys(state.warehouse).map(Number).sort((a, b) => PROD_BY_ID[b].cost - PROD_BY_ID[a].cost);
  for(const pid of ids){
    if(!state.warehouse[pid]) continue;
    for(const s of shelves){
      if(!state.warehouse[pid]) break;
      if(!canAccept(s.c, pid)) continue;
      const added = addToShelf(s.c, pid, state.warehouse[pid]);
      if(added > 0){
        state.warehouse[pid] -= added;
        moved += added;
        if(state.warehouse[pid] <= 0){ delete state.warehouse[pid]; }
      }
    }
  }
  if(moved > 0){
    state.ds.stock += moved;
    toast((state.lang === 'en' ? 'Stocked' : 'Разложено') + ': ' + moved, '#7fd07f');
    updateHUD();
    scheduleSave();
  } else {
    toast(state.lang === 'en' ? 'No free slots' : 'Нет свободных мест');
  }
}

  openModal(t('tasks'), el => {
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px';
    head.innerHTML = `<div class="chip">${todayStr()}</div>`;
    el.appendChild(head);

    state.tasks.forEach(tk => {
      const prog = taskProgress(tk);
      const done = prog >= tk.target;
      const row = document.createElement('div');
      row.className = 'row';
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.style.flex = '1';
      nm.innerHTML = `<b>${taskText(tk)}</b>
        <span>${prog} / ${tk.target} \u00B7 ${t('reward')}: ${tk.reward} \u20BF</span>
        <div class="progressbar"><i style="width:${(prog / tk.target * 100).toFixed(0)}%"></i></div>`;
      const b = document.createElement('button');
      b.className = 'btn' + (done && !tk.claimed ? '' : ' ghost');
      b.textContent = tk.claimed ? t('claimed') : t('claim');
      b.disabled = !done || tk.claimed;
      b.onclick = () => {
        if(tk.claimed || !done) return;
        tk.claimed = true;
        state.money += tk.reward;
        updateHUD(); scheduleSave();
        toast('+' + fmt(tk.reward) + ' \u20BF', '#ffd257');
        closeModal(); openTasks();
      };
      row.appendChild(nm); row.appendChild(b);
      el.appendChild(row);
    });
  });
}

/* ---- ежедневная награда ---- */
function openDaily(){
  openModal(t('daily'), el => {
    const today = todayStr();
    const canTake = state.lastDaily !== today;
    const amounts = [100, 200, 350, 550, 800, 1200, 2000];
    const dayIdx = state.streak % 7;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px';
    amounts.forEach((a, i) => {
      const d = document.createElement('div');
      d.style.cssText = `padding:12px 4px;border-radius:12px;text-align:center;font-size:12px;font-weight:700;
        background:${i === dayIdx ? '#2d6cdf' : (i < dayIdx ? '#1f3a2a' : '#1a212c')};
        border:1px solid ${i === dayIdx ? '#4a89ff' : '#232d3b'};`;
      d.innerHTML = `<div style="font-size:10px;opacity:.7;margin-bottom:4px">${state.lang === 'en' ? 'Day' : 'День'} ${i + 1}</div>
        <div style="color:#ffd257">${fmt(a)}</div>`;
      wrap.appendChild(d);
    });
    el.appendChild(wrap);

    const st = document.createElement('div');
    st.className = 'chip';
    st.textContent = t('streak') + ': ' + state.streak;
    el.appendChild(st);

    const btn = document.createElement('button');
    btn.className = 'btn' + (canTake ? '' : ' ghost');
    btn.style.cssText = 'width:100%;padding:14px;font-size:15px;margin-top:14px';
    btn.textContent = canTake ? (t('take') + ' ' + fmt(amounts[dayIdx]) + ' \u20BF') : t('dailyTaken');
    btn.disabled = !canTake;
    btn.onclick = () => {
      if(!canTake) return;
      state.money += amounts[dayIdx];
      state.lastDaily = today;
      state.streak++;
      updateHUD(); scheduleSave();
      toast('+' + fmt(amounts[dayIdx]) + ' \u20BF', '#ffd257');
      closeModal();
    };
    el.appendChild(btn);
  });
}

/* ---- награда за время ---- */
function checkTimeRewards(){
  const mins = state.playtime / 60;
  const next = TIME_REWARDS[state.lastRewardIdx];
  if(!next) return;
  if(mins >= next.min){
    state.lastRewardIdx++;
    state.money += next.amount;
    updateHUD(); scheduleSave();
    toast(t('onlineReward') + ': +' + fmt(next.amount) + ' \u20BF', '#ffd257');
  }
}

/* ---- реклама ---- */
function showAdOverlay(text){
  $('#overlayText').textContent = text || t('adLoading');
  $('#overlay').style.display = 'flex';
  Music.stop();
}
function hideAdOverlay(){
  $('#overlay').style.display = 'none';
  if(state.music) Music.start();
}

/* ---- обучение ---- */
let tutorialStep = 0;

function isTutorialBlocking(){
  return tutorialStep > 0 && !state.tutorialDone;
}

function updateTutorialBlock(){
  document.body.classList.toggle('tutorial-on', isTutorialBlocking());
  document.querySelectorAll('.botbtn, .iconbtn').forEach(b => b.classList.remove('tutorial-active'));
  if(!isTutorialBlocking()) return;
  if(tutorialStep === 2){
    document.getElementById('btnShop').classList.add('tutorial-active');
  } else if(tutorialStep === 3){
    document.getElementById('btnStock').classList.add('tutorial-active');
  }
}

function showTutorialHint(){
  const hint = $('#hint');
  if(!isTutorialBlocking()){ hint.style.display = 'none'; return; }
  const msgs = {
    1: t('tutorial1'), 2: t('tutorial2'), 3: t('tutorial3'),
    4: t('tutorial4'), 5: t('tutorial5')
  };
  const msg = msgs[tutorialStep];
  if(!msg){ hint.style.display = 'none'; return; }
  hint.style.display = 'block';
  hint.innerHTML = `<div>${msg}</div>`;
  if(tutorialStep === 1){
    const row = document.createElement('div');
    row.className = 'hintrow';
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = t('next');
    b.onclick = () => {
      tutorialStep = 2;
      updateTutorialBlock();
      showTutorialHint();
    };
    row.appendChild(b);
    hint.appendChild(row);
  } else if(tutorialStep === 4){
    // Показываем кнопку "Завершить" сразу после того как игрок разложил товар
    const row = document.createElement('div');
    row.className = 'hintrow';
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = t('finish');
    b.onclick = () => {
      state.tutorialDone = true;
      tutorialStep = 0;
      updateTutorialBlock();
      hint.style.display = 'none';
      scheduleSave();
      toast(state.lang === 'en' ? 'Tutorial complete!' : 'Обучение завершено!', '#7fd07f');
    };
    row.appendChild(b);
    hint.appendChild(row);
  }
}

function startTutorial(){
  tutorialStep = 1;
  state.tutorialDone = false;
  updateTutorialBlock();
  showTutorialHint();
}
function skipTutorial(){
  tutorialStep = 0;
  state.tutorialDone = true;
  updateTutorialBlock();
  $('#hint').style.display = 'none';
  scheduleSave();
}

/* ---- язык ---- */
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  updateHUD();
}

/* ------------------------------- 13. VK ----------------------------------- */
let launchParams = null;

function initVK(){
  if(!vk) return;
  try { vk.send('VKWebAppInit'); } catch(e){}

  vkSend('VKWebAppGetLaunchParams').then(data => {
    launchParams = data;
    return vkSend('VKWebAppShowBannerAd', {
      banner_type: 'bottom', layout_type: 'resize', height: 60
    }).catch(() => vkSend('VKWebAppShowBannerAd').catch(() => {}));
  }).catch(() => {
    vkSend('VKWebAppShowBannerAd', {
      banner_type: 'bottom', layout_type: 'resize', height: 60
    }).catch(() => {});
  });

  try {
    vk.subscribe(e => {
      const type = e.detail ? e.detail.type : e.type;
      if(type === 'VKWebAppViewHide'){
        paused = true; Music.stop();
      } else if(type === 'VKWebAppViewRestore'){
        paused = false;
        if(state && state.music) Music.start();
      }
    });
  } catch(err){}
}

window.addEventListener('blur', () => { paused = true; Music.stop(); });
window.addEventListener('focus', () => { paused = false; if(state && state.music) Music.start(); });
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ paused = true; Music.stop(); }
  else { paused = false; if(state && state.music) Music.start(); }
});

/* ------------------------------- 14. ЦИКЛ --------------------------------- */
let paused = false;
let lastTs = 0;

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if(dt > 0.1) dt = 0.1;
  if(dt < 0) dt = 0;

  if(!paused && state){
    updateWorld(dt);
    state.playtime += dt;
    checkTimeRewards();
    if(!window._saveAcc) window._saveAcc = 0;
    window._saveAcc += dt;
    if(window._saveAcc > 20){ window._saveAcc = 0; scheduleSave(); }
    if(state.tasksDate !== todayStr()){
      checkDailyReset();
      updateHUD();
    }
  }
  if(state) draw();
}

/* ------------------------------ 15. СТАРТ --------------------------------- */
async function boot(){
  state = newState();
  initGrid();

  const loaded = await loadGame();
  if(!loaded){
    state = newState();
    initGrid();
  }
  checkDailyReset();
  applyLang();
  resize();

  if(!loaded){
    setTimeout(() => {
      openModal(state.lang === 'en' ? 'Welcome!' : 'Добро пожаловать!', el => {
        const q = document.createElement('div');
        q.style.cssText = 'text-align:center;padding:16px 8px;font-size:15px;font-weight:600';
        q.textContent = t('tutorialQ');
        el.appendChild(q);
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px';
        const yes = document.createElement('button');
        yes.className = 'btn';
        yes.style.cssText = 'flex:1;padding:13px';
        yes.textContent = t('tutorialYes');
        yes.onclick = () => { closeModal(); startTutorial(); };
        const no = document.createElement('button');
        no.className = 'btn ghost';
        no.style.cssText = 'flex:1;padding:13px';
        no.textContent = t('tutorialSkip');
        no.onclick = () => { closeModal(); skipTutorial(); };
        row.appendChild(yes); row.appendChild(no);
        el.appendChild(row);
      });
    }, 400);
  } else if(!state.tutorialDone){
    // сохраняем прогресс обучения
    setTimeout(() => {
      if(!state.tutorialDone && tutorialStep === 0){
        // если игра была прервана, не продолжаем обучение с середины
      }
    }, 100);
  }

  updateHUD();
  updatePlaceBar();
  updateTutorialBlock();

  const startMusic = () => {
    if(state.music) Music.start();
    document.removeEventListener('pointerdown', startMusic);
    document.removeEventListener('keydown', startMusic);
  };
  document.addEventListener('pointerdown', startMusic);
  document.addEventListener('keydown', startMusic);

  requestAnimationFrame(loop);

  setInterval(() => { if(state) updateHUD(); }, 5000);
}

/* ------------------------------ 16. СОБЫТИЯ ------------------------------- */
$('#btnShop').onclick = () => { if(!paused && !isTutorialBlocking()) openShop(); };
$('#btnStock').onclick = () => { if(!paused && !isTutorialBlocking()) openWarehouse(); };
$('#btnTasks').onclick = () => { if(!paused && !isTutorialBlocking()) openTasks(); };
$('#btnDaily').onclick = () => { if(!paused && !isTutorialBlocking()) openDaily(); };
$('#btnSettings').onclick = () => { if(!paused && !isTutorialBlocking()) openSettings(); };
$('#btnBuild').onclick = () => {
  if(paused || isTutorialBlocking()) return;
  openModal(t('build'), el => {
    const items = [
      {label: t('furniture'), act: () => { closeModal(); openShop(); }},
      {label: t('expand'), act: () => { closeModal(); openShop(); }},
      {label: t('decor'), act: () => { closeModal(); openShop(); }}
    ];
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.cursor = 'pointer';
      row.innerHTML = `<div class="nm"><b>${it.label}</b></div>`;
      row.onclick = it.act;
      el.appendChild(row);
    });
  });
};
$('#btnInvite').onclick = () => {
  if(paused || isTutorialBlocking()) return;
  vkSend('VKWebAppShowInviteBox').then(() => {
    toast(state.lang === 'en' ? 'Invite sent!' : 'Приглашение отправлено!', '#7fd07f');
  }).catch(() => {
    toast(state.lang === 'en' ? 'Invite unavailable' : 'Приглашение недоступно');
  });
};

// переопределим обработчик магазина и склада для обучения
const _origShopHandler = $('#btnShop').onclick;
$('#btnShop').onclick = () => {
  if(paused) return;
  if(isTutorialBlocking() && tutorialStep !== 2) return;
  openShop();
};
const _origStockHandler = $('#btnStock').onclick;
$('#btnStock').onclick = () => {
  if(paused) return;
  if(isTutorialBlocking() && tutorialStep !== 3) return;
  openWarehouse();
};

// кнопка магазина во время обучения тоже вызывает openShop с покупкой

window.addEventListener('resize', () => { if(state) resize(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if(state) resize(); }, 250));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => { if(state) resize(); });
}

let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive: false});

/* ------------------------------- 17. ПОЛИФИЛЛ ----------------------------- */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    if(typeof r === 'number') r = [r, r, r, r];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
    return this;
  };
}

/* ------------------------------- 18. ЗАПУСК ------------------------------- */
initVK();
boot();
</script>
