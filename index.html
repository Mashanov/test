<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0b14">
<title>Мистическое Средневековье</title>
<script src="https://vk.com/js/api/xd_connection.js?2"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
:root{
  --gold:#e8c26a; --gold-d:#a8813a; --gold-l:#ffe9a8;
  --bg:#0b0813; --panel:#171226; --panel2:#211a33;
  --text:#e9e2d0; --muted:#9d94ad;
  --accent:#7b5cff; --green:#5cd68a; --red:#ff5f6d;
  --border:rgba(232,194,106,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;height:100%;width:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:"Georgia","Palatino Linotype",serif;
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;position:relative;overflow:hidden}

/* ============ TOP BAR ============ */
#topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:5px 8px;min-height:46px;
  background:linear-gradient(180deg,#1c1530,#120d20);
  border-bottom:1px solid rgba(232,194,106,.18);
  box-shadow:0 3px 12px rgba(0,0,0,.5);
  z-index:20;
}
#goldbox{
  display:flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#2c2140,#1c1530);
  border:1px solid var(--border);border-radius:20px;
  padding:4px 11px 4px 7px;font-size:14px;font-weight:bold;color:var(--gold-l);
  white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}
#goldbox svg{width:16px;height:16px;flex:0 0 auto}
#spacer{flex:1}
.tbtn{
  width:36px;height:36px;flex:0 0 auto;border-radius:11px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,#2a2140,#1a1428);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;padding:0;transition:transform .12s,filter .12s;
}
.tbtn:active{transform:scale(.92);filter:brightness(1.25)}
.tbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tbtn .dot{
  position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;
  background:var(--red);border:2px solid #120d20;display:none;
  animation:pulse 1.4s infinite;
}
.tbtn.alert .dot{display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* ============ STAGE ============ */
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}

/* ============ UNIT BAR ============ */
#unitbar{
  flex:0 0 auto;display:flex;gap:5px;padding:6px 7px;
  background:linear-gradient(180deg,#150f22,#0d0916);
  border-top:1px solid rgba(232,194,106,.18);
  z-index:20;min-height:70px;align-items:stretch;
}
.ubtn{
  flex:1 1 0;min-width:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:1px;padding:2px 1px 3px;border-radius:11px;
  border:1px solid rgba(232,194,106,.28);
  background:linear-gradient(180deg,#2b2142,#191227);
  color:var(--text);cursor:pointer;overflow:hidden;
  transition:transform .1s,filter .1s;
}
.ubtn:active{transform:scale(.94)}
.ubtn img{width:auto;height:34px;max-width:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.ubtn .cost{
  font-size:11px;font-weight:bold;color:var(--gold-l);
  display:flex;align-items:center;gap:3px;line-height:1;
}
.ubtn .cost i{width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 6px var(--accent);display:inline-block}
.ubtn .nm{font-size:9px;color:var(--muted);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ubtn.disabled{opacity:.42;filter:grayscale(.7)}

/* ============ BANNER ============ */
#banner{
  flex:0 0 auto;min-height:0;height:0;overflow:hidden;
  background:#000;display:flex;align-items:center;justify-content:center;
  transition:height .25s;
}
#banner.on{height:56px;min-height:56px}

/* ============ OVERLAYS ============ */
.overlay{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;padding:12px;
  background:rgba(5,3,10,.78);backdrop-filter:blur(3px);
}
.overlay.show{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1e1730,#140f22);
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 18px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;animation:pop .2s cubic-bezier(.2,1.4,.5,1);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal.wide{max-width:560px}
.mhead{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:12px 14px;border-bottom:1px solid rgba(232,194,106,.2);
  background:linear-gradient(180deg,rgba(123,92,255,.14),transparent);
}
.mhead h2{margin:0;font-size:17px;color:var(--gold-l);letter-spacing:.5px;flex:1;font-weight:normal}
.mclose{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--gold);font-size:19px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
.mclose:active{background:rgba(255,255,255,.12)}
.mbody{padding:12px 14px 16px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0}

/* ============ SCROLLBARS ============ */
.mbody,.scroll{
  scrollbar-width:thin;scrollbar-color:var(--gold-d) rgba(255,255,255,.05);
}
.mbody::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:9px;height:9px}
.mbody::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{
  background:rgba(255,255,255,.045);border-radius:9px;margin:4px 0;
}
.mbody::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--gold),var(--gold-d));
  border-radius:9px;border:2px solid #171226;background-clip:padding-box;
}
.mbody::-webkit-scrollbar-thumb:hover,.scroll::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,var(--gold-l),var(--gold));background-clip:padding-box;
}

/* ============ GENERIC UI ============ */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  border-radius:11px;margin-bottom:9px}
.row .lab{font-size:14px;color:var(--text)}
.row .sub{font-size:11px;color:var(--muted);margin-top:2px}
.btn{
  border:1px solid var(--border);border-radius:11px;padding:9px 16px;
  background:linear-gradient(180deg,#3a2b5e,#241a3d);color:var(--gold-l);
  font-family:inherit;font-size:14px;cursor:pointer;font-weight:bold;
  transition:transform .1s,filter .12s;white-space:nowrap;
}
.btn:active{transform:scale(.95);filter:brightness(1.2)}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.6)}
.btn.green{background:linear-gradient(180deg,#2c6b47,#1c4530);border-color:rgba(92,214,138,.5);color:#c9ffe0}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn.full{width:100%;display:block;margin-top:8px}
.switch{
  position:relative;width:52px;height:28px;border-radius:16px;flex:0 0 auto;
  background:#2a2238;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.2s;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(180deg,#8a8a9a,#5a5a6a);transition:.2s;
}
.switch.on{background:linear-gradient(180deg,#4b7bff,#2b4bc9);border-color:rgba(120,160,255,.6)}
.switch.on::after{left:26px;background:linear-gradient(180deg,#fff,#cfe0ff)}
.langrow{display:flex;gap:8px}
.langbtn{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer}
.langbtn.active{background:linear-gradient(180deg,#3a2b5e,#241a3d);color:var(--gold-l);border-color:var(--border);font-weight:bold}
input.pcode{
  flex:1;min-width:0;background:#0f0b1a;border:1px solid rgba(255,255,255,.13);
  border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none;
}
input.pcode:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(123,92,255,.22)}

/* quests */
.quest{
  display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:8px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:11px;
}
.quest.done{border-color:rgba(92,214,138,.45);background:rgba(92,214,138,.08)}
.quest .qi{flex:1;min-width:0}
.quest .qn{font-size:13px;margin-bottom:5px;line-height:1.25}
.quest .qbar{height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.quest .qbar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--gold-d),var(--gold));transition:width .3s}
.quest .qr{font-size:12px;color:var(--gold-l);font-weight:bold;white-space:nowrap;display:flex;gap:3px;align-items:center}
.quest .qr svg{width:13px;height:13px}

/* rest room */
.rest-timer{
  font-size:34px;text-align:center;color:var(--gold-l);letter-spacing:2px;
  font-variant-numeric:tabular-nums;margin:6px 0 2px;
}
.rest-bar{height:9px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin:10px 0}
.rest-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#b48bff);transition:width .5s linear}
.center{text-align:center}
.muted{color:var(--muted);font-size:12px;line-height:1.45}

/* playtime rewards */
.ptime-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:8px;
  border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
}
.ptime-item.ready{border-color:rgba(92,214,138,.5);background:rgba(92,214,138,.1);animation:glowp 1.6s infinite}
@keyframes glowp{0%,100%{box-shadow:0 0 0 rgba(92,214,138,0)}50%{box-shadow:0 0 14px rgba(92,214,138,.4)}}
.ptime-item.done{opacity:.45}
.ptime-item .tl{flex:1;font-size:13px}

/* ad overlay */
#adov{
  position:fixed;inset:0;z-index:9000;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:rgba(3,2,8,.94);backdrop-filter:blur(6px);
}
#adov.show{display:flex}
.spinner{
  width:56px;height:56px;border-radius:50%;
  border:4px solid rgba(232,194,106,.18);border-top-color:var(--gold);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#adov .adtxt{color:var(--gold-l);font-size:15px;text-align:center;padding:0 30px;line-height:1.5}

/* tutorial */
#tutbox{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(80px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 24px);max-width:430px;z-index:5000;display:none;
  background:linear-gradient(180deg,#241b3a,#160f26);
  border:1px solid var(--border);border-radius:14px;padding:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.85);
}
#tutbox.show{display:block;animation:pop .22s}
#tutbox .tt{font-size:14px;line-height:1.5;margin-bottom:11px;color:var(--text)}
#tutbox .tfoot{display:flex;gap:8px;align-items:center;justify-content:space-between}
#tutbox .dots{display:flex;gap:5px}
#tutbox .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}
#tutbox .dots i.on{background:var(--gold)}
.tut-highlight{position:relative;z-index:4000!important;box-shadow:0 0 0 3px var(--gold),0 0 24px rgba(232,194,106,.7)!important;border-radius:12px!important}

/* result */
.res-big{font-size:26px;text-align:center;margin:4px 0 10px;color:var(--gold-l);letter-spacing:1px}
.res-line{display:flex;justify-content:space-between;padding:7px 4px;font-size:14px;border-bottom:1px dashed rgba(255,255,255,.08)}

/* toast */
#toast{
  position:fixed;left:50%;top:64px;transform:translate(-50%,-16px);
  z-index:9500;background:linear-gradient(180deg,#2c2247,#1a1330);
  border:1px solid var(--border);border-radius:11px;padding:10px 18px;
  color:var(--gold-l);font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.7);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* main menu */
#mainmenu{
  position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:20px;
  background:radial-gradient(ellipse at 50% 40%,rgba(123,92,255,.16),transparent 65%);
}
#mainmenu.hidden{display:none}
#gametitle{
  font-size:clamp(20px,5.4vw,32px);text-align:center;color:var(--gold-l);
  letter-spacing:1.5px;text-shadow:0 0 26px rgba(232,194,106,.45),0 2px 4px #000;
  line-height:1.2;margin:0;
}
#gametitle small{display:block;font-size:.5em;color:var(--muted);letter-spacing:3px;margin-top:7px}
#playbtn{
  padding:15px 52px;font-size:19px;border-radius:14px;
  background:linear-gradient(180deg,#c9a24a,#8a6a20);
  border:2px solid #ffdf94;color:#241a04;font-weight:bold;font-family:inherit;
  cursor:pointer;letter-spacing:2px;text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:0 6px 0 #4a3610,0 12px 30px rgba(0,0,0,.6);
  transition:transform .09s,box-shadow .09s;
}
#playbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #4a3610,0 6px 16px rgba(0,0,0,.6)}
#levelinfo{font-size:13px;color:var(--muted);letter-spacing:1px}

/* battle HUD */
#battlehud{
  position:absolute;top:8px;left:0;right:0;z-index:25;display:none;
  padding:0 10px;pointer-events:none;
}
#battlehud.show{display:block}
.bhrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.bhrow .bhn{width:56px;color:var(--muted);text-align:right;flex:0 0 auto}
.bhrow .bhbar{flex:1;height:11px;border-radius:6px;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.1);overflow:hidden}
.bhrow .bhbar i{display:block;height:100%;transition:width .2s;border-radius:5px}
.bhrow.enemy .bhn{text-align:left}
#pausebtn{
  position:absolute;top:8px;right:8px;z-index:26;width:34px;height:34px;
  display:none;align-items:center;justify-content:center;
  border-radius:10px;border:1px solid var(--border);
  background:rgba(20,14,34,.85);color:var(--gold);cursor:pointer;
}
#pausebtn.show{display:flex}
#pausebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div id="goldbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9" fill="rgba(232,194,106,.18)"/>
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v10M9.5 9.5h3.8a1.7 1.7 0 010 3.4H9.5h4a1.7 1.7 0 010 3.4H9.5" stroke-width="1.4"/>
      </svg>
      <span id="goldval">0</span>
    </div>
    <div id="spacer"></div>
    <button class="tbtn" id="btn-quests" title="quests">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      <span class="dot"></span>
    </button>
    <button class="tbtn" id="btn-rest" title="rest">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </button>
    <button class="tbtn" id="btn-daily" title="daily">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13"/><path d="M12 8S9 3 6.5 4.5 8 8 12 8zM12 8s3-5 5.5-3.5S16 8 12 8z"/></svg>
      <span class="dot"></span>
    </button>
    <button class="tbtn" id="btn-time" title="time">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span class="dot"></span>
    </button>
    <button class="tbtn" id="btn-invite" title="invite">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 14.6c2.9.2 5 2.3 5 5.4"/></svg>
    </button>
    <button class="tbtn" id="btn-settings" title="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
    </button>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>

    <div id="battlehud">
      <div class="bhrow"><div class="bhn" id="lbl-ally">Вы</div><div class="bhbar"><i id="hp-ally" style="width:100%;background:linear-gradient(90deg,#3f8cff,#6bb6ff)"></i></div></div>
      <div class="bhrow enemy"><div class="bhn" id="lbl-enemy">Враг</div><div class="bhbar"><i id="hp-enemy" style="width:100%;background:linear-gradient(90deg,#ff4d5e,#ff8b6b)"></i></div></div>
    </div>
    <button id="pausebtn">
      <svg viewBox="0 0 24 24"><rect x="7" y="5" width="4" height="14" rx="1"/><rect x="13" y="5" width="4" height="14" rx="1"/></svg>
    </button>

    <div id="mainmenu">
      <h1 id="gametitle">МИСТИЧЕСКОЕ<small>СРЕДНЕВЕКОВЬЕ</small></h1>
      <div id="levelinfo"></div>
      <button id="playbtn">В БОЙ</button>
      <div class="muted center" style="max-width:280px" id="menu_hint"></div>
    </div>
  </main>

  <div id="unitbar"></div>
  <div id="banner"></div>
</div>

<!-- ================= OVERLAYS ================= -->

<div class="overlay" id="ov-settings">
  <div class="modal">
    <div class="mhead"><h2 data-i18n="settings"></h2><button class="mclose" data-close>&times;</button></div>
    <div class="mbody">
      <div class="row">
        <div><div class="lab" data-i18n="music"></div><div class="sub" data-i18n="music_sub"></div></div>
        <div class="switch on" id="sw-music"></div>
      </div>
      <div class="row" style="display:block">
        <div class="lab" style="margin-bottom:8px" data-i18n="language"></div>
        <div class="langrow">
          <button class="langbtn" data-lang="ru">Русский</button>
          <button class="langbtn" data-lang="en">English</button>
        </div>
      </div>
      <div class="row" style="display:block">
        <div class="lab" style="margin-bottom:8px" data-i18n="promocode"></div>
        <div style="display:flex;gap:8px">
          <input class="pcode" id="pcode-input" type="text" placeholder="...">
          <button class="btn" id="pcode-apply" data-i18n="apply"></button>
        </div>
        <div class="muted" id="pcode-msg" style="margin-top:8px;min-height:16px"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="ov-quests">
  <div class="modal">
    <div class="mhead"><h2 data-i18n="quests"></h2><button class="mclose" data-close>&times;</button></div>
    <div class="mbody" id="quest-list"></div>
  </div>
</div>

<div class="overlay" id="ov-rest">
  <div class="modal">
    <div class="mhead"><h2 data-i18n="rest"></h2><button class="mclose" data-close>&times;</button></div>
    <div class="mbody">
      <div class="center muted" data-i18n="rest_desc" style="margin-bottom:6px"></div>
      <div class="rest-timer" id="rest-timer">60</div>
      <div class="rest-bar"><i id="rest-fill" style="width:0%"></i></div>
      <div class="center muted" id="rest-total"></div>
    </div>
  </div>

/* ==========================================================================
   4. MUSIC (WebAudio procedural)
   ========================================================================== */
const Music = {
  ctx:null, master:null, timer:null, playing:false, pad:null, i:0,
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
  },
  play(){
    this.ensure();
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    this.playing = true;
    const n = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(n);
    this.master.gain.setTargetAtTime(0.13, n, 0.8);
    if(!this.pad) this._startPad();
    if(!this.timer){
      this.timer = setInterval(()=>this._tick(), 400);
    }
  },
  stop(){
    this.playing = false;
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    if(!this.ctx) return;
    const n = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(n);
    this.master.gain.setTargetAtTime(0, n, 0.25);
  },
  _startPad(){
    const c = this.ctx;
    const g = c.createGain(); g.gain.value = 0.16;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=620; f.Q.value=1.2;
    g.connect(f); f.connect(this.master);
    const freqs = [110, 164.81, 220, 277.18];
    const oscs = freqs.map(fr=>{
      const o = c.createOscillator();
      o.type='sawtooth'; o.frequency.value=fr; o.detune.value=(Math.random()*14-7);
      o.connect(g); o.start();
      return o;
    });
    const lfo = c.createOscillator(); lfo.frequency.value=0.055;
    const lg = c.createGain(); lg.gain.value=260;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    this.pad = {g,f,oscs,lfo};
  },
  _tick(){
    if(!this.playing || !this.ctx) return;
    const scale = [220, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
    const step = [0,2,4,3,5,4,2,0,1,3,5,6];
    const n = scale[step[this.i % step.length] % scale.length];
    this.i++;
    const c = this.ctx, t0 = c.currentTime;
    const o = c.createOscillator(); o.type='triangle'; o.frequency.value = n;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.075, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.35);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 1.45);
  }
};
function refreshMusic(){
  if(state.music && !isPausedBy('hidden') && !isPausedBy('ad')){
    Music.play();
  } else {
    Music.stop();
  }
}

const SPRITES = {};
function svgToImage(svg){
  const img = new Image();
  img.decoding = 'async';
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return img;
}
function loadSprites(){
  return new Promise(resolve=>{
    let left = Object.keys(SVG_SRC).length;
    Object.keys(SVG_SRC).forEach(k=>{
      const img = svgToImage(SVG_SRC[k]);
      SPRITES[k] = img;
      const done = ()=>{ if(--left<=0) resolve(); };
      if(img.complete && img.naturalWidth) done();
      else { img.onload = done; img.onerror = done; }
    });
  });
}

/* ==========================================================================
   7. GAME ENGINE
   ========================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W = 800, H = 500, DPR = 1;

function resizeCanvas(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width);
  H = Math.max(160, r.height);
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas, 220));

/* ---- projection ---- */
function project(u, lane){
  const s = 0.50 + 0.44 * lane;
  const x = W * 0.5 + (u - 0.5) * W * s;
  const y = H * 0.32 + lane * H * 0.48;
  return {x, y, s};
}

const UNITS = {
  sword:  {key:'sword',  cost:30,  hp:110, dmg:12, range:0.030, speed:0.085, atk:0.90, img:'sword'},
  archer: {key:'archer', cost:45,  hp:66,  dmg:10, range:0.150, speed:0.075, atk:1.10, img:'archer', ranged:true, proj:'#e8e2d0'},
  mage:   {key:'mage',   cost:70,  hp:78,  dmg:20, range:0.135, speed:0.060, atk:1.70, img:'mage',  ranged:true, proj:'#b48bff', aoe:0.055},
  knight: {key:'knight', cost:110, hp:310, dmg:25, range:0.028, speed:0.055, atk:1.30, img:'knight'},
  heal:   {key:'heal',   cost:80,  hp:92,  dmg:0,  range:0.125, speed:0.065, atk:1.50, img:'heal',  heal:26}
};
const UNIT_ORDER = ['sword','archer','mage','knight','heal'];

const LANES = [0.22, 0.5, 0.78];
const PLAYER_BASE_U = 0.045;
const ENEMY_BASE_U  = 0.955;

/* ---- particles / projectiles ---- */
const G = {
  active: false,
  over: true,
  level: 1,
  units: [],
  projectiles: [],
  particles: [],
  essence: 60,
  essenceMax: 120,
  essenceRegen: 10,
  playerBase: {hp: 1000, max: 1000},
  enemyBase:  {hp: 900,  max: 900},
  spawnTimer: 0,
  spawnInterval: 4,
  time: 0,
  kills: 0,
  spawned: 0,
  shakeT: 0,
  stars: [],
  uid: 1
};

function initStars(){
  G.stars = [];
  let seed = 1337;
  const rnd = ()=>{ seed = (seed*16807)%2147483647; return seed/2147483647; };
  for(let i=0;i<70;i++){
    G.stars.push({x:rnd(), y:rnd()*0.42, r:0.4+rnd()*1.4, a:0.25+rnd()*0.6, tw:rnd()*6.28});
  }
}
initStars();

/* ---- level config ---- */
function levelCfg(lv){
  return {
    enemyBaseHp: 700 + lv*240,
    playerBaseHp: 950 + lv*60,
    spawnInterval: Math.max(1.25, 4.3 - lv*0.22),
    tier: Math.min(1, (lv-1)/10)
  };
}

/* ---- unit factory ---- */
function makeUnit(type, side, lane, u){
  const d = UNITS[type];
  const hpScale = side==='enemy' ? (1 + (G.level-1)*0.16) : (1 + (G.level-1)*0.05);
  const dmgScale = side==='enemy' ? (1 + (G.level-1)*0.13) : (1 + (G.level-1)*0.04);
  return {
    id: G.uid++,
    type, side, lane, u,
    hp: d.hp*hpScale,
    maxHp: d.hp*hpScale,
    dmg: d.dmg*dmgScale,
    range: d.range,
    speed: d.speed,
    atk: d.atk,
    cd: Math.random()*0.4,
    bob: Math.random()*6.28,
    hitFlash: 0,
    heal: d.heal ? d.heal*0.9 : 0
  };
}

function spawnUnit(type, side, lane){
  const d = UNITS[type];
  const u = side === 'player' ? PLAYER_BASE_U + 0.03 : ENEMY_BASE_U - 0.03;
  const unit = makeUnit(type, side, lane, u);
  G.units.push(unit);
  if(side === 'player'){
    G.spawned++;
    questProgress('spawns', 1);
    if(type==='mage') { questProgress('mages',1); state.stats.mages++; }
    if(type==='knight') { questProgress('knights',1); state.stats.knights++; }
    if(type==='archer') { questProgress('archers',1); state.stats.archers++; }
    state.stats.spawns++;
  }
  return unit;
}

/* ---- damage ---- */
function damageUnit(target, amount, byPlayer){
  if(target.hp <= 0) return;
  target.hp -= amount;
  target.hitFlash = 0.18;
  if(target.hp <= 0){
    target.hp = 0;
    burst(target.u, target.lane, byPlayer ? '#7b5cff' : '#ff5f6d', 8);
    if(byPlayer){
      G.kills++;
      state.stats.kills++;
      questProgress('kills', 1);
    }
  }
}

function burst(u, lane, color, n){
  const p = project(u, lane);
  for(let i=0;i<n;i++){
    const a = Math.random()*6.28, sp = 18 + Math.random()*60;
    G.particles.push({
      x:p.x, y:p.y - 22*p.s,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
      life:0.55 + Math.random()*0.35, max:0.9,
      color, r: 1.6 + Math.random()*2.2, s:p.s
    });
  }
}

/* ---- combat step ---- */
function updateGame(dt){
  G.time += dt;
  G.essence = Math.min(G.essenceMax, G.essence + G.essenceRegen*dt);

  /* enemy spawner */
  G.spawnTimer -= dt;
  if(G.spawnTimer <= 0){
    G.spawnTimer = G.spawnInterval * (0.8 + Math.random()*0.45);
    const pool = ['sword','sword','archer'];
    if(G.level >= 2) pool.push('archer','mage');
    if(G.level >= 3) pool.push('knight','heal');
    if(G.level >= 5) pool.push('knight','mage','heal');
    const type = pool[Math.floor(Math.random()*pool.length)];
    spawnUnit(type, 'enemy', LANES[Math.floor(Math.random()*LANES.length)]);
  }

  /* units */
  const list = G.units;
  for(let i=0;i<list.length;i++){
    const u = list[i];
    if(u.hp <= 0) continue;
    u.bob += dt*7;
    if(u.hitFlash > 0) u.hitFlash -= dt;
    u.cd -= dt;

    const dir = u.side === 'player' ? 1 : -1;

    /* --- healer behaviour --- */
    if(UNITS[u.type].heal){
      let ally = null, worst = 1;
      for(let j=0;j<list.length;j++){
        const o = list[j];
        if(o === u || o.side !== u.side || o.hp <= 0) continue;
        if(o.lane !== u.lane) continue;
        const dist = Math.abs(o.u - u.u);
        if(dist > u.range) continue;
        const ratio = o.hp / o.maxHp;
        if(ratio < worst){ worst = ratio; ally = o; }
      }
      if(ally){
        if(u.cd <= 0){
          u.cd = u.atk;
          const before = ally.hp;
          ally.hp = Math.min(ally.maxHp, ally.hp + u.heal);
          if(ally.hp > before) burst(ally.u, ally.lane, '#8ef0b0', 5);
          G.projectiles.push({x1:u.u, y1:u.lane, x2:ally.u, y2:ally.lane, t:0, dur:0.22, color:'#8ef0b0'});
        }
        continue;
      }
    }

    /* --- find enemy unit in front --- */
    let target = null, bestD = 1e9;
    for(let j=0;j<list.length;j++){
      const o = list[j];
      if(o.side === u.side || o.hp <= 0 || o.lane !== u.lane) continue;
      const d = (o.u - u.u) * dir;
      if(d > -0.015 && d < bestD){ bestD = d; target = o; }
    }

    const enemyBaseU = dir > 0 ? ENEMY_BASE_U : PLAYER_BASE_U;
    const distToBase = Math.abs(enemyBaseU - u.u);

    if(target && bestD <= u.range){
      /* attack unit */
      if(u.cd <= 0 && u.dmg > 0){
        u.cd = u.atk;
        attackUnit(u, target);
      }
    } else if(distToBase <= u.range + 0.025){
      /* attack base */
      if(u.cd <= 0 && u.dmg > 0){
        u.cd = u.atk;
        attackBase(u);
      }
    } else {
      u.u += dir * u.speed * dt;
      u.u = Math.max(0.01, Math.min(0.99, u.u));
    }
  }

  /* cleanup */
  for(let i=G.units.length-1;i>=0;i--){
    if(G.units[i].hp <= 0) G.units.splice(i,1);
  }

  /* projectiles */
  for(let i=G.projectiles.length-1;i>=0;i--){
    const p = G.projectiles[i];
    p.t += dt;
    if(p.t >= p.dur) G.projectiles.splice(i,1);
  }

  /* particles */
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt;
    if(p.life <= 0){ G.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 190*dt;
  }

  if(G.shakeT > 0) G.shakeT -= dt;

  /* win / lose */
  if(G.enemyBase.hp <= 0 && !G.over){ endLevel(true); }
  else if(G.playerBase.hp <= 0 && !G.over){ endLevel(false); }

  updateBattleHud();
}

function attackUnit(u, target){
  if(UNITS[u.type].ranged){
    G.projectiles.push({x1:u.u, y1:u.lane, x2:target.u, y2:target.lane, t:0, dur:0.2, color:UNITS[u.type].proj||'#fff'});
    if(UNITS[u.type].aoe){
      const aoe = UNITS[u.type].aoe;
      for(const o of G.units){
        if(o.side === u.side || o.hp <= 0) continue;
        if(Math.abs(o.u - target.u) <= aoe && Math.abs(o.lane - target.lane) < 0.01){
          damageUnit(o, u.dmg, u.side === 'player');
        }
      }
      burst(target.u, target.lane, '#b48bff', 10);
    } else {
      damageUnit(target, u.dmg, u.side === 'player');
    }
  } else {
    damageUnit(target, u.dmg, u.side === 'player');
    burst(target.u, target.lane, u.side === 'player' ? '#9fc7ff' : '#ff9f9f', 3);
  }
}

function attackBase(u){
  const dmg = u.dmg;
  if(u.side === 'player'){
    G.enemyBase.hp = Math.max(0, G.enemyBase.hp - dmg);
    G.shakeT = 0.18;
    burst(ENEMY_BASE_U, u.lane, '#ffcf6b', 5);
  } else {
    G.playerBase.hp = Math.max(0, G.playerBase.hp - dmg);
    G.shakeT = 0.18;
    burst(PLAYER_BASE_U, u.lane, '#ff5f6d', 5);
  }
  if(UNITS[u.type].ranged){
    G.projectiles.push({
      x1:u.u, y1:u.lane,
      x2: u.side === 'player' ? ENEMY_BASE_U : PLAYER_BASE_U,
      y2: 0.5, t:0, dur:0.2,
      color: UNITS[u.type].proj || '#fff'
    });
  }
}

/* ---- rendering ---- */
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,'#070510');
  g.addColorStop(0.45,'#151029');
  g.addColorStop(0.78,'#241739');
  g.addColorStop(1,'#33204a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  const now = performance.now()/1000;
  for(const s of G.stars){
    const a = s.a * (0.55 + 0.45*Math.sin(now*0.9 + s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dfe6ff';
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* moon */
  const mx = W*0.79, my = H*0.13, mr = Math.min(W,H)*0.052;
  const mg = ctx.createRadialGradient(mx,my,mr*0.3,mx,my,mr*4.2);
  mg.addColorStop(0,'rgba(200,190,255,.30)');
  mg.addColorStop(1,'rgba(200,190,255,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx,my,mr*4.2,0,6.283); ctx.fill();
  ctx.fillStyle = '#e7e2ff';
  ctx.beginPath(); ctx.arc(mx,my,mr,0,6.283); ctx.fill();
  ctx.fillStyle = 'rgba(150,140,200,.35)';
  ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.25,mr*0.22,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.28,my+mr*0.18,mr*0.16,0,6.283); ctx.fill();

  /* distant hills */
  ctx.fillStyle = '#150e24';
  ctx.beginPath();
  ctx.moveTo(0, H*0.44);
  for(let i=0;i<=8;i++){
    const x = W*i/8;
    const y = H*0.44 - Math.sin(i*1.7)*H*0.045 - Math.sin(i*0.6)*H*0.02;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H*0.62); ctx.lineTo(0, H*0.62); ctx.closePath();
  ctx.fill();

  /* fog */
  const fg = ctx.createLinearGradient(0, H*0.28, 0, H*0.5);
  fg.addColorStop(0,'rgba(120,90,190,0)');
  fg.addColorStop(1,'rgba(120,90,190,.10)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, H*0.28, W, H*0.24);
}

function drawGround(){
  const a = project(0,0), b = project(1,0), c = project(1,1), d = project(0,1);
  const g = ctx.createLinearGradient(0,a.y,0,d.y);
  g.addColorStop(0,'#1a2419');
  g.addColorStop(0.55,'#22301f');
  g.addColorStop(1,'#2c3f28');
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();

  ctx.save();
  ctx.clip();
  ctx.strokeStyle = 'rgba(150,210,160,.10)';
  ctx.lineWidth = 1;
  for(let i=0;i<=12;i++){
    const p1 = project(i/12,0), p2 = project(i/12,1);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
  for(let i=0;i<=6;i++){
    const p1 = project(0,i/6), p2 = project(1,i/6);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
  /* mid divider */
  const m1 = project(0.5,0), m2 = project(0.5,1);
  ctx.strokeStyle = 'rgba(232,194,106,.14)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(m1.x,m1.y); ctx.lineTo(m2.x,m2.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* edges */
  ctx.strokeStyle = 'rgba(160,220,170,.14)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
  ctx.closePath(); ctx.stroke();
}

function drawBase(side){
  const isPlayer = side === 'player';
  const u = isPlayer ? PLAYER_BASE_U : ENEMY_BASE_U;
  const p = project(u, 0.5);
  const img = SPRITES[isPlayer ? 'castle' : 'darktower'];
  const h = (isPlayer ? 178 : 178) * p.s;
  const w = h * (140/200);

  /* glow under base */
  const gg = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, w*0.85);
  gg.addColorStop(0, isPlayer ? 'rgba(120,170,255,.30)' : 'rgba(255,60,90,.28)');
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, w*0.85, w*0.36, 0, 0, 6.283); ctx.fill();

  if(img && img.complete && img.naturalWidth){
    ctx.drawImage(img, p.x - w/2, p.y - h, w, h);
  }

  /* hp bar */
  const hp = isPlayer ? G.playerBase.hp / G.playerBase.max : G.enemyBase.hp / G.enemyBase.max;
  const bw = w * 0.88, bh = 7;
  const bx = p.x - bw/2, by = p.y - h - 16;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  roundRect(ctx, bx-1, by-1, bw+2, bh+2, 4); ctx.fill();
  ctx.fillStyle = isPlayer ? '#4d9dff' : '#ff4d5e';
  roundRect(ctx, bx, by, bw*Math.max(0,hp), bh, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 1;
  roundRect(ctx, bx, by, bw, bh, 3); ctx.stroke();
}

function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function drawUnit(u){
  const p = project(u.u, u.lane);
  const def = UNITS[u.type];
  const img = SPRITES[def.img];
  const hh = 70 * p.s;
  const ww = hh * (64/84);

  /* shadow / team ring */
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = u.side === 'player' ? '#4fa8ff' : '#ff5a5a';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, ww*0.40, ww*0.15, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();

  if(img && img.complete && img.naturalWidth){
    const bob = Math.sin(u.bob)*1.8*p.s;
    ctx.save();
    ctx.translate(p.x, p.y);
    if(u.side === 'enemy'){
      ctx.scale(-1,1);
      /* dark red tint for enemies */
      ctx.filter = 'saturate(0.55) brightness(0.85) hue-rotate(-25deg)';
    }
    ctx.drawImage(img, -ww/2, -hh + bob, ww, hh);
    ctx.restore();

    if(u.hitFlash > 0){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = u.hitFlash * 3;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - hh*0.5, ww*0.4, hh*0.45, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
  } else {
    ctx.fillStyle = u.side === 'player' ? '#4fa8ff' : '#ff5a5a';
    ctx.fillRect(p.x - ww*0.25, p.y - hh, ww*0.5, hh);
  }

  /* hp bar */
  if(u.hp < u.maxHp){
    const bw = ww*0.86, bh = 3.6;
    const bx = p.x - bw/2, by = p.y - hh - 9;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    roundRect(ctx, bx-0.6, by-0.6, bw+1.2, bh+1.2, 2.2); ctx.fill();
    ctx.fillStyle = u.side === 'player' ? '#54e08a' : '#ff6b6b';
    roundRect(ctx, bx, by, bw*Math.max(0,u.hp/u.maxHp), bh, 1.8); ctx.fill();
  }
}

function drawProjectiles(){
  for(const pr of G.projectiles){
    const k = Math.min(1, pr.t/pr.dur);
    const p1 = project(pr.x1, pr.y1);
    const p2 = project(pr.x2, pr.y2);
    const x = p1.x + (p2.x-p1.x)*k;
    const y = p1.y + (p2.y-p1.y)*k - Math.sin(k*Math.PI)*34*p1.s;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x,y,0,x,y,13);
    g.addColorStop(0, pr.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,13,0,6.283); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x,y,2.2,0,6.283); ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of G.particles){
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a*0.9) * p.s, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function renderGame(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.shakeT > 0){
    const m = G.shakeT * 14;
    ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m);
  }
  drawSky();
  drawGround();
  drawBase('player');
  drawBase('enemy');

  const sorted = G.units.slice().sort((a,b)=>{
    if(a.lane !== b.lane) return a.lane - b.lane;
    return a.u - b.u;
  });
  for(const u of sorted) drawUnit(u);

  drawProjectiles();
  drawParticles();

  /* essence aura on player base */
  if(G.active){
    const p = project(PLAYER_BASE_U, 0.5);
    const now = performance.now()/1000;
    ctx.save();
    ctx.globalAlpha = 0.16 + 0.06*Math.sin(now*2.4);
    ctx.fillStyle = '#7b5cff';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 46*p.s, 16*p.s, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
}

/* ==========================================================================
   8. BATTLE FLOW
   ========================================================================== */
const elHud = document.getElementById('battlehud');
const elHpAlly = document.getElementById('hp-ally');
const elHpEnemy = document.getElementById('hp-enemy');
const elMainMenu = document.getElementById('mainmenu');
const elUnitbar = document.getElementById('unitbar');
const elPauseBtn = document.getElementById('pausebtn');

function updateBattleHud(){
  if(!G.active) return;
  elHpAlly.style.width = Math.max(0, (G.playerBase.hp/G.playerBase.max)*100) + '%';
  elHpEnemy.style.width = Math.max(0, (G.enemyBase.hp/G.enemyBase.max)*100) + '%';
  refreshUnitButtons();
}

function startLevel(level){
  const cfg = levelCfg(level);
  G.level = level;
  G.units = [];
  G.projectiles = [];
  G.particles = [];
  G.essence = 60;
  G.essenceMax = 120;
  G.essenceRegen = 10 + level*0.35;
  G.playerBase = {hp: cfg.playerBaseHp, max: cfg.playerBaseHp};
  G.enemyBase  = {hp: cfg.enemyBaseHp,  max: cfg.enemyBaseHp};
  G.spawnInterval = cfg.spawnInterval;
  G.spawnTimer = 2.5;
  G.time = 0;
  G.kills = 0;
  G.spawned = 0;
  G.over = false;
  G.active = true;

  elMainMenu.classList.add('hidden');
  elHud.classList.add('show');
  elUnitbar.style.display = 'flex';
  elPauseBtn.classList.add('show');
  updateBattleHud();
}

function stopLevel(){
  G.active = false;

/* ------------------ AD OVERLAY ------------------ */
const adov = document.getElementById('adov');
function showAdOverlay(){
  adov.classList.add('show');
  setPause('ad', true);
}
function hideAdOverlay(){
  adov.classList.remove('show');
  setPause('ad', false);
}

function showNativeAd(format){
  return new Promise(resolve=>{
    if(!HAS_VK){ setTimeout(()=>resolve({result:true}), 350); return; }
    showAdOverlay();
    const done = (res)=>{ hideAdOverlay(); resolve(res); };
    VK.send('VKWebAppShowNativeAds', {ad_format: format})
      .then(data=> done(data || {result:true}))
      .catch(()=> done({result:false}));
    /* safety timeout */
    setTimeout(()=>{ if(adov.classList.contains('show')) done({result:false}); }, 25000);
  });
}

const levelInfoEl = document.getElementById('levelinfo');
function refreshMenu(){
  levelInfoEl.textContent = t('level') + ' ' + state.maxLevel;
}

async function onPlayClick(){
  Music.ensure();
  if(state.music) Music.play();

  /* 1) pause everything and show interstitial */
  setPause('ad', true);
  const res = await showNativeAd('interstitial');
  /* 2) restore and start */
  setPause('ad', false);
  startLevel(state.maxLevel);
}

let pendingReward = 0;
let pendingWin = false;

function endLevel(win){
  if(G.over) return;
  G.over = true;
  G.active = false;
  setTimeout(()=>{
    elPauseBtn.classList.remove('show');
    if(win){
      questProgress('wins', 1);
      state.stats.wins++;
      const reward = 60 + G.level*30 + Math.floor(G.kills*1.5);
      pendingReward = reward;
      pendingWin = true;
      if(state.maxLevel <= G.level) state.maxLevel = G.level + 1;
      showResult(true, reward);
    } else {
      pendingReward = Math.floor(10 + G.kills*1.2);
      pendingWin = false;
      showResult(false, pendingReward);
    }
    saveGame();
  }, 700);
}

const ovResult = document.getElementById('ov-result');
function showResult(win, reward){
  document.getElementById('res-title').textContent = win ? t('win') : t('lose');
  document.getElementById('res-title').style.color = win ? 'var(--gold-l)' : '#ff8b8b';
  document.getElementById('res-big').textContent = (win ? '✦ ' : '✧ ') + t('level') + ' ' + G.level;
  document.getElementById('res-lines').innerHTML =
    `<div class="res-line"><span>${t('units_spawned')}</span><b>${G.spawned}</b></div>` +
    `<div class="res-line"><span>${t('enemies_killed')}</span><b>${G.kills}</b></div>` +
    `<div class="res-line" style="border:none"><span>${t('winreward')}</span><b style="color:var(--gold-l)">+${reward}</b></div>`;
  const dbl = document.getElementById('res-double');
  dbl.style.display = win ? 'block' : 'none';
  dbl.disabled = false;
  dbl.textContent = t('double_reward');
  document.getElementById('res-take').textContent = t('take_reward');
  ovResult.classList.add('show');
  syncPause();
}

document.getElementById('res-take').addEventListener('click', ()=>{
  addGold(pendingReward);
  ovResult.classList.remove('show');
  syncPause();
  stopLevel();
  refreshMenu();
  saveGame();
});

document.getElementById('res-double').addEventListener('click', async ()=>{
  const btn = document.getElementById('res-double');
  btn.disabled = true;
  const r = await showNativeAd('reward');
  if(r && (r.result === true || r.result === 'true')){

  saveGame();
});

function addGold(n){
  state.gold += n;
  state.stats.goldEarned += n;
  questProgress('gold', n);
  refreshGold();
  saveGame();
}
function refreshGold(){
  document.getElementById('goldval').textContent = formatNum(state.gold);
}
function formatNum(n){
  n = Math.floor(n);
  if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if(n >= 10000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}

/* ---- quests ---- */
const QUEST_POOL = [
  {id:'q_win1',   type:'wins',    target:1,  reward:120},
  {id:'q_win2',   type:'wins',    target:2,  reward:250},
  {id:'q_win4',   type:'wins',    target:4,  reward:520},
  {id:'q_spawn20',type:'spawns',  target:20, reward:100},
  {id:'q_spawn60',type:'spawns',  target:60, reward:260},
  {id:'q_kill25', type:'kills',   target:25, reward:130},
  {id:'q_kill70', type:'kills',   target:70, reward:330},
  {id:'q_gold300',type:'gold',    target:300,reward:150},
  {id:'q_gold900',type:'gold',    target:900,reward:380},
  {id:'q_mage8',  type:'mages',   target:8,  reward:140},
  {id:'q_min10',  type:'minutes', target:10, reward:110},
  {id:'q_min25',  type:'minutes', target:25, reward:280},
  {id:'q_knight5',type:'knights', target:5,  reward:160},
  {id:'q_arch15', type:'archers', target:15, reward:170}
];
const QUEST_BY_ID = {};
QUEST_POOL.forEach(q=>QUEST_BY_ID[q.id]=q);

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function seededShuffle(arr, seed){
  let s = Math.abs(seed) % 2147483647 || 1;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    s = (s*1103515245 + 12345) & 0x7fffffff;
    const j = s % (i+1);
    const tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function ensureDailyQuests(){
  const today = todayStr();
  if(state.questDate === today && state.questList.length) return;
  let seed = 0;
  for(let i=0;i<today.length;i++) seed = seed*31 + today.charCodeAt(i);
  const picked = seededShuffle(QUEST_POOL, seed).slice(0,10);
  state.questDate = today;
  state.questList = picked.map(q=>q.id);
  state.quests = {};
  state.questClaimed = {};
  state.questList.forEach(id=>state.quests[id] = 0);
  saveGame();
}
function questProgress(type, n){
  if(!state.questList || !state.questList.length) return;
  let changed = false;
  for(const id of state.questList){
    const def = QUEST_BY_ID[id];
    if(!def) continue;
    if(def.type === type){
      state.quests[id] = (state.quests[id] || 0) + n;
      changed = true;
    }
  }
  if(changed){
    renderQuests();
    updateAlertDots();
    saveGame();
  }
}
function questReady(id){
  const def = QUEST_BY_ID[id];
  if(!def) return false;
  return (state.quests[id]||0) >= def.target && !state.questClaimed[id];
}
function renderQuests(){
  const box = document.getElementById('quest-list');
  if(!box) return;
  if(!state.questList.length){ box.innerHTML = '<div class="muted center">'+t('quests_empty')+'</div>'; return; }
  let html = '';
  for(const id of state.questList){
    const def = QUEST_BY_ID[id];
    if(!def) continue;
    const cur = Math.min(state.quests[id]||0, def.target);
    const done = questReady(id);
    const claimed = !!state.questClaimed[id];
    const pct = Math.min(100, (cur/def.target)*100);
    html += `<div class="quest ${done?'done':''}" data-qid="${id}">
      <div class="qi">
        <div class="qn">${questName(def)} — ${cur}/${def.target}</div>
        <div class="qbar"><i style="width:${pct}%"></i></div>
      </div>
      <div class="qr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9" fill="rgba(232,194,106,.16)"/>
          <path d="M12 7v10"/>
        </svg>${def.reward}
      </div>
      ${done ? `<button class="btn" data-claim="${id}" style="padding:6px 10px;font-size:12px">${t('quest_claim')}</button>` : (claimed ? `<span class="muted" style="font-size:11px">${t('quest_done')}</span>` : '')}
    </div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('[data-claim]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-claim');
      if(questReady(id)){
        state.questClaimed[id] = true;
        addGold(QUEST_BY_ID[id].reward);
        toast('+' + QUEST_BY_ID[id].reward + ' ' + t('gold'));
        renderQuests();
        updateAlertDots();
        saveGame();
      }
    });
  });
}
function questName(def){
  const names = {
    wins:{ru:'Победить в битвах', en:'Win battles'},
    spawns:{ru:'Призвать воинов', en:'Summon warriors'},
    kills:{ru:'Победить врагов', en:'Defeat enemies'},
    gold:{ru:'Заработать золота', en:'Earn gold'},
    mages:{ru:'Призвать магов', en:'Summon mages'},
    minutes:{ru:'Провести в игре минут', en:'Spend minutes in game'},
    knights:{ru:'Призвать рыцарей', en:'Summon knights'},
    archers:{ru:'Призвать лучников', en:'Summon archers'}
  };
  const n = names[def.type];
  return n ? n[LANG] || n.ru : def.type;
}

/* ---- daily ---- */
function dayIndex(){
  return Math.floor(Date.now() / 86400000);
}
function dailyAvailable(){
  return dayIndex() > (state.dailyLast || 0);
}
function renderDaily(){
  const st = document.getElementById('daily-status');
  const btn = document.getElementById('daily-claim');
  if(dailyAvailable()){
    const streak = Math.min(state.dailyStreak + 1, 7);
    const amount = 80 + streak*40;
    st.innerHTML = `<span style="color:var(--gold-l);font-size:20px">+${amount}</span> ${t('gold')}<br>
      <span class="muted">Серия: ${state.dailyStreak} → ${streak}</span>`;
    btn.disabled = false;
    btn.textContent = t('claim');
  } else {
    st.innerHTML = `<span class="muted">${t('daily_wait')}</span>`;
    btn.disabled = true;
    btn.textContent = t('claim');
  }
}
document.getElementById('daily-claim').addEventListener('click', ()=>{
  if(!dailyAvailable()) return;
  const streak = Math.min(state.dailyStreak + 1, 7);
  const amount = 80 + streak*40;
  state.dailyStreak = streak;
  state.dailyLast = dayIndex();
  addGold(amount);
  toast('+' + amount + ' ' + t('gold'));
  renderDaily();
  updateAlertDots();
  saveGame();
});

let restTick = 0;
let restOpen = false;
const REST_PERIOD = 60;      /* seconds */
const REST_GOLD = 8;

function renderRest(){
  const left = Math.max(0, REST_PERIOD - restTick);
  document.getElementById('rest-timer').textContent = Math.ceil(left);
  document.getElementById('rest-fill').style.width = (restTick/REST_PERIOD*100) + '%';

  restTick += 0.25;
  if(restTick >= REST_PERIOD){
    restTick = 0;
    state.restTotal += REST_GOLD;
    addGold(REST_GOLD);
    burst(0.5, 0.5, '#e8c26a', 6);
    toast('+' + REST_GOLD + ' ' + t('gold'));

  renderRest();
}, 250);

/* ---- playtime rewards ---- */
const PLAYTIME = [
  {min:5,  gold:60},
  {min:10, gold:120},
  {min:20, gold:260},
  {min:40, gold:520},
  {min:60, gold:800},
  {min:120,gold:1600}
];
let sessionSeconds = 0;
setInterval(()=>{
  if(document.hidden) return;
  sessionSeconds++;
  if(sessionSeconds % 60 === 0){
    state.onlineMinutes = (state.onlineMinutes||0) + 1;
    state.stats.minutes++;
    questProgress('minutes', 1);
    renderPlaytime();
    updateAlertDots();
    saveGame();
  }
}, 1000);

function renderPlaytime(){
  const box = document.getElementById('time-list');
  if(!box) return;
  let html = '';
  PLAYTIME.forEach((p, i)=>{
    const claimed = state.playClaimed.indexOf(i) >= 0;
    const ready = !claimed && state.onlineMinutes >= p.min;
    const left = Math.max(0, p.min - state.onlineMinutes);
    html += `<div class="ptime-item ${ready?'ready':''} ${claimed?'done':''}">
      <div class="tl">${t('online')} ${p.min} ${t('minutes')} — <b style="color:var(--gold-l)">+${p.gold}</b></div>
      ${claimed ? `<span class="muted">${t('time_gone')}</span>`
        : ready ? `<button class="btn green" data-pt="${i}" style="padding:6px 12px;font-size:12px">${t('time_ready')}</button>`
        : `<span class="muted">${t('time_locked')} ${left} ${t('minutes')}</span>`}
    </div>`;
  });
  box.innerHTML = html;
  box.querySelectorAll('[data-pt]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.getAttribute('data-pt'), 10);
      const p = PLAYTIME[i];
      if(state.playClaimed.indexOf(i) < 0 && state.onlineMinutes >= p.min){
        state.playClaimed.push(i);
        addGold(p.gold);
        toast('+' + p.gold + ' ' + t('gold'));
        renderPlaytime();
        updateAlertDots();
        saveGame();
      }
    });
  });
}

function buildUnitBar(){
  elUnitbar.innerHTML = '';
  UNIT_ORDER.forEach(key=>{
    const d = UNITS[key];
    const b = document.createElement('button');
    b.className = 'ubtn disabled';
    b.dataset.unit = key;
    b.innerHTML = `
      <img src="${SPRITES[d.img].src}" alt="">
      <span class="cost"><i></i>${d.cost}</span>
    `;
    b.addEventListener('click', ()=>trySpawn(key));
    elUnitbar.appendChild(b);
  });
}
function trySpawn(key){
  if(!G.active || G.over) return;
  const d = UNITS[key];
  if(G.essence < d.cost){
    toast(t('no_gold'));
    return;
  }
  G.essence -= d.cost;
  const lane = LANES[Math.floor(Math.random()*LANES.length)];
  spawnUnit(key, 'player', lane);
  refreshUnitButtons();
}
function refreshUnitButtons(){
  if(!G.active) return;
  elUnitbar.querySelectorAll('.ubtn').forEach(b=>{
    const key = b.dataset.unit;
    const d = UNITS[key];
    b.classList.toggle('disabled', G.essence < d.cost);
  });
}

const TUT_STEPS = ['tut_1','tut_2','tut_3','tut_4','tut_5','tut_6'];
const TUT_TARGETS = [null, '#stage', '#unitbar', '#unitbar', '#stage', null];
let tutIndex = 0;
let tutActive = false;
const tutBox = document.getElementById('tutbox');
const tutText = document.getElementById('tut-text');
const tutDots = document.getElementById('tut-dots');

function startTutorial(){
  tutActive = true;
  tutIndex = 0;
  document.getElementById('ov-tutorial-ask').classList.remove('show');
  syncPause();
  tutBox.classList.add('show');
  showTutStep();
}
function showTutStep(){
  if(tutIndex >= TUT_STEPS.length){ endTutorial(); return; }
  tutText.textContent = t(TUT_STEPS[tutIndex]);
  tutDots.innerHTML = TUT_STEPS.map((_,i)=>`<i class="${i<=tutIndex?'on':''}"></i>`).join('');
  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  const sel = TUT_TARGETS[tutIndex];
  if(sel){
    const el = document.querySelector(sel);
    if(el) el.classList.add('tut-highlight');
  }
  document.getElementById('tut-next').textContent =
    tutIndex === TUT_STEPS.length-1 ? (LANG==='ru'?'Готово':'Done') : t('next');
}
document.getElementById('tut-next').addEventListener('click', ()=>{
  tutIndex++;
  showTutStep();
});
function endTutorial(){
  tutActive = false;
  tutBox.classList.remove('show');
  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  state.tutorial = 2;
  saveGame();
  syncPause();
}

  const el = document.getElementById('toast');

  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ==========================================================================
   15. MAIN LOOP
   ========================================================================== */
let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if(dt > 0.06) dt = 0.06;
  if(dt < 0) dt = 0;

  if(G.active && !anyPause()){
    updateGame(dt);
  } else if(G.active){
    /* keep particles alive while paused? no — freeze everything */
  }

  renderGame();
}

function initBanner(){
  if(!HAS_VK) return;
  VK.send('VKWebAppGetLaunchParams')
    .then(()=>{
      return VK.send('VKWebAppShowBannerAd', {banner_location:'bottom'});
    })
    .then(()=>{
      document.getElementById('banner').classList.add('on');
      setTimeout(resizeCanvas, 320);
    })
    .catch(()=>{});
}

/* ==========================================================================
   17. BOOT
   ========================================================================== */
async function boot(){
  resizeCanvas();
  await loadSprites();
  buildUnitBar();

  const saved = await loadGame();
  if(saved && typeof saved === 'object'){
    state = Object.assign(defaultState(), saved);
    state.stats = Object.assign(defaultState().stats, saved.stats || {});
    if(!Array.isArray(state.playClaimed)) state.playClaimed = [];
    if(!Array.isArray(state.questList)) state.questList = [];
    if(!state.quests) state.quests = {};
    if(!state.questClaimed) state.questClaimed = {};
  } else {
    state = defaultState();
  }

  LANG = state.lang === 'en' ? 'en' : 'ru';
  state.lang = LANG;

  ensureDailyQuests();
  applyLang();
  refreshGold();
  refreshMenu();
  updateAlertDots();

  /* restore "today" resets */
  if(!dailyAvailable() && state.dailyLast && dayIndex() > state.dailyLast + 1){
    state.dailyStreak = 0;
  }

  document.getElementById('banner').classList.add('on');
  document.getElementById('banner').style.height = '0px';
  setTimeout(()=>{ document.getElementById('banner').style.height=''; }, 100);

  initBanner();
  resizeCanvas();

  /* music after first interaction */
  const firstGesture = ()=>{
    Music.ensure();
    if(state.music) Music.play();
    window.removeEventListener('pointerdown', firstGesture);
    window.removeEventListener('keydown', firstGesture);
  };
  window.addEventListener('pointerdown', firstGesture);
  window.addEventListener('keydown', firstGesture);

  /* first-run tutorial prompt */
  if(!state.tutorial){
    setTimeout(()=>{
      document.getElementById('ov-tutorial-ask').classList.add('show');
      syncPause();
    }, 700);
  }

  requestAnimationFrame(loop);
}

boot();

/* periodic save */
setInterval(()=>{ saveGame(); }, 20000);
window.addEventListener('beforeunload', ()=>{ saveGame(true); });
</script>
