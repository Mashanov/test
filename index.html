<script>
// ==================== VK BRIDGE ====================
let vkAvailable = false;
try {
  if (typeof vkBridge !== 'undefined') {
    vkBridge.send("VKWebAppInit").then(r => { vkAvailable = true; }).catch(e => { vkAvailable = false; });
  }
} catch(e) { vkAvailable = false; }

// ==================== INVITE FRIENDS ====================
function showInviteBox() {
  if (vkAvailable) {
    vkBridge.send("VKWebAppShowInviteBox").then(() => {}).catch(() => {});
  } else {
    showToast(t('invite'));
  }
}

// ==================== VK VIEW HIDE/RESTORE + PC BLUR/FOCUS (music pause/resume) ====================
let musicWasPlaying = false;

// VK events (mobile)
if (typeof vkBridge !== 'undefined') {
  vkBridge.subscribe((e) => {
    if (e.detail && e.detail.type === 'VKWebAppViewHide') {
      musicWasPlaying = musicPlaying;
      if (musicPlaying) stopMusic();
    }
    if (e.detail && e.detail.type === 'VKWebAppViewRestore') {
      if (musicWasPlaying && G.musicOn) {
        musicWasPlaying = false;
        playMusic();
      }
    }
  });
}

// PC: pause music when tab/window loses focus, resume when focus returns
self.addEventListener('blur', () => {
  musicWasPlaying = musicPlaying;
  if (musicPlaying) stopMusic();
});

self.addEventListener('focus', () => {
  if (musicWasPlaying && G.musicOn) {
    musicWasPlaying = false;
    playMusic();
  }
});

// Fallback: visibilitychange (covers tab switch in some browsers where blur is unreliable)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    musicWasPlaying = musicPlaying;
    if (musicPlaying) stopMusic();
  } else {
    if (musicWasPlaying && G.musicOn) {
      musicWasPlaying = false;
      playMusic();
    }
  }
});

// ==================== TRANSLATIONS ====================

// ==================== GAME STATE ====================
let G = {
  lang:'ru',
  coins:100,
  currentLevel:1,
  unlockedLevel:1,
  musicOn:true,
  tutorialDone:false,
  powerups:{bomb:0,line:0,color:0,shuffle:0,hammer:0},
  dailyLastClaim:null,
  dailyStreak:0,
  afkAccumulated:0,
  afkLastVisit:Date.now(),
  quests:[],
  questsDate:null,
  stats:{totalMatches:0, levelsCompleted:0, totalCoins:0 }
};

let currentScreen = null;

// ==================== STORAGE (VK) ====================
const STORAGE_KEY = 'crystal_match_data';

async function saveData() {
  if (vkAvailable) {
    try {
      await vkBridge.send("VKWebAppStorageSet", { key: STORAGE_KEY, value: JSON.stringify(G) });
    } catch(e) {}
  }
}

async function loadData() {
  if (vkAvailable) {
    try {
      const r = await vkBridge.send("VKWebAppStorageGet", { keys: [STORAGE_KEY] });
      if (r.keys && r.keys[0] && r.keys[0].value) {
        const data = JSON.parse(r.keys[0].value);
        Object.assign(G, data);
      }
    } catch(e) {}
  }
}

// ==================== AUDIO ====================
let audioCtx = null;
let musicGain = null;
let musicOscs = [];
let musicPlaying = false;
let musicInterval = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  }
}

function playMusic() {
  if (!G.musicOn || !audioCtx) return;
  if (musicPlaying) return;
  musicPlaying = true;
  
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.12;
  musicGain.connect(audioCtx.destination);
  
  // Chord progression: Am - F - C - G  (vi - IV - I - V)
  // Frequencies for each chord: [root, third, fifth, octave]
  const chords = [
    { bass: 130.81, notes: [261.63, 329.63, 392.00, 523.25] },  // Am
    { bass: 174.61, notes: [261.63, 349.23, 440.00, 523.25] },  // F
    { bass: 130.81, notes: [261.63, 329.63, 392.00, 523.25] },  // C
    { bass: 196.00, notes: [293.66, 392.00, 440.00, 587.33] }   // G
  ];
  
  // Arpeggio pattern for melody
  const arpPatterns = [
    [0, 1, 2, 3, 2, 1],  // up-down
    [0, 2, 1, 3, 1, 2],  // varied
    [3, 2, 1, 0, 1, 2],  // down-up
    [0, 1, 2, 3, 2, 0]   // arc
  ];
  
  let chordIdx = 0;
  let noteIdx = 0;
  let step = 0;
  const stepDuration = 280; // ms per step
  let melodyOsc = null;
  let bassOsc = null;
  let padOscs = [];
  
  function startChord() {
    const chord = chords[chordIdx];
    const pattern = arpPatterns[chordIdx % arpPatterns.length];
    
    // Bass note
    if (bassOsc) { try{bassOsc.stop();}catch(e){} }
    bassOsc = audioCtx.createOscillator();
    const bassGain = audioCtx.createGain();
    bassGain.gain.value = 0.15;
    bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + stepDuration*6/1000);
    bassOsc.type = 'triangle';
    bassOsc.frequency.value = chord.bass;
    bassOsc.connect(bassGain);
    bassGain.connect(musicGain);
    bassOsc.start();
    setTimeout(() => { try{bassOsc.stop();}catch(e){} }, stepDuration*6);
    musicOscs.push(bassOsc);
    
    // Pad chord (sustained, soft)
    padOscs.forEach(o => { try{o.stop();}catch(e){} });
    padOscs = [];
    chord.notes.forEach((freq, i) => {
      const pad = audioCtx.createOscillator();
      const padGain = audioCtx.createGain();
      padGain.gain.value = 0.02;
      pad.type = 'sine';
      pad.frequency.value = freq;
      pad.connect(padGain);
      padGain.connect(musicGain);
      pad.start();
      padOscs.push(pad);
      musicOscs.push(pad);
      setTimeout(() => { try{pad.stop();}catch(e){} }, stepDuration*6);
    });
    
    noteIdx = 0;
  }
  
  function playStep() {
    if (!musicPlaying || !G.musicOn) { stopMusic(); return; }
    
    const chord = chords[chordIdx];
    const pattern = arpPatterns[chordIdx % arpPatterns.length];
    const noteFreq = chord.notes[pattern[noteIdx % pattern.length]];
    
    // Melody note
    if (melodyOsc) { try{melodyOsc.stop();}catch(e){} }
    melodyOsc = audioCtx.createOscillator();
    const melodyGain = audioCtx.createGain();
    melodyGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    melodyGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + stepDuration/1000 * 0.9);
    melodyOsc.type = step % 2 === 0 ? 'sine' : 'triangle';
    melodyOsc.frequency.value = noteFreq;
    melodyOsc.connect(melodyGain);
    melodyGain.connect(musicGain);
    melodyOsc.start();
    setTimeout(() => { try{melodyOsc.stop();}catch(e){} }, stepDuration);
    musicOscs.push(melodyOsc);
    
    // Add a harmonic note every other step
    if (step % 2 === 1) {
      const harmOsc = audioCtx.createOscillator();
      const harmGain = audioCtx.createGain();
      harmGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      harmGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + stepDuration/1000 * 0.8);
      harmOsc.type = 'sine';
      harmOsc.frequency.value = noteFreq * 1.5; // Perfect fifth
      harmOsc.connect(harmGain);
      harmGain.connect(musicGain);
      harmOsc.start();
      setTimeout(() => { try{harmOsc.stop();}catch(e){} }, stepDuration);
      musicOscs.push(harmOsc);
    }
    
    noteIdx++;
    step++;
    
    // Change chord every 6 steps
    if (noteIdx >= 6) {
      chordIdx = (chordIdx + 1) % chords.length;
      startChord();
    }
  }
  
  startChord();
  playStep();
  musicInterval = setInterval(playStep, stepDuration);
}

function stopMusic() {
  musicPlaying = false;
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
  musicOscs.forEach(o => { try{o.stop();}catch(e){} });
  musicOscs = [];
  if (musicGain) { try{musicGain.disconnect();}catch(e){} }
  musicGain = null;
}

function toggleMusic() {
  G.musicOn = !G.musicOn;
  if (G.musicOn) playMusic(); else stopMusic();
  saveData();
}

function playSfx(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  gain.gain.value = 0.1;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if (type==='match') { osc.type='sine'; osc.frequency.setValueAtTime(523,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(784,audioCtx.currentTime+0.1); }
  else if (type==='swap') { osc.type='triangle'; osc.frequency.setValueAtTime(440,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(554,audioCtx.currentTime+0.05); }
  else if (type==='invalid') { osc.type='sawtooth'; osc.frequency.setValueAtTime(150,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80,audioCtx.currentTime+0.1); }
  else if (type==='win') { osc.type='sine'; [523,659,784,1047].forEach((f,i)=>{osc.frequency.setValueAtTime(f,audioCtx.currentTime+i*0.1);}); }
  else if (type==='click') { osc.type='square'; osc.frequency.setValueAtTime(800,audioCtx.currentTime); }
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.3);
  osc.stop(audioCtx.currentTime+0.3);
}

// ==================== CRYSTAL DEFINITIONS ====================
const CRYSTAL_TYPES = [
  { color:'#ff4444', glow:'#ff8888', shape:'diamond', name:'ruby' },
  { color:'#44aaff', glow:'#88ccff', shape:'circle', name:'sapphire' },
  { color:'#44ff44', glow:'#88ff88', shape:'hexagon', name:'emerald' },
  { color:'#ffaa22', glow:'#ffcc66', shape:'star', name:'topaz' },
  { color:'#aa44ff', glow:'#cc88ff', shape:'square', name:'amethyst' },
  { color:'#ff66aa', glow:'#ffaadd', shape:'triangle', name:'rose' },
  { color:'#22dddd', glow:'#66eeee', shape:'pentagon', name:'aquamarine' }
];

const OBSTACLE_TYPE = { color:'#555', glow:'#777', shape:'rock', name:'rock' };

function getCrystalTypesForLevel(level) {
  if (level <= 30) return 5;
  if (level <= 80) return 6;
  return 7;
}

function getLevelMode(level) {
  if (level <= 50) return 'classic';
  if (level <= 120) return 'movesLimit';
  if (level <= 200) return 'timed';
  if (level <= 300) return 'obstacles';
  if (level <= 400) return 'blind';
  return 'classic';
}

function getLevelTarget(level) {
  const base = 500 + level * 50;
  return base;
}

function getLevelMoves(level) {
  const mode = getLevelMode(level);
  if (mode === 'movesLimit') return Math.max(15, 30 - Math.floor(level/20));
  if (mode === 'timed') return 60;
  return Math.max(20, 35 - Math.floor(level/25));
}

// ==================== MATCH-3 ENGINE ====================
class Match3 {
  constructor(canvas, level) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cols = 8;
    this.rows = 8;
    this.cellSize = Math.min(canvas.width/this.cols, canvas.height/this.rows);
    this.level = level;
    this.mode = getLevelMode(level);
    this.numTypes = getCrystalTypesForLevel(level);
    this.target = getLevelTarget(level);
    this.maxMoves = getLevelMoves(level);
    this.movesLeft = this.maxMoves;
    this.score = 0;
    this.grid = [];
    this.selected = null;
    this.swapping = false;
    this.animating = false;
    this.particles = [];
    this.gameOver = false;
    this.won = false;
    this.paused = false;
    this.hasObstacles = (this.mode === 'obstacles' || level > 300);
    this.blind = (this.mode === 'blind');
    this.timeLeft = this.mode === 'timed' ? this.maxMoves : 0;
    this.powerupMode = null;
    this.init();
  }
  
  init() {
    this.grid = [];
    for (let r=0; r<this.rows; r++) {
      this.grid[r] = [];
      for (let c=0; c<this.cols; c++) {
        if (this.hasObstacles && Math.random() < 0.08 + this.level*0.0003) {
          this.grid[r][c] = { type:-1, x:c*this.cellSize, y:r*this.cellSize, scale:1, alpha:1 };
        } else {
          this.grid[r][c] = this.makeCrystal(r,c);
        }
      }
    }
    // Ensure no initial matches
    let tries = 0;
    while (this.findAllMatches().length > 0 && tries < 50) {
      this.grid = [];
      for (let r=0; r<this.rows; r++) {
        this.grid[r] = [];
        for (let c=0; c<this.cols; c++) {
          if (this.hasObstacles && Math.random() < 0.08) {
            this.grid[r][c] = { type:-1, x:c*this.cellSize, y:r*this.cellSize, scale:1, alpha:1 };
          } else {
            this.grid[r][c] = this.makeCrystal(r,c);
          }
        }
      }
      tries++;
    }
  }
  
  makeCrystal(r, c) {
    let type;
    do { type = Math.floor(Math.random()*this.numTypes); }
    while (
      (c >= 2 && this.grid[r][c-1] && this.grid[r][c-1].type === type && this.grid[r][c-2] && this.grid[r][c-2].type === type) ||
      (r >= 2 && this.grid[r-1][c] && this.grid[r-1][c].type === type && this.grid[r-2][c] && this.grid[r-2][c].type === type)
    );
    return { type, x:c*this.cellSize, y:r*this.cellSize, targetX:c*this.cellSize, targetY:r*this.cellSize, scale:1, alpha:1, special:null };
  }
  
  findAllMatches() {
    const matches = [];
    // Horizontal
    for (let r=0; r<this.rows; r++) {
      let count = 1;
      for (let c=1; c<=this.cols; c++) {
        const prev = this.grid[r][c-1];
        const curr = c < this.cols ? this.grid[r][c] : null;
        if (curr && prev && curr.type >= 0 && prev.type >= 0 && curr.type === prev.type) {
          count++;
        } else {
          if (count >= 3) {
            const m = [];
            for (let i=0; i<count; i++) m.push({r, c:c-1-i});
            matches.push(m);
          }
          count = 1;
        }
      }
    }
    // Vertical
    for (let c=0; c<this.cols; c++) {
      let count = 1;
      for (let r=1; r<=this.rows; r++) {
        const prev = this.grid[r-1][c];
        const curr = r < this.rows ? this.grid[r][c] : null;
        if (curr && prev && curr.type >= 0 && prev.type >= 0 && curr.type === prev.type) {
          count++;
        } else {
          if (count >= 3) {
            const m = [];
            for (let i=0; i<count; i++) m.push({r:r-1-i, c});
            matches.push(m);
          }
          count = 1;
        }
      }
    }
    return matches;
  }
  
  swap(r1,c1,r2,c2) {
    const tmp = this.grid[r1][c1];
    this.grid[r1][c1] = this.grid[r2][c2];
    this.grid[r2][c2] = tmp;
    // Update target positions
    this.grid[r1][c1].targetX = c1*this.cellSize;
    this.grid[r1][c1].targetY = r1*this.cellSize;
    this.grid[r2][c2].targetX = c2*this.cellSize;
    this.grid[r2][c2].targetY = r2*this.cellSize;
  }
  
  trySwap(r1,c1,r2,c2) {
    if (this.animating || this.gameOver || this.paused) return;
    if (Math.abs(r1-r2)+Math.abs(c1-c2) !== 1) return;
    if (this.grid[r1][c1].type < 0 || this.grid[r2][c2].type < 0) return;
    
    this.swapping = true;
    this.animating = true;
    
    // Animate swap visually
    const cr1 = this.grid[r1][c1];
    const cr2 = this.grid[r2][c2];
    const tx1 = c2*this.cellSize, ty1 = r2*this.cellSize;
    const tx2 = c1*this.cellSize, ty2 = r1*this.cellSize;
    
    let frames = 0;
    const maxFrames = 10;
    const animateSwap = () => {
      frames++;
      const t = frames / maxFrames;
      const ease = 1 - Math.pow(1-t, 3); // ease-out cubic
      cr1.x = (c1*this.cellSize) + (tx1 - c1*this.cellSize) * ease;
      cr1.y = (r1*this.cellSize) + (ty1 - r1*this.cellSize) * ease;
      cr2.x = (c2*this.cellSize) + (tx2 - c2*this.cellSize) * ease;
      cr2.y = (r2*this.cellSize) + (ty2 - r2*this.cellSize) * ease;
      if (frames < maxFrames) {
        requestAnimationFrame(animateSwap);
      } else {
        // Actually swap in grid
        this.swap(r1,c1,r2,c2);
        cr1.x = tx1; cr1.y = ty1;
        cr2.x = tx2; cr2.y = ty2;
        playSfx('swap');
        
        const matches = this.findAllMatches();
        if (matches.length === 0) {
          // Animate swap back
          const crA = this.grid[r1][c1];
          const crB = this.grid[r2][c2];
          let f2 = 0;
          const animateBack = () => {
            f2++;
            const t2 = f2 / maxFrames;
            const ease2 = 1 - Math.pow(1-t2, 3);
            crA.x = tx1 + (tx2 - tx1) * ease2;
            crA.y = ty1 + (ty2 - ty1) * ease2;
            crB.x = tx2 + (tx1 - tx2) * ease2;
            crB.y = ty2 + (ty1 - ty2) * ease2;
            if (f2 < maxFrames) {
              requestAnimationFrame(animateBack);
            } else {
              this.swap(r1,c1,r2,c2);
              this.grid[r1][c1].x = c1*this.cellSize;
              this.grid[r1][c1].y = r1*this.cellSize;
              this.grid[r2][c2].x = c2*this.cellSize;
              this.grid[r2][c2].y = r2*this.cellSize;
              playSfx('invalid');
              this.swapping = false;
              this.animating = false;
            }
          };
          animateBack();
        } else {
          this.movesLeft--;
          this.swapping = false;
          this.processMatches();
        }
      }
    };
    animateSwap();
  }
  
  processMatches() {
    this.animating = true;
    let matches = this.findAllMatches();
    if (matches.length === 0) { this.animating = false; this.checkGameOver(); return; }
    
    const matched = new Set();
    let totalMatched = 0;
    
    matches.forEach(m => {
      m.forEach(({r,c}) => {
        const key = r*100+c;
        if (!matched.has(key)) {
          matched.add(key);
          totalMatched++;
          // Particle burst
          this.addParticles(c*this.cellSize+this.cellSize/2, r*this.cellSize+this.cellSize/2, this.grid[r][c].type);
          // Add sparkle particles
          this.addSparkles(c*this.cellSize+this.cellSize/2, r*this.cellSize+this.cellSize/2);
          // Mark for removal animation
          const cr = this.grid[r][c];
          if (cr) { cr.removing = true; cr.removeProgress = 0; }
        }
      });
      // Create special for 4+ matches
      if (m.length >= 4) {
        const mid = m[Math.floor(m.length/2)];
        const crystal = this.grid[mid.r][mid.c];
        if (crystal && crystal.type >= 0) {
          crystal.special = m.length >= 5 ? 'color' : (m[0].r === m[1].r ? 'lineH' : 'lineV');
          crystal.removing = false; // Don't remove the special one
        }
      }
    });
    
    // Animate removal then actually remove
    let frames = 0;
    const maxFrames = 15;
    const animateRemoval = () => {
      frames++;
      matched.forEach(key => {
        const r = Math.floor(key/100);
        const c = key%100;
        const cr = this.grid[r][c];
        if (cr && cr.removing) {
          cr.removeProgress = frames / maxFrames;
          cr.scale = 1 + cr.removeProgress * 0.5; // Scale up
          cr.alpha = 1 - cr.removeProgress; // Fade out
        }
      });
      if (frames < maxFrames) {
        requestAnimationFrame(animateRemoval);
      } else {
        // Actually remove
        matched.forEach(key => {
          const r = Math.floor(key/100);
          const c = key%100;
          const cr = this.grid[r][c];
          if (cr && cr.removing) {
            this.grid[r][c] = null;
          }
        });
        
        // Score
        const points = totalMatched * 50 * (1 + Math.floor(totalMatched/5)*0.5);
        this.score += Math.floor(points);
        G.stats.totalMatches += totalMatched;
        playSfx('match');
        
        // Drop and fill
        this.dropAndFill();
      }
    };
    animateRemoval();
  }
  
  dropAndFill() {
    for (let c=0; c<this.cols; c++) {
      let writeR = this.rows-1;
      for (let r=this.rows-1; r>=0; r--) {
        if (this.grid[r][c]) {
          if (r !== writeR) {
            this.grid[writeR][c] = this.grid[r][c];
            this.grid[writeR][c].targetX = c*this.cellSize;
            this.grid[writeR][c].targetY = writeR*this.cellSize;
            this.grid[r][c] = null;
          }
          writeR--;
        }
      }
      // Fill empty
      for (let r=writeR; r>=0; r--) {
        this.grid[r][c] = { type: Math.floor(Math.random()*this.numTypes), x:c*this.cellSize, y:-this.cellSize*(writeR-r+1), targetX:c*this.cellSize, targetY:r*this.cellSize, scale:1, alpha:1, special:null };
      }
    }
    
    // Animate falling
    let animFrames = 0;
    const animate = ()=>{
      let allSettled = true;
      for (let r=0; r<this.rows; r++) {
        for (let c=0; c<this.cols; c++) {
          const cr = this.grid[r][c];
          if (!cr) continue;
          const speed = 0.25;
          if (Math.abs(cr.x - cr.targetX) > 1) { cr.x += (cr.targetX-cr.x)*speed; allSettled=false; }
          else cr.x = cr.targetX;
          if (Math.abs(cr.y - cr.targetY) > 1) { cr.y += (cr.targetY-cr.y)*speed; allSettled=false; }
          else cr.y = cr.targetY;
        }
      }
      animFrames++;
      if (!allSettled && animFrames < 60) {
        requestAnimationFrame(animate);
      } else {
        // Snap
        for (let r=0; r<this.rows; r++)
          for (let c=0; c<this.cols; c++)
            if (this.grid[r][c]) { this.grid[r][c].x=this.grid[r][c].targetX; this.grid[r][c].y=this.grid[r][c].targetY; }
        
        // Check cascading matches
        const cascMatches = this.findAllMatches();
        if (cascMatches.length > 0) {
          setTimeout(()=>this.processMatches(), 100);
        } else {
          this.animating = false;
          this.checkGameOver();
        }
      }
    };
    animate();
  }
  
  checkGameOver() {
    // Win immediately only if 3 stars achieved (score >= target * 1.5)
    if (this.score >= this.target * 1.5) {
      this.won = true;
      this.gameOver = true;
      onLevelWin(this.level, this.score);
    } else if (this.mode === 'timed') {
      // Timed mode: when time runs out, check if score is enough for at least 1 star
      if (this.timeLeft <= 0) {
        if (this.score >= this.target) {
          this.won = true;
          this.gameOver = true;
          onLevelWin(this.level, this.score);
        } else {
          this.gameOver = true;
          onLevelLose();
        }
      }
    } else {
      // Move-limited modes: when moves run out, check if score is enough for at least 1 star
      if (this.movesLeft <= 0) {
        if (this.score >= this.target) {
          this.won = true;
          this.gameOver = true;
          onLevelWin(this.level, this.score);
        } else {
          this.gameOver = true;
          onLevelLose();
        }
      }
    }
  }
  
  addParticles(x, y, type) {
    const color = type >= 0 ? CRYSTAL_TYPES[type].color : '#888';
    const glow = type >= 0 ? CRYSTAL_TYPES[type].glow : '#aaa';
    for (let i=0; i<12; i++) {
      const angle = (Math.PI*2*i)/12 + Math.random()*0.3;
      const speed = Math.random()*5+2;
      this.particles.push({
        x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-2,
        life:1, color: i%2===0 ? color : glow, size:Math.random()*5+2,
        type:'circle', rotation:0, rotSpeed:(Math.random()-0.5)*0.3
      });
    }
  }
  
  addSparkles(x, y) {
    for (let i=0; i<6; i++) {
      const angle = Math.random()*Math.PI*2;
      const dist = Math.random()*20+10;
      this.particles.push({
        x:x+Math.cos(angle)*dist, y:y+Math.sin(angle)*dist,
        vx:Math.cos(angle)*1, vy:Math.sin(angle)*1-1,
        life:1, color:'#ffffff', size:Math.random()*3+1,
        type:'sparkle', rotation:Math.random()*Math.PI, rotSpeed:(Math.random()-0.5)*0.2
      });
    }
  }
  
  usePowerup(type, r, c) {
    if (G.powerups[type] <= 0) return false;
    if (type === 'bomb') {
      for (let dr=-1; dr<=1; dr++)
        for (let dc=-1; dc<=1; dc++) {
          const nr=r+dr, nc=c+dc;
          if (nr>=0&&nr<this.rows&&nc>=0&&nc<this.cols&&this.grid[nr][nc]&&this.grid[nr][nc].type>=0) {
            this.addParticles(nc*this.cellSize+this.cellSize/2, nr*this.cellSize+this.cellSize/2, this.grid[nr][nc].type);
            this.grid[nr][nc] = null;
            this.score += 100;
          }
        }
    } else if (type === 'line') {
      for (let i=0; i<this.cols; i++) {
        if (this.grid[r][i]&&this.grid[r][i].type>=0) { this.addParticles(i*this.cellSize+this.cellSize/2,r*this.cellSize+this.cellSize/2,this.grid[r][i].type); this.grid[r][i]=null; this.score+=100; }
      }
    } else if (type === 'color') {
      const t = this.grid[r][c] ? this.grid[r][c].type : 0;
      for (let rr=0; rr<this.rows; rr++)
        for (let cc=0; cc<this.cols; cc++)
          if (this.grid[rr][cc]&&this.grid[rr][cc].type===t) { this.addParticles(cc*this.cellSize+this.cellSize/2,rr*this.cellSize+this.cellSize/2,t); this.grid[rr][cc]=null; this.score+=100; }
    } else if (type === 'shuffle') {
      const types = [];
      for (let rr=0; rr<this.rows; rr++)
        for (let cc=0; cc<this.cols; cc++)
          if (this.grid[rr][cc]&&this.grid[rr][cc].type>=0) types.push(this.grid[rr][cc].type);
      types.sort(()=>Math.random()-0.5);
      let idx=0;
      for (let rr=0; rr<this.rows; rr++)
        for (let cc=0; cc<this.cols; cc++)
          if (this.grid[rr][cc]&&this.grid[rr][cc].type>=0) this.grid[rr][cc].type = types[idx++];
    } else if (type === 'hammer') {
      if (this.grid[r][c]&&this.grid[r][c].type>=0) { this.addParticles(c*this.cellSize+this.cellSize/2,r*this.cellSize+this.cellSize/2,this.grid[r][c].type); this.grid[r][c]=null; this.score+=50; }
    }
    G.powerups[type]--;
    saveData();
    this.dropAndFill();
    return true;
  }
  
  update(dt) {
    // Update particles
    this.particles = this.particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.025;
      if (p.rotSpeed) p.rotation += p.rotSpeed;
      return p.life > 0;
    });
    
    // Timer
    if (this.mode === 'timed' && !this.gameOver && !this.paused) {
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.checkGameOver(); }
    }
  }
  
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    
    // Background grid
    ctx.fillStyle = 'rgba(10,10,30,0.5)';
    ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    
    for (let r=0; r<this.rows; r++) {
      for (let c=0; c<this.cols; c++) {
        ctx.fillStyle = (r+c)%2===0 ? 'rgba(30,30,60,0.3)' : 'rgba(20,20,45,0.3)';
        ctx.fillRect(c*this.cellSize, r*this.cellSize, this.cellSize, this.cellSize);
      }
    }
    
    // Draw crystals
    for (let r=0; r<this.rows; r++) {
      for (let c=0; c<this.cols; c++) {
        const cr = this.grid[r][c];
        if (!cr) continue;
        
        ctx.globalAlpha = cr.alpha !== undefined ? cr.alpha : 1;
        
        if (cr.type === -1) {
          this.drawObstacle(cr.x, cr.y);
        } else {
          const ct = CRYSTAL_TYPES[cr.type];
          if (this.blind) {
            this.drawCrystal(cr.x, cr.y, '#444', '#666', 'circle', cr.special, cr.scale || 1);
          } else {
            this.drawCrystal(cr.x, cr.y, ct.color, ct.glow, ct.shape, cr.special, cr.scale || 1);
          }
        }
        
        ctx.globalAlpha = 1;
        
        // Selected highlight
        if (this.selected && this.selected.r === r && this.selected.c === c) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.strokeRect(c*this.cellSize+2, r*this.cellSize+2, this.cellSize-4, this.cellSize-4);
        }
      }
    }
    
    // Particles
    this.particles.forEach(p => {
      ctx.globalAlpha = p.life;
      if (p.type === 'sparkle') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation + p.life * 3);
        ctx.fillStyle = p.color;
        const sz = p.size * p.life;
        ctx.fillRect(-sz, -sz*0.15, sz*2, sz*0.3);
        ctx.fillRect(-sz*0.15, -sz, sz*0.3, sz*2);
        ctx.restore();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }
  
  drawCrystal(x, y, color, glow, shape, special, scale) {
    const ctx = this.ctx;
    const s = this.cellSize * 0.4 * scale;
    const cx = x + this.cellSize/2;
    const cy = y + this.cellSize/2;
    
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = 15;
    ctx.fillStyle = color;
    ctx.strokeStyle = glow;
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    switch(shape) {
      case 'diamond':
        ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s, cy); ctx.lineTo(cx, cy+s); ctx.lineTo(cx-s, cy); ctx.closePath();
        break;
      case 'circle':
        ctx.arc(cx, cy, s, 0, Math.PI*2);
        break;
      case 'hexagon':
        for (let i=0; i<6; i++) { const a=i*Math.PI/3; const px=cx+Math.cos(a)*s, py=cy+Math.sin(a)*s; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
        ctx.closePath();
        break;
      case 'star':
        for (let i=0; i<10; i++) { const a=i*Math.PI/5-Math.PI/2; const r=i%2===0?s:s*0.4; const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
        ctx.closePath();
        break;
      case 'square':
        const sr=s*0.8; ctx.rect(cx-sr, cy-sr, sr*2, sr*2);
        break;
      case 'triangle':
        ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s, cy+s*0.8); ctx.lineTo(cx-s, cy+s*0.8); ctx.closePath();
        break;
      case 'pentagon':
        for (let i=0; i<5; i++) { const a=i*Math.PI*2/5-Math.PI/2; const px=cx+Math.cos(a)*s, py=cy+Math.sin(a)*s; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
        ctx.closePath();
        break;
    }
    ctx.fill();
    ctx.stroke();
    
    // Inner shine
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(cx-s*0.3, cy-s*0.3, s*0.25, 0, Math.PI*2);
    ctx.fill();
    
    // Special indicator
    if (special) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (special === 'color') ctx.fillText('★', cx, cy);
      else ctx.fillText(special === 'lineH' ? '↔' : '↕', cx, cy);
    }
    
    ctx.restore();
  }
  
  drawObstacle(x, y) {
    const ctx = this.ctx;
    const s = this.cellSize * 0.4;
    const cx = x + this.cellSize/2;
    const cy = y + this.cellSize/2;
    ctx.save();
    ctx.fillStyle = '#444';
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx-s, cy-s*0.7);
    ctx.lineTo(cx+s*0.8, cy-s);
    ctx.lineTo(cx+s, cy+s*0.5);
    ctx.lineTo(cx-s*0.3, cy+s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.arc(cx-s*0.2, cy-s*0.2, s*0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  
  handleClick(x, y) {
    if (this.animating || this.gameOver || this.paused) return;
    
    // Powerup mode
    if (this.powerupMode) {
      const c = Math.floor(x / this.cellSize);
      const r = Math.floor(y / this.cellSize);
      if (r>=0&&r<this.rows&&c>=0&&c<this.cols&&this.grid[r][c]) {
        if (this.usePowerup(this.powerupMode, r, c)) {
          playSfx('match');
          this.powerupMode = null;
        }
      }
      return;
    }
    
    const c = Math.floor(x / this.cellSize);
    const r = Math.floor(y / this.cellSize);
    if (r<0||r>=this.rows||c<0||c>=this.cols) return;
    if (!this.grid[r][c] || this.grid[r][c].type < 0) return;
    
    if (this.selected) {
      if (this.selected.r === r && this.selected.c === c) {
        this.selected = null;
        return;
      }
      const dr = Math.abs(this.selected.r - r);
      const dc = Math.abs(this.selected.c - c);
      if (dr + dc === 1) {
        this.trySwap(this.selected.r, this.selected.c, r, c);
        this.selected = null;
      } else {
        this.selected = {r, c};
      }
    } else {
      this.selected = {r, c};
    }
  }
}

  let screen = document.getElementById('levels-screen');

    document.getElementById('game-container').appendChild(screen);

  screen.innerHTML = `
    <div style="width:95%;max-width:500px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">

    </div>
    <div class="level-grid-container">
      <div class="level-grid" id="level-grid-el"></div>
    </div>
  `;
  
  const grid = document.getElementById('level-grid-el');
  grid.innerHTML = '';
  
  const maxShow = Math.min(G.unlockedLevel + 20, 500);
  for (let i=1; i<=maxShow; i++) {
    const card = document.createElement('div');
    card.className = 'level-card ' + (i <= G.unlockedLevel ? (i === G.unlockedLevel ? 'current' : 'unlocked') : 'locked');
    
    const mode = getLevelMode(i);
    let modeIcon = '';
    if (mode === 'timed') modeIcon = '⏱';
    else if (mode === 'obstacles') modeIcon = '🪨';
    else if (mode === 'blind') modeIcon = '🙈';
    else if (mode === 'movesLimit') modeIcon = '🎯';
    
    card.innerHTML = `<div style="font-size:18px;">${i}</div><div style="font-size:10px;">${modeIcon}</div>`;
    
    if (i <= G.unlockedLevel) {
      card.onclick = () => { playSfx('click'); startLevel(i); };
    }
    grid.appendChild(card);
  }
  
  // Scroll to current
  setTimeout(() => {
    const container = screen.querySelector('.level-grid-container');
    const current = screen.querySelector('.level-card.current');
    if (current) container.scrollTop = current.offsetTop - container.clientHeight/2;
  }, 50);
}

function startLevel(level) {
  buildGameScreen();
  const screen = document.getElementById('game-screen');
  
  const isMobile = window.innerWidth < 600;
  const boardSize = Math.min(isMobile ? window.innerWidth-20 : 500, window.innerHeight-250);
  const canvasSize = Math.max(boardSize, 300);
  
  screen.innerHTML = `
    <div class="game-top-bar">
      <button class="btn-back" onclick="playSfx('click');stopGameLoop();showScreen('levels')">${t('back')}</button>
      <div class="game-info-box"><div class="label">${t('level')}</div><div class="value">${level}</div></div>
      <div class="game-info-box"><div class="label">${t('score')}</div><div class="value" id="g-score">0</div></div>
      <div class="game-info-box"><div class="label">${t('target')}</div><div class="value">${getLevelTarget(level)}</div></div>
      <div class="game-info-box" style="min-width:100px;">
        <div class="label">⭐⭐⭐</div>
        <div class="value" style="font-size:13px;">${Math.floor(getLevelTarget(level)*1.0)} / ${Math.floor(getLevelTarget(level)*1.2)} / ${Math.floor(getLevelTarget(level)*1.5)}</div>
      </div>
      <div class="game-info-box"><div class="label" id="g-moves-label">${t('moves')}</div><div class="value" id="g-moves">${getLevelMoves(level)}</div></div>
    </div>
    <div id="star-progress" style="width:95%;max-width:500px;margin-bottom:8px;display:flex;align-items:center;gap:4px;">
        <span style="color:#8899bb;font-size:11px;white-space:nowrap;">⭐</span>
        <div style="flex:1;height:8px;background:rgba(30,30,70,.6);border-radius:4px;overflow:hidden;position:relative;">
          <div id="star-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#ffaa00);border-radius:4px;transition:width .3s;"></div>
          <div style="position:absolute;top:0;left:66.7%;width:2px;height:100%;background:rgba(255,255,255,.3);"></div>
          <div style="position:absolute;top:0;left:80%;width:2px;height:100%;background:rgba(255,255,255,.3);"></div>
        </div>
        <span style="color:#8899bb;font-size:11px;white-space:nowrap;">⭐⭐⭐</span>
      </div>
      <canvas id="game-canvas" width="${canvasSize}" height="${canvasSize}"></canvas>
    <div class="power-up-bar" id="powerup-bar"></div>
  `;
  
  const canvas = document.getElementById('game-canvas');
  game = new Match3(canvas, level);
  
  // Powerup bar
  const puBar = document.getElementById('powerup-bar');
  const pus = [
    { type:'bomb', svg:bombSVG(), desc:t('bombDesc') },
    { type:'line', svg:lineSVG(), desc:t('lineDesc') },
    { type:'color', svg:colorSVG(), desc:t('colorDesc') },
    { type:'shuffle', svg:shuffleSVG(), desc:t('shuffleDesc') },
    { type:'hammer', svg:hammerSVG(), desc:t('hammerDesc') }
  ];
  pus.forEach(pu => {
    const el = document.createElement('div');
    el.className = 'power-up-slot';
    el.innerHTML = pu.svg + `<div class="power-up-count">${G.powerups[pu.type]||0}</div>`;
    el.title = pu.desc;
    el.onclick = () => {
      if (G.powerups[pu.type] > 0) {
        game.powerupMode = game.powerupMode === pu.type ? null : pu.type;
        playSfx('click');
      } else {
        showToast(t('notEnough'));
      }
    };
    puBar.appendChild(el);
  });
  
  showScreen('game');
  
  // Show interstitial ad before level starts
  game.paused = true;
  showToast(t('adLoading'), 1500);
  showInterstitialAd(() => {
    game.paused = false;
  });
  
  // Start game loop
  lastTime = performance.now();
  gameLoopId = requestAnimationFrame(gameLoop);
}

function gameLoop(time) {
  if (!game || currentScreen !== 'game') return;
  const dt = (time - lastTime) / 1000;
  lastTime = time;
  
  game.update(dt);
  game.draw();
  
  // Update UI
  const scoreEl = document.getElementById('g-score');
  const movesEl = document.getElementById('g-moves');
  const movesLabel = document.getElementById('g-moves-label');
  if (scoreEl) scoreEl.textContent = game.score;
  if (movesEl) {
    if (game.mode === 'timed') { movesEl.textContent = Math.ceil(game.timeLeft); if(movesLabel) movesLabel.textContent = '⏱'; }
    else { movesEl.textContent = game.movesLeft; }
  }
  
  // Update powerup counts
  const puSlots = document.querySelectorAll('.power-up-slot .power-up-count');
  ['bomb','line','color','shuffle','hammer'].forEach((type,i) => {
    if (puSlots[i]) puSlots[i].textContent = G.powerups[type]||0;
  });
  
  // Update star progress bar
  const starBar = document.getElementById('star-bar');
  if (starBar && game) {
    const target = game.target;
    const pct = Math.min(100, (game.score / (target * 1.5)) * 100);
    starBar.style.width = pct + '%';
  }
  
  gameLoopId = requestAnimationFrame(gameLoop);
}

function stopGameLoop() {
  if (gameLoopId) { cancelAnimationFrame(gameLoopId); gameLoopId = null; }
  game = null;
}

// ==================== LEVEL WIN/LOSE ====================
function onLevelWin(level, score) {
  playSfx('win');
  G.stats.levelsCompleted++;
  
  const reward = 50 + level * 10;
  const stars = score >= getLevelTarget(level)*1.5 ? 3 : score >= getLevelTarget(level)*1.2 ? 2 : 1;
  
  if (level >= G.unlockedLevel) {
    G.unlockedLevel = Math.min(level + 1, 500);
  }
  
  // Update quests
  updateQuestProgress('win', 1);
  updateQuestProgress('score', score);
  updateQuestProgress('level', level);
  
  saveData();
  
  setTimeout(() => {
    const screen = document.getElementById('game-screen');
    const overlay = document.createElement('div');
    overlay.className = 'overlay-bg';
    overlay.id = 'win-overlay';

  { id:'winStreak', desc:{ru:'Выиграйте 3 уровня подряд', en:'Win 3 levels in a row'}, target:3, type:'winStreak', reward:250 },
  { id:'matches500', desc:{ru:'Соберите 500 кристаллов', en:'Match 500 crystals'}, target:500, type:'matches', reward:400 }
];

function getQuestsDate() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function generateQuests() {
  const today = getQuestsDate();
  if (G.questsDate !== today || !G.quests.length) {
    G.questsDate = today;
    const shuffled = [...QUEST_TEMPLATES].sort(()=>Math.random()-0.5);
    G.quests = shuffled.slice(0,10).map(q => ({ ...q, progress:0, claimed:false }));
    saveData();
  }
}

function updateQuestProgress(type, value) {
  G.quests.forEach(q => {
    if (q.claimed) return;
    if (type === 'win' && q.type === 'win') q.progress = Math.min(q.target, q.progress+1);
    if (type === 'win' && q.type === 'winStreak') q.progress = Math.min(q.target, q.progress+1);
    if (type === 'score' && q.type === 'scoreOne') q.progress = Math.max(q.progress, value);
    if (type === 'score' && q.type === 'scoreTotal') q.progress += value;
    if (type === 'match' && q.type === 'matches') q.progress = Math.min(q.target, q.progress+value);
    if (type === 'level' && q.type === 'levelBeat' && value >= q.target) q.progress = q.target;
  });
  saveData();
}

function buildQuests() {
  generateQuests();
  let screen = document.getElementById('quests-screen');
  if (!screen) {
    screen = document.createElement('div');
    screen.id = 'quests-screen';
    screen.className = 'screen';
    document.getElementById('game-container').appendChild(screen);
  }
  
  const now = new Date();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  const hoursLeft = Math.floor((tomorrow - now) / 3600000);
  const minsLeft = Math.floor(((tomorrow - now) % 3600000) / 60000);
  
  let questsHtml = G.quests.map((q,i) => `
    <div class="quest-card">
      <div class="quest-info">
        <div class="quest-title">${q.desc[G.lang]}</div>
        <div class="quest-progress">${q.progress}/${q.target}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="quest-reward"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd700"/></svg>${q.reward}</div>
        <button class="quest-claim-btn" ${q.progress>=q.target&&!q.claimed?'':'disabled'} data-idx="${i}">${q.claimed?t('claimed'):t('claimReward')}</button>
      </div>
    </div>
  `).join('');
  
  const allDone = G.quests.every(q => q.claimed);
  
  screen.innerHTML = `
    <div style="width:90%;max-width:460px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <button class="btn-back" onclick="playSfx('click');buildLobby();showScreen('lobby')">${t('back')}</button>
        <h2 style="color:#aaddff;font-size:24px;">${t('quests')}</h2>
      </div>
      <div style="text-align:center;color:#8899bb;margin-bottom:15px;font-size:13px;">
        ${allDone ? t('noQuests') : `${t('questRefresh')} ${hoursLeft}${t('hours')} ${minsLeft}${t('min')}`}
      </div>
      <div class="quest-scroll-wrap">${questsHtml}</div>
    </div>
  `;
  
  screen.querySelectorAll('.quest-claim-btn').forEach(b => {
    if (b.disabled) return;
    b.onclick = () => {
      const idx = parseInt(b.dataset.idx);
      if (G.quests[idx].progress >= G.quests[idx].target && !G.quests[idx].claimed) {
        G.quests[idx].claimed = true;
        G.coins += G.quests[idx].reward;
        saveData();
        playSfx('win');
        showToast(`+${G.quests[idx].reward} ${t('coins')}!`);
        buildQuests();
      }
    };
  });
}

let afkTimerId = null;

  }
  
  const earnPerMin = 5 + Math.floor(G.unlockedLevel/10);
  const earnPerSec = earnPerMin / 60;
  
  // Start accumulating only while AFK screen is open
  if (afkTimerId) { clearInterval(afkTimerId); afkTimerId = null; }
  afkAccumulator = 0;
  
  function updateAfkDisplay() {
    const coinEl = document.getElementById('afk-coins');
    const btnEl = document.getElementById('afk-collect');
    if (coinEl) coinEl.textContent = Math.floor(afkAccumulator);
    if (btnEl) {
      btnEl.textContent = `${t('collect')} ${Math.floor(afkAccumulator)}`;
      btnEl.disabled = afkAccumulator < 1;
    }
  }
  
  afkTimerId = setInterval(() => {
    afkAccumulator += earnPerSec;
    updateAfkDisplay();
  }, 1000);
  
  screen.innerHTML = `
    <div style="width:90%;max-width:400px;text-align:center;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

            <circle cx="40" cy="40" r="35" fill="#ffd700" stroke="#daa520" stroke-width="3"/>
            <text x="40" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#b8860b">$</text>
          </svg>
        </div>
        <div class="afk-info">
          <p style="color:#aaddff;font-size:18px;">${t('afkEarn')}</p>
          <p style="color:#ffd700;font-size:32px;font-weight:bold;" id="afk-coins">0</p>
          <p style="color:#8899bb;font-size:14px;">${earnPerMin} ${t('perMin')}</p>
          <p style="color:#667788;font-size:12px;margin-top:8px;">💡 ${G.lang==='ru' ? 'Монеты начисляются, пока вы здесь' : 'Coins accrue while you are here'}</p>
        </div>
        <button class="btn btn-success" id="afk-collect" disabled>${t('collect')} 0</button>
      </div>
    </div>
  `;
  
  document.getElementById('afk-back').onclick = () => {
    playSfx('click');
    if (afkTimerId) { clearInterval(afkTimerId); afkTimerId = null; }
    // Collect on leave
    if (afkAccumulator >= 1) {
      G.coins += Math.floor(afkAccumulator);
      G.afkAccumulated = Math.floor(afkAccumulator);
      saveData();
    }
    afkAccumulator = 0;
    buildLobby();
    showScreen('lobby');
  };
  
  document.getElementById('afk-collect').onclick = () => {
    const amount = Math.floor(afkAccumulator);
    if (amount > 0) {
      G.coins += amount;
      showToast(`+${amount} ${t('coins')}!`);
      afkAccumulator = 0;
      saveData();
      updateAfkDisplay();
    }
  };
}

          G.powerups[puType] = (G.powerups[puType]||0) + qty;

    overlay.remove();
    G.tutorialDone = true;
    saveData();
    startTutorial();
  };
  document.getElementById('tut-no').onclick = () => {
    overlay.remove();
    G.tutorialDone = true;
    saveData();
  };
}

function startTutorial() {
  startLevel(1);
  setTimeout(() => {
    const screen = document.getElementById('game-screen');
    const steps = [
      { text: t('tut1'), pos: '50%', top: '40%' },
      { text: t('tut2'), pos: '50%', top: '50%' },
      { text: t('tut3'), pos: '50%', top: '60%' }
    ];
    let step = 0;
    
    function showStep() {
      const old = screen.querySelector('.tut-text');
      if (old) old.remove();
      if (step >= steps.length) return;
      
      const el = document.createElement('div');
      el.className = 'tut-text';
      el.style.left = '50%';
      el.style.transform = 'translateX(-50%)';
      el.style.top = steps[step].top;
      el.innerHTML = steps[step].text + (step < steps.length-1 ? '<br><button class="btn btn-primary" style="margin-top:10px;padding:8px 20px;font-size:14px;">Далее →</button>' : '<br><button class="btn btn-success" style="margin-top:10px;padding:8px 20px;font-size:14px;">✓ Понятно</button>');
      screen.appendChild(el);
      
      el.querySelector('button').onclick = () => {
        step++;
        if (step < steps.length) showStep();
        else el.remove();
      };
    }
    showStep();
  }, 1000);
}

// ==================== SCREEN BUILDER DISPATCHER ====================
function buildScreen(name) {
  switch(name) {
    case 'levels': buildLevels(); break;
    case 'settings': buildSettings(); break;
    case 'quests': buildQuests(); break;
    case 'afk': buildAfk(); break;
    case 'daily': buildDaily(); break;
    case 'shop': buildShop(); break;
  }
}

// ==================== TOAST ====================
let toastTimer = null;
function showToast(msg, duration=2000) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.remove(), duration);
}

// ==================== INPUT HANDLING ====================
function setupInput() {
  document.addEventListener('click', () => { initAudio(); if (G.musicOn) playMusic(); }, { once: true });
  document.addEventListener('touchstart', () => { initAudio(); if (G.musicOn) playMusic(); }, { once: true });
  
  document.addEventListener('click', (e) => {
    if (currentScreen !== 'game' || !game) return;
    const canvas = document.getElementById('game-canvas');
    if (!canvas || !canvas.contains(e.target)) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    game.handleClick(x, y);
  });
  
  let touchStart = null;
  document.addEventListener('touchstart', (e) => {
    if (currentScreen !== 'game' || !game) return;
    const canvas = document.getElementById('game-canvas');
    if (!canvas) return;
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    if (t.clientX < rect.left || t.clientX > rect.right || t.clientY < rect.top || t.clientY > rect.bottom) return;
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });
  
  document.addEventListener('touchend', (e) => {
    if (currentScreen !== 'game' || !game || !touchStart) return;
    const canvas = document.getElementById('game-canvas');
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < 10) {
      // Tap
      const x = (t.clientX - rect.left) * scaleX;
      const y = (t.clientY - rect.top) * scaleY;
      game.handleClick(x, y);
    } else {
      // Swipe
      const startX = (touchStart.x - rect.left) * scaleX;
      const startY = (touchStart.y - rect.top) * scaleY;
      const endX = (t.clientX - rect.left) * scaleX;
      const endY = (t.clientY - rect.top) * scaleY;
      const r1 = Math.floor(startY / game.cellSize);
      const c1 = Math.floor(startX / game.cellSize);
      let r2 = r1, c2 = c1;
      if (Math.abs(dx) > Math.abs(dy)) { c2 = c1 + (dx > 0 ? 1 : -1); }
      else { r2 = r1 + (dy > 0 ? 1 : -1); }
      if (r2>=0&&r2<game.rows&&c2>=0&&c2<game.cols) {
        game.selected = {r:r1, c:c1};
        game.trySwap(r1, c1, r2, c2);
        game.selected = null;
      }
    }
    touchStart = null;
    e.preventDefault();
  }, { passive: false });
}

// ==================== INIT ====================
async function init() {
  await loadData();
  generateQuests();
  buildLobby();
  showScreen('lobby');
  showBanner();
  setupInput();
  
  if (!G.tutorialDone) {
    setTimeout(showTutorialPrompt, 500);
  }
}

// Start when VK bridge is ready
if (typeof vkBridge !== 'undefined') {
  vkBridge.send("VKWebAppInit").then(() => { init(); }).catch(() => { init(); });
} else {
  init();
}
</script>
