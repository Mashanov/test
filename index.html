}
document.getElementById('sw-music').addEventListener('click', ()=>{
  state.music = !state.music;
  syncSettingsUI();
  refreshMusic();
  saveGame();
});
document.querySelectorAll('.langbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.lang = b.getAttribute('data-lang');
    LANG = state.lang;
    applyLang();
    syncSettingsUI();
    saveGame();
  });
});
document.getElementById('pcode-apply').addEventListener('click', ()=>{
  const inp = document.getElementById('pcode-input');
  const msg = document.getElementById('pcode-msg');
  const code = (inp.value || '').trim().toLowerCase();
  if(!code){ msg.textContent = t('promocode_bad'); msg.style.color = '#ff8b8b'; return; }
  if(code === 'clear12'){
    msg.textContent = '...';
    if(HAS_VK){
      VK.send('VKWebAppStorageSet', {key: SAVE_KEY, value: ''}).finally(()=>location.reload());
    } else {
      location.reload();
    }
    return;
  }
  if(code === 'admin17'){
    addGold(100000);
    msg.textContent = t('promocode_ok') + ' +100000 ' + t('gold');
    msg.style.color = 'var(--green)';
    inp.value = '';
    refreshAllUI();
    saveGame();
    return;
  }
  msg.textContent = t('promocode_bad');
  msg.style.color = '#ff8b8b';
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  if(!confirm(LANG==='ru'?'Сбросить весь прогресс?':'Reset all progress?')) return;
  if(HAS_VK){
    VK.send('VKWebAppStorageSet', {key: SAVE_KEY, value: ''}).finally(()=>location.reload());
  } else {
    location.reload();
  }
});

/* ========================================================================
   LANGUAGE
   ======================================================================== */
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    const v = t(k);
    if(v) el.textContent = v;
  });
  document.getElementById('adov-text').textContent = t('ad_loading');
  document.documentElement.lang = LANG;
  refreshMenu();
  refreshAllUI();
  renderLobbyBuildings();
  if(document.getElementById('ov-quests').classList.contains('show')) renderQuests();
  if(document.getElementById('ov-daily').classList.contains('show')) renderDaily();
  if(document.getElementById('ov-time').classList.contains('show')) renderPlaytime();
  if(document.getElementById('ov-units').classList.contains('show')) renderUnitsModal();
  if(document.getElementById('ov-lab').classList.contains('show')) renderLabModal();
  if(document.getElementById('ov-auction').classList.contains('show')) renderAuctionModal();
  if(document.getElementById('ov-cave').classList.contains('show')) renderCaveModal();
  syncSettingsUI();
}
function refreshMenu(){
  // mainmenu is hidden in this version
}

/* ========================================================================
   TUTORIAL
   ======================================================================== */
const TUT_STEPS = ['tut_1','tut_2','tut_3','tut_4','tut_5','tut_6'];
const TUT_TARGETS = [null, '#lobby-buildings', null, '#bottom', null, null];
let tutIndex = 0;
let tutActive = false;
const tutBox = document.getElementById('tutbox');
const tutText = document.getElementById('tut-text');
const tutDots = document.getElementById('tut-dots');

function startTutorial(){
  tutActive = true;
  tutIndex = 0;
  document.getElementById('ov-tutorial-ask').classList.remove('show');
  syncPause();
  tutBox.classList.add('show');
  showTutStep();
}
function showTutStep(){
  if(tutIndex >= TUT_STEPS.length){ endTutorial(); return; }
  tutText.textContent = t(TUT_STEPS[tutIndex]);
  tutDots.innerHTML = TUT_STEPS.map((_,i)=>`<i class="${i<=tutIndex?'on':''}"></i>`).join('');
  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  const sel = TUT_TARGETS[tutIndex];
  if(sel){
    const el = document.querySelector(sel);
    if(el) el.classList.add('tut-highlight');
  }
  document.getElementById('tut-next').textContent =
    tutIndex === TUT_STEPS.length-1 ? (LANG==='ru'?'Готово':'Done') : t('next');
}
document.getElementById('tut-next').addEventListener('click', ()=>{ tutIndex++; showTutStep(); });
function endTutorial(){
  tutActive = false;
  tutBox.classList.remove('show');
  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  state.tutorial = 2;
  saveGame();
  syncPause();
}
document.getElementById('tut-yes').addEventListener('click', ()=>{
  state.tutorial = 2;
  saveGame();
  startTutorial();
});
document.getElementById('tut-no').addEventListener('click', ()=>{
  state.tutorial = 1;
  saveGame();
  document.getElementById('ov-tutorial-ask').classList.remove('show');
  syncPause();
});

/* ========================================================================
   TOAST
   ======================================================================== */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ========================================================================
   BUILDING COMPLETION TICK
   ======================================================================== */
setInterval(()=>{
  if(VIEW !== 'lobby') return;
  let changed = false;
  // check buildings completed
  for(const key in state.buildings){
    const b = state.buildings[key];
    if(b.buildEnd && b.buildEnd > 0 && Date.now() >= b.buildEnd){
      b.buildEnd = 0;
      b.buildStart = 0;
      if(BUILDINGS[key].resource){
        state.prod[key] = Date.now();
      }
      changed = true;
      const name = LANG==='ru' ? BUILDINGS[key].ru : BUILDINGS[key].en;
      toast(name + ' — ' + t('ready'));
      questProgress('builds', 1);
    }
  }
  // check hero upgrades
  for(const key in state.heroes){
    const h = state.heroes[key];
    if(h.upgradeEnd && h.upgradeEnd > 0 && Date.now() >= h.upgradeEnd){
      h.upgradeEnd = 0;
      changed = true;
      toast((LANG==='ru'?HERO_DEFS[key].ru:HERO_DEFS[key].en) + ' — ' + t('ready'));
    }
  }
  if(changed){
    refreshAllUI();
    saveGame();
  } else {
    updateBuildingIndicators();
  }
}, 1000);

/* ========================================================================
   MAIN LOOP
   ======================================================================== */
let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if(dt > 0.06) dt = 0.06;
  if(dt < 0) dt = 0;

  if((VIEW === 'battle' || VIEW === 'cave') && G.active && !anyPause()){
    updateGame(dt);
  }

  // draw
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(VIEW === 'lobby'){
    drawLobbyScene();
  } else {
    renderBattle();
  }
}

/* ========================================================================
   VISIBILITY / VK EVENTS
   ======================================================================== */
window.addEventListener('blur', ()=> setPause('hidden', true));
window.addEventListener('focus', ()=> setPause('hidden', false));
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) setPause('hidden', true);
  else setPause('hidden', false);
});
if(HAS_VK){
  try{
    vkBridge.subscribe((e)=>{
      const type = e && e.detail && e.detail.type;
      if(type === 'VKWebAppViewHide') setPause('hidden', true);
      else if(type === 'VKWebAppViewRestore') setPause('hidden', false);
    });
  }catch(err){}
}

/* ========================================================================
   BANNER
   ======================================================================== */
function initBanner(){
  if(!HAS_VK) return;
  VK.send('VKWebAppGetLaunchParams')
    .then(()=> VK.send('VKWebAppShowBannerAd', {banner_location:'bottom'}))
    .then(()=>{
      document.getElementById('banner').classList.add('on');
      setTimeout(resizeCanvas, 320);
    })
    .catch(()=>{});
}

/* ========================================================================
   BOOT
   ======================================================================== */
async function boot(){
  resizeCanvas();
  await loadSprites();

  const saved = await loadGame();
  if(saved && typeof saved === 'object' && saved.v === 2){
    state = Object.assign(defaultState(), saved);
    if(!state.buildings) state.buildings = {};
    if(!state.unitsOwned) state.unitsOwned = {sword:true};
    if(!state.heroes) state.heroes = {};
    if(!state.prod) state.prod = {};
    if(!state.auction) state.auction = [];
    if(!state.questList) state.questList = [];
    if(!state.quests) state.quests = {};
    if(!state.questClaimed) state.questClaimed = {};
    if(!state.playClaimed) state.playClaimed = [];
    // ensure hero defaults
    HERO_ORDER.forEach(k=>{
      if(!state.heroes[k]) state.heroes[k] = {level:0, upgradeEnd:0};
    });
  } else if(saved && typeof saved === 'object' && saved.v !== 2){
    // migrate old v1 data roughly
    const old = saved;
    state = defaultState();
    state.gold = old.gold || 0;
    state.maxLevel = old.maxLevel || 1;
    state.music = old.music !== false;
    state.lang = old.lang || 'ru';
    state.tutorial = old.tutorial || 0;
    state.wins = old.stats ? old.stats.wins : 0;
    state.onlineMinutes = old.onlineMinutes || 0;
  } else {
    state = defaultState();
  }

  LANG = state.lang === 'en' ? 'en' : 'ru';
  state.lang = LANG;

  ensureDailyQuests();
  applyLang();
  refreshAllUI();
  renderLobbyBuildings();

  document.getElementById('banner').style.height = '0px';
  setTimeout(()=>{ document.getElementById('banner').style.height=''; }, 100);
  initBanner();

  // audio unlock
  const firstGesture = ()=>{
    Music.ensure();
    if(state.music) Music.play();
    window.removeEventListener('pointerdown', firstGesture);
    window.removeEventListener('keydown', firstGesture);
  };
  window.addEventListener('pointerdown', firstGesture);
  window.addEventListener('keydown', firstGesture);

  // first-run tutorial
  if(!state.tutorial){
    setTimeout(()=>{
      document.getElementById('ov-tutorial-ask').classList.add('show');
      syncPause();
    }, 700);
  }

  requestAnimationFrame(loop);
}

boot();
setInterval(()=>saveGame(), 20000);
window.addEventListener('beforeunload', ()=>saveGame(true));
</script>
