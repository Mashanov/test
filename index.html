<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0b14">
<title>Мистическое Средневековье</title>
<script src="https://vk.com/js/api/xd_connection.js?2"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
:root{
  --gold:#e8c26a; --gold-d:#a8813a; --gold-l:#ffe9a8;
  --bg:#0b0813; --panel:#171226;
  --text:#e9e2d0; --muted:#9d94ad;
  --accent:#7b5cff; --green:#5cd68a; --red:#ff5f6d;
  --wheat:#e8c460; --wood:#a07040; --stone:#9098a8; --essence:#c88aff;
  --border:rgba(232,194,106,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Georgia","Palatino Linotype",serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;position:relative;overflow:hidden}

/* ============ TOP BAR ============ */
#topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;
  padding:4px 6px;min-height:44px;
  background:linear-gradient(180deg,#1c1530,#120d20);
  border-bottom:1px solid rgba(232,194,106,.18);
  box-shadow:0 3px 12px rgba(0,0,0,.5);
  z-index:20;overflow-x:auto;scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none}
.chip{
  display:flex;align-items:center;gap:4px;flex:0 0 auto;
  background:linear-gradient(180deg,#2c2140,#1c1530);
  border:1px solid var(--border);border-radius:16px;
  padding:3px 9px 3px 5px;font-size:12px;font-weight:bold;color:var(--gold-l);
  white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}
.chip svg{width:13px;height:13px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2}
.chip.wheat{color:#f0d97a;border-color:rgba(240,217,122,.3)}
.chip.wood{color:#c89060;border-color:rgba(200,144,96,.3)}
.chip.stone{color:#b0b8c8;border-color:rgba(176,184,200,.3)}
.chip.essence{color:#d8a8ff;border-color:rgba(216,168,255,.35)}
.chip.hidden{display:none}
#spacer{flex:1;min-width:6px}
.tbtn{
  width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,#2a2140,#1a1428);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;padding:0;transition:transform .12s;
}
.tbtn:active{transform:scale(.9)}
.tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn .dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #120d20;display:none;animation:pulse 1.4s infinite}
.tbtn.alert .dot{display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ============ STAGE ============ */
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;position:absolute;inset:0}

/* ============ LOBBY BUILDINGS ============ */
#lobby-buildings{position:absolute;inset:0;pointer-events:none;z-index:5}
.bld{
  position:absolute;transform:translate(-50%,-100%);
  pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
  transition:transform .12s;padding:0;border:none;background:none;
}
.bld:active{transform:translate(-50%,-100%) scale(.94)}
.bld .bicon{
  width:72px;height:72px;position:relative;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.7));
}
.bld .bicon img{width:100%;height:100%;object-fit:contain;display:block}
.bld .badge{
  position:absolute;bottom:-4px;right:-4px;min-width:22px;height:22px;
  padding:0 5px;border-radius:11px;background:linear-gradient(180deg,#c9a24a,#7d5a14);
  border:2px solid #1a1428;color:#241a04;font-size:11px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;
}
.bld .timer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  background:#0d0916;border:1px solid var(--border);border-radius:8px;
  padding:1px 5px;font-size:9px;color:var(--gold-l);white-space:nowrap;
  display:none;font-family:monospace;
}
.bld .timer.show{display:block}
.bld .ready{
  position:absolute;top:-6px;right:-4px;width:16px;height:16px;border-radius:50%;
  background:var(--green);border:2px solid #1a1428;
  box-shadow:0 0 10px var(--green);display:none;
  animation:pulse 1.2s infinite;
}
.bld .ready.show{display:block}
.bld .bname{
  font-size:10px;color:var(--text);margin-top:2px;white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 6px #000;font-weight:bold;
}
.bld.locked .bicon{filter:grayscale(1) brightness(.5) drop-shadow(0 4px 8px rgba(0,0,0,.7))}
.bld.locked .bname{color:#777}
.bld.unbuilt .bicon{filter:grayscale(.7) brightness(.6)}

/* ============ BATTLE HUD ============ */
#battlehud{position:absolute;top:8px;left:0;right:0;z-index:25;display:none;padding:0 10px;pointer-events:none}
#battlehud.show{display:block}
.bhrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.bhrow .bhn{width:56px;color:var(--muted);text-align:right;flex:0 0 auto}
.bhrow .bhbar{flex:1;height:11px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.bhrow .bhbar i{display:block;height:100%;transition:width .2s;border-radius:5px}
.bhrow.enemy .bhn{text-align:left}
#pausebtn{position:absolute;top:8px;right:8px;z-index:26;width:34px;height:34px;display:none;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--border);background:rgba(20,14,34,.85);color:var(--gold);cursor:pointer}
#pausebtn.show{display:flex}
#pausebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ============ MAIN MENU (play) ============ */
#mainmenu{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(123,92,255,.12),transparent 65%)}
#mainmenu.hidden{display:none}
#mainmenu button{pointer-events:auto}
#gametitle{font-size:clamp(20px,5vw,30px);text-align:center;color:var(--gold-l);letter-spacing:1.5px;text-shadow:0 0 26px rgba(232,194,106,.45),0 2px 4px #000;line-height:1.2;margin:0;pointer-events:none}
#gametitle small{display:block;font-size:.5em;color:var(--muted);letter-spacing:3px;margin-top:5px}
#playbtn{padding:15px 52px;font-size:19px;border-radius:14px;background:linear-gradient(180deg,#c9a24a,#8a6a20);border:2px solid #ffdf94;color:#241a04;font-weight:bold;font-family:inherit;cursor:pointer;letter-spacing:2px;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 6px 0 #4a3610,0 12px 30px rgba(0,0,0,.6);transition:transform .09s,box-shadow .09s}
#playbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #4a3610,0 6px 16px rgba(0,0,0,.6)}

/* ============ BOTTOM BAR ============ */
#bottom{flex:0 0 auto;background:linear-gradient(180deg,#150f22,#0d0916);border-top:1px solid rgba(232,194,106,.18);z-index:20;min-height:64px;display:flex;align-items:stretch;gap:5px;padding:6px 7px}
#bottom.battle{min-height:68px}
#bottom .lbtn{flex:1 1 0;min-width:0;border-radius:11px;border:1px solid rgba(232,194,106,.28);background:linear-gradient(180deg,#2b2142,#191227);color:var(--text);cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s;position:relative}
#bottom .lbtn:active{transform:scale(.95)}
#bottom .lbtn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bottom .lbtn span{font-size:10px;color:var(--muted);white-space:nowrap}
#bottom .lbtn.big{background:linear-gradient(180deg,#3a2b5e,#241a3d);border-color:var(--border)}
#bottom .lbtn.big span{color:var(--gold-l);font-weight:bold;font-size:11px}
#bottom .lbtn:disabled{opacity:.35;cursor:default}
#bottom .lbtn .bn{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;font-size:9px;border-radius:8px;padding:0 4px;font-weight:bold;display:none}
#bottom .lbtn.alert .bn{display:block}

/* unit buttons */
.ubtn{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;padding:2px 1px 3px;border-radius:11px;border:1px solid rgba(232,194,106,.28);background:linear-gradient(180deg,#2b2142,#191227);color:var(--text);cursor:pointer;overflow:hidden;transition:transform .1s}
.ubtn:active{transform:scale(.94)}
.ubtn img{width:auto;height:32px;max-width:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.ubtn .cost{font-size:11px;font-weight:bold;color:var(--gold-l);display:flex;align-items:center;gap:3px;line-height:1}
.ubtn .cost i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);display:inline-block}
.ubtn.disabled{opacity:.42;filter:grayscale(.7)}

/* ============ BANNER ============ */
#banner{flex:0 0 auto;min-height:0;height:0;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;transition:height .25s}
#banner.on{height:50px;min-height:50px}

/* ============ OVERLAYS ============ */
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(5,3,10,.78);backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1e1730,#140f22);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;animation:pop .2s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.mhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(232,194,106,.2);background:linear-gradient(180deg,rgba(123,92,255,.14),transparent)}
.mhead h2{margin:0;font-size:17px;color:var(--gold-l);letter-spacing:.5px;flex:1;font-weight:normal}
.mclose{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--gold);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mclose:active{background:rgba(255,255,255,.12)}
.mbody{padding:12px 14px 16px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0}

/* scrollbars */
.mbody,.scroll{scrollbar-width:thin;scrollbar-color:var(--gold-d) rgba(255,255,255,.05)}
.mbody::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:9px;height:9px}
.mbody::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.045);border-radius:9px;margin:4px 0}
.mbody::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--gold-d));border-radius:9px;border:2px solid #171226;background-clip:padding-box}

/* generic UI */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:11px;margin-bottom:9px}
.row .lab{font-size:14px;color:var(--text)}
.row .sub{font-size:11px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--border);border-radius:11px;padding:9px 16px;background:linear-gradient(180deg,#3a2b5e,#241a3d);color:var(--gold-l);font-family:inherit;font-size:14px;cursor:pointer;font-weight:bold;transition:transform .1s,filter .12s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.6)}
.btn.green{background:linear-gradient(180deg,#2c6b47,#1c4530);border-color:rgba(92,214,138,.5);color:#c9ffe0}
.btn.red{background:linear-gradient(180deg,#7a2b3e,#4a1830);border-color:rgba(255,95,109,.5);color:#ffd0d6}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn.full{width:100%;display:block;margin-top:8px}
.center{text-align:center}
.muted{color:var(--muted);font-size:12px;line-height:1.45}

/* resource cost display */
.costrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.costitem{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:bold}
.costitem svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.costitem.miss{color:#ff5f6d}
.costitem.ok{color:var(--green)}

/* building modal content */
.binfo{display:flex;align-items:center;gap:12px;padding:10px;background:rgba(0,0,0,.28);border-radius:12px;margin-bottom:10px}
.binfo img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.binfo .bl{flex:1;min-width:0}
.binfo .bnm{font-size:15px;color:var(--gold-l);font-weight:bold}
.binfo .blv{font-size:12px;color:var(--muted);margin-top:3px}
.binfo .bdesc{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}

/* progress bar (build timer) */
.progress{height:9px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin:8px 0;border:1px solid rgba(255,255,255,.06)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#b48bff);transition:width .5s linear;border-radius:5px}

/* unit shop cards */
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ucard{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.ucard img{width:52px;height:52px;object-fit:contain}
.ucard .un{font-size:12px;color:var(--text);font-weight:bold}
.ucard .us{font-size:10px;color:var(--muted)}
.ucard.locked{opacity:.55;filter:grayscale(.6)}
.ucard.owned{border-color:rgba(92,214,138,.5);background:rgba(92,214,138,.08)}
.ucard .ubuy{margin-top:4px;width:100%;padding:6px;font-size:11px;border-radius:8px}
.ucard .lock-msg{font-size:10px;color:var(--muted);padding:2px 4px}

/* hero cards */
.hcard{display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:9px;align-items:center}
.hcard img{width:54px;height:54px;object-fit:contain;flex:0 0 auto}
.hcard .hinfo{flex:1;min-width:0}
.hcard .hn{font-size:14px;color:var(--gold-l);font-weight:bold}
.hcard .hl{font-size:11px;color:var(--muted);margin-top:2px}
.hcard .hb{font-size:11px;color:var(--essence);margin-top:4px}
.hcard .hbtn{padding:6px 10px;font-size:11px}

/* auction cards */
.acard{padding:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:8px}
.acard .arow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.acard .anm{font-size:13px;color:var(--text)}
.acard .aprice{font-size:13px;color:var(--gold-l);font-weight:bold}
.acard .achance{font-size:11px;color:var(--muted);margin-top:4px}
.acard .abtns{display:flex;gap:6px;margin-top:8px}
.acard .abtns .btn{flex:1;font-size:11px;padding:6px}

/* cave list */
.ccard{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:8px}
.ccard img{width:44px;height:44px;object-fit:contain;flex:0 0 auto}
.ccard .cinfo{flex:1;min-width:0}
.ccard .cn{font-size:13px;color:var(--text);font-weight:bold}
.ccard .cr{font-size:11px;color:var(--essence);margin-top:2px}
.ccard .btn{font-size:11px;padding:7px 12px}
.ccard.locked{opacity:.5;filter:grayscale(.6)}

/* form */
input.fld{flex:1;min-width:0;background:#0f0b1a;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none}
input.fld:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(123,92,255,.22)}
select.fld{flex:1;min-width:0;background:#0f0b1a;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none}

/* toggles */
.switch{position:relative;width:52px;height:28px;border-radius:16px;flex:0 0 auto;background:#2a2238;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#8a8a9a,#5a5a6a);transition:.2s}
.switch.on{background:linear-gradient(180deg,#4b7bff,#2b4bc9);border-color:rgba(120,160,255,.6)}
.switch.on::after{left:26px;background:linear-gradient(180deg,#fff,#cfe0ff)}
.langrow{display:flex;gap:8px}
.langbtn{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer}
.langbtn.active{background:linear-gradient(180deg,#3a2b5e,#241a3d);color:var(--gold-l);border-color:var(--border);font-weight:bold}

/* quests */
.quest{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:8px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:11px}
.quest.done{border-color:rgba(92,214,138,.45);background:rgba(92,214,138,.08)}
.quest .qi{flex:1;min-width:0}
.quest .qn{font-size:12px;margin-bottom:5px;line-height:1.25}
.quest .qbar{height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.quest .qbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-d),var(--gold));transition:width .3s}
.quest .qr{font-size:12px;color:var(--gold-l);font-weight:bold;white-space:nowrap;display:flex;gap:3px;align-items:center}
.quest .qr svg{width:13px;height:13px}

/* rest */
.rest-timer{font-size:34px;text-align:center;color:var(--gold-l);letter-spacing:2px;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.rest-bar{height:9px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin:10px 0}
.rest-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#b48bff);transition:width .5s linear}

/* playtime */
.ptime-item{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:8px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.ptime-item.ready{border-color:rgba(92,214,138,.5);background:rgba(92,214,138,.1);animation:glowp 1.6s infinite}
@keyframes glowp{0%,100%{box-shadow:0 0 0 rgba(92,214,138,0)}50%{box-shadow:0 0 14px rgba(92,214,138,.4)}}
.ptime-item.done{opacity:.45}
.ptime-item .tl{flex:1;font-size:12px}

/* ad overlay */
#adov{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(3,2,8,.94);backdrop-filter:blur(6px)}
#adov.show{display:flex}
.spinner{width:56px;height:56px;border-radius:50%;border:4px solid rgba(232,194,106,.18);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#adov .adtxt{color:var(--gold-l);font-size:15px;text-align:center;padding:0 30px;line-height:1.5;white-space:pre-line}

/* tutorial */
#tutbox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:430px;z-index:5000;display:none;background:linear-gradient(180deg,#241b3a,#160f26);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.85)}
#tutbox.show{display:block;animation:pop .22s}
#tutbox .tt{font-size:13px;line-height:1.5;margin-bottom:11px;color:var(--text)}
#tutbox .tfoot{display:flex;gap:8px;align-items:center;justify-content:space-between}
#tutbox .dots{display:flex;gap:5px}
#tutbox .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}
#tutbox .dots i.on{background:var(--gold)}
.tut-highlight{position:relative;z-index:4000!important;box-shadow:0 0 0 3px var(--gold),0 0 24px rgba(232,194,106,.7)!important;border-radius:12px!important}

/* result */
.res-big{font-size:26px;text-align:center;margin:4px 0 10px;color:var(--gold-l);letter-spacing:1px}
.res-line{display:flex;justify-content:space-between;padding:7px 4px;font-size:14px;border-bottom:1px dashed rgba(255,255,255,.08)}

/* toast */
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-16px);z-index:9500;background:linear-gradient(180deg,#2c2247,#1a1330);border:1px solid var(--border);border-radius:11px;padding:10px 18px;color:var(--gold-l);font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.7)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* menu grid in main menu modal */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{padding:14px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;font-size:12px;position:relative}
.mbtn:active{transform:scale(.97)}
.mbtn svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mbtn .bn{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--red);display:none;animation:pulse 1.4s infinite}
.mbtn.alert .bn{display:block}

/* resource info small */
.res-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.35);font-size:11px;font-weight:bold;border:1px solid rgba(255,255,255,.08)}
.res-pill svg{width:11px;height:11px}
</style>

/* ========================================================================
   SAVE / LOAD
   ======================================================================== */
let saveTimer = null;
function saveGame(now){
  if(!HAS_VK) return;
  if(now){
    VK.send('VKWebAppStorageSet', {key: SAVE_KEY, value: JSON.stringify(state)}).catch(()=>{});
    return;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    VK.send('VKWebAppStorageSet', {key: SAVE_KEY, value: JSON.stringify(state)}).catch(()=>{});
  }, 1200);
}
async function loadGame(){
  if(!HAS_VK) return null;
  try{
    const r = await VK.send('VKWebAppStorageGet', {keys:[SAVE_KEY]});
    const v = r && r.keys && r.keys[0] && r.keys[0].value;
    if(v) return JSON.parse(v);
  }catch(e){}
  return null;
}

/* ========================================================================
   MUSIC
   ======================================================================== */
const Music = {
  ctx:null, master:null, timer:null, playing:false, pad:null, i:0,
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
  },
  play(){
    this.ensure(); if(!this.ctx) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    this.playing = true;
    const n = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(n);
    this.master.gain.setTargetAtTime(0.12, n, 0.8);
    if(!this.pad) this._startPad();
    if(!this.timer) this.timer = setInterval(()=>this._tick(), 400);
  },
  stop(){
    this.playing = false;
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    if(!this.ctx) return;
    const n = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(n);
    this.master.gain.setTargetAtTime(0, n, 0.25);
  },
  _startPad(){
    const c = this.ctx;
    const g = c.createGain(); g.gain.value = 0.16;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=620; f.Q.value=1.2;
    g.connect(f); f.connect(this.master);
    const freqs = [110, 164.81, 220, 277.18];
    const oscs = freqs.map(fr=>{
      const o = c.createOscillator();
      o.type='sawtooth'; o.frequency.value=fr; o.detune.value=(Math.random()*14-7);
      o.connect(g); o.start();
      return o;
    });
    const lfo = c.createOscillator(); lfo.frequency.value=0.055;
    const lg = c.createGain(); lg.gain.value=260;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    this.pad = {g,f,oscs,lfo};
  },
  _tick(){
    if(!this.playing || !this.ctx) return;
    const scale = [220, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
    const step = [0,2,4,3,5,4,2,0,1,3,5,6];
    const n = scale[step[this.i % step.length] % scale.length];
    this.i++;
    const c = this.ctx, t0 = c.currentTime;
    const o = c.createOscillator(); o.type='triangle'; o.frequency.value = n;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.075, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.35);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 1.45);
  }
};
function refreshMusic(){
  if(state.music && !isPausedBy('hidden') && !isPausedBy('ad')){
    Music.play();
  } else {
    Music.stop();
  }
}

/* ========================================================================
   PAUSE SYSTEM
   ======================================================================== */
const pauseReasons = new Set();
function setPause(r, on){ if(on) pauseReasons.add(r); else pauseReasons.delete(r); refreshMusic(); }
function isPausedBy(r){ return pauseReasons.has(r); }
function anyPause(){ return pauseReasons.size > 0; }
function anyModalOpen(){ return !!document.querySelector('.overlay.show'); }
function syncPause(){ setPause('modal', anyModalOpen()); }

const SPRITES = {};
function loadSprites(){
  return new Promise(resolve=>{
    let left = Object.keys(SVG_SRC).length;
    const done = ()=>{ if(--left<=0) resolve(); };
    Object.keys(SVG_SRC).forEach(k=>{
      const img = new Image();
      img.decoding = 'async';
      img.onload = done;
      img.onerror = done;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_SRC[k]);
      SPRITES[k] = img;
    });
  });
}
function getSprite(key){ return SPRITES[key]; }

/* ========================================================================
   CANVAS SETUP
   ======================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W = 800, H = 500, DPR = 1;

function resizeCanvas(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width);
  H = Math.max(160, r.height);
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  positionBuildings();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas, 220));

/* ========================================================================
   LOBBY (village) VIEW
   ======================================================================== */
let VIEW = 'lobby'; // 'lobby' | 'battle' | 'cave'
const G = {
  active:false, over:true, mode:'battle', level:1,
  units:[], projectiles:[], particles:[], damageNums:[],
  essence:60, essenceMax:120, essenceRegen:10,
  playerBase:{hp:1000,max:1000}, enemyBase:{hp:900,max:900},
  spawnTimer:0, spawnInterval:4, time:0, kills:0, spawned:0,
  shakeT:0, stars:[], uid:1,
  hpBuff:0, dmgBuff:0, essBuff:0
};
function initStars(){
  G.stars = [];
  let seed = 1337;
  const rnd = ()=>{ seed = (seed*16807)%2147483647; return seed/2147483647; };
  for(let i=0;i<70;i++){
    G.stars.push({x:rnd(), y:rnd()*0.42, r:0.4+rnd()*1.4, a:0.25+rnd()*0.6, tw:rnd()*6.28});
  }
}
initStars();

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,'#070510');
  g.addColorStop(0.45,'#151029');
  g.addColorStop(0.78,'#241739');
  g.addColorStop(1,'#33204a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  const now = performance.now()/1000;
  for(const s of G.stars){
    const a = s.a * (0.55 + 0.45*Math.sin(now*0.9 + s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dfe6ff';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const mx = W*0.79, my = H*0.13, mr = Math.min(W,H)*0.05;
  const mg = ctx.createRadialGradient(mx,my,mr*0.3,mx,my,mr*4.2);
  mg.addColorStop(0,'rgba(200,190,255,.30)');
  mg.addColorStop(1,'rgba(200,190,255,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx,my,mr*4.2,0,6.283); ctx.fill();
  ctx.fillStyle = '#e7e2ff';
  ctx.beginPath(); ctx.arc(mx,my,mr,0,6.283); ctx.fill();
  ctx.fillStyle = 'rgba(150,140,200,.35)';
  ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.25,mr*0.22,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.28,my+mr*0.18,mr*0.16,0,6.283); ctx.fill();
  ctx.fillStyle = '#150e24';
  ctx.beginPath();
  ctx.moveTo(0, H*0.44);
  for(let i=0;i<=8;i++){
    const x = W*i/8;
    const y = H*0.44 - Math.sin(i*1.7)*H*0.045 - Math.sin(i*0.6)*H*0.02;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H*0.62); ctx.lineTo(0, H*0.62); ctx.closePath();
  ctx.fill();
}

function drawLobbyScene(){
  drawSky();
  // Ground
  const gy = H*0.42;
  const g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0,'#1a2419');
  g.addColorStop(0.6,'#22301f');
  g.addColorStop(1,'#2c3f28');
  ctx.fillStyle = g;
  ctx.fillRect(0, gy, W, H-gy);
  // Paths (simple dirt roads)
  ctx.strokeStyle = 'rgba(180,150,100,.10)';
  ctx.lineWidth = 26;
  ctx.lineCap = 'round';
  const cx = W*0.5, cy = H*0.55;
  const points = [
    [W*0.5,H*0.15], [W*0.15,H*0.42], [W*0.85,H*0.42],
    [W*0.5,H*0.45], [W*0.15,H*0.75], [W*0.5,H*0.85],
    [W*0.85,H*0.75]
  ];
  points.forEach(p=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(p[0],p[1]);
    ctx.stroke();
  });
  // Decorative trees
  const rnd = (n)=>{ const s=Math.sin(n*99.7)*0.5+0.5; return s; };
  for(let i=0;i<14;i++){
    const tx = rnd(i*1.3)*W;
    const ty = gy + rnd(i*2.1)*(H-gy)*0.9;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(tx,ty,10,3,0,0,6.283); ctx.fill();
    ctx.fillStyle = '#1c3318';
    ctx.beginPath();
    ctx.moveTo(tx-8, ty);
    ctx.lineTo(tx, ty-22);
    ctx.lineTo(tx+8, ty);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2a4a1f';
    ctx.beginPath();
    ctx.moveTo(tx-6, ty-8);
    ctx.lineTo(tx, ty-24);
    ctx.lineTo(tx+6, ty-8);
    ctx.closePath();
    ctx.fill();
  }
  // Fireflies
  const now = performance.now()/1000;
  for(let i=0;i<12;i++){
    const fx = ((Math.sin(now*0.3 + i*1.7)*0.5+0.5)*0.7 + 0.15) * W;
    const fy = ((Math.cos(now*0.4 + i*2.3)*0.5+0.5)*0.5 + 0.35) * H;
    ctx.globalAlpha = 0.4 + 0.4*Math.sin(now*2 + i);
    ctx.fillStyle = '#a8e8a8';
    ctx.beginPath(); ctx.arc(fx, fy, 1.5, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

    const name = LANG === 'ru' ? cfg.ru : cfg.en;
    const btn = document.createElement('button');
    btn.className = 'bld';
    if(lvl === 0 && key !== 'castle') btn.classList.add('unbuilt');
    if(!building && key !== 'castle' && !data) btn.classList.add('unbuilt');
    btn.dataset.bld = key;
    btn.innerHTML = `
      <div class="bicon">
        <img src="${img.src}" alt="">
        ${lvl>0 ? `<div class="badge">${lvl}</div>` : ''}
        <div class="ready"></div>
        <div class="timer"></div>
      </div>
      <div class="bname">${name}</div>
    `;
    btn.addEventListener('click', ()=> openBuildingModal(key));
    cont.appendChild(btn);
  });
  positionBuildings();
  updateBuildingIndicators();
}

function updateBuildingIndicators(){
  const cont = document.getElementById('lobby-buildings');
  if(!cont) return;
  Object.keys(BLD_POS).forEach(key=>{
    const btn = cont.querySelector(`[data-bld="${key}"]`);
    if(!btn) return;
    const data = state.buildings[key];
    const lvl = data ? data.level : 0;
    const building = data && data.buildEnd > Date.now();
    const cfg = BUILDINGS[key];

    const timerEl = btn.querySelector('.timer');
    const readyEl = btn.querySelector('.ready');

    if(building){
      timerEl.classList.add('show');
      const left = Math.max(0, Math.floor((data.buildEnd - Date.now())/1000));
      timerEl.textContent = fmtTime(left);
      readyEl.classList.remove('show');
    } else if(cfg.resource && lvl > 0){
      timerEl.classList.remove('show');
      // ready if stored >= cap
      const prod = getProduction(key);
      if(prod.stored >= prod.cap - 0.5) readyEl.classList.add('show');
      else readyEl.classList.remove('show');
    } else {
      timerEl.classList.remove('show');
      readyEl.classList.remove('show');
    }
  });
}

/* ========================================================================
   PRODUCTION
   ======================================================================== */
function getProduction(key){
  const cfg = BUILDINGS[key];
  if(!cfg || !cfg.resource) return {stored:0, cap:0, rate:0};
  const data = state.buildings[key];
  const lvl = data ? data.level : 0;
  if(lvl === 0) return {stored:0, cap:0, rate:0};
  const now = Date.now();
  const last = state.prod[key] || now;
  const hours = Math.max(0, (now - last)/3600000);
  const rate = cfg.rate(lvl);
  const cap = cfg.cap(lvl);
  const stored = Math.min(cap, rate * hours);
  return {stored, cap, rate};
}

function collectProduction(key){
  const cfg = BUILDINGS[key];
  if(!cfg || !cfg.resource) return;
  const data = state.buildings[key];
  if(!data || data.level === 0) return;
  const prod = getProduction(key);
  const amount = Math.floor(prod.stored);
  if(amount <= 0) return;
  state[cfg.resource] = (state[cfg.resource] || 0) + amount;
  state.prod[key] = Date.now();
  refreshAllUI();
  toast('+' + amount + ' ' + t(cfg.resource));
  saveGame();
}

/* ========================================================================
   HELPERS
   ======================================================================== */
function fmtTime(sec){
  if(sec <= 0) return LANG==='ru'?'0с':'0s';
  const d = Math.floor(sec/86400);
  const h = Math.floor((sec%86400)/3600);
  const m = Math.floor((sec%3600)/60);
  const s = Math.floor(sec%60);
  const parts = [];
  if(d) parts.push(d + (LANG==='ru'?'д':'d'));
  if(h) parts.push(h + (LANG==='ru'?'ч':'h'));
  if(m && !d) parts.push(m + (LANG==='ru'?'м':'m'));
  if(!d && !h && s && !m) parts.push(s + (LANG==='ru'?'с':'s'));
  return parts.join(' ') || (LANG==='ru'?'0с':'0s');
}

function fmtNum(n){
  n = Math.floor(n);
  if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if(n >= 10000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}

function resName(r){ return RES[r] ? (RES[r][LANG] || RES[r].ru) : r; }
function resColor(r){ return RES[r] ? RES[r].color : '#fff'; }
function resIcon(r){ return RES[r] ? RES[r].icon : ''; }

function canAfford(cost){
  for(const k in cost){
    if((state[k]||0) < cost[k]) return false;
  }
  return true;
}
function spendCost(cost){
  for(const k in cost){
    state[k] = (state[k]||0) - cost[k];
  }
}

function addResource(k, n){
  state[k] = (state[k]||0) + n;
}
function addGold(n){ addResource('gold', n); state.goldEarned = (state.goldEarned||0)+n; }

function showCostHTML(cost){
  let html = '<div class="costrow">';
  for(const k in cost){
    const have = state[k]||0;
    const need = cost[k];
    const cls = have >= need ? 'ok' : 'miss';
    html += `<span class="costitem ${cls}"><svg viewBox="0 0 24 24"><path d="${resIcon(k)}"/></svg>${need}</span>`;
  }
  html += '</div>';
  return html;
}

   BUILDING MODAL
   ======================================================================== */
let currentBuildingKey = null;

function openBuildingModal(key){
  if(VIEW !== 'lobby') return;
  currentBuildingKey = key;
  renderBuildingModal();
  openOverlay('ov-building');
}

function renderBuildingModal(){
  const key = currentBuildingKey;
  if(!key) return;
  const cfg = BUILDINGS[key];
  const data = state.buildings[key];
  const lvl = data ? data.level : 0;
  const name = LANG === 'ru' ? cfg.ru : cfg.en;
  document.getElementById('bld-title').textContent = name;

  const body = document.getElementById('bld-body');
  const img = getSprite(cfg.icon);

  const desc = LANG === 'ru' ? cfg.desc_ru : cfg.desc_en;

  let html = `
    <div class="binfo">
      <img src="${img.src}" alt="">
      <div class="bl">
        <div class="bnm">${name}</div>
        <div class="blv">${t('level')} ${lvl} / ${cfg.maxLevel}</div>
        <div class="bdesc">${desc}</div>
      </div>
    </div>
  `;

  const building = data && data.buildEnd > Date.now();
  const nextLvl = lvl + 1;

  if(building){
    const left = Math.max(0, Math.floor((data.buildEnd - Date.now())/1000));
    const total = data.buildStart ? Math.max(1, data.buildEnd - data.buildStart) : 1;
    const pct = 100 * (1 - left*1000/total);
    html += `<div class="center muted" style="margin-bottom:6px">${t('building')}… ${fmtTime(left)}</div>`;
    html += `<div class="progress"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;
  } else if(lvl >= cfg.maxLevel){
    html += `<div class="center muted" style="margin:10px 0">${t('level_max')}</div>`;
  } else {
    // Check requirements
    let reqOK = true;
    let reqMsg = '';
    if(cfg.req){
      const reqLvl = cfg.reqLv(nextLvl);
      const have = (state.buildings[cfg.req]||{}).level || 0;
      if(have < reqLvl){ reqOK = false; reqMsg = `${t('req_castle')} ${reqLvl}`; }
    }

    const cost = cfg.cost(nextLvl);
    const time = cfg.time(nextLvl);
    const ok = canAfford(cost) && reqOK;

    html += `<div style="margin-top:6px;font-size:12px;color:var(--muted)">${LANG==='ru'?'Стоимость:':'Cost:'}</div>`;
    html += showCostHTML(cost);
    html += `<div class="center muted" style="margin:6px 0">${LANG==='ru'?'Время:':'Time:'} ${fmtTime(time)}</div>`;
    if(!reqOK) html += `<div class="center" style="color:#ff8b8b;font-size:12px;margin:6px 0">${reqMsg}</div>`;
    if(cfg.resource){
      const prod = getProduction(key);
      const newRate = cfg.rate(nextLvl);
      const newCap = cfg.cap(nextLvl);
      html += `<div class="muted" style="margin:8px 0">${t('production')}: +${newRate}/ч → ${t('storage')} ${newCap}</div>`;
    }
    html += `<button class="btn green full" id="bld-action" ${ok?'':'disabled'} data-act="${lvl>0?'upgrade':'build'}">${lvl>0?t('upgrade'):t('build')}</button>`;
  }

  // collect button
  if(cfg.resource && lvl > 0){
    const prod = getProduction(key);
    const stored = Math.floor(prod.stored);
    html += `<div class="row" style="margin-top:10px">
      <div>
        <div class="lab">${t('storage')}: <b style="color:${resColor(cfg.resource)}">${stored}</b> / ${prod.cap}</div>
        <div class="sub">+${prod.rate}/ч</div>
      </div>
      <button class="btn ${stored>0?'green':''}" id="bld-collect" ${stored>0?'':'disabled'}>${t('collect')}</button>
    </div>`;
  }

  // special actions
  if(key === 'barracks' && lvl > 0){
    html += `<button class="btn full" id="bld-units">${t('units')} →</button>`;
  }
  if(key === 'lab' && lvl > 0){
    html += `<button class="btn full" id="bld-lab">${t('lab')} →</button>`;
  }
  if(key === 'auction' && lvl > 0){
    html += `<button class="btn full" id="bld-auction">${t('auction')} →</button>`;
  }
  if(key === 'cave' && lvl > 0){
    html += `<button class="btn full" id="bld-cave">${t('cave')} →</button>`;
  }

  body.innerHTML = html;

  const actionBtn = body.querySelector('#bld-action');
  if(actionBtn){
    actionBtn.addEventListener('click', ()=>{
      if(building) return;
      if(!canAfford(cfg.cost(nextLvl))) { toast(t('no_gold')); return; }
      if(cfg.req){
        const reqLvl = cfg.reqLv(nextLvl);
        const have = (state.buildings[cfg.req]||{}).level || 0;
        if(have < reqLvl){ toast(LANG==='ru'?`Требуется ${cfg.req} ур. ${reqLvl}`:`Requires ${cfg.req} lvl ${reqLvl}`); return; }
      }
      spendCost(cfg.cost(nextLvl));
      if(!state.buildings[key]) state.buildings[key] = {level:lvl, buildEnd:0};
      state.buildings[key].level = nextLvl;
      state.buildings[key].buildEnd = Date.now() + cfg.time(nextLvl)*1000;
      state.buildings[key].buildStart = Date.now();
      if(cfg.resource) state.prod[key] = Date.now();
      refreshAllUI();
      renderBuildingModal();
      saveGame();
    });
  }

  const collectBtn = body.querySelector('#bld-collect');
  if(collectBtn){
    collectBtn.addEventListener('click', ()=>{
      collectProduction(key);
      renderBuildingModal();
    });
  }
  const btnUnits = body.querySelector('#bld-units');
  if(btnUnits) btnUnits.addEventListener('click', ()=>{ closeOverlay(document.getElementById('ov-building')); openUnitsModal(); });
  const btnLab = body.querySelector('#bld-lab');
  if(btnLab) btnLab.addEventListener('click', ()=>{ closeOverlay(document.getElementById('ov-building')); openLabModal(); });
  const btnAuc = body.querySelector('#bld-auction');
  if(btnAuc) btnAuc.addEventListener('click', ()=>{ closeOverlay(document.getElementById('ov-building')); openAuctionModal(); });
  const btnCave = body.querySelector('#bld-cave');
  if(btnCave) btnCave.addEventListener('click', ()=>{ closeOverlay(document.getElementById('ov-building')); openCaveModal(); });
}

    const img = getSprite(d.img);

    let st = '';
    if(owned) st = `<span style="color:var(--green);font-size:10px">${t('owned')}</span>`;

      ${st}
      ${canBuy ? `<button class="btn ubuy" data-buy="${key}">${t('buy')}</button>` : ''}
    </div>`;

      state.gold -= d.buyPrice;
      state.unitsOwned[key] = true;
      refreshAllUI();
      renderUnitsModal();
      saveGame();
      toast('+ ' + (LANG==='ru'?d.ru:d.en));
    });
  });
}

function openAuctionModal(){

function auctionSlotLimit(){
  const lvl = state.buildings.auction ? state.buildings.auction.level : 0;
  return 1 + lvl; // level 1: 2 slots
}
function renderAuctionModal(){
  const resSel = document.getElementById('auc-res');
  resSel.innerHTML = '';
  ['wheat','wood','stone'].forEach(k=>{
    if((state[k]||0) > 0 || resSel.children.length === 0){
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = resName(k) + ' (' + (state[k]||0) + ')';
      resSel.appendChild(opt);
    }
  });
  // list
  const listEl = document.getElementById('auction-list');
  const slots = auctionSlotLimit();
  let html = `<div class="muted" style="margin-bottom:6px">${LANG==='ru'?'Слоты':'Slots'}: ${state.auction.length}/${slots}</div>`;
  if(state.auction.length === 0){
    html += `<div class="muted center" style="padding:14px">${LANG==='ru'?'Нет активных лотов':'No active listings'}</div>`;
  } else {
    state.auction.forEach(a=>{
      const base = BASE_PRICES[a.resource] || 1;
      const mult = a.price / base;
      const chance = Math.min(0.8, Math.max(0.02, 0.4 / mult));
      const age = Math.floor((Date.now() - a.createdAt)/60000);
      html += `<div class="acard">
        <div class="arow">
          <div class="anm">${resName(a.resource)} x${a.amount}</div>
          <div class="aprice">${a.price} ${t('gold')}/${LANG==='ru'?'ед.':'u'}</div>
        </div>
        <div class="achance">${t('chance')}: ${Math.round(chance*100)}% · ${LANG==='ru'?'выставлено':'listed'} ${age} ${LANG==='ru'?'м':'m'} назад</div>
        <div class="abtns">
          <button class="btn red" data-cancel="${a.id}">${t('cancel')}</button>
        </div>
      </div>`;
    });
  }
  listEl.innerHTML = html;
  listEl.querySelectorAll('[data-cancel]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = parseInt(b.getAttribute('data-cancel'),10);
      const idx = state.auction.findIndex(a=>a.id===id);
      if(idx>=0){
        const a = state.auction[idx];
        state[a.resource] = (state[a.resource]||0) + a.amount;
        state.auction.splice(idx,1);
        refreshAllUI();
        renderAuctionModal();
        saveGame();
      }
    });
  });
}
document.getElementById('auc-add').addEventListener('click', ()=>{
  const res = document.getElementById('auc-res').value;
  const amt = parseInt(document.getElementById('auc-amt').value,10);
  const price = parseInt(document.getElementById('auc-price').value,10);
  const hint = document.getElementById('auc-hint');
  if(!res || !amt || !price || amt <= 0 || price <= 0){ hint.textContent = LANG==='ru'?'Заполните поля':'Fill fields'; return; }
  if((state[res]||0) < amt){ hint.textContent = LANG==='ru'?'Недостаточно ресурса':'Not enough resource'; return; }
  if(state.auction.length >= auctionSlotLimit()){ hint.textContent = LANG==='ru'?'Все слоты заняты':'All slots busy'; return; }
  const base = BASE_PRICES[res] || 1;
  const mult = price / base;
  if(mult > 5){ hint.textContent = LANG==='ru'?'Слишком высокая цена':'Price too high'; return; }
  state[res] -= amt;
  state.auction.push({
    id: state.auctionSeq++,
    resource: res,
    amount: amt,
    price,
    createdAt: Date.now()
  });
  document.getElementById('auc-amt').value = '';
  document.getElementById('auc-price').value = '';
  hint.textContent = '';
  refreshAllUI();
  renderAuctionModal();
  saveGame();
});

/* process auction sales every minute */
setInterval(()=>{
  if(!state.auction || !state.auction.length) return;
  let changed = false;
  for(let i=state.auction.length-1;i>=0;i--){
    const a = state.auction[i];
    const base = BASE_PRICES[a.resource] || 1;
    const mult = a.price / base;
    const chance = Math.min(0.8, Math.max(0.02, 0.4 / mult));
    if(Math.random() < chance){
      const total = a.price * a.amount;
      state.gold = (state.gold||0) + total;
      state.goldEarned = (state.goldEarned||0) + total;
      state.auction.splice(i,1);
      changed = true;
      toast('+' + total + ' ' + t('gold'));
    }
  }
  if(changed){
    refreshAllUI();
    if(document.getElementById('ov-auction').classList.contains('show')) renderAuctionModal();
    saveGame();
  }
}, 60000);

  {id:'q_min10',type:'minutes',target:10,reward:110},
  {id:'q_min25',type:'minutes',target:25,reward:280},
  {id:'q_knight5',type:'knights',target:5,reward:160},
  {id:'q_arch15',type:'archers',target:15,reward:170},

  {id:'q_cave1',type:'caveWins',target:1,reward:250},
  {id:'q_auc1',type:'auctionSales',target:1,reward:180}
];
const QUEST_BY_ID = {};
QUEST_POOL.forEach(q=>QUEST_BY_ID[q.id]=q);

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function seededShuffle(arr, seed){
  let s = Math.abs(seed) % 2147483647 || 1;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    s = (s*1103515245 + 12345) & 0x7fffffff;
    const j = s % (i+1);
    const tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function ensureDailyQuests(){
  const today = todayStr();
  if(state.questDate === today && state.questList.length) return;
  let seed = 0;
  for(let i=0;i<today.length;i++) seed = seed*31 + today.charCodeAt(i);
  const picked = seededShuffle(QUEST_POOL, seed).slice(0,10);
  state.questDate = today;
  state.questList = picked.map(q=>q.id);
  state.quests = {};
  state.questClaimed = {};
  state.questList.forEach(id=>state.quests[id] = 0);
  saveGame();
}
function questProgress(type, n){
  if(!state.questList || !state.questList.length) return;
  let changed = false;
  for(const id of state.questList){
    const def = QUEST_BY_ID[id];
    if(!def) continue;
    if(def.type === type){
      state.quests[id] = (state.quests[id] || 0) + n;
      changed = true;
    }
  }
  if(changed){
    if(document.getElementById('ov-quests').classList.contains('show')) renderQuests();
    updateAlertDots();
    saveGame();
  }
}
function questReady(id){
  const def = QUEST_BY_ID[id];
  if(!def) return false;
  return (state.quests[id]||0) >= def.target && !state.questClaimed[id];
}
function questName(def){
  const names = {
    wins:{ru:'Победить в битвах',en:'Win battles'},
    spawns:{ru:'Призвать воинов',en:'Summon warriors'},
    kills:{ru:'Победить врагов',en:'Defeat enemies'},
    gold:{ru:'Заработать золота',en:'Earn gold'},
    mages:{ru:'Призвать магов',en:'Summon mages'},
    minutes:{ru:'Провести в игре минут',en:'Spend minutes in game'},
    knights:{ru:'Призвать рыцарей',en:'Summon knights'},
    archers:{ru:'Призвать лучников',en:'Summon archers'},
    builds:{ru:'Построить зданий',en:'Construct buildings'},
    caveWins:{ru:'Победить в пещере',en:'Win in cave'},
    auctionSales:{ru:'Продать на аукционе',en:'Sell on auction'}
  };
  const n = names[def.type];
  return n ? (n[LANG] || n.ru) : def.type;
}
function renderQuests(){
  const box = document.getElementById('quest-list');
  if(!box) return;
  if(!state.questList.length){ box.innerHTML = `<div class="muted center">${LANG==='ru'?'Задания обновятся завтра':'Quests will refresh tomorrow'}</div>`; return; }
  let html = '';
  for(const id of state.questList){
    const def = QUEST_BY_ID[id];
    if(!def) continue;
    const cur = Math.min(state.quests[id]||0, def.target);
    const done = questReady(id);
    const claimed = !!state.questClaimed[id];
    const pct = Math.min(100, (cur/def.target)*100);
    html += `<div class="quest ${done?'done':''}">
      <div class="qi">
        <div class="qn">${questName(def)} — ${cur}/${def.target}</div>
        <div class="qbar"><i style="width:${pct}%"></i></div>
      </div>
      <div class="qr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" fill="rgba(232,194,106,.16)"/><path d="M12 7v10"/></svg>${def.reward}</div>
      ${done ? `<button class="btn" data-claim="${id}" style="padding:6px 10px;font-size:12px">${t('quest_claim')}</button>` : (claimed ? `<span class="muted" style="font-size:11px">${t('quest_done')}</span>` : '')}
    </div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('[data-claim]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-claim');
      if(questReady(id)){
        state.questClaimed[id] = true;
        addGold(QUEST_BY_ID[id].reward);
        toast('+' + QUEST_BY_ID[id].reward + ' ' + t('gold'));
        renderQuests();
        updateAlertDots();
        refreshAllUI();
        saveGame();
      }
    });
  });
}

/* ========================================================================
   BATTLE ENGINE
   ======================================================================== */
const LANES = [0.22, 0.5, 0.78];
const PLAYER_BASE_U = 0.045;
const ENEMY_BASE_U  = 0.955;

function project(u, lane){
  const s = 0.50 + 0.44 * lane;
  const x = W * 0.5 + (u - 0.5) * W * s;
  const y = H * 0.32 + lane * H * 0.48;
  return {x, y, s};
}

function levelCfg(lv){
  return {
    enemyBaseHp: 700 + lv*240,
    playerBaseHp: 950 + lv*60,
    spawnInterval: Math.max(1.25, 4.3 - lv*0.22)
  };
}
function caveCfg(lv){
  return {
    enemyBaseHp: 900 + lv*400,
    playerBaseHp: 900 + lv*100,
    spawnInterval: Math.max(1.0, 3.0 - lv*0.15)
  };
}

function makeUnit(type, side, lane, u){
  const d = UNIT_DEFS[type];
  const hpScale = side==='enemy' ? (1 + (G.level-1)*0.16) : (1 + (G.level-1)*0.05 + (G.hpBuff||0));
  const dmgScale = side==='enemy' ? (1 + (G.level-1)*0.13) : (1 + (G.level-1)*0.04 + (G.dmgBuff||0));
  return {
    id: G.uid++, type, side, lane, u,
    hp: d.hp*hpScale, maxHp: d.hp*hpScale,
    dmg: d.dmg*dmgScale, range: d.range, speed: d.speed, atk: d.atk,
    cd: Math.random()*0.4, bob: Math.random()*6.28, hitFlash: 0,
    heal: d.heal ? d.heal*0.9 : 0,
    atkAnim: 0, hitAnim: 0, hitDir: 1
  };
}

function spawnUnit(type, side, lane){
  const d = UNIT_DEFS[type];
  const u = side === 'player' ? PLAYER_BASE_U + 0.03 : ENEMY_BASE_U - 0.03;
  const unit = makeUnit(type, side, lane, u);
  G.units.push(unit);
  if(side === 'player'){
    G.spawned++;
    questProgress('spawns', 1);
    if(type==='mage') questProgress('mages',1);
    if(type==='knight') questProgress('knights',1);
    if(type==='archer') questProgress('archers',1);
    state.spawns = (state.spawns||0) + 1;
  }
  return unit;
}

function damageUnit(target, amount, byPlayer){
  if(target.hp <= 0) return;
  target.hp -= amount;
  target.hitFlash = 0.18;
  target.hitAnim = 0.2;
  target.hitDir = byPlayer ? 1 : -1;
  addDamageNumber(target.u, target.lane, Math.round(amount));
  if(target.hp <= 0){
    target.hp = 0;
    burst(target.u, target.lane, byPlayer ? '#7b5cff' : '#ff5f6d', 8);
    if(byPlayer){
      G.kills++;
      state.kills = (state.kills||0) + 1;
      questProgress('kills', 1);
    }
  }
}

function addDamageNumber(u, lane, dmg){
  const p = project(u, lane);
  G.damageNums.push({
    x: p.x + (Math.random()-0.5)*16,
    y: p.y - 60*p.s,
    vy: -60 - Math.random()*30,
    life: 0.9,
    max: 0.9,
    text: String(dmg),
    color: '#ffdb6b'
  });
}

function burst(u, lane, color, n){
  const p = project(u, lane);
  for(let i=0;i<n;i++){
    const a = Math.random()*6.28, sp = 18 + Math.random()*60;
    G.particles.push({
      x:p.x, y:p.y - 22*p.s,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
      life:0.55 + Math.random()*0.35, max:0.9,
      color, r: 1.6 + Math.random()*2.2, s:p.s
    });
  }
}

function updateGame(dt){
  G.time += dt;
  G.essence = Math.min(G.essenceMax, G.essence + G.essenceRegen*dt*(1+(G.essBuff||0)));

  G.spawnTimer -= dt;
  if(G.spawnTimer <= 0){
    G.spawnTimer = G.spawnInterval * (0.8 + Math.random()*0.45);
    let pool = ['sword','sword','archer'];
    if(G.level >= 2) pool.push('archer','mage');
    if(G.level >= 3) pool.push('knight','heal');
    if(G.level >= 5) pool.push('knight','mage','heal');
    const type = pool[Math.floor(Math.random()*pool.length)];
    spawnUnit(type, 'enemy', LANES[Math.floor(Math.random()*LANES.length)]);
  }

  const list = G.units;
  for(let i=0;i<list.length;i++){
    const u = list[i];
    if(u.hp <= 0) continue;
    u.bob += dt*7;
    if(u.hitFlash > 0) u.hitFlash -= dt;
    if(u.hitAnim > 0) u.hitAnim -= dt;
    if(u.atkAnim > 0) u.atkAnim -= dt;
    u.cd -= dt;

    const dir = u.side === 'player' ? 1 : -1;

    if(UNIT_DEFS[u.type].heal){
      let ally = null, worst = 1;
      for(let j=0;j<list.length;j++){
        const o = list[j];
        if(o === u || o.side !== u.side || o.hp <= 0) continue;
        if(o.lane !== u.lane) continue;
        const dist = Math.abs(o.u - u.u);
        if(dist > u.range) continue;
        const ratio = o.hp / o.maxHp;
        if(ratio < worst){ worst = ratio; ally = o; }
      }
      if(ally){
        if(u.cd <= 0){
          u.cd = u.atk;
          u.atkAnim = 0.3;
          const before = ally.hp;
          ally.hp = Math.min(ally.maxHp, ally.hp + u.heal);
          if(ally.hp > before) burst(ally.u, ally.lane, '#8ef0b0', 5);
          G.projectiles.push({x1:u.u,y1:u.lane,x2:ally.u,y2:ally.lane,t:0,dur:0.22,color:'#8ef0b0'});
        }
        continue;
      }
    }

    let target = null, bestD = 1e9;
    for(let j=0;j<list.length;j++){
      const o = list[j];
      if(o.side === u.side || o.hp <= 0 || o.lane !== u.lane) continue;
      const d = (o.u - u.u) * dir;
      if(d > -0.015 && d < bestD){ bestD = d; target = o; }
    }

    const enemyBaseU = dir > 0 ? ENEMY_BASE_U : PLAYER_BASE_U;
    const distToBase = Math.abs(enemyBaseU - u.u);

    if(target && bestD <= u.range){
      if(u.cd <= 0 && u.dmg > 0){
        u.cd = u.atk;
        u.atkAnim = 0.3;
        attackUnit(u, target);
      }
    } else if(distToBase <= u.range + 0.025){
      if(u.cd <= 0 && u.dmg > 0){
        u.cd = u.atk;
        u.atkAnim = 0.3;
        attackBase(u);
      }
    } else {
      u.u += dir * u.speed * dt;
      u.u = Math.max(0.01, Math.min(0.99, u.u));
    }
  }

  for(let i=G.units.length-1;i>=0;i--){
    if(G.units[i].hp <= 0) G.units.splice(i,1);
  }

  for(let i=G.projectiles.length-1;i>=0;i--){
    const p = G.projectiles[i];
    p.t += dt;
    if(p.t >= p.dur) G.projectiles.splice(i,1);
  }

  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt;
    if(p.life <= 0){ G.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 190*dt;
  }

  for(let i=G.damageNums.length-1;i>=0;i--){
    const d = G.damageNums[i];
    d.life -= dt;
    if(d.life <= 0){ G.damageNums.splice(i,1); continue; }
    d.y += d.vy*dt;
    d.vy += 30*dt;
  }

  if(G.shakeT > 0) G.shakeT -= dt;

  if(G.enemyBase.hp <= 0 && !G.over) endLevel(true);
  else if(G.playerBase.hp <= 0 && !G.over) endLevel(false);

  updateBattleHud();
}

function attackUnit(u, target){
  if(UNIT_DEFS[u.type].ranged){
    G.projectiles.push({x1:u.u,y1:u.lane,x2:target.u,y2:target.lane,t:0,dur:0.2,color:UNIT_DEFS[u.type].proj||'#fff'});
    if(UNIT_DEFS[u.type].aoe){
      const aoe = UNIT_DEFS[u.type].aoe;
      for(const o of G.units){
        if(o.side === u.side || o.hp <= 0) continue;
        if(Math.abs(o.u - target.u) <= aoe && Math.abs(o.lane - target.lane) < 0.01){
          damageUnit(o, u.dmg, u.side === 'player');
        }
      }
      burst(target.u, target.lane, '#b48bff', 10);
    } else {
      damageUnit(target, u.dmg, u.side === 'player');
    }
  } else {
    damageUnit(target, u.dmg, u.side === 'player');
    burst(target.u, target.lane, u.side === 'player' ? '#9fc7ff' : '#ff9f9f', 3);
  }
}
function attackBase(u){
  const dmg = u.dmg;
  if(u.side === 'player'){
    G.enemyBase.hp = Math.max(0, G.enemyBase.hp - dmg);
    G.shakeT = 0.18;
    burst(ENEMY_BASE_U, u.lane, '#ffcf6b', 5);
  } else {
    G.playerBase.hp = Math.max(0, G.playerBase.hp - dmg);
    G.shakeT = 0.18;
    burst(PLAYER_BASE_U, u.lane, '#ff5f6d', 5);
  }
  if(UNIT_DEFS[u.type].ranged){
    G.projectiles.push({
      x1:u.u,y1:u.lane,
      x2: u.side === 'player' ? ENEMY_BASE_U : PLAYER_BASE_U,
      y2: 0.5, t:0, dur:0.2,
      color: UNIT_DEFS[u.type].proj || '#fff'
    });
  }
}

/* ========================================================================
   RENDERING
   ======================================================================== */
function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function drawGround(){
  const a = project(0,0), b = project(1,0), c = project(1,1), d = project(0,1);
  const isCave = G.mode === 'cave';
  const g = ctx.createLinearGradient(0,a.y,0,d.y);
  if(isCave){
    g.addColorStop(0,'#181022');
    g.addColorStop(0.55,'#211830');
    g.addColorStop(1,'#2a1f3d');
  } else {
    g.addColorStop(0,'#1a2419');
    g.addColorStop(0.55,'#22301f');
    g.addColorStop(1,'#2c3f28');
  }
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();

  ctx.save();
  ctx.clip();
  ctx.strokeStyle = isCave ? 'rgba(180,140,255,.10)' : 'rgba(150,210,160,.10)';
  ctx.lineWidth = 1;
  for(let i=0;i<=12;i++){
    const p1 = project(i/12,0), p2 = project(i/12,1);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
  for(let i=0;i<=6;i++){
    const p1 = project(0,i/6), p2 = project(1,i/6);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
  const m1 = project(0.5,0), m2 = project(0.5,1);
  ctx.strokeStyle = 'rgba(232,194,106,.14)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(m1.x,m1.y); ctx.lineTo(m2.x,m2.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.strokeStyle = isCave ? 'rgba(200,160,255,.14)' : 'rgba(160,220,170,.14)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
  ctx.closePath(); ctx.stroke();
}

function drawBase(side){
  const isPlayer = side === 'player';
  const u = isPlayer ? PLAYER_BASE_U : ENEMY_BASE_U;
  const p = project(u, 0.5);
  const isCave = G.mode === 'cave';
  let key;
  if(isCave){
    key = isPlayer ? 'castle' : 'altardark';
  } else {
    key = isPlayer ? 'castle' : 'darktower';
  }
  const img = getSprite(key);
  const h = 178 * p.s;
  const w = h * (140/200);

  const gg = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, w*0.85);
  gg.addColorStop(0, isPlayer ? 'rgba(120,170,255,.30)' : (isCave ? 'rgba(180,80,255,.28)' : 'rgba(255,60,90,.28)'));
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, w*0.85, w*0.36, 0, 0, 6.283); ctx.fill();

  if(img && img.complete && img.naturalWidth){
    ctx.drawImage(img, p.x - w/2, p.y - h, w, h);
  }

  const hp = isPlayer ? G.playerBase.hp/G.playerBase.max : G.enemyBase.hp/G.enemyBase.max;
  const bw = w * 0.88, bh = 7;
  const bx = p.x - bw/2, by = p.y - h - 16;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  roundRect(ctx, bx-1, by-1, bw+2, bh+2, 4); ctx.fill();
  ctx.fillStyle = isPlayer ? '#4d9dff' : (isCave ? '#b46bff' : '#ff4d5e');
  roundRect(ctx, bx, by, bw*Math.max(0,hp), bh, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 1;
  roundRect(ctx, bx, by, bw, bh, 3); ctx.stroke();
}

function drawUnit(u){
  const p = project(u.u, u.lane);
  const def = UNIT_DEFS[u.type];
  const img = getSprite(def.img);
  const hh = 70 * p.s;
  const ww = hh * (64/84);

  // attack lunge
  let lungeX = 0, lungeY = 0, rot = 0;
  if(u.atkAnim > 0){
    const k = u.atkAnim / 0.3;
    const sign = u.side === 'player' ? 1 : -1;
    const lunge = Math.sin((1-k)*Math.PI) * 8;
    lungeX = sign * lunge;
    rot = sign * Math.sin((1-k)*Math.PI) * 0.14;
  }
  // hit recoil
  if(u.hitAnim > 0){
    const k = u.hitAnim / 0.2;
    lungeX -= u.hitDir * Math.sin(k*Math.PI) * 6;
  }

  // shadow
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = u.side === 'player' ? '#4fa8ff' : (G.mode==='cave' ? '#b46bff' : '#ff5a5a');
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, ww*0.40, ww*0.15, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();

  if(img && img.complete && img.naturalWidth){
    const bob = Math.sin(u.bob)*1.8*p.s;
    ctx.save();
    ctx.translate(p.x + lungeX, p.y + lungeY);
    if(u.side === 'enemy'){
      ctx.scale(-1,1);
      ctx.filter = G.mode==='cave' ? 'saturate(0.7) brightness(0.85) hue-rotate(-30deg)' : 'saturate(0.55) brightness(0.85) hue-rotate(-25deg)';
    }
    if(rot) ctx.rotate(rot);
    ctx.drawImage(img, -ww/2, -hh + bob, ww, hh);
    ctx.restore();

    if(u.hitFlash > 0){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = u.hitFlash * 3;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - hh*0.5, ww*0.4, hh*0.45, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
  } else {
    ctx.fillStyle = u.side === 'player' ? '#4fa8ff' : '#ff5a5a';
    ctx.fillRect(p.x - ww*0.25, p.y - hh, ww*0.5, hh);
  }

  if(u.hp < u.maxHp){
    const bw = ww*0.86, bh = 3.6;
    const bx = p.x - bw/2, by = p.y - hh - 9;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    roundRect(ctx, bx-0.6, by-0.6, bw+1.2, bh+1.2, 2.2); ctx.fill();
    ctx.fillStyle = u.side === 'player' ? '#54e08a' : '#ff6b6b';
    roundRect(ctx, bx, by, bw*Math.max(0,u.hp/u.maxHp), bh, 1.8); ctx.fill();
  }
}

function drawProjectiles(){
  for(const pr of G.projectiles){
    const k = Math.min(1, pr.t/pr.dur);
    const p1 = project(pr.x1, pr.y1);
    const p2 = project(pr.x2, pr.y2);
    const x = p1.x + (p2.x-p1.x)*k;
    const y = p1.y + (p2.y-p1.y)*k - Math.sin(k*Math.PI)*34*p1.s;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x,y,0,x,y,13);
    g.addColorStop(0, pr.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,13,0,6.283); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x,y,2.2,0,6.283); ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of G.particles){
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a*0.9) * p.s, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawDamageNums(){
  for(const d of G.damageNums){
    const a = Math.max(0, d.life / d.max);
    ctx.globalAlpha = a;
    ctx.font = 'bold 14px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,.85)';
    ctx.lineWidth = 3;
    ctx.strokeText(d.text, d.x, d.y);
    ctx.fillStyle = d.color;
    ctx.fillText(d.text, d.x, d.y);
  }
  ctx.globalAlpha = 1;
}

function renderBattle(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.shakeT > 0){
    const m = G.shakeT * 14;
    ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m);
  }
  if(G.mode === 'cave'){
    // cave ambience
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#080512');
    g.addColorStop(0.5,'#150a20');
    g.addColorStop(1,'#1d0f2a');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    // crystals on walls
    const now = performance.now()/1000;
    for(let i=0;i<14;i++){
      const cx = (Math.sin(i*13.7)*0.5+0.5) * W;
      const cy = ((Math.cos(i*7.3)*0.5+0.5)*0.6 + 0.05) * H;
      ctx.globalAlpha = 0.25 + 0.2*Math.sin(now + i);
      ctx.fillStyle = '#b46bff';
      ctx.beginPath(); ctx.arc(cx, cy, 2 + Math.sin(i)*1, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    drawSky();
  }
  drawGround();
  drawBase('player');
  drawBase('enemy');

  const sorted = G.units.slice().sort((a,b)=>{
    if(a.lane !== b.lane) return a.lane - b.lane;
    return a.u - b.u;
  });
  for(const u of sorted) drawUnit(u);
  drawProjectiles();
  drawParticles();
  drawDamageNums();

  if(G.active){
    const p = project(PLAYER_BASE_U, 0.5);
    const now = performance.now()/1000;
    ctx.save();
    ctx.globalAlpha = 0.16 + 0.06*Math.sin(now*2.4);
    ctx.fillStyle = '#7b5cff';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 46*p.s, 16*p.s, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
}

function setBuffFromHeroes(){
  G.hpBuff = 0; G.dmgBuff = 0; G.essBuff = 0;
  for(const k in HERO_DEFS){
    const d = HERO_DEFS[k];
    const h = state.heroes[k];
    if(!h) continue;
    const bonus = h.level * d.bonusPer;
    if(d.bonus === 'hp') G.hpBuff += bonus;
    else if(d.bonus === 'dmg') G.dmgBuff += bonus;
    else if(d.bonus === 'essence') G.essBuff += bonus;
  }
}

function startBattle(level){
  const cfg = levelCfg(level);
  G.mode = 'battle';
  G.level = level;
  G.units = []; G.projectiles = []; G.particles = []; G.damageNums = [];
  G.essence = 60; G.essenceMax = 120;
  G.essenceRegen = 10 + level*0.35;
  G.playerBase = {hp: cfg.playerBaseHp, max: cfg.playerBaseHp};
  G.enemyBase  = {hp: cfg.enemyBaseHp, max: cfg.enemyBaseHp};
  G.spawnInterval = cfg.spawnInterval;
  G.spawnTimer = 2.5;
  G.time = 0; G.kills = 0; G.spawned = 0;
  G.over = false; G.active = true;
  setBuffFromHeroes();

  VIEW = 'battle';
  document.getElementById('lobby-buildings').style.display = 'none';
  document.getElementById('mainmenu').classList.add('hidden');
  document.getElementById('battlehud').classList.add('show');
  document.getElementById('pausebtn').classList.add('show');
  updateBottomBar();
  resizeCanvas();
}

function startCave(lvl){

  G.mode = 'cave';

  G.units = []; G.projectiles = []; G.particles = []; G.damageNums = [];
  G.essence = 60; G.essenceMax = 120;

function stopBattle(){

  VIEW = 'lobby';

  document.getElementById('pausebtn').classList.remove('show');

function endLevel(win){
  if(G.over) return;
  G.over = true;
  G.active = false;
  const isCave = G.mode === 'cave';
  setTimeout(()=>{
    document.getElementById('pausebtn').classList.remove('show');
    if(win){
      questProgress('wins',1);
      state.wins = (state.wins||0)+1;
      if(isCave){
        questProgress('caveWins',1);
        if(G.level >= (state.caveMaxLevel||1)) state.caveMaxLevel = G.level + 1;
        const idx = Math.min(CAVE_REWARDS.length-1, G.level-1);
        const rew = CAVE_REWARDS[idx];
        pendingReward = {mode:'cave', ess: rew.essence, gold: rew.gold, wheat: rew.wheat, wood: rew.wood, stone: rew.stone};
      } else {
        const reward = 60 + G.level*30 + Math.floor(G.kills*1.5);
        pendingReward = {mode:'battle', gold: reward};
        if(state.maxLevel <= G.level) state.maxLevel = G.level + 1;
      }
    } else {
      const reward = Math.floor(10 + G.kills*1.2);
      pendingReward = {mode: isCave?'cave':'battle', gold: reward, ess: 0, wheat:0, wood:0, stone:0};
    }
    showResult(win);
    saveGame();
  }, 700);
}

let pendingReward = null;
const ovResult = document.getElementById('ov-result');

function showResult(win){
  const r = pendingReward || {};
  document.getElementById('res-title').textContent = win ? t('win') : t('lose');
  document.getElementById('res-title').style.color = win ? 'var(--gold-l)' : '#ff8b8b';
  document.getElementById('res-big').textContent = (win ? '✦ ' : '✧ ') + (G.mode==='cave'? (LANG==='ru'?'Пещера ':'Cave ') : t('level') + ' ') + G.level;
  let lines = `<div class="res-line"><span>${t('units_spawned')}</span><b>${G.spawned}</b></div>
    <div class="res-line"><span>${t('enemies_killed')}</span><b>${G.kills}</b></div>`;
  let rewardText = '';
  if(r.gold) rewardText += '+'+r.gold+' '+t('gold')+' ';
  if(r.ess) rewardText += '+'+r.ess+' '+t('essence')+' ';
  if(r.wheat) rewardText += '+'+r.wheat+' '+t('wheat')+' ';
  if(r.wood) rewardText += '+'+r.wood+' '+t('wood')+' ';
  if(r.stone) rewardText += '+'+r.stone+' '+t('stone');
  lines += `<div class="res-line" style="border:none"><span>${t('winreward')}</span><b style="color:var(--gold-l)">${rewardText}</b></div>`;
  document.getElementById('res-lines').innerHTML = lines;

  const dbl = document.getElementById('res-double');
  dbl.style.display = win ? 'block' : 'none';
  dbl.disabled = false;
  dbl.textContent = t('double_reward');
  document.getElementById('res-take').textContent = t('take_reward');
  ovResult.classList.add('show');
  syncPause();
}

function claimPendingReward(){
  const r = pendingReward;
  if(!r) return;
  if(r.gold) addGold(r.gold);
  if(r.ess) addResource('essence', r.ess);
  if(r.wheat) addResource('wheat', r.wheat);
  if(r.wood) addResource('wood', r.wood);
  if(r.stone) addResource('stone', r.stone);
  pendingReward = null;
  refreshAllUI();
  saveGame();
}

document.getElementById('res-take').addEventListener('click', ()=>{
  claimPendingReward();
  ovResult.classList.remove('show');
  syncPause();
  stopBattle();
});

document.getElementById('res-double').addEventListener('click', async ()=>{
  const btn = document.getElementById('res-double');
  btn.disabled = true;
  const r = await showNativeAd('reward');
  const success = r && (r.result === true || r.result === 'true');
  const orig = pendingReward;
  if(success){
    if(orig.gold) orig.gold *= 2;
    if(orig.ess) orig.ess *= 2;
    if(orig.wheat) orig.wheat *= 2;
    if(orig.wood) orig.wood *= 2;
    if(orig.stone) orig.stone *= 2;
    toast('x2!');
  }
  claimPendingReward();
  ovResult.classList.remove('show');
  syncPause();
  stopBattle();
});

const adov = document.getElementById('adov');
function showAdOverlay(){ adov.classList.add('show'); setPause('ad', true); }
function hideAdOverlay(){ adov.classList.remove('show'); setPause('ad', false); }
function showNativeAd(format){
  return new Promise(resolve=>{
    if(!HAS_VK){ setTimeout(()=>resolve({result:true}), 350); return; }
    showAdOverlay();
    const done = (res)=>{ hideAdOverlay(); resolve(res); };
    VK.send('VKWebAppShowNativeAds', {ad_format: format})
      .then(data=> done(data || {result:true}))
      .catch(()=> done({result:false}));
    setTimeout(()=>{ if(adov.classList.contains('show')) done({result:false}); }, 25000);
  });
}
