<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<title>Бургерная</title>

<script src="https://vk.com/js/api/xd_connection.js?2"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',Roboto,sans-serif;color:#fff;font-size:14px}
#game-container{position:relative;width:100%;height:100%;overflow:hidden}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;background:#16213e}
#ui-layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:2}
#ui-layer>*{pointer-events:auto}

/* Верхняя панель — исправлено: relative + высокий z-index */
#top-bar{
    position:relative;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 12px;
    background:linear-gradient(180deg,rgba(26,26,46,.98),rgba(26,26,46,.85));
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.12);
    height:44px;
    flex-shrink:0;
}
#currency-display,#level-display{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.4)}
#currency-display{color:#ffd166;text-shadow:0 0 8px rgba(255,209,102,.5)}
#level-display{color:#4ecdc4}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:18px;cursor:pointer;padding:6px 10px;border-radius:50%;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,.2)}

/* Экраны */
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;padding:56px 16px 16px;background:linear-gradient(180deg,rgba(26,26,46,.96),rgba(22,33,62,.98));z-index:5;overflow-y:auto}
.screen.active{display:flex}

/* ===== ЛОББИ ===== */
#lobby{justify-content:flex-start;padding-top:60px}
.lobby-hero{
    width:140px;height:140px;margin-bottom:8px;
    filter:drop-shadow(0 8px 24px rgba(255,107,53,.4));
    animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.lobby-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    width:100%;
    max-width:400px;
    margin-top:10px;
}
.menu-card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:14px 8px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
    color:#fff;
    cursor:pointer;
    transition:transform .1s,background .2s,box-shadow .2s;
    box-shadow:0 4px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.15);
    font-family:inherit;
    min-height:88px;
}
.menu-card:active{transform:scale(.95);background:rgba(255,255,255,.15)}
.menu-icon{font-size:26px;line-height:1}
.menu-label{font-size:11px;font-weight:700;text-align:center;letter-spacing:.3px}
.menu-card.play-card{
    grid-column:1 / -1;
    flex-direction:row;
    gap:14px;
    min-height:70px;
    background:linear-gradient(135deg,#ff6b35,#ff8c42);
    border-color:rgba(255,209,102,.5);
    box-shadow:0 8px 24px rgba(255,107,53,.5), inset 0 1px 0 rgba(255,255,255,.3);
}
.menu-card.play-card .menu-icon{font-size:32px}
.menu-card.play-card .menu-label{font-size:20px;font-weight:800;letter-spacing:1px}
.badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 8px #ff3b30}

/* ===== ЭКРАН УРОВНЯ ===== */
#level-screen{
    padding:50px 0 0 0;
    justify-content:flex-start;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(26,26,46,.98),rgba(22,33,62,.98));
}
#restaurant-scene{
    width:100%;
    height:32vh;
    min-height:160px;
    max-height:230px;
    flex-shrink:0;
    background:#0d0d1a;
    position:relative;
    overflow:hidden;
}
#restaurant-svg{width:100%;height:100%;display:block}
#level-content{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:8px;
    overflow-y:auto;
    min-height:0;
}

#order-panel{
    background:linear-gradient(135deg,rgba(255,107,53,.2),rgba(255,107,53,.08));
    border:1px solid rgba(255,107,53,.4);
    border-radius:14px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}
#order-header{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:4px}
#order-customer{font-size:13px;font-weight:700;color:#ffd166}
#order-timer{font-size:14px;font-weight:800;color:#4ecdc4}
#order-items{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.order-item{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:rgba(255,255,255,.12);border-radius:8px;font-size:20px}

#burger-stack{
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    gap:2px;
    min-height:80px;
    max-height:130px;
    overflow-y:auto;
    padding:6px;
    border:2px dashed rgba(255,209,102,.35);
    border-radius:12px;
    background:rgba(0,0,0,.35);
}
.burger-layer{
    width:85%;
    min-height:18px;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:#333;
    font-weight:800;
    padding:2px 6px;
    box-shadow:0 2px 4px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4);
    animation:layerPop .2s ease-out;
}
@keyframes layerPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

#ingredients-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(66px,1fr));
    gap:6px;
}
.ingredient-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:8px 4px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:10px;
    background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
    color:#fff;
    font-size:10px;
    cursor:pointer;
    font-family:inherit;
    transition:transform .1s,background .15s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.ingredient-btn:active{background:rgba(255,255,255,.2);transform:scale(.95)}
.ingredient-btn .emoji{font-size:24px;line-height:1}

#level-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
#level-actions button{flex:1}

/* Общие кнопки */
.main-btn{
    padding:14px 20px;
    font-size:16px;
    font-weight:800;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#ff6b35,#ff8c42);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(255,107,53,.4), inset 0 1px 0 rgba(255,255,255,.3);
    font-family:inherit;
    letter-spacing:.3px;
}
.main-btn:active{transform:scale(.97)}
.main-btn:disabled{opacity:.5;cursor:not-allowed}
.secondary-btn{
    padding:12px 18px;
    font-size:14px;
    font-weight:700;
    border:1px solid rgba(255,255,255,.25);
    border-radius:10px;
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    font-family:inherit;
}
.secondary-btn:active{background:rgba(255,255,255,.18)}

/* ===== Прочие экраны ===== */
#lobby h2,#levels-screen h2,#tasks-screen h2,#afk-screen h2,#daily-screen h2,#shop-screen h2,#settings-screen h2,#tutorial-screen h2,#result-screen h2{
    font-size:22px;font-weight:800;margin-bottom:14px;color:#ffd166;text-align:center;
}
#levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:60vh;overflow-y:auto;width:100%;max-width:520px;padding:4px}
.level-btn{aspect-ratio:1;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.level-btn.completed{background:linear-gradient(135deg,rgba(78,205,196,.4),rgba(78,205,196,.15));border-color:#4ecdc4;color:#c8fff6}
.level-btn.locked{opacity:.3;cursor:not-allowed}
.level-btn.current{border-color:#ffd166;box-shadow:0 0 10px rgba(255,209,102,.6)}

#tasks-list{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding:4px}
.task-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(255,255,255,.06);border-radius:12px;border:1px solid rgba(255,255,255,.1);gap:10px}
.task-item.completed{border-color:#4ecdc4;background:rgba(78,205,196,.15)}

#settings-screen label{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px}
#settings-screen select,#promo-input{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px;width:100%;max-width:300px;font-family:inherit}
.promo-section{display:flex;flex-direction:column;gap:8px;margin:16px 0;width:100%;max-width:300px}

#shop-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:60vh;overflow-y:auto;width:100%;max-width:520px;padding:4px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;text-align:center}
.shop-item .price{color:#ffd166;font-weight:800}
.shop-item button{width:100%;padding:8px;font-size:12px}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(255,107,53,.95);padding:10px 20px;border-radius:12px;color:#fff;font-weight:800;z-index:1000;animation:fadeInOut 2.2s ease-in-out;max-width:80%;text-align:center;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:1000;padding:20px;text-align:center}
.modal-bg h2{font-size:18px;max-width:400px;line-height:1.4}
.modal-bg button{min-width:180px}

/* SVG-клиенты */
.customer-svg{cursor:pointer;transition:transform .2s}
.customer-svg.selected{filter:drop-shadow(0 0 10px #ffd166)}
.customer-svg.served{opacity:0;pointer-events:none}

@media (max-width:480px){
    .lobby-grid{max-width:340px;gap:8px}
    .menu-card{min-height:78px;padding:10px 6px}
    .menu-icon{font-size:22px}
    .menu-label{font-size:10px}
    .menu-card.play-card .menu-label{font-size:18px}
    #restaurant-scene{height:28vh;min-height:140px}
}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
        <div id="top-bar">
            <div id="currency-display">
                <span>🪙</span>
                <span id="coin-count">0</span>
            </div>
            <div id="level-display">
                <span>Ур.</span>
                <span id="level-number">1</span>
            </div>
            <button id="settings-btn" class="icon-btn" aria-label="Настройки">⚙</button>
        </div>

        <!-- ЛОББИ -->
        <div id="lobby" class="screen active">
            <svg class="lobby-hero" viewBox="0 0 200 200">
                <ellipse cx="100" cy="50" rx="72" ry="34" fill="#e0a96d" stroke="#b8814a" stroke-width="2"/>
                <ellipse cx="100" cy="42" rx="60" ry="20" fill="#f0c78a" opacity="0.6"/>
                <circle cx="82" cy="34" r="2" fill="#fff" opacity="0.8"/>
                <circle cx="102" cy="30" r="2" fill="#fff" opacity="0.8"/>
                <circle cx="120" cy="36" r="2" fill="#fff" opacity="0.8"/>
                <path d="M32 60 Q100 42 168 60 L168 74 Q100 56 32 74 Z" fill="#8fd860"/>
                <path d="M28 76 Q100 60 172 76 L172 96 Q100 80 28 96 Z" fill="#8b3d15"/>
                <path d="M30 98 Q100 84 170 98 L170 112 Q100 98 30 112 Z" fill="#ffd93d"/>
                <path d="M30 114 Q100 100 170 114 L170 130 Q100 118 30 130 Z" fill="#e63946"/>
                <ellipse cx="100" cy="150" rx="72" ry="22" fill="#d99758" stroke="#b8814a" stroke-width="2"/>
                <ellipse cx="100" cy="144" rx="60" ry="12" fill="#f0c78a" opacity="0.5"/>
            </svg>
            <div class="lobby-grid">
                <button id="play-btn" class="menu-card play-card">
                    <span class="menu-icon">▶</span>
                    <span class="menu-label">ИГРАТЬ</span>
                </button>
                <button id="levels-btn" class="menu-card">
                    <span class="menu-icon">🗺️</span>
                    <span class="menu-label">Уровни</span>
                </button>
                <button id="shop-btn" class="menu-card">
                    <span class="menu-icon">🛒</span>
                    <span class="menu-label">Магазин</span>
                </button>
                <button id="tasks-btn" class="menu-card">
                    <span class="menu-icon">📋</span>
                    <span class="menu-label">Задания</span>
                </button>
                <button id="daily-btn" class="menu-card">
                    <span class="menu-icon">🎁</span>
                    <span class="menu-label">Награда</span>
                </button>
                <button id="afk-btn" class="menu-card">
                    <span class="menu-icon">💤</span>
                    <span class="menu-label">AFK</span>
                </button>
                <button id="invite-btn" class="menu-card">
                    <span class="menu-icon">👥</span>
                    <span class="menu-label">Друзья</span>
                </button>
            </div>
        </div>

        <!-- ЭКРАН УРОВНЯ -->
        <div id="level-screen" class="screen">
            <div id="restaurant-scene">
                <svg id="restaurant-svg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#2a2a3e"/>
                            <stop offset="1" stop-color="#1a1a2e"/>
                        </linearGradient>
                    </defs>
                    <g id="scene-bg"></g>
                    <g id="customers-layer"></g>
                </svg>
            </div>
            <div id="level-content">
                <div id="order-panel">
                    <div id="order-header">
                        <span id="order-customer">Выберите клиента</span>
                        <span id="order-timer">⏱ <span id="timer-value">60</span>с</span>
                    </div>
                    <div id="order-items"></div>
                </div>
                <div id="burger-stack"></div>
                <div id="ingredients-list"></div>
                <div id="level-actions">
                    <button id="clear-btn" class="secondary-btn">Очистить</button>
                    <button id="serve-btn" class="main-btn">Подать</button>
                </div>
            </div>
        </div>

        <!-- РЕЗУЛЬТАТ -->
        <div id="result-screen" class="screen">
            <h2 id="result-title">Уровень пройден!</h2>
            <div id="result-stats" style="margin:20px 0;text-align:center;line-height:1.8"></div>
            <button id="double-reward-btn" class="main-btn" style="min-width:240px">Удвоить награду (реклама)</button>
            <button id="next-level-btn" class="main-btn" style="margin-top:12px;min-width:240px">Следующий уровень</button>
            <button id="back-lobby-btn" class="secondary-btn" style="margin-top:12px;min-width:240px">В лобби</button>
        </div>

        <!-- УРОВНИ -->
        <div id="levels-screen" class="screen">
            <h2>Уровни</h2>
            <div id="levels-grid"></div>
            <button id="levels-back" class="secondary-btn" style="margin-top:16px">Назад</button>
        </div>

        <!-- ЗАДАНИЯ -->
        <div id="tasks-screen" class="screen">
            <h2>Задания</h2>
            <div id="tasks-list"></div>
            <button id="tasks-back" class="secondary-btn" style="margin-top:16px">Назад</button>
        </div>

        <!-- AFK -->
        <div id="afk-screen" class="screen">
            <h2>AFK‑комната</h2>
            <p style="margin:20px 0;line-height:2;text-align:center;font-size:15px">
                Доход: <span id="afk-rate">1</span> 🪙 / мин<br>
                Заработано: <span id="afk-earned">0</span><br>
                Всего минут: <span id="afk-total">0</span>
            </p>
            <button id="afk-back" class="secondary-btn">Назад</button>
        </div>

        <!-- ЕЖЕДНЕВНАЯ НАГРАДА -->
        <div id="daily-screen" class="screen">
            <h2>Ежедневная награда</h2>
            <p id="daily-status" style="margin:20px 0;text-align:center"></p>
            <button id="daily-claim" class="main-btn" style="min-width:200px">Получить</button>
            <button id="daily-back" class="secondary-btn" style="margin-top:12px">Назад</button>
        </div>

        <!-- МАГАЗИН -->
        <div id="shop-screen" class="screen">
            <h2>Магазин</h2>
            <div id="shop-items"></div>
            <button id="shop-back" class="secondary-btn" style="margin-top:16px">Назад</button>
        </div>

        <!-- НАСТРОЙКИ -->
        <div id="settings-screen" class="screen">
            <h2>Настройки</h2>
            <label><input type="checkbox" id="music-toggle"> Музыка</label>
            <label>
                Язык:
                <select id="language-select">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </label>
            <div class="promo-section">
                <input type="text" id="promo-input" placeholder="Промокод">
                <button id="promo-btn" class="secondary-btn">Активировать</button>
            </div>
            <button id="settings-back" class="secondary-btn" style="margin-top:16px">Назад</button>
        </div>

        <!-- ОБУЧЕНИЕ -->
        <div id="tutorial-screen" class="screen">
            <h2 id="tutorial-title">Обучение</h2>
            <p id="tutorial-text" style="max-width:400px;text-align:center;margin:20px 0;line-height:1.6"></p>
            <button id="tutorial-next" class="main-btn" style="min-width:200px">Далее</button>
            <button id="tutorial-skip" class="secondary-btn" style="margin-top:12px">Пропустить</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
   ЛОКАЛИЗАЦИЯ
============================================================ */
const i18n = {
    ru: {
        play:'Играть', levels:'Уровни', tasks:'Задания', afk_room:'AFK‑комната',
        daily_reward:'Ежедневная награда', invite_friends:'Пригласить друзей',
        shop:'Магазин', settings:'Настройки', music:'Музыка', language:'Язык',
        promo_code:'Промокод', activate:'Активировать', back:'Назад',
        order:'Заказ', serve:'Подать', clear:'Очистить',
        level_complete:'Уровень пройден!', double_reward:'Удвоить награду (реклама)',
        next_level:'Следующий уровень', back_lobby:'В лобби',
        tutorial_title:'Обучение', tutorial_next:'Далее', tutorial_skip:'Пропустить',
        tutorial_welcome:'Добро пожаловать в Бургерную! Клиенты приходят в ваш ресторан и делают заказ.',
        tutorial_order:'Над головой клиента — пузырь с ингредиентами, которые он хочет в бургере.',
        tutorial_ingredients:'Нажмите на клиента, чтобы выбрать его, затем добавляйте ингредиенты в бургер.',
        tutorial_serve:'Соберите бургер по заказу (булка, котлета, начинки, булка) и нажмите «Подать».',
        tutorial_timer:'Успейте обслужить всех клиентов до окончания времени!',
        daily_available:'Награда доступна!', daily_claimed:'Награда уже получена сегодня.',
        claim:'Получить', level:'Уровень', coins:'монет', purchase:'Купить',
        promo_invalid:'Неверный промокод', promo_clear:'Все данные сброшены!',
        promo_admin:'Начислено 1 000 000 монет!', not_enough_coins:'Недостаточно монет',
        purchased:'Куплено!', already_owned:'Уже куплено', apply:'Применить',
        time_out:'Время вышло!', wrong_order:'Неправильный заказ!',
        select_customer:'Выберите клиента', tutorial_prompt:'Хотите пройти обучение?',
        tutorial_yes:'Пройти', tutorial_no:'Пропустить',
        ingredients:'Ингредиенты', interior:'Интерьер', upgrades:'Улучшения'
    },

const VKBridge = {
    available: typeof vkBridge !== 'undefined',
    init(){
        if(!this.available){ console.warn('VK Bridge не загружен'); return; }
        vkBridge.send('VKWebAppInit').catch(e=>console.warn(e));
        this.setupViewHandlers();
    },
    async saveData(key, value){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppStorageSet',{key, value:JSON.stringify(value)}); return true; }
        catch(e){ return false; }
    },
    async loadData(key){
        if(!this.available) return null;
        try{
            const r = await vkBridge.send('VKWebAppStorageGet',{keys:[key]});
            if(r.keys && r.keys[0] && r.keys[0].value) return JSON.parse(r.keys[0].value);
            return null;
        }catch(e){ return null; }
    },
    async clearAllData(){
        if(!this.available) return false;
        try{
            const r = await vkBridge.send('VKWebAppStorageGetKeys',{count:1000, offset:0});
            if(r.keys) for(const k of r.keys) await vkBridge.send('VKWebAppStorageSet',{key:k, value:''});
            return true;
        }catch(e){ return false; }
    },
    async showInterstitial(){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppShowNativeAds',{ad_format:'interstitial'}); return true; }
        catch(e){ return false; }
    },
    async showRewarded(){
        if(!this.available) return false;
        try{
            const r = await vkBridge.send('VKWebAppShowNativeAds',{ad_format:'reward'});
            return r && r.result === true;
        }catch(e){ return false; }
    },
    async showBanner(){
        if(!this.available) return;
        try{
            await vkBridge.send('VKWebAppGetLaunchParams');
            await vkBridge.send('VKWebAppShowBannerAd',{banner_location:'bottom'});
        }catch(e){}
    },
    async inviteFriends(){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppShowInviteBox'); return true; }
        catch(e){ return false; }
    },
    setupViewHandlers(){
        if(this.available){
            try{
                vkBridge.subscribe(e=>{
                    if(!e || !e.detail) return;
                    if(e.detail.type === 'VKWebAppViewHide'){
                        AudioManager.pauseMusic(); if(window.Game) Game.pause();
                    } else if(e.detail.type === 'VKWebAppViewRestore'){
                        AudioManager.resumeMusic(); if(window.Game) Game.resume();
                    }
                });
            }catch(e){}
        }
        document.addEventListener('visibilitychange',()=>{
            if(document.hidden){ AudioManager.pauseMusic(); if(window.Game) Game.pause(); }
            else { AudioManager.resumeMusic(); if(window.Game) Game.resume(); }
        });
        window.addEventListener('blur',()=>AudioManager.pauseMusic());
        window.addEventListener('focus',()=>AudioManager.resumeMusic());
    }
};

/* ============================================================
   AUDIO
============================================================ */
const AudioManager = {
    musicEnabled: true,
    musicPlaying: false,
    audioContext: null,
    musicTimer: null,
    notes: [262, 294, 330, 349, 392, 440, 494, 523],
    init(){
        const go = ()=>{
            if(!this.audioContext){
                try{ this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
            }
            if(this.audioContext && this.audioContext.state === 'suspended') this.audioContext.resume();
            document.removeEventListener('touchstart', go);
            document.removeEventListener('click', go);
        };
        document.addEventListener('touchstart', go, {once:true});
        document.addEventListener('click', go, {once:true});
    },
    playNote(){
        if(!this.musicPlaying || !this.musicEnabled || !this.audioContext) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = this.notes[Math.floor(Math.random()*this.notes.length)];
        const now = this.audioContext.currentTime;
        gain.gain.setValueAtTime(0.035, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(gain); gain.connect(this.audioContext.destination);
        osc.start(now); osc.stop(now + 0.6);
        this.musicTimer = setTimeout(()=>this.playNote(), 700);
    },
    startMusic(){
        if(!this.musicEnabled || this.musicPlaying || !this.audioContext) return;
        this.musicPlaying = true;
        this.playNote();
    },
    stopMusic(){
        this.musicPlaying = false;
        if(this.musicTimer){ clearTimeout(this.musicTimer); this.musicTimer = null; }
    },
    pauseMusic(){ this.stopMusic(); },
    resumeMusic(){ if(this.musicEnabled) this.startMusic(); },
    toggleMusic(enabled){
        this.musicEnabled = enabled;
        if(enabled) this.startMusic(); else this.stopMusic();
    },
    playSound(type){
        if(!this.audioContext) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        const now = this.audioContext.currentTime;
        if(type === 'click'){
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if(type === 'correct'){
            osc.frequency.value = 523;
            osc.frequency.linearRampToValueAtTime(1046, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if(type === 'error'){
            osc.type = 'sawtooth';
            osc.frequency.value = 200;
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if(type === 'coin'){
            osc.frequency.value = 1200;
            osc.frequency.linearRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        }
        osc.connect(gain); gain.connect(this.audioContext.destination);
    }
};

    ],
    all(){ return this.baseIngredients.concat(this.premiumIngredients); },
    getColor(id){

        return ing ? ing.color : '#ccc';
    },
    getName(id){
        const ing = this.all().find(i=>i.id === id);
        return ing ? ing.name : id;
    },
    getEmoji(id){
        const ing = this.all().find(i=>i.id === id);
        return ing ? ing.emoji : '❓';
    },

    // Генерация уровня: несколько клиентов с заказами
    getLevel(n){
        const customerCount = Math.min(2 + Math.floor(n/100), 6);
        const fillingCount = Math.min(1 + Math.floor(n/80), 4);
        const timeLimit = Math.max(90 - Math.floor(n/30)*10, 60) + customerCount * 15;
        const rewardPerCustomer = 40 + n * 5;
        const totalReward = rewardPerCustomer * customerCount;

        // Доступные ингредиенты для этого уровня
        let available = [...this.baseIngredients];
        this.premiumIngredients.forEach(ing=>{
            if(GameState.purchasedIngredients.includes(ing.id)) available.push(ing);
        });

        const fillings = available.filter(i=>i.id !== 'bun_bottom' && i.id !== 'bun_top');

        // Генерируем заказ для каждого клиента
        const customers = [];
        for(let i=0; i<customerCount; i++){
            const shuffled = [...fillings].sort(()=>Math.random()-0.5);
            const chosen = shuffled.slice(0, fillingCount);
            const order = ['bun_bottom', 'patty', ...chosen.map(c=>c.id), 'bun_top'];
            customers.push(order);
        }

        return {
            level: n,
            customers: customers,
            timeLimit: timeLimit,
            reward: totalReward,
            rewardPerCustomer: rewardPerCustomer,
            availableIngredients: available.map(i=>i.id)
        };
    }
};

            this.lastUpdate = today;

            this.generateDailyTasks();

        const shuffled = [...this.taskPool].sort(()=>Math.random()-0.5);
        this.dailyTasks = shuffled.slice(0,10).map(t=>({...t, completed:false, claimed:false}));
        this.progress = {};
        this.lastUpdate = new Date().toDateString();
    },
    updateProgress(type, amount=1){
        this.dailyTasks.forEach(task=>{
            if(task.completed || task.type !== type) return;
            this.progress[task.id] = (this.progress[task.id] || 0) + amount;
            if(this.progress[task.id] >= task.target){
                task.completed = true;
                GameState.save();
                if(window.Game) Game.showToast('✓ ' + task.text);
            }
        });
    },

        const task = this.dailyTasks.find(t=>t.id === taskId);
        if(task && task.completed && !task.claimed){
            task.claimed = true;
            GameState.coins += task.reward;
            GameState.save();
            AudioManager.playSound('coin');
            return task.reward;
        }
        return 0;

        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;
        if(!this.paused){
            this.update(dt);
            this.render();
        }
        this.animationFrame = requestAnimationFrame(t=>this.gameLoop(t));
    }
    update(dt){ this.backgroundOffset = (this.backgroundOffset + dt * 20) % 40; }
    render(){
        const w = this.canvas._w || 300;
        const h = this.canvas._h || 300;
        const grad = this.ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(1, '#16213e');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, w, h);
        this.ctx.fillStyle = 'rgba(255,255,255,0.02)';
        const tile = 40;
        for(let x = -tile; x < w + tile; x += tile){
            for(let y = -tile; y < h + tile; y += tile){
                this.ctx.fillRect(x + this.backgroundOffset, y, tile - 2, tile - 2);
            }
        }
    }

    showScreen(id){
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        const el = document.getElementById(id);
        if(el) el.classList.add('active');
    }

    setupEventListeners(){
        const bind = (id, fn)=>{
            const el = document.getElementById(id);
            if(el) el.addEventListener('click', ()=>{ AudioManager.playSound('click'); fn(); });
        };

        bind('play-btn', ()=>this.startLevel(GameState.currentLevel));
        bind('levels-btn', ()=>{ this.renderLevelsGrid(); this.showScreen('levels-screen'); });
        bind('tasks-btn', ()=>{ this.renderTasks(); this.showScreen('tasks-screen'); });
        bind('afk-btn', ()=>{ this.showScreen('afk-screen'); AFKRoom.start(); AFKRoom.updateUI(); });
        bind('daily-btn', ()=>{ this.checkDailyReward(); this.showScreen('daily-screen'); });
        bind('shop-btn', ()=>{ this.renderShop(); this.showScreen('shop-screen'); });
        bind('invite-btn', ()=>{ VKBridge.inviteFriends(); Tasks.updateProgress('invite', 1); });
        bind('settings-btn', ()=>this.showScreen('settings-screen'));
        bind('settings-back', ()=>this.showScreen('lobby'));
        bind('levels-back', ()=>this.showScreen('lobby'));
        bind('tasks-back', ()=>this.showScreen('lobby'));
        bind('afk-back', ()=>{ AFKRoom.stop(); this.showScreen('lobby'); });
        bind('daily-back', ()=>this.showScreen('lobby'));
        bind('shop-back', ()=>this.showScreen('lobby'));
        bind('serve-btn', ()=>this.serveBurger());
        bind('clear-btn', ()=>this.clearBurger());
        bind('daily-claim', ()=>this.claimDailyReward());
        bind('promo-btn', ()=>this.handlePromoCode());
        bind('tutorial-next', ()=>this.nextTutorialStep());
        bind('tutorial-skip', ()=>this.skipTutorial());
        bind('next-level-btn', ()=>{ this.startLevel(Math.min(GameState.currentLevel + 1, 500)); });
        bind('back-lobby-btn', ()=>this.showScreen('lobby'));

        document.getElementById('music-toggle').addEventListener('change', e=>{
            GameState.musicEnabled = e.target.checked;
            AudioManager.toggleMusic(e.target.checked);
            GameState.save();
        });
        document.getElementById('language-select').addEventListener('change', e=>{
            GameState.language = e.target.value;
            currentLang = e.target.value;
            this.applyLanguage();
            GameState.save();
        });
        document.getElementById('double-reward-btn').addEventListener('click', async ()=>{
            AudioManager.pauseMusic();
            const ok = await VKBridge.showRewarded();
            AudioManager.resumeMusic();
            if(ok){
                GameState.coins += this.currentReward;
                GameState.save();
                this.updateCurrencyDisplay();
                const btn = document.getElementById('double-reward-btn');
                btn.disabled = true;
                btn.textContent = '✓ +' + this.currentReward + ' 🪙';
            }
        });
    }

    /* ===== ЗАПУСК УРОВНЯ ===== */
    async startLevel(levelNum){
        this.paused = true;
        AudioManager.pauseMusic();
        await VKBridge.showInterstitial();
        AudioManager.resumeMusic();
        this.paused = false;

        GameState.currentLevel = levelNum;
        const data = Levels.getLevel(levelNum);

        this.customersTotal = data.customers.length;
        this.customersServed = 0;
        this.currentReward = data.reward;
        this.rewardPerCustomer = data.rewardPerCustomer;
        this.timeLeft = data.timeLimit;
        this.availableIngredients = data.availableIngredients;

        // Создаём клиентов
        const positions = this.getCustomerPositions(this.customersTotal);
        this.customers = data.customers.map((order, i)=>({
            x: positions[i],
            y: 250,
            color: CUSTOMER_COLORS[Math.floor(Math.random()*CUSTOMER_COLORS.length)],
            skin: SKIN_COLORS[Math.floor(Math.random()*SKIN_COLORS.length)],
            hair: HAIR_COLORS[Math.floor(Math.random()*HAIR_COLORS.length)],
            order: order,
            served: false,
            name: CUSTOMER_NAMES[Math.floor(Math.random()*CUSTOMER_NAMES.length)]
        }));

        this.selectedCustomer = 0;
        this.currentBurger = [];

        this.renderScene();
        this.renderCustomers();
        this.renderOrderPanel();
        this.renderIngredients();
        this.renderBurgerStack();
        this.updateTimerDisplay();
        this.showScreen('level-screen');
        this.gameActive = true;

        if(this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(()=>{
            if(!this.gameActive || this.paused) return;
            this.timeLeft--;
            this.updateTimerDisplay();
            if(this.timeLeft <= 0) this.failLevel();
        }, 1000);

        GameState.save();
    }

    getCustomerPositions(count){
        const spacing = 800 / (count + 1);
        const positions = [];
        for(let i=0; i<count; i++) positions.push(spacing * (i + 1));
        return positions;
    }

    selectCustomer(i){
        if(!this.gameActive) return;
        if(!this.customers[i] || this.customers[i].served) return;
        this.selectedCustomer = i;
        AudioManager.playSound('click');
        this.renderCustomers();
        this.renderOrderPanel();
    }

    renderOrderPanel(){
        const nameEl = document.getElementById('order-customer');
        const itemsEl = document.getElementById('order-items');

        if(this.selectedCustomer === null || !this.customers[this.selectedCustomer] || this.customers[this.selectedCustomer].served){
            nameEl.textContent = t('select_customer');
            itemsEl.innerHTML = '';
            return;
        }
        const c = this.customers[this.selectedCustomer];
        nameEl.textContent = '👤 ' + c.name;
        itemsEl.innerHTML = '';
        c.order.forEach(id=>{
            const el = document.createElement('div');
            el.className = 'order-item';
            el.textContent = Levels.getEmoji(id);
            el.title = Levels.getName(id);
            itemsEl.appendChild(el);
        });
    }

    renderIngredients(){
        const c = document.getElementById('ingredients-list');
        c.innerHTML = '';
        this.availableIngredients.forEach(id=>{
            const ing = Levels.all().find(i=>i.id === id);
            if(!ing) return;
            const btn = document.createElement('button');
            btn.className = 'ingredient-btn';
            btn.innerHTML = `<span class="emoji">${ing.emoji}</span><span>${ing.name}</span>`;
            btn.addEventListener('click', ()=>this.addIngredient(id));
            c.appendChild(btn);
        });
    }

    addIngredient(id){
        if(!this.gameActive) return;
        if(this.selectedCustomer === null) {
            this.showToast(t('select_customer'));
            return;
        }
        this.currentBurger.push(id);
        this.renderBurgerStack();
        AudioManager.playSound('click');
        Tasks.updateProgress('use_ingredient', 1);
    }

    renderBurgerStack(){
        const c = document.getElementById('burger-stack');
        c.innerHTML = '';
        this.currentBurger.forEach(id=>{
            const layer = document.createElement('div');
            layer.className = 'burger-layer';
            layer.style.background = Levels.getColor(id);
            layer.textContent = Levels.getEmoji(id) + ' ' + Levels.getName(id);
            c.appendChild(layer);
        });
    }

    serveBurger(){
        if(!this.gameActive) return;
        if(this.selectedCustomer === null){
            this.showToast(t('select_customer'));
            return;
        }
        const c = this.customers[this.selectedCustomer];
        if(!c || c.served) return;

        if(this.arraysEqualSet(this.currentBurger, c.order)){
            AudioManager.playSound('correct');
            c.served = true;
            this.customersServed++;

            // Награда за клиента
            GameState.coins += this.rewardPerCustomer;
            GameState.totalCoinsEarned += this.rewardPerCustomer;
            GameState.totalBurgersServed++;
            GameState.totalPerfectBurgers++;
            this.updateCurrencyDisplay();

            Tasks.updateProgress('serve', 1);
            Tasks.updateProgress('earn', this.rewardPerCustomer);
            Tasks.updateProgress('perfect', 1);

            this.currentBurger = [];
            this.renderBurgerStack();
            this.renderCustomers();

            if(this.customersServed >= this.customersTotal){
                this.completeLevel();
            } else {
                const next = this.customers.findIndex(cu=>!cu.served);
                this.selectedCustomer = next >= 0 ? next : null;
                this.renderOrderPanel();
                this.renderCustomers();
            }
            GameState.save();
        } else {
            AudioManager.playSound('error');
            this.showToast(t('wrong_order'));
            this.currentBurger = [];
            this.renderBurgerStack();
        }
    }

    arraysEqualSet(a, b){
        if(a.length !== b.length) return false;
        const sa = [...a].sort();
        const sb = [...b].sort();
        return sa.every((v, i)=>v === sb[i]);
    }

    clearBurger(){
        this.currentBurger = [];
        this.renderBurgerStack();
    }

    completeLevel(){
        this.gameActive = false;
        clearInterval(this.timerInterval);

        GameState.coins += this.currentReward;
        GameState.totalCoinsEarned += this.currentReward;

        if(!GameState.completedLevels.includes(GameState.currentLevel)){
            GameState.completedLevels.push(GameState.currentLevel);
        }
        if(GameState.currentLevel >= GameState.maxLevel){
            GameState.maxLevel = GameState.currentLevel + 1;
        }
        Tasks.updateProgress('earn', this.currentReward);
        Tasks.updateProgress('complete_levels', 1);

        GameState.save();
        this.updateCurrencyDisplay();
        this.showLevelResult();
    }

    failLevel(){
        this.gameActive = false;
        clearInterval(this.timerInterval);
        this.showToast(t('time_out'));
        setTimeout(()=>this.showScreen('lobby'), 1400);
    }

    showLevelResult(){
        const stats = document.getElementById('result-stats');
        stats.innerHTML = `
            <p style="font-size:18px;color:#4ecdc4;font-weight:800">Уровень ${GameState.currentLevel}</p>
            <p style="color:#aaa;margin-top:6px">Обслужено клиентов: ${this.customersServed}/${this.customersTotal}</p>
            <p style="color:#ffd166;font-weight:800;margin-top:10px;font-size:20px">+${this.currentReward} 🪙</p>
        `;
        const btn = document.getElementById('double-reward-btn');
        btn.disabled = false;
        btn.textContent = t('double_reward');
        this.showScreen('result-screen');
    }

    updateTimerDisplay(){
        const el = document.getElementById('timer-value');
        if(el) el.textContent = Math.max(0, this.timeLeft);
    }

    renderLevelsGrid(){
        const c = document.getElementById('levels-grid');
        c.innerHTML = '';
        for(let i=1; i<=500; i++){
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            btn.textContent = i;
            if(GameState.completedLevels.includes(i)) btn.classList.add('completed');
            if(i > GameState.maxLevel){ btn.classList.add('locked'); btn.disabled = true; }
            if(i === GameState.currentLevel) btn.classList.add('current');
            btn.addEventListener('click', ()=>{ if(!btn.disabled) this.startLevel(i); });
            c.appendChild(btn);
        }
    }

    renderTasks(){
        const c = document.getElementById('tasks-list');
        c.innerHTML = '';
        Tasks.dailyTasks.forEach(task=>{
            const el = document.createElement('div');
            el.className = 'task-item' + (task.completed ? ' completed' : '');
            const prog = Tasks.progress[task.id] || 0;
            const progText = task.completed ? '✅' : `${prog}/${task.target}`;
            el.innerHTML = `
                <div style="flex:1;min-width:0">
                    <div style="font-size:13px">${task.text}</div>
                    <small style="color:#aaa">${progText}</small>
                </div>
                <div style="text-align:right">
                    <div style="color:#ffd166;font-weight:800">${task.reward} 🪙</div>
                    ${task.completed && !task.claimed ? `<button class="main-btn" data-tid="${task.id}" style="margin-top:4px;padding:6px 12px;font-size:11px">${t('claim')}</button>` : ''}
                    ${task.claimed ? '<div style="margin-top:4px">✅</div>' : ''}
                </div>
            `;
            c.appendChild(el);
        });
        c.querySelectorAll('button[data-tid]').forEach(btn=>{
            btn.addEventListener('click', ()=>{
                Tasks.claimReward(btn.dataset.tid);
                this.renderTasks();
                this.updateCurrencyDisplay();
            });
        });
    }

    checkDailyReward(){
        const today = new Date().toDateString();
        const status = document.getElementById('daily-status');
        const btn = document.getElementById('daily-claim');
        if(GameState.lastDailyReward === today){
            status.textContent = t('daily_claimed');
            btn.disabled = true;
        } else {
            status.textContent = t('daily_available');
            btn.disabled = false;
        }
    }

    claimDailyReward(){
        const today = new Date().toDateString();
        if(GameState.lastDailyReward === today) return;
        GameState.lastDailyReward = today;
        GameState.coins += 500;
        GameState.save();
        this.updateCurrencyDisplay();
        document.getElementById('daily-status').textContent = t('daily_claimed');
        document.getElementById('daily-claim').disabled = true;
        AudioManager.playSound('coin');
        this.showToast('+500 🪙');
    }

        const c = document.getElementById('shop-items');

                <button class="main-btn">${t('purchase')}</button>

        }
        if(!GameState.hasLemonadeMachine){
            const el = document.createElement('div');
            el.className = 'shop-item';
            el.innerHTML = `
                <div style="font-size:32px">🍋</div>
                <div style="font-size:12px">Машина для лимонада</div>
                <div class="price">4000 🪙</div>
                <button class="main-btn">${t('purchase')}</button>
            `;
            el.querySelector('button').addEventListener('click', ()=>{
                if(GameState.coins >= 4000){
                    GameState.coins -= 4000;
                    GameState.hasLemonadeMachine = true;
                    GameState.save();
                    this.updateCurrencyDisplay();
                    this.renderShop();
                } else this.showToast(t('not_enough_coins'));
            });
            c.appendChild(el);
        }
        const cost = AFKRoom.rate * 1000;
        const el = document.createElement('div');
        el.className = 'shop-item';
        el.innerHTML = `
            <div style="font-size:32px">💤</div>
            <div style="font-size:12px">+1 🪙 / мин в AFK</div>
            <div class="price">${cost} 🪙</div>
            <button class="main-btn">${t('purchase')}</button>
        `;
        el.querySelector('button').addEventListener('click', ()=>{
            if(GameState.coins >= cost){
                GameState.coins -= cost;
                AFKRoom.upgradeRate();
                GameState.save();
                this.updateCurrencyDisplay();
                this.renderShop();
            } else this.showToast(t('not_enough_coins'));
        });
        c.appendChild(el);
    }

    async handlePromoCode(){
        const input = document.getElementById('promo-input');
        const code = input.value.trim().toLowerCase();
        if(code === 'clear12'){
            await VKBridge.clearAllData();
            this.showToast(t('promo_clear'));
            setTimeout(()=>location.reload(), 1200);
        } else if(code === 'admin17'){
            GameState.coins += 1000000;
            GameState.save();
            this.updateCurrencyDisplay();
            this.showToast(t('promo_admin'));
        } else {
            this.showToast(t('promo_invalid'));
        }
        input.value = '';
    }

    showTutorialPrompt(){
        const modal = document.createElement('div');
        modal.className = 'modal-bg';
        modal.innerHTML = `<h2>${t('tutorial_prompt')}</h2>`;
        const yes = document.createElement('button');
        yes.className = 'main-btn';
        yes.textContent = t('tutorial_yes');
        yes.onclick = ()=>{ modal.remove(); this.startTutorial(); };
        const no = document.createElement('button');
        no.className = 'secondary-btn';
        no.textContent = t('tutorial_no');
        no.onclick = ()=>{ modal.remove(); this.skipTutorial(); };
        modal.appendChild(yes);
        modal.appendChild(no);
        document.body.appendChild(modal);
    }

    startTutorial(){
        this.tutorialStep = 0;
        this.showScreen('tutorial-screen');
        this.nextTutorialStep();
    }

    nextTutorialStep(){
        const steps = [t('tutorial_welcome'), t('tutorial_order'), t('tutorial_ingredients'), t('tutorial_serve'), t('tutorial_timer')];
        if(this.tutorialStep >= steps.length){
            GameState.tutorialCompleted = true;
            GameState.save();
            this.showScreen('lobby');
            return;
        }
        document.getElementById('tutorial-title').textContent = t('tutorial_title');
        document.getElementById('tutorial-text').textContent = steps[this.tutorialStep];
        this.tutorialStep++;
    }

    skipTutorial(){
        GameState.tutorialCompleted = true;
        GameState.save();
        this.showScreen('lobby');
    }

    showToast(text){
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 2200);
    }

    updateCurrencyDisplay(){
        const c = document.getElementById('coin-count');
        const l = document.getElementById('level-number');
        if(c) c.textContent = GameState.coins.toLocaleString('ru-RU');
        if(l) l.textContent = GameState.maxLevel;
    }

    pause(){ this.paused = true; }
    resume(){ this.paused = false; }
}

    AudioManager.init();
    Game = new BurgerGame();
    window.Game = Game;
    Game.init();
