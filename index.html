<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<title>Бургерная</title>

<script src="https://vk.com/js/api/xd_connection.js?2"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#100823;font-family:'Segoe UI',Roboto,sans-serif;color:#fff;font-size:14px}
#game-container{position:relative;width:100%;height:100%;overflow:hidden}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;background:#1a0f2e}
#ui-layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:2}
#ui-layer>*{pointer-events:auto}

/* ============ КРАСИВЫЕ СКРОЛЛБАРЫ ============ */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:4px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff6b35,#ff8c42);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ff8c42,#ffa566)}
*{scrollbar-width:thin;scrollbar-color:#ff6b35 rgba(255,255,255,.05)}

/* ============ ICONS ============ */
.svg-icon{display:inline-block;vertical-align:middle;width:1em;height:1em;flex-shrink:0}
.i-fill{fill:currentColor}

/* ============ TOP BAR ============ */
#top-bar{
  position:relative;z-index:100;display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;height:48px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(30,15,60,.98),rgba(20,10,45,.92));
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,200,100,.25);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
#currency-display,#level-display{
  display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;
  padding:5px 12px;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,107,53,.25),rgba(255,209,102,.15));
  border:1px solid rgba(255,200,100,.35);
  box-shadow:0 0 12px rgba(255,150,50,.2), inset 0 1px 0 rgba(255,255,255,.1);
}
#currency-display{color:#ffd166;text-shadow:0 0 8px rgba(255,209,102,.6)}
#currency-display .svg-icon{font-size:18px;filter:drop-shadow(0 0 4px rgba(255,200,80,.7))}
#level-display{color:#4ecdc4;text-shadow:0 0 8px rgba(78,205,196,.6)}
.icon-btn{
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.2);font-size:20px;cursor:pointer;
  padding:6px;border-radius:50%;color:#fff;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 2px 8px rgba(0,0,0,.3);
}
.icon-btn:active{background:rgba(255,255,255,.25);transform:scale(.93)}
.icon-btn .svg-icon{width:20px;height:20px;color:#ffd166}

/* ============ SCREENS ============ */
.screen{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  position:absolute;inset:0;padding:60px 16px 20px;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,107,53,.15),transparent 50%),
    radial-gradient(circle at 80% 90%,rgba(78,205,196,.12),transparent 50%),
    linear-gradient(180deg,rgba(30,15,60,.98),rgba(15,8,35,.99));
  z-index:5;overflow-y:auto;
}
.screen.active{display:flex}

/* ============ LOBBY ============ */
#lobby{justify-content:flex-start;padding-top:64px}
.lobby-hero{
  width:160px;height:160px;margin-bottom:6px;
  filter:drop-shadow(0 10px 30px rgba(255,107,53,.55));
  animation:float 3.5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
#restaurant-title-display{
  font-size:22px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,#ffd166,#ff6b35,#ffd166);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
  text-align:center;margin-bottom:14px;
  filter:drop-shadow(0 2px 6px rgba(255,150,50,.4));
}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.lobby-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  width:100%;max-width:400px;margin-top:10px;
}
.menu-card{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:14px 8px;border:1px solid rgba(255,255,255,.15);border-radius:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  color:#fff;cursor:pointer;
  transition:transform .12s,background .2s,box-shadow .2s;
  box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
  font-family:inherit;min-height:92px;
}
.menu-card:active{transform:scale(.95);background:rgba(255,255,255,.18);box-shadow:0 2px 8px rgba(255,107,53,.4)}
.menu-card .svg-icon{width:30px;height:30px;color:#ffd166;filter:drop-shadow(0 2px 6px rgba(255,180,60,.5))}
.menu-card .menu-label{font-size:11px;font-weight:700;text-align:center;letter-spacing:.3px}
.menu-card.play-card{
  grid-column:1 / -1;flex-direction:row;gap:14px;min-height:72px;
  background:linear-gradient(135deg,#ff6b35,#ff8c42,#ffb84d);
  border-color:rgba(255,209,102,.6);
  box-shadow:0 8px 28px rgba(255,107,53,.55), inset 0 1px 0 rgba(255,255,255,.35);
  animation:pulse-play 2.4s ease-in-out infinite;
}
@keyframes pulse-play{0%,100%{box-shadow:0 8px 28px rgba(255,107,53,.55), inset 0 1px 0 rgba(255,255,255,.35)}50%{box-shadow:0 8px 36px rgba(255,140,66,.8), inset 0 1px 0 rgba(255,255,255,.4)}}
.menu-card.play-card .svg-icon{width:34px;height:34px;color:#fff}
.menu-card.play-card .menu-label{font-size:20px;font-weight:900;letter-spacing:1.5px;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.badge-dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:#ff3b30;box-shadow:0 0 10px #ff3b30;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ LEVEL SCREEN ============ */
#level-screen{padding:48px 0 0 0;justify-content:flex-start;overflow:hidden;background:linear-gradient(180deg,#1e0f3c,#0f0825)}
#restaurant-scene{
  width:100%;height:34vh;min-height:180px;max-height:250px;flex-shrink:0;
  background:#0a0518;position:relative;overflow:hidden;
  border-bottom:2px solid rgba(255,200,100,.3);
  box-shadow:0 4px 24px rgba(0,0,0,.7), inset 0 -20px 40px rgba(0,0,0,.5);
}
#restaurant-svg{width:100%;height:100%;display:block}
#level-content{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto;min-height:0}

#order-panel{
  background:linear-gradient(135deg,rgba(255,107,53,.22),rgba(255,140,66,.08));
  border:1px solid rgba(255,140,66,.5);border-radius:14px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:0 0 20px rgba(255,107,53,.15), inset 0 1px 0 rgba(255,255,255,.1);
}
#order-header{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:4px}
#order-customer{font-size:13px;font-weight:800;color:#ffd166;display:flex;align-items:center;gap:6px}
#order-timer{font-size:14px;font-weight:800;color:#4ecdc4;display:flex;align-items:center;gap:4px}
#order-timer .svg-icon{width:16px;height:16px}
#order-items{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.order-item{
  display:flex;align-items:center;justify-content:center;width:38px;height:38px;
  background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.2);border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.order-item .svg-icon{width:24px;height:24px}

#burger-stack{
  display:flex;flex-direction:column-reverse;align-items:center;gap:2px;
  min-height:80px;max-height:130px;overflow-y:auto;padding:6px;
  border:2px dashed rgba(255,209,102,.4);border-radius:12px;
  background:rgba(0,0,0,.4);
  box-shadow:inset 0 0 20px rgba(255,150,50,.08);
}
.burger-layer{
  width:85%;min-height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#1a0f2e;font-weight:900;padding:3px 8px;
  box-shadow:0 2px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5);
  animation:layerPop .22s cubic-bezier(.34,1.56,.64,1);
}
.burger-layer .svg-icon{width:16px;height:16px;margin-right:4px}
@keyframes layerPop{from{opacity:0;transform:scale(.7) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}

#ingredients-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.ingredient-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
  border:1px solid rgba(255,255,255,.2);border-radius:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  color:#fff;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:transform .1s,background .15s,box-shadow .2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 2px 6px rgba(0,0,0,.3);
}
.ingredient-btn:active{background:rgba(255,255,255,.22);transform:scale(.93);box-shadow:0 0 14px rgba(255,180,60,.6)}
.ingredient-btn .svg-icon{width:26px;height:26px}

#level-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
#level-actions button{flex:1}

/* ============ BUTTONS ============ */
.main-btn{
  padding:14px 20px;font-size:16px;font-weight:900;border:none;border-radius:12px;
  background:linear-gradient(135deg,#ff6b35,#ff8c42);color:#fff;cursor:pointer;
  box-shadow:0 4px 18px rgba(255,107,53,.5), inset 0 1px 0 rgba(255,255,255,.35);
  font-family:inherit;letter-spacing:.3px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.main-btn:active{transform:scale(.97)}
.main-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.main-btn .svg-icon{width:18px;height:18px}
.secondary-btn{
  padding:12px 18px;font-size:14px;font-weight:700;
  border:1px solid rgba(255,255,255,.28);border-radius:10px;
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.secondary-btn:active{background:rgba(255,255,255,.2)}

/* ============ HEADINGS ============ */
#lobby h2,#levels-screen h2,#tasks-screen h2,#afk-screen h2,#daily-screen h2,
#shop-screen h2,#settings-screen h2,#tutorial-screen h2,#result-screen h2,
#achievements-screen h2{
  font-size:22px;font-weight:900;margin-bottom:14px;
  background:linear-gradient(135deg,#ffd166,#ff8c42);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;letter-spacing:.5px;
}

/* ============ LEVELS GRID ============ */
#levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px;max-height:60vh;overflow-y:auto;width:100%;max-width:520px;padding:4px}
.level-btn{
  aspect-ratio:1;border:1px solid rgba(255,255,255,.22);border-radius:10px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  color:#fff;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;
}
.level-btn.completed{background:linear-gradient(135deg,rgba(78,205,196,.5),rgba(78,205,196,.2));border-color:#4ecdc4;color:#d6fffb;box-shadow:0 0 12px rgba(78,205,196,.4)}
.level-btn.locked{opacity:.3;cursor:not-allowed}
.level-btn.current{border-color:#ffd166;box-shadow:0 0 14px rgba(255,209,102,.8);background:linear-gradient(135deg,rgba(255,209,102,.3),rgba(255,140,66,.15))}

/* ============ TASKS ============ */
#tasks-list{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding:4px}
.task-item{
  display:flex;justify-content:space-between;align-items:center;padding:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border-radius:12px;border:1px solid rgba(255,255,255,.12);gap:10px;
}
.task-item.completed{border-color:#4ecdc4;background:rgba(78,205,196,.16);box-shadow:0 0 14px rgba(78,205,196,.25)}

/* ============ ACHIEVEMENTS ============ */
#achievements-list{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding:4px}
.ach-item{display:flex;gap:12px;align-items:center;padding:12px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:12px}
.ach-item.unlocked{border-color:#ffd166;background:linear-gradient(160deg,rgba(255,209,102,.2),rgba(255,140,66,.08));box-shadow:0 0 16px rgba(255,180,60,.3)}
.ach-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.03));flex-shrink:0}
.ach-icon .svg-icon{width:26px;height:26px;color:#ffd166}
.ach-item:not(.unlocked) .ach-icon .svg-icon{color:#666;opacity:.5}

/* ============ SETTINGS ============ */
#settings-screen label{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px;width:100%;max-width:340px}
#settings-screen select,#promo-input,#name-input{
  padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);color:#fff;font-size:15px;
  width:100%;max-width:340px;font-family:inherit;outline:none;
}
#settings-screen input[type=checkbox]{width:20px;height:20px;accent-color:#ff6b35}
.promo-section{display:flex;flex-direction:column;gap:8px;margin:16px 0;width:100%;max-width:340px;align-items:center}

/* ============ КАСТОМНЫЙ SELECT ============ */
#settings-screen select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  padding:12px 42px 12px 14px;
  border-radius:10px;
  border:1px solid rgba(255,200,100,.35);
  background-color:rgba(255,255,255,.08);
  background-image:
    linear-gradient(135deg,rgba(255,107,53,.18),rgba(255,209,102,.06)),
    url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3e%3cpath fill='%23ffd166' d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
  background-repeat:no-repeat,no-repeat;
  background-position:0 0,right 12px center;
  background-size:100% 100%,20px;
  color:#fff;font-size:15px;font-weight:700;font-family:inherit;
  outline:none;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 2px 8px rgba(0,0,0,.3);
  width:100%;max-width:340px;
}
#settings-screen select:focus{
  border-color:#ffd166;
  box-shadow:0 0 0 2px rgba(255,209,102,.3);
}
#settings-screen select option{
  background-color:#1a0f2e;
  color:#fff;
  padding:10px;
  font-size:15px;
}
#settings-screen select option:checked{
  background:linear-gradient(135deg,#ff6b35,#ff8c42);
  color:#fff;
}

/* ============ SHOP ============ */
#shop-categories{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 10px;width:100%;max-width:560px;-webkit-overflow-scrolling:touch}
.shop-cat{
  flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
  color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.shop-cat.active{background:linear-gradient(135deg,#ff6b35,#ff8c42);border-color:transparent;box-shadow:0 4px 14px rgba(255,107,53,.5)}
.shop-cat .svg-icon{width:16px;height:16px}
#shop-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:55vh;overflow-y:auto;width:100%;max-width:560px;padding:4px}
.shop-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.14);border-radius:14px;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}
.shop-item .preview{width:60px;height:60px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);overflow:hidden;position:relative}
.shop-item .preview .svg-icon{width:40px;height:40px}
.shop-item .price{color:#ffd166;font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px}
.shop-item .price .svg-icon{width:14px;height:14px}
.shop-item button{width:100%;padding:8px;font-size:12px}
.shop-item .item-name{font-size:12px;font-weight:700}

/* ============ TOAST / MODAL ============ */
.toast{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(255,107,53,.98),rgba(255,140,66,.98));
  padding:12px 22px;border-radius:14px;color:#fff;font-weight:800;z-index:1000;
  animation:fadeInOut 2.2s ease-in-out;max-width:80%;text-align:center;font-size:13px;
  box-shadow:0 8px 28px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3);
}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-12px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.modal-bg{
  position:fixed;inset:0;background:rgba(5,2,15,.88);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  z-index:1000;padding:20px;text-align:center;
}
.modal-bg h2{font-size:18px;max-width:400px;line-height:1.4;color:#ffd166}
.modal-bg button{min-width:200px}

/* ============ LEVEL UP FX ============ */
.levelup-fx{
  position:fixed;inset:0;pointer-events:none;z-index:900;display:flex;align-items:center;justify-content:center;
}
.levelup-fx span{
  font-size:48px;font-weight:900;
  background:linear-gradient(135deg,#ffd166,#ff6b35);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:levelupAnim 1.6s ease-out forwards;
  text-shadow:0 0 40px rgba(255,180,60,.8);
}
@keyframes levelupAnim{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4) translateY(-40px)}}

/* ============ SVG CUSTOMERS ============ */
.customer-svg{cursor:pointer;transition:transform .2s}
.customer-svg.selected{filter:drop-shadow(0 0 12px #ffd166)}
.customer-svg.served{opacity:0;pointer-events:none;transition:opacity .4s}

/* ============ AFK / DAILY ============ */
.stat-row{display:flex;justify-content:space-between;width:100%;max-width:320px;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:12px;border:1px solid rgba(255,255,255,.12);margin-bottom:8px;font-size:14px;align-items:center}
.stat-row .val{font-weight:900;color:#ffd166;display:flex;align-items:center;gap:4px}

/* Streak visual */
.streak-days{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap;justify-content:center}
.streak-day{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);font-size:12px;font-weight:800;color:#888}
.streak-day.done{background:linear-gradient(135deg,#ff6b35,#ffd166);border-color:#ffd166;color:#fff;box-shadow:0 0 12px rgba(255,180,60,.6)}
.streak-day.today{border-color:#4ecdc4;box-shadow:0 0 14px rgba(78,205,196,.7)}

/* ============ AD LOADING OVERLAY ============ */
.ad-loading-overlay{
    position:fixed;inset:0;z-index:3000;
    display:flex;align-items:center;justify-content:center;
    background:rgba(5,2,15,.9);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    animation:adFadeIn .25s ease;
}
@keyframes adFadeIn{from{opacity:0}to{opacity:1}}
.ad-loading-box{
    display:flex;flex-direction:column;align-items:center;gap:18px;
    padding:32px 44px;
    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1px solid rgba(255,200,100,.35);
    border-radius:22px;
    box-shadow:0 0 60px rgba(255,107,53,.35), inset 0 1px 0 rgba(255,255,255,.12);
}
.ad-spinner{
    width:60px;height:60px;border-radius:50%;
    border:4px solid rgba(255,209,102,.18);
    border-top-color:#ff6b35;
    border-right-color:#ffd166;
    animation:adspin .9s linear infinite;
    box-shadow:0 0 24px rgba(255,140,66,.45);
}
@keyframes adspin{to{transform:rotate(360deg)}}
.ad-loading-text{
    font-size:14px;font-weight:800;color:#ffd166;
    text-align:center;max-width:260px;line-height:1.4;
    text-shadow:0 0 12px rgba(255,209,102,.4);
    letter-spacing:.3px;
}

/* ============ CUSTOM SELECT (Язык) ============ */
.setting-row{
    display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px;
    margin:14px 0;font-size:15px;font-weight:700;color:#fff;
}
.custom-select{position:relative;width:100%;font-family:inherit;z-index:10}
.custom-select-trigger{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;border-radius:14px;
    border:1px solid rgba(255,200,100,.35);
    background:
        linear-gradient(135deg,rgba(255,107,53,.18),rgba(255,209,102,.06)),
        rgba(255,255,255,.04);
    color:#fff;font-size:15px;font-weight:800;cursor:pointer;
    font-family:inherit;letter-spacing:.2px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 14px rgba(0,0,0,.35);
    transition:border-color .2s, box-shadow .2s, transform .1s;
}
.custom-select-trigger:hover{
    border-color:#ffd166;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        0 0 0 3px rgba(255,209,102,.15),
        0 6px 20px rgba(255,107,53,.4);
}
.custom-select-trigger:active{transform:scale(.98)}
.custom-select-chevron{
    width:18px;height:18px;color:#ffd166;flex-shrink:0;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 0 6px rgba(255,209,102,.5));
}
.custom-select.open .custom-select-chevron{transform:rotate(180deg)}
.custom-select-list{
    position:absolute;top:calc(100% + 8px);left:0;right:0;
    list-style:none;margin:0;padding:6px;
    background:linear-gradient(160deg,#2a1850,#1a0f2e);
    border:1px solid rgba(255,200,100,.45);
    border-radius:14px;
    box-shadow:
        0 14px 44px rgba(0,0,0,.7),
        0 0 24px rgba(255,107,53,.25),
        inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0;visibility:hidden;
    transform:translateY(-8px) scale(.97);
    transform-origin:top center;
    transition:opacity .2s, transform .2s, visibility .2s;
    overflow:hidden;
}
.custom-select.open .custom-select-list{
    opacity:1;visibility:visible;transform:translateY(0) scale(1);
}
.custom-select-list li{
    padding:12px 14px;border-radius:10px;font-size:14px;font-weight:800;
    color:#fff;cursor:pointer;
    display:flex;align-items:center;gap:10px;
    transition:background .18s, color .18s, transform .12s;
    position:relative;
}
.custom-select-list li:hover{
    background:linear-gradient(135deg,#ff6b35,#ff8c42);
    color:#fff;
    box-shadow:0 4px 14px rgba(255,107,53,.55);
    transform:translateX(2px);
}
.custom-select-list li.selected{
    background:linear-gradient(135deg,rgba(255,209,102,.28),rgba(255,140,66,.14));
    color:#ffd166;
}
.custom-select-list li.selected::after{
    content:'✓';margin-left:auto;font-weight:900;color:#ffd166;font-size:16px;
}
.custom-select-list li.selected:hover::after{color:#fff}
.lang-flag{font-size:18px;line-height:1}

@media (max-width:480px){
  .lobby-grid{max-width:340px;gap:8px}
  .menu-card{min-height:80px;padding:10px 6px}

  .menu-card .menu-label{font-size:10px}
  .menu-card.play-card .menu-label{font-size:18px}
  #restaurant-scene{height:30vh;min-height:150px}
}

/* ===== КАСТОМНЫЙ SELECT ЯЗЫКА ===== */
function syncLanguageSelect(){
    const sel   = document.getElementById('language-select');
    const wrap  = document.getElementById('lang-custom');
    const label = document.getElementById('lang-select-value');
    if(!sel || !wrap || !label) return;
    const opt = sel.options[sel.selectedIndex];
    if(opt) label.textContent = opt.textContent;
    wrap.querySelectorAll('.custom-select-list li').forEach(li=>{
        li.classList.toggle('selected', li.dataset.value === sel.value);
    });
}
function initLanguageSelect(){
    const sel  = document.getElementById('language-select');
    const wrap = document.getElementById('lang-custom');
    if(!sel || !wrap) return;
    const trigger = wrap.querySelector('.custom-select-trigger');

    trigger.addEventListener('click', e=>{
        e.stopPropagation();
        wrap.classList.toggle('open');
    });
    wrap.querySelectorAll('.custom-select-list li').forEach(li=>{
        li.addEventListener('click', ()=>{
            sel.value = li.dataset.value;
            sel.dispatchEvent(new Event('change'));
            syncLanguageSelect();
            wrap.classList.remove('open');
            AudioManager.playSound('click');
        });
    });
    document.addEventListener('click', e=>{
        if(!wrap.contains(e.target)) wrap.classList.remove('open');
    });
    document.addEventListener('keydown', e=>{
        if(e.key === 'Escape') wrap.classList.remove('open');
    });
    syncLanguageSelect();
}

/* ============================================================
   VK BRIDGE
============================================================ */
const VKBridge = {
    available: typeof vkBridge !== 'undefined',
    init(){
        if(!this.available){ console.warn('VK Bridge not loaded'); return; }
        vkBridge.send('VKWebAppInit').catch(e=>console.warn(e));
        this.setupViewHandlers();
    },
    async saveData(key, value){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppStorageSet',{key, value:JSON.stringify(value)}); return true; }
        catch(e){ return false; }
    },
    async loadData(key){
        if(!this.available) return null;
        try{
            const r = await vkBridge.send('VKWebAppStorageGet',{keys:[key]});
            if(r.keys && r.keys[0] && r.keys[0].value) return JSON.parse(r.keys[0].value);
            return null;
        }catch(e){ return null; }
    },
    async clearAllData(){
        if(!this.available) return false;
        try{
            const r = await vkBridge.send('VKWebAppStorageGetKeys',{count:1000, offset:0});
            if(r.keys) for(const k of r.keys) await vkBridge.send('VKWebAppStorageSet',{key:k, value:''});
            return true;
        }catch(e){ return false; }
    },
    async showInterstitial(){
        if(!this.available) return false;
        showAdLoading();
        const minDelay = new Promise(r=>setTimeout(r, 700));
        try{
            const adPromise = vkBridge.send('VKWebAppShowNativeAds',{ad_format:'interstitial'});
            await Promise.all([adPromise, minDelay]);
            return true;
        }catch(e){
            await minDelay;
            return false;
        }finally{
            hideAdLoading();
        }
    },
    async showRewarded(){
        if(!this.available) return false;
        showAdLoading();
        const minDelay = new Promise(r=>setTimeout(r, 700));
        try{
            const adPromise = vkBridge.send('VKWebAppShowNativeAds',{ad_format:'reward'});
            const r = await adPromise;
            await minDelay;
            return r && r.result === true;
        }catch(e){
            await minDelay;
            return false;
        }finally{
            hideAdLoading();
        }
    },
    async showBanner(){
        if(!this.available) return;
        try{
            await vkBridge.send('VKWebAppGetLaunchParams');
            await vkBridge.send('VKWebAppShowBannerAd',{banner_location:'bottom'});
        }catch(e){}
    },
    async inviteFriends(){
        if(!this.available) return false;
        try{ await vkBridge.send('VKWebAppShowInviteBox'); return true; }
        catch(e){ return false; }
    },
    setupViewHandlers(){
        if(this.available){
            try{
                vkBridge.subscribe(e=>{
                    if(!e || !e.detail) return;
                    if(e.detail.type === 'VKWebAppViewHide'){
                        AudioManager.pauseMusic(); if(window.Game) Game.pause();
                    } else if(e.detail.type === 'VKWebAppViewRestore'){
                        AudioManager.resumeMusic(); if(window.Game) Game.resume();
                    }
                });
            }catch(e){}
        }
        document.addEventListener('visibilitychange',()=>{
            if(document.hidden){ AudioManager.pauseMusic(); if(window.Game) Game.pause(); }
            else { AudioManager.resumeMusic(); if(window.Game) Game.resume(); }
        });
    }
};

/* ============================================================
   AUDIO
============================================================ */
const AudioManager = {
    musicEnabled: true, musicPlaying: false, audioContext: null, musicTimer: null,
    notes: [262, 294, 330, 349, 392, 440, 494, 523],
    init(){
        const go = ()=>{
            if(!this.audioContext){
                try{ this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
            }
            if(this.audioContext && this.audioContext.state === 'suspended') this.audioContext.resume();
            document.removeEventListener('touchstart', go);
            document.removeEventListener('click', go);
        };
        document.addEventListener('touchstart', go, {once:true});
        document.addEventListener('click', go, {once:true});
    },
    playNote(){
        if(!this.musicPlaying || !this.musicEnabled || !this.audioContext) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = this.notes[Math.floor(Math.random()*this.notes.length)];
        const now = this.audioContext.currentTime;
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(gain); gain.connect(this.audioContext.destination);
        osc.start(now); osc.stop(now + 0.6);
        this.musicTimer = setTimeout(()=>this.playNote(), 700);
    },
    startMusic(){
        if(!this.musicEnabled || this.musicPlaying || !this.audioContext) return;
        this.musicPlaying = true;
        this.playNote();
    },
    stopMusic(){
        this.musicPlaying = false;
        if(this.musicTimer){ clearTimeout(this.musicTimer); this.musicTimer = null; }
    },
    pauseMusic(){ this.stopMusic(); },
    resumeMusic(){ if(this.musicEnabled) this.startMusic(); },
    toggleMusic(enabled){
        this.musicEnabled = enabled;
        if(enabled) this.startMusic(); else this.stopMusic();
    },
    playSound(type){
        if(!this.audioContext) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        const now = this.audioContext.currentTime;
        if(type === 'click'){
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if(type === 'correct'){
            osc.frequency.value = 523;
            osc.frequency.linearRampToValueAtTime(1046, now + 0.2);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if(type === 'error'){
            osc.type = 'sawtooth';
            osc.frequency.value = 200;
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if(type === 'coin'){
            osc.frequency.value = 1200;
            osc.frequency.linearRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        }
        osc.connect(gain); gain.connect(this.audioContext.destination);
    }
};

const Levels = {
    totalLevels: 500,
    getLevel(n){
        const customerCount = Math.min(2 + Math.floor(n/100), 6);
        const fillingCount = Math.min(1 + Math.floor(n/80), 4);
        const timeLimit = Math.max(90 - Math.floor(n/30)*10, 60) + customerCount * 15;
        const rewardPerCustomer = 40 + n * 5;
        const totalReward = rewardPerCustomer * customerCount;
        let available = [...Ingredients.base];
        Ingredients.premium.forEach(ing=>{
            if(GameState.purchasedIngredients.includes(ing.id)) available.push(ing);
        });
        const fillings = available.filter(i=>i.id !== 'bun_bottom' && i.id !== 'bun_top');
        const customers = [];
        for(let i=0; i<customerCount; i++){
            const shuffled = [...fillings].sort(()=>Math.random()-0.5);
            const chosen = shuffled.slice(0, fillingCount);
            customers.push(['bun_bottom','patty', ...chosen.map(c=>c.id), 'bun_top']);
        }
        return { level:n, customers, timeLimit, reward:totalReward, rewardPerCustomer,
                 availableIngredients: available.map(i=>i.id) };
    }
};

        if(saved && saved.lastTaskUpdate === today && saved.dailyTasks){

            this.progress = saved.taskProgress || {};

        const shuffled = [...this.taskPool].sort(()=>Math.random()-0.5);

        this.dailyTasks.forEach(task=>{
            if(task.completed || task.type !== type) return;
            this.progress[task.id] = (this.progress[task.id] || 0) + amount;
            if(this.progress[task.id] >= task.target){

                GameState.save();
                if(window.Game) Game.showToast('✓ ' + this.getTaskText(task));

const AFKRoom = {

        if(this.active) return;

        this.updateUI();
        this.interval = setInterval(()=>{
            if(!this.active) return;
            this.accumulatedCoins += this.rate;
            this.totalMinutes += 1;

            GameState.save();
            this.updateUI();
            if(window.Game) Game.updateCurrencyDisplay();
        }, 60000);
    },
    stop(){
        this.active = false;
        if(this.interval){ clearInterval(this.interval); this.interval = null; }
    },
    updateUI(){
        const r = document.getElementById('afk-rate');
        const e = document.getElementById('afk-earned');

        if(!this.claimedMilestones) this.claimedMilestones = [];
        if(!this.restaurantName) this.restaurantName = 'Бургерная';
        if(saved.tasks) Tasks.init(saved.tasks); else Tasks.init(null);
        if(saved.afk){
            AFKRoom.totalMinutes = saved.afk.totalMinutes || 0;
            AFKRoom.rate = saved.afk.rate || 1;
        }
        return true;

        if(this._saveTimeout) clearTimeout(this._saveTimeout);

        this.customersServed = 0;

        this.tutorialStep = 0;

    async init(){
        this.resizeCanvas();
        window.addEventListener('resize', ()=>this.resizeCanvas());
        VKBridge.init();
        const hasSave = await GameState.load();

        AudioManager.toggleMusic(GameState.musicEnabled);
        document.getElementById('music-toggle').checked = GameState.musicEnabled;
        document.getElementById('language-select').value = GameState.language;
        document.getElementById('name-input').value = GameState.restaurantName;
        currentLang = GameState.language;

        this.applyLanguage();
        this.updateRestaurantTitle();

        if(!hasSave) Tasks.init(null);

        this.setupEventListeners();
        initLanguageSelect();
        syncLanguageSelect();
        this.updateCurrencyDisplay();
        this.checkDailyBadge();
        VKBridge.showBanner();

        if(!GameState.tutorialCompleted){
            this.showTutorialPrompt();
        } else {
            this.showScreen('lobby');
        }

        this.lastTime = performance.now();
        this.gameLoop(this.lastTime);
    }

    applyLanguage(){
        // 1) Кнопки лобби
        document.querySelector('#play-btn .menu-label').textContent = t('play');
        const map = {
            'levels-btn':'levels', 'shop-btn':'shop', 'tasks-btn':'tasks',
            'daily-btn':'daily_reward', 'afk-btn':'afk_room', 'achievements-btn':'achievements',
            'invite-btn':'invite_friends'
        };
        for(const [id, key] of Object.entries(map)){
            const el = document.getElementById(id);
            if(el){ const l = el.querySelector('.menu-label'); if(l) l.textContent = t(key); }
        }

        // 2) Кнопки на экранах
        const set = (id, key)=>{ const el = document.getElementById(id); if(el) el.textContent = t(key); };
        set('serve-btn','serve'); set('clear-btn','clear');
        set('double-reward-btn','double_reward');
        set('next-level-btn','next_level'); set('back-lobby-btn','back_lobby');
        set('tutorial-next','tutorial_next'); set('tutorial-skip','tutorial_skip');
        set('daily-claim','claim');
        set('levels-back','back'); set('tasks-back','back'); set('afk-back','back');
        set('daily-back','back'); set('shop-back','back'); set('settings-back','back');
        set('achievements-back','back');
        set('promo-btn','activate');
        set('save-name-btn','save_name_btn');

        // 3) Заголовки и подписи через data-i18n
        document.querySelectorAll('[data-i18n]').forEach(el=>{
            const key = el.dataset.i18n;
            el.textContent = t(key);
        });

        // 4) Placeholder'ы
        const nameInput = document.getElementById('name-input');
        if(nameInput) nameInput.placeholder = t('placeholder_name');
        const promoInput = document.getElementById('promo-input');
        if(promoInput) promoInput.placeholder = t('placeholder_promo');

        // 5) Заголовок обучения
        const tut = document.getElementById('tutorial-title');
        if(tut) tut.textContent = t('tutorial_header');

        // 6) Обновляем HTML lang атрибут
        document.documentElement.lang = currentLang;
        syncLanguageSelect();

        // 7) Перерисовка активных динамических экранов
        try{
            if(document.getElementById('tasks-screen').classList.contains('active')) this.renderTasks();
            if(document.getElementById('achievements-screen').classList.contains('active')) this.renderAchievements();
            if(document.getElementById('shop-screen').classList.contains('active')) this.renderShop();
            if(document.getElementById('levels-screen').classList.contains('active')) this.renderLevelsGrid();
            if(document.getElementById('level-screen').classList.contains('active')){
                this.renderOrderPanel();
                this.renderIngredients();
                this.renderBurgerStack();
            }
        }catch(e){}
    }

    updateRestaurantTitle(){
        const el = document.getElementById('restaurant-title-display');
        if(el) el.textContent = GameState.restaurantName;
    }

    resizeCanvas(){
        const dpr = window.devicePixelRatio || 1;
        const rect = this.canvas.getBoundingClientRect();
        this.canvas.width = rect.width * dpr;
        this.canvas.height = rect.height * dpr;
        this.ctx.setTransform(1,0,0,1,0,0);
        this.ctx.scale(dpr, dpr);
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
        this.canvas._w = rect.width;
        this.canvas._h = rect.height;
    }

    gameLoop(timestamp){
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;
        if(!this.paused){
            this.update(dt);
            this.render();
        }
        this.animationFrame = requestAnimationFrame(t=>this.gameLoop(t));
    }

    update(dt){
        this.backgroundOffset = (this.backgroundOffset + dt * 20) % 40;
        this.particles = this.particles.filter(p=>{
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 500 * dt;
            return p.life > 0;
        });
    }

    render(){
        const w = this.canvas._w || 300, h = this.canvas._h || 300;
        const grad = this.ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a0f2e');
        grad.addColorStop(1, '#0f0820');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, w, h);

        const time = performance.now() / 1000;
        const glow = this.ctx.createRadialGradient(
            w/2 + Math.sin(time*.3)*w*.3, h/2 + Math.cos(time*.2)*h*.3,
            0, w/2, h/2, Math.max(w,h)
        );
        glow.addColorStop(0, 'rgba(255,107,53,0.10)');
        glow.addColorStop(1, 'rgba(255,107,53,0)');
        this.ctx.fillStyle = glow;
        this.ctx.fillRect(0, 0, w, h);

        this.ctx.fillStyle = 'rgba(255,255,255,0.025)';
        const tile = 40;
        for(let x = -tile; x < w + tile; x += tile){
            for(let y = -tile; y < h + tile; y += tile){
                this.ctx.fillRect(x + this.backgroundOffset, y, tile - 2, tile - 2);
            }
        }

        this.particles.forEach(p=>{
            this.ctx.globalAlpha = Math.min(1, p.life);
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(p.x, p.y, 4, 4);
        });
        this.ctx.globalAlpha = 1;
    }

    spawnParticle(x, y, color){
        this.particles.push({
            x, y, vx:(Math.random()-.5)*200, vy:-150 - Math.random()*150,
            life: 1.2, color
        });
    }

    showScreen(id){
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        const el = document.getElementById(id);
        if(el) el.classList.add('active');
        if(id === 'lobby'){ this.updateRestaurantTitle(); this.checkDailyBadge(); }
    }

    checkDailyBadge(){
        const today = new Date().toDateString();
        const badge = document.getElementById('daily-badge');
        if(badge) badge.style.display = (GameState.lastDailyReward !== today) ? 'block' : 'none';
    }

    setupEventListeners(){
        const bind = (id, fn)=>{
            const el = document.getElementById(id);
            if(el) el.addEventListener('click', ()=>{ AudioManager.playSound('click'); fn(); });
        };

        bind('play-btn', ()=>this.startLevel(GameState.currentLevel));
        bind('levels-btn', ()=>{ this.renderLevelsGrid(); this.showScreen('levels-screen'); });
        bind('tasks-btn', ()=>{ this.renderTasks(); this.showScreen('tasks-screen'); });
        bind('afk-btn', ()=>{ AFKRoom.start(); AFKRoom.updateUI(); this.showScreen('afk-screen'); });
        bind('daily-btn', ()=>{ this.checkDailyReward(); this.showScreen('daily-screen'); });
        bind('shop-btn', ()=>{ this.renderShop(); this.showScreen('shop-screen'); });
        bind('achievements-btn', ()=>{ this.renderAchievements(); this.showScreen('achievements-screen'); });
        bind('invite-btn', ()=>{ VKBridge.inviteFriends(); Tasks.updateProgress('invite', 1); });
        bind('settings-btn', ()=>this.showScreen('settings-screen'));
        bind('settings-back', ()=>this.showScreen('lobby'));
        bind('levels-back', ()=>this.showScreen('lobby'));
        bind('tasks-back', ()=>this.showScreen('lobby'));
        bind('afk-back', ()=>{ AFKRoom.stop(); this.showScreen('lobby'); });
        bind('daily-back', ()=>this.showScreen('lobby'));
        bind('shop-back', ()=>this.showScreen('lobby'));
        bind('achievements-back', ()=>this.showScreen('lobby'));
        bind('serve-btn', ()=>this.serveBurger());
        bind('clear-btn', ()=>this.clearBurger());
        bind('daily-claim', ()=>this.claimDailyReward());
        bind('promo-btn', ()=>this.handlePromoCode());
        bind('tutorial-next', ()=>this.nextTutorialStep());
        bind('tutorial-skip', ()=>this.skipTutorial());
        bind('next-level-btn', ()=>this.startLevel(Math.min(GameState.currentLevel + 1, 500)));
        bind('back-lobby-btn', ()=>this.showScreen('lobby'));
        bind('save-name-btn', ()=>this.saveName());

        document.getElementById('music-toggle').addEventListener('change', e=>{
            GameState.musicEnabled = e.target.checked;
            AudioManager.toggleMusic(e.target.checked);
            GameState.save();
        });
        document.getElementById('language-select').addEventListener('change', e=>{
            GameState.language = e.target.value;
            currentLang = e.target.value;
            this.applyLanguage();
            GameState.save();
        });
        document.getElementById('double-reward-btn').addEventListener('click', async ()=>{
            AudioManager.pauseMusic();
            const ok = await VKBridge.showRewarded();
            AudioManager.resumeMusic();
            if(ok){
                GameState.coins += this.currentReward;
                GameState.totalCoinsEarned += this.currentReward;
                GameState.save();
                this.updateCurrencyDisplay();
                const btn = document.getElementById('double-reward-btn');
                btn.disabled = true;
                btn.textContent = '✓ +' + this.currentReward;
            }
        });

    /* ===== УРОВЕНЬ ===== */
    async startLevel(levelNum){
        this.paused = true;
        AudioManager.pauseMusic();
        await VKBridge.showInterstitial();
        AudioManager.resumeMusic();
        this.paused = false;

        GameState.currentLevel = levelNum;
        const data = Levels.getLevel(levelNum);

        this.customersTotal = data.customers.length;
        this.customersServed = 0;
        this.currentReward = data.reward;
        this.rewardPerCustomer = data.rewardPerCustomer;
        this.timeLeft = data.timeLimit;
        this.availableIngredients = data.availableIngredients;
        this.combo = 0;

        const positions = this.getCustomerPositions(this.customersTotal);
        const namesArr = currentLang === 'en' ? CUSTOMER_NAMES_EN : CUSTOMER_NAMES;
        this.customers = data.customers.map((order, i)=>({
            x: positions[i], y: 250,
            color: CUSTOMER_COLORS[Math.floor(Math.random()*CUSTOMER_COLORS.length)],
            skin: SKIN_COLORS[Math.floor(Math.random()*SKIN_COLORS.length)],
            hair: HAIR_COLORS[Math.floor(Math.random()*HAIR_COLORS.length)],
            order: order, served: false,
            name: namesArr[Math.floor(Math.random()*namesArr.length)]
        }));

        this.selectedCustomer = 0;
        this.currentBurger = [];

        this.renderScene();
        this.renderCustomers();
        this.renderOrderPanel();
        this.renderIngredients();
        this.renderBurgerStack();
        this.updateTimerDisplay();
        this.showScreen('level-screen');
        this.gameActive = true;

        if(this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(()=>{
            if(!this.gameActive || this.paused) return;
            this.timeLeft--;
            this.updateTimerDisplay();
            if(this.timeLeft <= 0) this.failLevel();
        }, 1000);

        GameState.save();
    }

    getCustomerPositions(count){
        const spacing = 800 / (count + 1);
        const positions = [];
        for(let i=0; i<count; i++) positions.push(spacing * (i + 1));
        return positions;
    }

                    <ellipse cx="0" cy="-2" rx="42" ry="6" fill="${tableItem.color}" opacity=".8"/>
                </g>
                <g transform="translate(${tx-60},252)">
                    <rect x="-8" y="0" width="16" height="6" fill="${chairItem.color}"/>
                    <rect x="-8" y="-16" width="16" height="14" rx="2" fill="${chairItem.color}"/>
                </g>
                <g transform="translate(${tx+60},252)">
                    <rect x="-8" y="0" width="16" height="6" fill="${chairItem.color}"/>
                    <rect x="-8" y="-16" width="16" height="14" rx="2" fill="${chairItem.color}"/>
                </g>
            `;
        });
        return out;
    }

    escapeXml(s){
        return s.replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
    }

    selectCustomer(i){
        if(!this.gameActive) return;
        if(!this.customers[i] || this.customers[i].served) return;
        this.selectedCustomer = i;
        AudioManager.playSound('click');
        this.renderCustomers();
        this.renderOrderPanel();
    }

    renderOrderPanel(){
        const nameEl = document.getElementById('order-customer');
        const itemsEl = document.getElementById('order-items');
        if(this.selectedCustomer === null || !this.customers[this.selectedCustomer] || this.customers[this.selectedCustomer].served){
            nameEl.innerHTML = icon('user') + ' ' + t('order_select');
            itemsEl.innerHTML = '';

        const c = this.customers[this.selectedCustomer];

    renderIngredients(){
        const c = document.getElementById('ingredients-list');
        c.innerHTML = '';
        this.availableIngredients.forEach(id=>{
            const ing = Ingredients.find(id);
            if(!ing) return;
            const btn = document.createElement('button');
            btn.className = 'ingredient-btn';
            btn.innerHTML = ingIcon(id) + `<span>${Ingredients.getName(id)}</span>`;
            btn.addEventListener('click', ()=>this.addIngredient(id));
            c.appendChild(btn);

    addIngredient(id){
        if(!this.gameActive) return;
        if(this.selectedCustomer === null){
            this.showToast(t('select_customer'));
            return;
        }
        this.currentBurger.push(id);
        this.renderBurgerStack();
        AudioManager.playSound('click');
        Tasks.updateProgress('use_ingredient', 1);
    }

    renderBurgerStack(){
        const c = document.getElementById('burger-stack');
        c.innerHTML = '';
        this.currentBurger.forEach(id=>{
            const layer = document.createElement('div');
            layer.className = 'burger-layer';
            layer.style.background = Ingredients.getColor(id);
            layer.innerHTML = ingIcon(id) + '<span>' + Ingredients.getName(id) + '</span>';
            c.appendChild(layer);
        });
    }

    serveBurger(){
        if(!this.gameActive) return;
        if(this.selectedCustomer === null){
            this.showToast(t('select_customer'));
            return;
        }
        const c = this.customers[this.selectedCustomer];
        if(!c || c.served) return;

        if(this.arraysEqualSet(this.currentBurger, c.order)){
            AudioManager.playSound('correct');
            c.served = true;
            this.customersServed++;

            this.combo++;
            if(this.combo > GameState.bestCombo) GameState.bestCombo = this.combo;
            const comboMult = 1 + Math.min(0.5, (this.combo - 1) * 0.1);
            const reward = Math.round(this.rewardPerCustomer * comboMult);

            GameState.coins += reward;
            GameState.totalCoinsEarned += reward;
            GameState.totalBurgersServed++;
            GameState.totalPerfectBurgers++;
            this.updateCurrencyDisplay();

            Tasks.updateProgress('serve', 1);
            Tasks.updateProgress('earn', reward);
            Tasks.updateProgress('perfect', 1);
            Achievements.check();

            const rect = document.getElementById('restaurant-scene').getBoundingClientRect();
            const px = rect.left + (c.x/800) * rect.width;
            const py = rect.top + (c.y/300) * rect.height - 40;
            for(let i=0; i<12; i++) this.spawnParticle(px, py, '#ffd166');

            this.currentBurger = [];
            this.renderBurgerStack();
            this.renderCustomers();

            if(this.customersServed >= this.customersTotal){
                this.completeLevel();
            } else {
                const next = this.customers.findIndex(cu=>!cu.served);
                this.selectedCustomer = next >= 0 ? next : null;
                this.renderOrderPanel();
                this.renderCustomers();
            }
            GameState.save();
        } else {
            AudioManager.playSound('error');
            this.showToast(t('wrong_order'));
            this.combo = 0;
            this.currentBurger = [];
            this.renderBurgerStack();
        }
    }

    arraysEqualSet(a, b){
        if(a.length !== b.length) return false;
        const sa = [...a].sort(), sb = [...b].sort();
        return sa.every((v, i)=>v === sb[i]);
    }

    clearBurger(){ this.currentBurger = []; this.renderBurgerStack(); }

    completeLevel(){
        this.gameActive = false;
        clearInterval(this.timerInterval);

        GameState.coins += this.currentReward;
        GameState.totalCoinsEarned += this.currentReward;

        if(!GameState.completedLevels.includes(GameState.currentLevel)){
            GameState.completedLevels.push(GameState.currentLevel);
        }
        if(GameState.currentLevel >= GameState.maxLevel){
            GameState.maxLevel = GameState.currentLevel + 1;
        }
        Tasks.updateProgress('earn', this.currentReward);
        Tasks.updateProgress('complete_levels', 1);
        Achievements.check();

        let milestoneBonus = 0;
        if(GameState.currentLevel % 10 === 0 && !GameState.claimedMilestones.includes(GameState.currentLevel)){
            GameState.claimedMilestones.push(GameState.currentLevel);
            milestoneBonus = GameState.currentLevel * 500;
            GameState.coins += milestoneBonus;
            this.showLevelUpFx('MILESTONE +' + milestoneBonus);
        }

        GameState.save();
        this.updateCurrencyDisplay();
        this.showLevelResult(milestoneBonus);
    }

    showLevelUpFx(text){
        const fx = document.createElement('div');
        fx.className = 'levelup-fx';
        fx.innerHTML = `<span>${text}</span>`;
        document.body.appendChild(fx);
        setTimeout(()=>fx.remove(), 1700);
    }

    failLevel(){
        this.gameActive = false;
        clearInterval(this.timerInterval);
        this.showToast(t('time_out'));
        setTimeout(()=>this.showScreen('lobby'), 1400);
    }

    showLevelResult(milestoneBonus=0){
        const stats = document.getElementById('result-stats');
        stats.innerHTML = `
            <p style="font-size:18px;color:#4ecdc4;font-weight:800">${t('level_num')} ${GameState.currentLevel}</p>
            <p style="color:#aaa;margin-top:6px">${t('served')} ${this.customersServed}/${this.customersTotal}</p>
            <p style="color:#aaa;margin-top:4px">${t('best_combo')} x${this.combo}</p>
            <p style="color:#ffd166;font-weight:900;margin-top:10px;font-size:22px;display:flex;align-items:center;justify-content:center;gap:6px">
                +${this.currentReward} ${icon('coin')}
            </p>
            ${milestoneBonus ? `<p style="color:#ff8c42;font-weight:800;margin-top:6px">🏆 ${t('milestone_bonus')} +${milestoneBonus}</p>` : ''}
        `;
        const btn = document.getElementById('double-reward-btn');
        btn.disabled = false;

    updateTimerDisplay(){
        const el = document.getElementById('timer-value');
        if(el){
            el.textContent = Math.max(0, this.timeLeft);
            el.parentElement.style.color = this.timeLeft <= 10 ? '#ff3b30' : '#4ecdc4';
        }
    }

    renderLevelsGrid(){
        const c = document.getElementById('levels-grid');
        c.innerHTML = '';
        for(let i=1; i<=500; i++){
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            btn.textContent = i;
            if(GameState.completedLevels.includes(i)) btn.classList.add('completed');
            if(i > GameState.maxLevel){ btn.classList.add('locked'); btn.disabled = true; }
            if(i === GameState.currentLevel) btn.classList.add('current');
            btn.addEventListener('click', ()=>{ if(!btn.disabled) this.startLevel(i); });
            c.appendChild(btn);
        }
    }

    renderTasks(){
        const c = document.getElementById('tasks-list');
        c.innerHTML = '';
        Tasks.dailyTasks.forEach(task=>{
            const el = document.createElement('div');
            el.className = 'task-item' + (task.completed ? ' completed' : '');
            const prog = Tasks.progress[task.id] || 0;
            const progText = task.completed ? '✅' : `${prog}/${task.target}`;
            el.innerHTML = `
                <div style="flex:1;min-width:0">
                    <div style="font-size:13px">${Tasks.getTaskText(task)}</div>
                    <small style="color:#aaa">${progText}</small>
                </div>
                <div style="text-align:right">
                    <div style="color:#ffd166;font-weight:800;display:flex;align-items:center;gap:4px;justify-content:flex-end">${task.reward} ${icon('coin')}</div>
                    ${task.completed && !task.claimed ? `<button class="main-btn" data-tid="${task.id}" style="margin-top:4px;padding:6px 12px;font-size:11px">${t('claim')}</button>` : ''}

    renderAchievements(){

                <div class="ach-icon"><svg class="svg-icon"><use href="#${ach.icon}"/></svg></div>

                    <div style="font-weight:800;font-size:13px">${Achievements.getName(ach)}</div>

            `;

    checkDailyReward(){
        const today = new Date().toDateString();
        const status = document.getElementById('daily-status');
        const btn = document.getElementById('daily-claim');

        if(GameState.lastDailyReward){
            const last = new Date(GameState.lastDailyReward);
            const now = new Date(today);
            const diffDays = Math.round((now - last) / (1000*60*60*24));
            if(diffDays > 1) GameState.streak = 0;
        }

        const streakEl = document.getElementById('streak-info');
        if(streakEl) streakEl.textContent = t('streak') + ': ' + GameState.streak + ' 🔥';
        const daysEl = document.getElementById('streak-days');
        if(daysEl){
            daysEl.innerHTML = '';
            for(let i=1; i<=7; i++){
                const d = document.createElement('div');
                d.className = 'streak-day' + (i <= GameState.streak ? ' done' : '');
                if(i === GameState.streak + 1) d.classList.add('today');
                d.textContent = i;
                daysEl.appendChild(d);
            }
        }

        if(GameState.lastDailyReward === today){
            status.textContent = t('daily_claimed');
            btn.disabled = true;
        } else {
            const reward = this.getStreakReward(GameState.streak + 1);
            status.innerHTML = `${t('day')} ${Math.min(GameState.streak+1, 7)}: +${reward} ${icon('coin')}`;
            btn.disabled = false;
        }
    }

    getStreakReward(day){
        const rewards = [100, 200, 400, 800, 1600, 3200, 6400];
        return rewards[Math.min(day-1, rewards.length-1)];
    }

    claimDailyReward(){
        const today = new Date().toDateString();
        if(GameState.lastDailyReward === today) return;
        const newStreak = GameState.streak + 1;
        GameState.streak = newStreak;
        GameState.lastDailyReward = today;
        const reward = this.getStreakReward(newStreak);
        GameState.coins += reward;
        GameState.totalCoinsEarned += reward;
        GameState.save();
        this.updateCurrencyDisplay();
        Achievements.check();
        this.checkDailyReward();
        this.checkDailyBadge();
        AudioManager.playSound('coin');
        this.showToast('+' + reward);
    }

    renderShop(){
        const catsEl = document.getElementById('shop-categories');
        const itemsEl = document.getElementById('shop-items');

        const cats = [
            {id:'ingredients', label:t('ingredients'), icon:'i-burger'},
            {id:'theme',       label:t('interior'),    icon:'f-painting'},
            {id:'table',       label:t('cat_tables'),  icon:'f-table'},
            {id:'chair',       label:t('cat_chairs'),  icon:'f-chair'},
            {id:'window',      label:t('cat_windows'), icon:'f-window'},
            {id:'floor',       label:t('cat_tiles'),   icon:'f-floor'},
            {id:'decor',       label:t('furniture'),   icon:'f-plant'},
            {id:'upgrades',    label:t('upgrades'),    icon:'i-star'}

        cats.forEach(cat=>{

            btn.className = 'shop-cat' + (this.shopCategory === cat.id ? ' active' : '');

        itemsEl.innerHTML = '';

        if(this.shopCategory === 'ingredients'){

                el.className = 'shop-item';

                `;
                if(!owned) el.querySelector('button').addEventListener('click', ()=>{
                    if(GameState.coins >= ing.price){
                        GameState.coins -= ing.price;
                        GameState.purchasedIngredients.push(ing.id);
                        GameState.save();
                        this.updateCurrencyDisplay();
                        this.renderShop();
                        AudioManager.playSound('coin');
                    } else this.showToast(t('not_enough_coins'));
                });
                itemsEl.appendChild(el);

        else if(this.shopCategory === 'theme'){

                el.className = 'shop-item';
                const themeName = (currentLang === 'en' && theme.name_en) ? theme.name_en : theme.name;

                    <div class="preview" style="background:linear-gradient(135deg,${theme.wall1},${theme.accent})">

                    if(owned){
                        GameState.restaurantTheme = theme.id;
                        GameState.save();
                        this.renderShop();

                `;

                        GameState.ownedFurniture.push(item.id);
                        GameState.selectedFurniture[this.shopCategory] = item.id;
                        GameState.save();
                        this.updateCurrencyDisplay();
                        this.renderShop();
                        Achievements.check();
                        AudioManager.playSound('coin');
                    } else this.showToast(t('not_enough_coins'));
                });
                itemsEl.appendChild(el);
            });
        }
    }

    async handlePromoCode(){
        const input = document.getElementById('promo-input');
        const code = input.value.trim().toLowerCase();
        if(code === 'clear12'){
            await VKBridge.clearAllData();
            this.showToast(t('promo_clear'));
            setTimeout(()=>location.reload(), 1200);
        } else if(code === 'admin17'){
            GameState.coins += 1000000;
            GameState.totalCoinsEarned += 1000000;
            GameState.save();
            this.updateCurrencyDisplay();
            this.showToast(t('promo_admin'));
        } else if(code === 'burger2024'){
            GameState.coins += 50000;
            GameState.save();
            this.updateCurrencyDisplay();
            this.showToast('+50 000');
        } else {
            this.showToast(t('promo_invalid'));
        }
        input.value = '';
    }

    showTutorialPrompt(){
        const modal = document.createElement('div');
        modal.className = 'modal-bg';
        modal.innerHTML = `<h2>${t('tutorial_prompt')}</h2>`;
        const yes = document.createElement('button');
        yes.className = 'main-btn';
        yes.textContent = t('tutorial_yes');
        yes.onclick = ()=>{ modal.remove(); this.startTutorial(); };
        const no = document.createElement('button');
        no.className = 'secondary-btn';
        no.textContent = t('tutorial_no');
        no.onclick = ()=>{ modal.remove(); this.skipTutorial(); };
        modal.appendChild(yes);
        modal.appendChild(no);
        document.body.appendChild(modal);
    }

    startTutorial(){
        this.tutorialStep = 0;
        this.showScreen('tutorial-screen');
        this.nextTutorialStep();
    }

    nextTutorialStep(){
        const steps = [t('tutorial_welcome'), t('tutorial_order'), t('tutorial_ingredients'), t('tutorial_serve'), t('tutorial_timer')];
        if(this.tutorialStep >= steps.length){
            GameState.tutorialCompleted = true;
            GameState.save();
            this.showScreen('lobby');
            return;
        }
        document.getElementById('tutorial-title').textContent = t('tutorial_header');
        document.getElementById('tutorial-text').textContent = steps[this.tutorialStep];
        this.tutorialStep++;
    }

    skipTutorial(){
        GameState.tutorialCompleted = true;
        GameState.save();
        this.showScreen('lobby');
    }

    showToast(text){
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = text;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 2200);
    }

    updateCurrencyDisplay(){
        const c = document.getElementById('coin-count');
        const l = document.getElementById('level-number');
        if(c) c.textContent = GameState.coins.toLocaleString(currentLang === 'en' ? 'en-US' : 'ru-RU');
        if(l) l.textContent = GameState.maxLevel;
    }

    pause(){ this.paused = true; }
    resume(){ this.paused = false; }
}
