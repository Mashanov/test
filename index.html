<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<title>Бургерная</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#100823;font-family:'Segoe UI',Roboto,sans-serif;color:#fff;font-size:14px}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,#2a1850,#0a0518 70%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.screen.active{display:flex}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#ff6b35;border-radius:3px}
.svg{display:inline-block;width:1em;height:1em;vertical-align:middle;flex-shrink:0;fill:currentColor}

/* ==== Buttons ==== */
.btn-primary,.btn-secondary,.btn-tertiary{
  font-family:inherit;font-weight:900;border:none;border-radius:14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s,box-shadow .2s,background .2s;
}
.btn-primary{padding:14px 24px;font-size:16px;letter-spacing:.5px;background:linear-gradient(135deg,#ff6b35,#ff8c42);color:#fff;box-shadow:0 6px 24px rgba(255,107,53,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-primary:active{transform:scale(.96)}
.btn-primary:disabled{opacity:.4;box-shadow:none}
.btn-secondary{padding:11px 18px;font-size:13px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-secondary:active{background:rgba(255,255,255,.2)}
.btn-tertiary{padding:9px 14px;font-size:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.15)}
.btn-tertiary:active{background:rgba(255,255,255,.15)}

/* ==== LOBBY ==== */
#lobby{justify-content:flex-start;padding-top:24px;gap:4px}
.lobby-hero{font-size:60px;filter:drop-shadow(0 10px 30px rgba(255,107,53,.6));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
#lobby h1{font-size:28px;font-weight:900;letter-spacing:1.5px;background:linear-gradient(135deg,#ffd166,#ff6b35,#ffd166);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;text-align:center}
@keyframes shine{to{background-position:200% 50%}}
.subtitle{color:#888;font-size:10px;letter-spacing:4px;margin-bottom:16px}
.lobby-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:400px;margin-top:8px}
.menu-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));color:#fff;cursor:pointer;font-family:inherit;min-height:78px}
.menu-card:active{transform:scale(.95);background:rgba(255,255,255,.18)}
.menu-card .svg{width:26px;height:26px;color:#ffd166}
.menu-card .label{font-size:10px;font-weight:700;text-align:center}
.menu-card.play{grid-column:1 / -1;flex-direction:row;gap:10px;min-height:60px;background:linear-gradient(135deg,#ff6b35,#ff8c42,#ffb84d);border-color:rgba(255,209,102,.6);box-shadow:0 8px 28px rgba(255,107,53,.55)}
.menu-card.play .svg{width:28px;height:28px;color:#fff}
.menu-card.play .label{font-size:18px;font-weight:900;letter-spacing:1.5px}
.badge{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#ff3b30;box-shadow:0 0 10px #ff3b30;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.hud-coins{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;background:linear-gradient(135deg,rgba(255,107,53,.25),rgba(255,209,102,.15));border:1px solid rgba(255,200,100,.35);font-weight:800;color:#ffd166;font-size:14px;z-index:5}
.hud-coins .svg{width:16px;height:16px}

/* ==== LEVEL LAYOUT ==== */
#level{padding:0;justify-content:flex-start}
.hud{position:absolute;top:0;left:0;right:0;height:52px;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:linear-gradient(180deg,rgba(20,10,40,.98),rgba(20,10,40,.85));border-bottom:1px solid rgba(255,200,100,.25)}
.hud-left{display:flex;gap:6px;align-items:center}
.coins-hud,.hearts-hud,.level-badge{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-weight:800;font-size:13px}
.coins-hud{color:#ffd166}.coins-hud .svg{width:14px;height:14px}
.hearts-hud{letter-spacing:1px;font-size:14px}
.heart{transition:opacity .3s}.heart.lost{opacity:.25;filter:grayscale(1)}
.level-badge{color:#4ecdc4;font-size:11px}
.hud-quit{width:32px;height:32px;border-radius:50%;font-size:20px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);cursor:pointer}

/* ==== SCENE (SVG background + HTML customers overlay) ==== */
.scene{position:absolute;top:52px;left:0;right:0;height:38vh;min-height:200px;max-height:280px;background:#0a0518;overflow:hidden;border-bottom:2px solid rgba(255,200,100,.3)}
.scene-svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.customers-layer{position:absolute;inset:0;pointer-events:none}
.customer{position:absolute;bottom:14%;width:64px;height:110px;cursor:pointer;pointer-events:auto;transition:transform .2s,filter .2s}
.customer.selected{transform:translateY(-6px) scale(1.06);filter:drop-shadow(0 0 14px #ffd166)}
.customer .body-svg{width:100%;height:100%;display:block}
.customer .face-happy,.customer .face-worried,.customer .face-angry{display:none}
.customer[data-mood="happy"] .face-happy,
.customer[data-mood="worried"] .face-worried,
.customer[data-mood="angry"] .face-angry{display:inline}
.order-bubble{position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;padding:3px 5px;display:flex;gap:1px;white-space:nowrap;border:2px solid #ffd166;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.order-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #ffd166}
.order-bubble .ing{width:16px;height:16px;display:inline-flex}
.order-bubble .ing svg{width:100%;height:100%}
.mod-badge{position:absolute;top:-68px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;font-size:9px;font-weight:900;padding:2px 7px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 8px rgba(230,57,70,.6);animation:modPulse 1.5s infinite}
@keyframes modPulse{50%{transform:translateX(-50%) scale(1.06)}}
.patience-bar{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:56px;height:5px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.patience-fill{height:100%;width:100%;background:#4ecdc4;border-radius:3px;transition:background .3s}
.patience-fill.warn{background:#ffa500}
.patience-fill.danger{background:#e63946;animation:dangerPulse .5s infinite}
@keyframes dangerPulse{50%{opacity:.5}}

/* ==== GAME PANEL ==== */
.game-panel{position:absolute;top:calc(52px + 38vh);left:0;right:0;bottom:0;display:flex;flex-direction:column;padding:6px;gap:4px;overflow-y:auto;background:linear-gradient(180deg,rgba(15,8,30,.5),rgba(10,5,25,.98))}
.order-panel{background:linear-gradient(135deg,rgba(255,107,53,.22),rgba(255,140,66,.06));border:1px solid rgba(255,140,66,.5);border-radius:10px;padding:6px 10px;min-height:46px;display:flex;flex-direction:column;gap:4px}
.order-title{font-size:11px;color:#ffd166;font-weight:800;display:flex;justify-content:space-between}
.order-items{display:flex;flex-wrap:wrap;gap:3px}
.order-items .ing{width:24px;height:24px;background:rgba(255,255,255,.1);border-radius:5px;padding:2px;display:flex}
.order-items .ing svg{width:100%;height:100%}
.burger-stack{min-height:52px;max-height:100px;overflow-y:auto;padding:4px;display:flex;flex-direction:column-reverse;align-items:center;gap:1px;background:rgba(0,0,0,.4);border:2px dashed rgba(255,209,102,.3);border-radius:10px}
.burger-layer{width:88%;height:16px;border-radius:5px;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:9px;font-weight:900;color:#1a0f2e;box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);animation:layerPop .2s}
.burger-layer .ing{width:12px;height:12px;display:flex}
.burger-layer .ing svg{width:100%;height:100%}
@keyframes layerPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.ingredients{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:4px}
.ing-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));color:#fff;font-size:8px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .1s,background .15s}
.ing-btn:active{transform:scale(.9);background:rgba(255,180,60,.3)}
.ing-btn .ing{width:22px;height:22px}
.ing-btn .ing svg{width:100%;height:100%}
.actions{display:flex;gap:5px;margin-top:auto;padding-top:3px}
.actions button{flex:1}

/* ==== RESULT ==== */
#result{gap:12px;text-align:center}
.result-stars{font-size:54px;letter-spacing:6px;line-height:1}
.result-stars .star{opacity:.2;transition:all .4s;display:inline-block}
.result-stars .star.on{opacity:1;animation:starPop .5s backwards}
.result-stars .star.on:nth-child(2){animation-delay:.15s}
.result-stars .star.on:nth-child(3){animation-delay:.3s}
@keyframes starPop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
#result h2{font-size:24px;font-weight:900}
#result-coins{font-size:20px;color:#ffd166;font-weight:900}
.result-buttons{display:flex;flex-direction:column;gap:6px;width:100%;max-width:280px;margin-top:14px}

/* ==== GRIDS / LISTS ==== */
#levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px;width:100%;max-width:520px;max-height:60vh;overflow-y:auto;padding:4px}
.lvl-btn{aspect-ratio:1;border-radius:10px;font-family:inherit;font-size:12px;font-weight:900;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lvl-btn.locked{opacity:.3;cursor:not-allowed}
.lvl-btn.done{border-color:#4ecdc4;background:rgba(78,205,196,.2)}
.lvl-btn.current{border-color:#ffd166;box-shadow:0 0 12px rgba(255,209,102,.7)}
.lvl-btn .stars{font-size:7px;color:#ffd166;letter-spacing:-1px}

.task-item,.ach-item,.shop-item{display:flex;gap:10px;align-items:center;padding:10px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:10px}
.task-item.done,.ach-item.unlocked{border-color:#4ecdc4;background:rgba(78,205,196,.14)}
#tasks-list,#achievements-list{width:100%;max-width:480px;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;padding:4px}
.ach-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);flex-shrink:0;color:#ffd166}
.ach-icon .svg{width:22px;height:22px}

#shop-categories{display:flex;gap:5px;overflow-x:auto;padding:4px 4px 10px;width:100%;max-width:520px}
.shop-cat{flex-shrink:0;padding:7px 12px;border-radius:16px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
.shop-cat.active{background:linear-gradient(135deg,#ff6b35,#ff8c42);border-color:transparent}
#shop-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:55vh;overflow-y:auto;width:100%;max-width:520px;padding:4px}
.shop-item{flex-direction:column;align-items:center;gap:5px;padding:10px;text-align:center}
.shop-item .preview{width:54px;height:54px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);overflow:hidden}
.shop-item .preview .svg{width:36px;height:36px}
.shop-item .name{font-size:11px;font-weight:700}
.shop-item .price{color:#ffd166;font-weight:800;font-size:11px;display:flex;align-items:center;gap:3px}
.shop-item .price .svg{width:12px;height:12px}
.shop-item button{width:100%;padding:7px;font-size:11px}

/* ==== MISC ==== */
.screen h2{font-size:22px;font-weight:900;margin-bottom:14px;color:#ffd166;text-align:center}
#toast-area{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.toast{padding:9px 18px;border-radius:12px;font-weight:800;font-size:12px;background:linear-gradient(135deg,rgba(255,107,53,.98),rgba(255,140,66,.98));box-shadow:0 6px 20px rgba(0,0,0,.5);animation:toastIn 2s forwards;max-width:80vw;text-align:center}
.toast.good{background:linear-gradient(135deg,#4ecdc4,#2a9d8f)}
.toast.bad{background:linear-gradient(135deg,#e63946,#8a1020)}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}15%,85%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
body.shake #level{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fly-coin{position:fixed;pointer-events:none;z-index:1000;font-weight:900;font-size:20px;color:#ffd166;text-shadow:0 0 12px rgba(255,209,102,.9);animation:flyUp 1s ease-out forwards}
@keyframes flyUp{to{opacity:0;transform:translateY(-90px) scale(1.5)}}
.particle{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:999;animation:burst .7s ease-out forwards}
@keyframes burst{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.combo-flash{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1000;font-size:38px;font-weight:900;color:#ffd166;text-shadow:0 0 24px rgba(255,209,102,.9),0 4px 12px rgba(0,0,0,.6);animation:comboAnim .8s ease-out forwards}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#splash{position:fixed;inset:0;background:#100823;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#splash.hidden{opacity:0;pointer-events:none;transition:opacity .4s}
.spinner{width:48px;height:48px;border:4px solid rgba(255,209,102,.2);border-top-color:#ff6b35;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.stat-row{display:flex;justify-content:space-between;width:100%;max-width:320px;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:10px;border:1px solid rgba(255,255,255,.12);margin-bottom:6px;font-size:13px;align-items:center}
.stat-row .val{font-weight:900;color:#ffd166;display:flex;align-items:center;gap:3px}
.streak-days{display:flex;gap:5px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.streak-day{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);font-size:11px;font-weight:800;color:#888}
.streak-day.done{background:linear-gradient(135deg,#ff6b35,#ffd166);border-color:#ffd166;color:#fff}
.streak-day.today{border-color:#4ecdc4}
</style>
</head>

/* ============================================================
   AUDIO
============================================================ */
const Audio = {
  ctx:null, on:true,
  init(){
    const un = () => {
      if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
      if(this.ctx?.state==='suspended') this.ctx.resume();
      document.removeEventListener('touchstart', un);
      document.removeEventListener('click', un);
    };
    document.addEventListener('touchstart', un, {once:true});
    document.addEventListener('click', un, {once:true});
  },
  beep(f,d,t='sine',v=0.08){
    if(!this.on||!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=t; o.frequency.value=f;
    const n=this.ctx.currentTime;
    g.gain.setValueAtTime(v,n); g.gain.exponentialRampToValueAtTime(0.001,n+d);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(n); o.stop(n+d);
  },
  click(){ this.beep(600,0.05,'square',0.05); },
  add(){ this.beep(500,0.04,'sine',0.05); },
  success(){
    if(!this.on||!this.ctx) return;
    const n=this.ctx.currentTime;
    [523,659,784].forEach((f,i)=>{
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,n+i*0.06); g.gain.linearRampToValueAtTime(0.08,n+i*0.06+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,n+i*0.06+0.22);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(n+i*0.06); o.stop(n+i*0.06+0.22);
    });
  },
  error(){
    if(!this.on||!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(240,this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,this.ctx.currentTime+0.3);
    g.gain.setValueAtTime(0.08,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.32);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime+0.32);
  },
  coin(){
    if(!this.on||!this.ctx) return;
    const n=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='square'; o.frequency.setValueAtTime(1200,n); o.frequency.linearRampToValueAtTime(1800,n+0.08);
    g.gain.setValueAtTime(0.05,n); g.gain.exponentialRampToValueAtTime(0.001,n+0.14);
    o.connect(g); g.connect(this.ctx.destination); o.start(n); o.stop(n+0.14);
  },
  levelUp(){
    if(!this.on||!this.ctx) return;
    const n=this.ctx.currentTime;
    [262,330,392,523,659,784].forEach((f,i)=>{
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,n+i*0.08); g.gain.linearRampToValueAtTime(0.09,n+i*0.08+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,n+i*0.08+0.32);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(n+i*0.08); o.stop(n+i*0.08+0.32);
    });
  }
};

function shake(){ document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),320); }
function flyCoin(x,y,amt){
  const el=document.createElement('div'); el.className='fly-coin'; el.textContent='+'+amt;
  el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function burst(x,y,color,cnt=15){
  for(let i=0;i<cnt;i++){
    const el=document.createElement('div'); el.className='particle';
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.background=color;
    const a=Math.random()*Math.PI*2, d=30+Math.random()*70;
    el.style.setProperty('--dx',Math.cos(a)*d+'px');
    el.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(el); setTimeout(()=>el.remove(),700);
  }
}
function comboFlash(txt){
  const el=document.createElement('div'); el.className='combo-flash'; el.textContent=txt;
  document.body.appendChild(el); setTimeout(()=>el.remove(),800);
}
function toast(txt,kind=''){
  const el=document.createElement('div'); el.className='toast '+kind; el.textContent=txt;

function shuffle(a){ return [...a].sort(()=>Math.random()-0.5); }

function unlockedBaseIngredients(level){
  const ids=[];
  LEVEL_UNLOCKS.forEach(u=>{ if(level>=u.level) ids.push(...u.ids); });
  return ids;
}
function availableIngredientsForLevel(level){
  const base = unlockedBaseIngredients(level);
  const premium = Save.data.purchasedIngredients;
  return [...new Set([...base, ...premium])];
}
function findFurn(cat,id){
  const c = FURN[cat]; return c ? c.items.find(i=>i.id===id) : null;

/* ============================================================
   LEVEL CONFIG
============================================================ */
function getLevelConfig(n){
  const avail = availableIngredientsForLevel(n);
  const fillings = avail.filter(id=>id!=='bun_bottom' && id!=='bun_top');
  
  let concurrent, total, patience, specials, rush, vip;
  if(n<=3){ concurrent=1; total=3+n; patience=60; specials=0; rush=0; vip=0; }
  else if(n<=8){ concurrent=2; total=6+Math.floor((n-3)*1.5); patience=45-n; specials=0.15; rush=0; vip=0; }
  else if(n<=20){ concurrent=2; total=10+Math.floor((n-8)*1.2); patience=38-Math.floor((n-8)*0.5); specials=0.22; rush=0.15; vip=0; }
  else if(n<=50){ concurrent=3; total=14+Math.floor((n-20)*0.8); patience=33-Math.floor((n-20)*0.2); specials=0.28; rush=0.2; vip=0.1; }
  else if(n<=100){ concurrent=3; total=18+Math.floor((n-50)*0.5); patience=28-Math.floor((n-50)*0.1); specials=0.35; rush=0.25; vip=0.15; }
  else { concurrent=3; total=Math.min(30,22+Math.floor((n-100)*0.15)); patience=Math.max(18,22-Math.floor((n-100)*0.05)); specials=0.4; rush=0.3; vip=0.2; }
  
  return { level:n, fillings, concurrent:Math.max(1,concurrent), total,
    basePatience:Math.max(15,patience), specialChance:specials, rushChance:rush, vipChance:vip,
    rewardBase: Math.round(12 + n*1.5) };
}

/* ============================================================
   CUSTOMER GENERATION
============================================================ */
function makeCustomer(cfg){
  let type='regular';
  const r=Math.random();
  if(r<cfg.vipChance) type='vip';
  else if(r<cfg.vipChance+cfg.rushChance) type='rush';
  
  let itemCount, patMult, rewMult;
  if(type==='vip'){ itemCount=rand(3,4); patMult=1.5; rewMult=2.2; }
  else if(type==='rush'){ itemCount=rand(1,2); patMult=0.55; rewMult=1.5; }
  else { itemCount=rand(1,3); patMult=1; rewMult=1; }
  
  itemCount = Math.min(itemCount, cfg.fillings.length);
  const chosen = shuffle(cfg.fillings).slice(0,itemCount);
  let order = ['bun_bottom','patty', ...chosen, 'bun_top'];
  
  let modifier = null;
  if(cfg.specialChance > 0 && Math.random() < cfg.specialChance){
    const cands=[];
    if(order.includes('onion')) cands.push('no_onion');
    if(order.includes('pickle')) cands.push('no_pickle');
    if(order.includes('tomato')) cands.push('no_tomato');
    cands.push('double_cheese','double_patty');
    modifier = cands[rand(0,cands.length-1)];
    if(modifier==='no_onion') order=order.filter(x=>x!=='onion');
    else if(modifier==='no_pickle') order=order.filter(x=>x!=='pickle');
    else if(modifier==='no_tomato') order=order.filter(x=>x!=='tomato');
    else if(modifier==='double_cheese'){
      const i=order.indexOf('cheese');
      if(i>=0) order.splice(i+1,0,'cheese'); else order.splice(2,0,'cheese','cheese');
    } else if(modifier==='double_patty'){
      const i=order.indexOf('patty'); order.splice(i+1,0,'patty');
    }
  }
  
  // Compute base reward with premium ingredient bonuses
  let ingBonus = 1;
  chosen.forEach(id=>{ const i=ING[id]; if(i?.bonus) ingBonus *= i.bonus; });
  let reward = Math.round(cfg.rewardBase * rewMult * ingBonus);
  
  const names=['Аня','Ваня','Маша','Петя','Оля','Серёжа','Катя','Дима','Лена','Миша','Даша','Коля','Света','Гоша','Костя'];
  const colors=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e84393'];
  const skins=['#f5c6a0','#e0ac69','#c68642','#8d5524','#ffdbac'];
  const hairs=['#2c1810','#000000','#ffd700','#8b4513','#a0522d','#c45a2d'];
  
  return {
    type, order, modifier, reward,
    patience: Math.round(cfg.basePatience*patMod? cfg.basePatience : cfg.basePatience*patMult*1000),
    maxPatience: Math.round(cfg.basePatience*patMult*1000),
    name: names[rand(0,names.length-1)],
    color: colors[rand(0,colors.length-1)],
    skin: skins[rand(0,skins.length-1)],
    hair: hairs[rand(0,hairs.length-1)],
    served:false
  };
}

// Called ONLY when list changes: initial, spawn, remove, selection change
function rebuildCustomers(){
  const layer = document.getElementById('customers-layer');
  layer.innerHTML = '';
  const total = G.customers.length;
  const spacing = 100/(total+1);
  G.customers.forEach((c,i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'customer' + (i===G.selected ? ' selected' : '');
    wrap.style.left = `calc(${spacing*(i+1)}% - 32px)`;
    wrap.dataset.idx = i;
    const pct = c.patience/c.maxPatience;
    const mood = pct<0.15?'angry':pct<0.4?'worried':'happy';
    wrap.dataset.mood = mood;
    
    let html = customerSvgBody(c);
    html += `<div class="order-bubble">${c.order.map(id=>`<span class="ing">${ingSvg(id)}</span>`).join('')}</div>`;
    if(c.modifier) html += `<div class="mod-badge">${MOD_LABEL[c.modifier]}</div>`;
    let barCls = pct<0.25?'danger':pct<0.5?'warn':'';
    html += `<div class="patience-bar"><div class="patience-fill ${barCls}" style="width:${pct*100}%"></div></div>`;
    
    wrap.innerHTML = html;
    // IMPORTANT: attach click ONCE
    wrap.addEventListener('click', ()=>selectCustomer(i));
    layer.appendChild(wrap);
  });
}

// Called every frame: updates only style.width and data-mood
function updateCustomerVisuals(){
  const layer = document.getElementById('customers-layer');
  if(!layer) return;
  const wraps = layer.children;
  for(let i=0; i<wraps.length; i++){
    const wrap = wraps[i];
    const c = G.customers[i];
    if(!c){ continue; }
    const pct = Math.max(0, c.patience / c.maxPatience);
    const bar = wrap.querySelector('.patience-fill');
    if(bar){
      bar.style.width = (pct*100)+'%';
      bar.classList.toggle('danger', pct<0.25);
      bar.classList.toggle('warn', pct>=0.25 && pct<0.5);
    }
    const mood = pct<0.15?'angry':pct<0.4?'worried':'happy';
    if(wrap.dataset.mood !== mood) wrap.dataset.mood = mood;
  }
}

/* ============================================================
   GAME LOGIC
============================================================ */
function selectCustomer(i){
  if(!G.active) return;
  if(i===G.selected) return;
  if(!G.customers[i]) return;
  Audio.click();
  G.selected = i;
  G.burger = [];
  rebuildCustomers();
  renderOrderPanel();
  renderBurgerStack();
}

function addIngredient(id){
  if(!G.active) return;
  if(G.selected<0){ toast('Сначала выберите клиента','bad'); return; }
  G.burger.push(id);
  Audio.add();
  renderBurgerStack();
}

function clearBurger(){
  G.burger = [];
  renderBurgerStack();
}

function serve(){
  if(!G.active) return;
  if(G.selected<0 || !G.customers[G.selected]){ toast('Выберите клиента','bad'); return; }
  const c = G.customers[G.selected];
  const a = [...G.burger].sort().join('|');
  const b = [...c.order].sort().join('|');
  
  if(a===b){
    Audio.success();
    c.served = true;
    G.combo++;
    if(G.combo>G.maxCombo) G.maxCombo = G.combo;
    const comboMult = 1+Math.min(1,(G.combo-1)*0.15);
    const reward = Math.round(c.reward * comboMult);
    G.coins += reward;
    Save.data.coins += reward;
    Save.data.totalEarned += reward;
    Save.data.totalServed++;
    Save.data.totalPerfect++;
    if(G.combo > Save.data.bestCombo) Save.data.bestCombo = G.combo;
    
    const wrap = document.querySelector(`.customer[data-idx="${G.selected}"]`);
    if(wrap){
      const r = wrap.getBoundingClientRect();
      flyCoin(r.left+r.width/2, r.top+r.height/2, reward);
      burst(r.left+r.width/2, r.top+r.height/2, '#ffd166', 18);
    }
    if(G.combo>=3) comboFlash('COMBO ×'+G.combo);
    Audio.coin();
    toast('✓ +'+reward,'good');
    
    G.totalServed++;
    document.getElementById('hud-coins').textContent = Save.data.coins;
    document.getElementById('lobby-coins').textContent = Save.data.coins;
    document.getElementById('hud-progress').textContent = G.totalServed+'/'+G.totalNeeded;
    
    trackTask('serve',1);
    trackTask('earn',reward);
    trackTask('perfect',1);
    checkAchievements();
    
    G.customers.splice(G.selected,1);
    G.selected = -1;
    G.burger = [];
    
    if(G.totalServed>=G.totalNeeded){ Save.save(); endLevel(true); return; }
    
    setTimeout(()=>{
      if(G.active && G.customers.length<G.cfg.concurrent){
        G.customers.push(makeCustomer(G.cfg));
      }
      rebuildCustomers();
    }, 400);
    rebuildCustomers();
    renderOrderPanel();
    renderBurgerStack();
  } else {
    Audio.error();
    shake();
    toast('✗ Не тот заказ','bad');
    G.combo = 0;
    loseHeart();
    if(G.hearts > 0){
      // Remove failed customer and spawn new
      G.customers.splice(G.selected,1);
      G.selected = -1;
      G.burger = [];
      setTimeout(()=>{
        if(G.active && G.customers.length<G.cfg.concurrent){
          G.customers.push(makeCustomer(G.cfg));
        }
        rebuildCustomers();
      }, 400);
      rebuildCustomers();
      renderOrderPanel();
      renderBurgerStack();
    }
  }
}

function loseHeart(){
  G.hearts--;
  updateHearts();
  if(G.hearts<=0){ Save.save(); endLevel(false); }
}

function tickPatience(dt){
  if(!G.active || G.paused) return;
  const expired = [];
  G.customers.forEach((c,i)=>{
    c.patience -= dt*1000;
    if(c.patience<=0){ c.patience=0; expired.push(i); }
  });
  updateCustomerVisuals();
  if(expired.length){
    // Remove expired in reverse
    expired.sort((a,b)=>b-a).forEach(i=>{
      if(i===G.selected){ G.selected=-1; G.burger=[]; renderOrderPanel(); renderBurgerStack(); }
      G.customers.splice(i,1);
      G.combo = 0;
      loseHeart();
    });
    Audio.error();
    toast('😡 Клиент ушёл','bad');
    rebuildCustomers();
    // Refill
    if(G.active && G.hearts>0 && G.totalServed<G.totalNeeded){
      setTimeout(()=>{
        if(G.active){
          while(G.customers.length<G.cfg.concurrent && G.customers.length+G.totalServed<G.totalNeeded){
            G.customers.push(makeCustomer(G.cfg));
            break; // one at a time
          }
          rebuildCustomers();
        }
      }, 500);
    }
  }
}

function gameLoop(ts){
  const dt = Math.min((ts-G.lastFrame)/1000, 0.1);
  G.lastFrame = ts;
  tickPatience(dt);
  if(G.active) G.raf = requestAnimationFrame(gameLoop);
}

/* ============================================================
   LEVEL FLOW
============================================================ */
function startLevel(n){
  Audio.init();
  Save.data.maxLevel = Math.max(Save.data.maxLevel, n);
  G.levelNum = n;
  G.cfg = getLevelConfig(n);
  G.coins = 0;
  G.hearts = 3;
  G.totalNeeded = G.cfg.total;
  G.totalServed = 0;
  G.customers = [];
  G.selected = -1;
  G.burger = [];
  G.combo = 0;
  G.maxCombo = 0;
  G.paused = false;
  G.active = true;
  
  const initial = Math.min(G.cfg.concurrent, G.totalNeeded);
  for(let i=0;i<initial;i++) G.customers.push(makeCustomer(G.cfg));
  
  document.getElementById('hud-level').textContent = G.levelNum;
  document.getElementById('hud-coins').textContent = Save.data.coins;
  document.getElementById('hud-progress').textContent = '0/'+G.totalNeeded;
  
  renderSceneSVG();
  renderIngredients();
  renderOrderPanel();
  renderBurgerStack();
  updateHearts();
  rebuildCustomers();
  showScreen('level');
  
  G.lastFrame = performance.now();
  if(G.raf) cancelAnimationFrame(G.raf);
  G.raf = requestAnimationFrame(gameLoop);
}

function endLevel(win){
  G.active = false;
  if(G.raf){ cancelAnimationFrame(G.raf); G.raf=null; }
  
  const stars = win ? G.hearts : 0;
  if(win){
    Audio.levelUp();
    const prev = Save.data.stars[G.levelNum] || 0;
    if(stars > prev) Save.data.stars[G.levelNum] = stars;
    Save.data.maxLevel = Math.max(Save.data.maxLevel, G.levelNum + 1);
    trackTask('complete',1);
    Save.data.taskProgress = Save.data.taskProgress || {};
  }
  Save.save();
  checkAchievements();
  
  document.getElementById('result-stars').innerHTML =
    [1,2,3].map(i=>`<span class="star ${i<=stars?'on':''}">★</span>`).join('');
  document.getElementById('result-title').textContent = win ? 'Уровень пройден!' : 'Провал...';
  document.getElementById('result-coins').textContent = win ? `Заработано: ${G.coins} монет` : 'Все сердца потеряны';
  document.getElementById('next-btn').style.display = win ? 'flex' : 'none';
  
  showScreen('result');
  refreshLobby();
}

  {id:'earn_500',type:'earn',target:500,reward:150,text:'Заработайте 500 монет'},
  {id:'earn_2000',type:'earn',target:2000,reward:500,text:'Заработайте 2000 монет'},
  {id:'complete_3',type:'complete',target:3,reward:250,text:'Пройдите 3 уровня'},

];
function ensureTasks(){
  const today = new Date().toDateString();
  if(Save.data.taskDay !== today){
    Save.data.taskDay = today;
    Save.data.taskProgress = {};
    // Pick 3 random daily tasks
    Save.data.dailyTasks = shuffle(TASK_POOL).slice(0,3).map(t=>({...t,claimed:false}));
    Save.save();
  }
}
function trackTask(type, amount){
  ensureTasks();
  const tasks = Save.data.dailyTasks || [];
  let changed = false;
  tasks.forEach(t=>{
    if(t.claimed) return;
    if(t.type !== type) return;
    const cur = Save.data.taskProgress[t.id] || 0;
    Save.data.taskProgress[t.id] = Math.min(t.target, cur + amount);
    changed = true;
  });
  if(changed) Save.save();
}

          Save.data.purchasedThemes.push(id);

          Save.save();
          document.getElementById('lobby-coins').textContent = Save.data.coins;

          renderShop();
        } else toast('Недостаточно монет','bad');

  const grid = document.getElementById('levels-grid');

  const max = Save.data.maxLevel;

  for(let i=1;i<=show;i++){
    const btn = document.createElement('button');
    btn.className = 'lvl-btn';
    const unlocked = i<=max;
    const stars = Save.data.stars[i]||0;

    if(unlocked) btn.addEventListener('click', ()=>{ Audio.click(); startLevel(i); });

function bindEvents(){
  const on = (id,fn)=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', ()=>{ Audio.click(); fn(); });
  };
  
  on('play-btn', ()=>startLevel(Save.data.maxLevel));
  on('levels-btn', ()=>{ renderLevelsGrid(); showScreen('levels-screen'); });
  on('shop-btn', ()=>{ renderShop(); showScreen('shop-screen'); });
  on('tasks-btn', ()=>{ renderTasks(); showScreen('tasks-screen'); });
  on('ach-btn', ()=>{ renderAchievements(); showScreen('ach-screen'); });
  on('daily-btn', ()=>{ renderDaily(); showScreen('daily-screen'); });
  on('afk-btn', ()=>{ refreshAFK(); showScreen('afk-screen'); });
  on('settings-btn', ()=>{ refreshSettings(); showScreen('settings-screen'); });
  
  on('levels-back', ()=>{ refreshLobby(); showScreen('lobby'); });
  on('shop-back', ()=>{ refreshLobby(); showScreen('lobby'); });
  on('tasks-back', ()=>{ refreshLobby(); showScreen('lobby'); });
  on('ach-back', ()=>{ refreshLobby(); showScreen('lobby'); });
  on('daily-back', ()=>{ refreshLobby(); showScreen('lobby'); });
  on('afk-back', ()=>{ refreshLobby(); showScreen('lobby'); });
  on('settings-back', ()=>{ refreshLobby(); showScreen('lobby'); });
  on('to-lobby-btn', ()=>{ refreshLobby(); showScreen('lobby'); });
  
  on('serve-btn', serve);
  on('clear-btn', clearBurger);
  on('quit-btn', ()=>{
    if(confirm('Выйти из уровня? Прогресс уровня не сохранится.')){
      G.active = false;
      if(G.raf){ cancelAnimationFrame(G.raf); G.raf=null; }
      refreshLobby(); showScreen('lobby');
    }
  });
  
  on('next-btn', ()=>startLevel(Math.min(G.levelNum+1, 500)));
  on('retry-btn', ()=>startLevel(G.levelNum));
  
  on('daily-claim', ()=>{
    const today = new Date().toDateString();
    if(Save.data.lastDaily===today) return;
    // Check streak continuity
    const last = Save.data.lastDaily ? new Date(Save.data.lastDaily) : null;
    const now = new Date(today);
    const diff = last ? Math.round((now-last)/(1000*60*60*24)) : 999;
    if(diff>1) Save.data.streak = 0;
    Save.data.streak++;
    Save.data.lastDaily = today;
    const rewards = [100,200,400,800,1600,3200,6400];
    const r = rewards[Math.min(Save.data.streak-1,6)];
    Save.data.coins += r;
    Save.save();
    checkAchievements();
    Audio.coin();
    toast('+'+r+' монет','good');
    renderDaily();
    refreshLobby();
  });
  
  document.getElementById('music-toggle').addEventListener('change', e=>{
    Save.data.musicOn = e.target.checked;
    Audio.on = e.target.checked;
    Save.save();
  });
  
  on('reset-progress', ()=>{
    if(confirm('Точно сбросить весь прогресс?')){
      Save.data = JSON.parse(JSON.stringify(DEFAULT_SAVE));
      Save.save();
      refreshLobby();
      refreshSettings();
      showScreen('lobby');
      toast('Прогресс сброшен');
    }
  });
  
  // Keyboard
  document.addEventListener('keydown', e=>{
    if(!G.active) return;
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); serve(); }
    if(e.key==='Escape'){ e.preventDefault(); clearBurger(); }
  });
}

function refreshAFK(){
  document.getElementById('afk-rate').textContent = Save.data.afkRate;
  document.getElementById('afk-earned').textContent = Save.data.afkEarned;
  document.getElementById('afk-total').textContent = Save.data.afkTotal;
}

function refreshSettings(){
  document.getElementById('music-toggle').checked = Save.data.musicOn;
  document.getElementById('best-combo-stat').textContent = Save.data.bestCombo;
  document.getElementById('total-served-stat').textContent = Save.data.totalServed;
}

/* ============================================================
   AFK tick (passive income)
============================================================ */
let afkTimer = null;
function startAFKTicker(){
  if(afkTimer) return;
  afkTimer = setInterval(()=>{
    if(Save.data.afkRate > 0){
      Save.data.coins += Save.data.afkRate;
      Save.data.afkEarned += Save.data.afkRate;
      Save.data.afkTotal += 1;
      Save.data.totalEarned += Save.data.afkRate;
      document.getElementById('lobby-coins').textContent = Save.data.coins;
      if(document.getElementById('afk-earned')) refreshAFK();
    }
  }, 60000);
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  Audio.init();
  try{
    if(typeof vkBridge!=='undefined') await vkBridge.send('VKWebAppInit');
  }catch(e){}
  await Save.load();
  Audio.on = Save.data.musicOn;
  ensureTasks();
  bindEvents();
  refreshLobby();
  startAFKTicker();
  
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{ const s = document.getElementById('splash'); if(s) s.remove(); }, 500);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
