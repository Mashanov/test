/* ========================================================================
   BATTLE ENGINE
   ======================================================================== */
const LANES = [0.22, 0.5, 0.78];
const PLAYER_BASE_U = 0.045;
const ENEMY_BASE_U = 0.955;

const G = {
  active:false, over:true, mode:'battle', level:1, isTutorial: false,
  units:[], projectiles:[], particles:[], damageNums:[],
  essence:60, essenceMax:120, essenceRegen:10,
  playerBase:{hp:1000,max:1000}, enemyBase:{hp:900,max:900},
  spawnTimer:0, spawnInterval:4, time:0, kills:0, spawned:0,
  shakeT:0, uid:1,
  hpBuff:0, dmgBuff:0, essBuff:0
};

function project(u, lane){
  const s = 0.50 + 0.44 * lane;
  return {x: W*0.5 + (u-0.5)*W*s, y: H*0.32 + lane*H*0.48, s};
}
function levelCfg(lv){
  return { enemyBaseHp: 700 + lv*240, playerBaseHp: 950 + lv*60, spawnInterval: Math.max(1.25, 4.3 - lv*0.22) };
}
function caveCfg(lv){
  return { enemyBaseHp: 900 + lv*400, playerBaseHp: 900 + lv*100, spawnInterval: Math.max(1.0, 3.0 - lv*0.15) };
}
function setBuffFromHeroes(){
  G.hpBuff = 0; G.dmgBuff = 0; G.essBuff = 0;
  for(const k in HERO_DEFS){
    const d = HERO_DEFS[k], h = state.heroes[k];
    if(!h) continue;
    const bonus = h.level * d.bonusPer;
    if(d.bonus === 'hp') G.hpBuff += bonus;
    else if(d.bonus === 'dmg') G.dmgBuff += bonus;
    else if(d.bonus === 'essence') G.essBuff += bonus;
  }
}
function makeUnit(type, side, lane, u){
  const d = UNIT_DEFS[type];
  const hpScale = side==='enemy' ? (1 + (G.level-1)*0.16) : (1 + (G.level-1)*0.05 + G.hpBuff);
  const dmgScale = side==='enemy' ? (1 + (G.level-1)*0.13) : (1 + (G.level-1)*0.04 + G.dmgBuff);
  return {
    id: G.uid++, type, side, lane, u,
    hp: d.hp*hpScale, maxHp: d.hp*hpScale,
    dmg: d.dmg*dmgScale, range: d.range, speed: d.speed, atk: d.atk,
    cd: Math.random()*0.4, bob: Math.random()*6.28, hitFlash: 0,
    heal: d.heal ? d.heal*0.9 : 0,
    atkAnim: 0, hitAnim: 0, hitDir: 1
  };
}
function spawnUnit(type, side, lane){
  const u = side === 'player' ? PLAYER_BASE_U + 0.03 : ENEMY_BASE_U - 0.03;
  const unit = makeUnit(type, side, lane, u);
  G.units.push(unit);
  if(side === 'player'){
    G.spawned++;
    questProgress('spawns', 1);
    if(type==='mage') questProgress('mages',1);
    if(type==='knight') questProgress('knights',1);
    if(type==='archer') questProgress('archers',1);
  }
}
function damageUnit(target, amount, byPlayer){
  if(target.hp <= 0) return;
  target.hp -= amount;
  target.hitFlash = 0.18; target.hitAnim = 0.2; target.hitDir = byPlayer ? 1 : -1;
  addDamageNumber(target.u, target.lane, Math.round(amount));
  if(target.hp <= 0){
    target.hp = 0;
    burst(target.u, target.lane, byPlayer ? '#7b5cff' : '#ff5f6d', 8);
    if(byPlayer){ G.kills++; state.kills = (state.kills||0)+1; questProgress('kills', 1); }
  }
}
function addDamageNumber(u, lane, dmg){
  const p = project(u, lane);
  G.damageNums.push({x: p.x + (Math.random()-0.5)*16, y: p.y - 60*p.s, vy: -60 - Math.random()*30, life: 0.9, max: 0.9, text: String(dmg), color: '#ffdb6b'});
}
function burst(u, lane, color, n){
  const p = project(u, lane);
  for(let i=0;i<n;i++){
    const a = Math.random()*6.28, sp = 18 + Math.random()*60;
    G.particles.push({x:p.x, y:p.y - 22*p.s, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40, life:0.55 + Math.random()*0.35, max:0.9, color, r: 1.6 + Math.random()*2.2, s:p.s});
  }
}
function updateGame(dt){
  G.time += dt;
  G.essence = Math.min(G.essenceMax, G.essence + G.essenceRegen*dt*(1+G.essBuff));
  G.spawnTimer -= dt;
  if(G.spawnTimer <= 0){
    G.spawnTimer = G.spawnInterval * (0.8 + Math.random()*0.45);
    let pool = ['sword','sword','archer'];
    if(G.level >= 2) pool.push('archer','mage');
    if(G.level >= 3) pool.push('knight','heal');
    if(G.level >= 5) pool.push('knight','mage','heal');
    if(G.isTutorial) pool = ['sword'];
    const type = pool[Math.floor(Math.random()*pool.length)];
    spawnUnit(type, 'enemy', LANES[Math.floor(Math.random()*LANES.length)]);
  }
  const list = G.units;
  for(let i=0;i<list.length;i++){
    const u = list[i];
    if(u.hp <= 0) continue;
    u.bob += dt*7;
    if(u.hitFlash > 0) u.hitFlash -= dt;
    if(u.hitAnim > 0) u.hitAnim -= dt;
    if(u.atkAnim > 0) u.atkAnim -= dt;
    u.cd -= dt;
    const dir = u.side === 'player' ? 1 : -1;
    if(UNIT_DEFS[u.type].heal){
      let ally = null, worst = 1;
      for(let j=0;j<list.length;j++){
        const o = list[j];
        if(o === u || o.side !== u.side || o.hp <= 0 || o.lane !== u.lane) continue;
        if(Math.abs(o.u - u.u) > u.range) continue;
        const ratio = o.hp / o.maxHp;
        if(ratio < worst){ worst = ratio; ally = o; }
      }
      if(ally){
        if(u.cd <= 0){
          u.cd = u.atk; u.atkAnim = 0.3;
          const before = ally.hp;
          ally.hp = Math.min(ally.maxHp, ally.hp + u.heal);
          if(ally.hp > before) burst(ally.u, ally.lane, '#8ef0b0', 5);
          G.projectiles.push({x1:u.u,y1:u.lane,x2:ally.u,y2:ally.lane,t:0,dur:0.22,color:'#8ef0b0'});
        }
        continue;
      }
    }
    let target = null, bestD = 1e9;
    for(let j=0;j<list.length;j++){
      const o = list[j];
      if(o.side === u.side || o.hp <= 0 || o.lane !== u.lane) continue;
      const d = (o.u - u.u) * dir;
      if(d > -0.015 && d < bestD){ bestD = d; target = o; }
    }
    const enemyBaseU = dir > 0 ? ENEMY_BASE_U : PLAYER_BASE_U;
    const distToBase = Math.abs(enemyBaseU - u.u);
    if(target && bestD <= u.range){
      if(u.cd <= 0 && u.dmg > 0){ u.cd = u.atk; u.atkAnim = 0.3; attackUnit(u, target); }
    } else if(distToBase <= u.range + 0.025){
      if(u.cd <= 0 && u.dmg > 0){ u.cd = u.atk; u.atkAnim = 0.3; attackBase(u); }
    } else {
      u.u += dir * u.speed * dt;
      u.u = Math.max(0.01, Math.min(0.99, u.u));
    }
  }
  for(let i=G.units.length-1;i>=0;i--) if(G.units[i].hp <= 0) G.units.splice(i,1);
  for(let i=G.projectiles.length-1;i>=0;i--){ const p = G.projectiles[i]; p.t += dt; if(p.t >= p.dur) G.projectiles.splice(i,1); }
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i]; p.life -= dt;
    if(p.life <= 0){ G.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 190*dt;
  }
  for(let i=G.damageNums.length-1;i>=0;i--){
    const d = G.damageNums[i]; d.life -= dt;
    if(d.life <= 0){ G.damageNums.splice(i,1); continue; }
    d.y += d.vy*dt; d.vy += 30*dt;
  }
  if(G.shakeT > 0) G.shakeT -= dt;
  if(G.enemyBase.hp <= 0 && !G.over) endLevel(true);
  else if(G.playerBase.hp <= 0 && !G.over) endLevel(false);
  updateBattleHud();
}
function attackUnit(u, target){
  if(UNIT_DEFS[u.type].ranged){
    G.projectiles.push({x1:u.u,y1:u.lane,x2:target.u,y2:target.lane,t:0,dur:0.2,color:UNIT_DEFS[u.type].proj||'#fff'});
    if(UNIT_DEFS[u.type].aoe){
      const aoe = UNIT_DEFS[u.type].aoe;
      for(const o of G.units){
        if(o.side === u.side || o.hp <= 0) continue;
        if(Math.abs(o.u - target.u) <= aoe && Math.abs(o.lane - target.lane) < 0.01) damageUnit(o, u.dmg, u.side === 'player');
      }
      burst(target.u, target.lane, '#b48bff', 10);
    } else damageUnit(target, u.dmg, u.side === 'player');
  } else {
    damageUnit(target, u.dmg, u.side === 'player');
    burst(target.u, target.lane, u.side === 'player' ? '#9fc7ff' : '#ff9f9f', 3);
  }
}
function attackBase(u){
  const dmg = u.dmg;
  if(u.side === 'player'){ G.enemyBase.hp = Math.max(0, G.enemyBase.hp - dmg); G.shakeT = 0.18; burst(ENEMY_BASE_U, u.lane, '#ffcf6b', 5); }
  else { G.playerBase.hp = Math.max(0, G.playerBase.hp - dmg); G.shakeT = 0.18; burst(PLAYER_BASE_U, u.lane, '#ff5f6d', 5); }
  if(UNIT_DEFS[u.type].ranged){
    G.projectiles.push({x1:u.u,y1:u.lane,x2: u.side === 'player' ? ENEMY_BASE_U : PLAYER_BASE_U, y2: 0.5, t:0, dur:0.2, color: UNIT_DEFS[u.type].proj || '#fff'});
  }
}

function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}
function drawGround(){
  const a = project(0,0), b = project(1,0), c = project(1,1), d = project(0,1);
  const isCave = G.mode === 'cave';
  const g = ctx.createLinearGradient(0,a.y,0,d.y);
  if(isCave){ g.addColorStop(0,'#181022'); g.addColorStop(0.55,'#211830'); g.addColorStop(1,'#2a1f3d'); }
  else { g.addColorStop(0,'#1a2419'); g.addColorStop(0.55,'#22301f'); g.addColorStop(1,'#2c3f28'); }
  ctx.beginPath();
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
  ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = isCave ? 'rgba(180,140,255,.10)' : 'rgba(150,210,160,.10)';
  ctx.lineWidth = 1;
  for(let i=0;i<=12;i++){ const p1 = project(i/12,0), p2 = project(i/12,1); ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  for(let i=0;i<=6;i++){ const p1 = project(0,i/6), p2 = project(1,i/6); ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  const m1 = project(0.5,0), m2 = project(0.5,1);
  ctx.strokeStyle = 'rgba(232,194,106,.14)'; ctx.lineWidth = 1.5; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(m1.x,m1.y); ctx.lineTo(m2.x,m2.y); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}
function drawBase(side){
  const isPlayer = side === 'player';
  const u = isPlayer ? PLAYER_BASE_U : ENEMY_BASE_U;
  const p = project(u, 0.5);
  const isCave = G.mode === 'cave';
  const key = isCave ? (isPlayer ? 'castle' : 'altardark') : (isPlayer ? 'castle' : 'darktower');
  const img = getSprite(key);
  const h = 178 * p.s, w = h * (140/200);
  const gg = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, w*0.85);
  gg.addColorStop(0, isPlayer ? 'rgba(120,170,255,.30)' : (isCave ? 'rgba(180,80,255,.28)' : 'rgba(255,60,90,.28)'));
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, w*0.85, w*0.36, 0, 0, 6.283); ctx.fill();
  if(img && img.complete && img.naturalWidth) ctx.drawImage(img, p.x - w/2, p.y - h, w, h);
  const hp = isPlayer ? G.playerBase.hp/G.playerBase.max : G.enemyBase.hp/G.enemyBase.max;
  const bw = w * 0.88, bh = 7;
  const bx = p.x - bw/2, by = p.y - h - 16;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  roundRect(ctx, bx-1, by-1, bw+2, bh+2, 4); ctx.fill();
  ctx.fillStyle = isPlayer ? '#4d9dff' : (isCave ? '#b46bff' : '#ff4d5e');
  roundRect(ctx, bx, by, bw*Math.max(0,hp), bh, 3); ctx.fill();
}
function drawUnit(u){
  const p = project(u.u, u.lane);
  const def = UNIT_DEFS[u.type];
  const img = getSprite(def.img);
  const hh = 70 * p.s, ww = hh * (64/84);
  let lungeX = 0, rot = 0;
  if(u.atkAnim > 0){
    const k = u.atkAnim / 0.3, sign = u.side === 'player' ? 1 : -1;
    lungeX = sign * Math.sin((1-k)*Math.PI) * 8;
    rot = sign * Math.sin((1-k)*Math.PI) * 0.14;
  }
  if(u.hitAnim > 0){ lungeX -= u.hitDir * Math.sin((u.hitAnim/0.2)*Math.PI) * 6; }
  ctx.save(); ctx.globalAlpha = 0.4;
  ctx.fillStyle = u.side === 'player' ? '#4fa8ff' : (G.mode==='cave' ? '#b46bff' : '#ff5a5a');
  ctx.beginPath(); ctx.ellipse(p.x, p.y, ww*0.40, ww*0.15, 0, 0, 6.283); ctx.fill();
  ctx.restore();
  if(img && img.complete && img.naturalWidth){
    const bob = Math.sin(u.bob)*1.8*p.s;
    ctx.save();
    ctx.translate(p.x + lungeX, p.y);
    if(u.side === 'enemy'){
      ctx.scale(-1,1);
      ctx.filter = G.mode==='cave' ? 'saturate(0.7) brightness(0.85) hue-rotate(-30deg)' : 'saturate(0.55) brightness(0.85) hue-rotate(-25deg)';
    }
    if(rot) ctx.rotate(rot);
    ctx.drawImage(img, -ww/2, -hh + bob, ww, hh);
    ctx.restore();
    if(u.hitFlash > 0){
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = u.hitFlash*3;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(p.x, p.y - hh*0.5, ww*0.4, hh*0.45, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }
  }
  if(u.hp < u.maxHp){
    const bw = ww*0.86, bh = 3.6;
    const bx = p.x - bw/2, by = p.y - hh - 9;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    roundRect(ctx, bx-0.6, by-0.6, bw+1.2, bh+1.2, 2.2); ctx.fill();
    ctx.fillStyle = u.side === 'player' ? '#54e08a' : '#ff6b6b';
    roundRect(ctx, bx, by, bw*Math.max(0,u.hp/u.maxHp), bh, 1.8); ctx.fill();
  }
}
function drawProjectiles(){
  for(const pr of G.projectiles){
    const k = Math.min(1, pr.t/pr.dur);
    const p1 = project(pr.x1, pr.y1), p2 = project(pr.x2, pr.y2);
    const x = p1.x + (p2.x-p1.x)*k;
    const y = p1.y + (p2.y-p1.y)*k - Math.sin(k*Math.PI)*34*p1.s;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x,y,0,x,y,13);
    g.addColorStop(0, pr.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,13,0,6.283); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y,2.2,0,6.283); ctx.fill();
    ctx.restore();
  }
}
function drawParticles(){
  for(const p of G.particles){
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a*0.9) * p.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawDamageNums(){
  for(const d of G.damageNums){
    const a = Math.max(0, d.life / d.max);
    ctx.globalAlpha = a;
    ctx.font = 'bold 14px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 3;
    ctx.strokeText(d.text, d.x, d.y);
    ctx.fillStyle = d.color; ctx.fillText(d.text, d.x, d.y);
  }
  ctx.globalAlpha = 1;
}
function renderBattle(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.shakeT > 0){
    const m = G.shakeT * 14;
    ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m);
  }
  if(G.mode === 'cave'){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#080512'); g.addColorStop(0.5,'#150a20'); g.addColorStop(1,'#1d0f2a');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    const now = performance.now()/1000;
    for(let i=0;i<14;i++){
      const cx = (Math.sin(i*13.7)*0.5+0.5) * W;
      const cy = ((Math.cos(i*7.3)*0.5+0.5)*0.6 + 0.05) * H;
      ctx.globalAlpha = 0.25 + 0.2*Math.sin(now + i);
      ctx.fillStyle = '#b46bff';
      ctx.beginPath(); ctx.arc(cx, cy, 2 + Math.sin(i)*1, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    drawBattleSky();
  }
  drawGround();
  drawBase('player');
  drawBase('enemy');
  const sorted = G.units.slice().sort((a,b)=>{
    if(a.lane !== b.lane) return a.lane - b.lane;
    return a.u - b.u;
  });
  for(const u of sorted) drawUnit(u);
  drawProjectiles();
  drawParticles();
  drawDamageNums();
}

/* ========================================================================
   BATTLE FLOW
   ======================================================================== */
function updateBattleHud(){
  if(!G.active) return;
  document.getElementById('hp-ally').style.width = Math.max(0,(G.playerBase.hp/G.playerBase.max)*100)+'%';
  document.getElementById('hp-enemy').style.width = Math.max(0,(G.enemyBase.hp/G.enemyBase.max)*100)+'%';
  refreshUnitButtons();
}
function startBattle(level, isTutorial){
  let cfg = levelCfg(level);
  if(isTutorial) cfg = { enemyBaseHp: 150, playerBaseHp: 5000, spawnInterval: 12 };
  G.mode = 'battle'; G.level = level; G.isTutorial = !!isTutorial;
  G.units = []; G.projectiles = []; G.particles = []; G.damageNums = [];
  G.essence = isTutorial ? 120 : 60; G.essenceMax = 120;
  G.essenceRegen = isTutorial ? 20 : (10 + level*0.35);
  G.playerBase = {hp: cfg.playerBaseHp, max: cfg.playerBaseHp};
  G.enemyBase = {hp: cfg.enemyBaseHp, max: cfg.enemyBaseHp};
  G.spawnInterval = cfg.spawnInterval;
  G.spawnTimer = isTutorial ? 15 : 2.5;
  G.time = 0; G.kills = 0; G.spawned = 0;
  G.over = false; G.active = true;
  setBuffFromHeroes();
  VIEW = 'battle';
  worldEl.style.display = 'none';
  document.getElementById('battlehud').classList.add('show');
  document.getElementById('pausebtn').classList.add('show');
  buildBattleUnitBar();
}
function startCave(lvl){
  const cfg = caveCfg(lvl);
  G.mode = 'cave'; G.level = lvl; G.isTutorial = false;
  G.units = []; G.projectiles = []; G.particles = []; G.damageNums = [];
  G.essence = 60; G.essenceMax = 120;
  G.essenceRegen = 9 + lvl*0.4;
  G.playerBase = {hp: cfg.playerBaseHp, max: cfg.playerBaseHp};
  G.enemyBase = {hp: cfg.enemyBaseHp, max: cfg.enemyBaseHp};
  G.spawnInterval = cfg.spawnInterval;
  G.spawnTimer = 2.0;
  G.time = 0; G.kills = 0; G.spawned = 0;
  G.over = false; G.active = true;
  setBuffFromHeroes();
  VIEW = 'cave';
  worldEl.style.display = 'none';
  document.getElementById('battlehud').classList.add('show');
  document.getElementById('pausebtn').classList.add('show');
  buildBattleUnitBar();
}
function stopBattle(){
  G.active = false; G.over = true;
  VIEW = 'lobby';
  document.getElementById('battlehud').classList.remove('show');
  document.getElementById('pausebtn').classList.remove('show');
  worldEl.style.display = '';
  buildLobbyBottom();
  refreshAllUI();
  refreshMusic();
}

let pendingReward = null;
let pendingTutorialWin = false;
function endLevel(win){
  if(G.over) return;
  G.over = true; G.active = false;
  const isCave = G.mode === 'cave';
  const wasTutorial = G.isTutorial;
  setTimeout(()=>{
    document.getElementById('pausebtn').classList.remove('show');
    if(win){
      questProgress('wins',1);
      state.wins = (state.wins||0)+1;
      if(isCave){
        questProgress('caveWins',1);
        if(G.level >= (state.caveMaxLevel||1)) state.caveMaxLevel = G.level + 1;
        const idx = Math.min(CAVE_REWARDS.length-1, G.level-1);
        const rew = CAVE_REWARDS[idx];
        pendingReward = {mode:'cave', ess: rew.essence, gold: rew.gold, wheat: rew.wheat, wood: rew.wood, stone: rew.stone};
      } else {
        const reward = 60 + G.level*30 + Math.floor(G.kills*1.5);
        pendingReward = {mode:'battle', gold: reward};
        if(state.maxLevel <= G.level) state.maxLevel = G.level + 1;
      }
    } else {
      const reward = Math.floor(10 + G.kills*1.2);
      pendingReward = {mode: isCave?'cave':'battle', gold: reward, ess: 0, wheat:0, wood:0, stone:0};
    }
    pendingTutorialWin = wasTutorial && win;
    showResult(win);
    saveGame();
  }, 700);
}

const ovResult = document.getElementById('ov-result');
function showResult(win){
  const r = pendingReward || {};
  document.getElementById('res-title').textContent = win ? t('win') : t('lose');
  document.getElementById('res-title').style.color = win ? 'var(--gold-l)' : '#ff8b8b';
  document.getElementById('res-big').textContent = (win ? '✦ ' : '✧ ') + (G.mode==='cave'? (LANG==='ru'?'Пещера ':'Cave ') : t('level') + ' ') + G.level;
  let lines = `<div class="res-line"><span>${t('units_spawned')}</span><b>${G.spawned}</b></div>
    <div class="res-line"><span>${t('enemies_killed')}</span><b>${G.kills}</b></div>`;
  let rewardText = '';
  if(r.gold) rewardText += '+'+r.gold+' '+t('gold')+' ';
  if(r.ess) rewardText += '+'+r.ess+' '+t('essence')+' ';
  if(r.wheat) rewardText += '+'+r.wheat+' '+t('wheat')+' ';
  if(r.wood) rewardText += '+'+r.wood+' '+t('wood')+' ';
  if(r.stone) rewardText += '+'+r.stone+' '+t('stone');
  lines += `<div class="res-line" style="border:none"><span>${t('winreward')}</span><b style="color:var(--gold-l)">${rewardText}</b></div>`;
  document.getElementById('res-lines').innerHTML = lines;
  const dbl = document.getElementById('res-double');
  dbl.style.display = (win && !G.isTutorial) ? 'block' : 'none';
  dbl.disabled = false;
  dbl.textContent = t('double_reward');
  document.getElementById('res-take').textContent = t('take_reward');
  ovResult.classList.add('show');
  syncPause();
}
function claimPendingReward(){
  const r = pendingReward;
  if(!r) return;
  if(r.gold) addGold(r.gold);
  if(r.ess) addResource('essence', r.ess);
  if(r.wheat) addResource('wheat', r.wheat);
  if(r.wood) addResource('wood', r.wood);
  if(r.stone) addResource('stone', r.stone);
  pendingReward = null;
  refreshAllUI(); saveGame();
}
document.getElementById('res-take').addEventListener('click', ()=>{
  claimPendingReward();
  ovResult.classList.remove('show');
  syncPause();
  const wasTutWin = pendingTutorialWin;
  pendingTutorialWin = false;
  stopBattle();
  if(wasTutWin) tutTrigger('battle-won');
});
document.getElementById('res-double').addEventListener('click', async ()=>{
  const btn = document.getElementById('res-double');
  btn.disabled = true;
  const r = await showNativeAd('reward');
  const success = r && (r.result === true || r.result === 'true');
  if(success){
    const orig = pendingReward;
    if(orig.gold) orig.gold *= 2;
    if(orig.ess) orig.ess *= 2;
    if(orig.wheat) orig.wheat *= 2;
    if(orig.wood) orig.wood *= 2;
    if(orig.stone) orig.stone *= 2;
    toast('x2!');
  }
  claimPendingReward();
  ovResult.classList.remove('show');
  syncPause();
  stopBattle();
});

const QUEST_POOL = [
  {id:'q_win1',type:'wins',target:1,reward:120},{id:'q_win2',type:'wins',target:2,reward:250},
  {id:'q_win4',type:'wins',target:4,reward:520},{id:'q_spawn20',type:'spawns',target:20,reward:100},
  {id:'q_spawn60',type:'spawns',target:60,reward:260},{id:'q_kill25',type:'kills',target:25,reward:130},
  {id:'q_kill70',type:'kills',target:70,reward:330},{id:'q_gold300',type:'gold',target:300,reward:150},
  {id:'q_gold900',type:'gold',target:900,reward:380},{id:'q_mage8',type:'mages',target:8,reward:140},
  {id:'q_min10',type:'minutes',target:10,reward:110},{id:'q_min25',type:'minutes',target:25,reward:280},
  {id:'q_knight5',type:'knights',target:5,reward:160},{id:'q_arch15',type:'archers',target:15,reward:170},
  {id:'q_build1',type:'builds',target:1,reward:200},{id:'q_cave1',type:'caveWins',target:1,reward:250},
  {id:'q_auc1',type:'auctionSales',target:1,reward:180}
];
const QUEST_BY_ID = {};
QUEST_POOL.forEach(q=>QUEST_BY_ID[q.id]=q);

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function seededShuffle(arr, seed){
  let s = Math.abs(seed) % 2147483647 || 1;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    s = (s*1103515245 + 12345) & 0x7fffffff;
    const j = s % (i+1);
    const tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function ensureDailyQuests(){
  const today = todayStr();
  if(state.questDate === today && state.questList.length) return;
  let seed = 0;
  for(let i=0;i<today.length;i++) seed = seed*31 + today.charCodeAt(i);
  const picked = seededShuffle(QUEST_POOL, seed).slice(0,10);
  state.questDate = today;
  state.questList = picked.map(q=>q.id);
  state.quests = {}; state.questClaimed = {};
  state.questList.forEach(id=>state.quests[id] = 0);
  saveGame();
}
function questProgress(type, n){
  if(!state.questList || !state.questList.length) return;
  let changed = false;
  for(const id of state.questList){
    const def = QUEST_BY_ID[id];
    if(!def) continue;
    if(def.type === type){ state.quests[id] = (state.quests[id] || 0) + n; changed = true; }
  }
  if(changed){
    if(document.getElementById('ov-quests').classList.contains('show')) renderQuests();
    updateAlertDots(); saveGame();
  }
}
function questReady(id){
  const def = QUEST_BY_ID[id];
  if(!def) return false;
  return (state.quests[id]||0) >= def.target && !state.questClaimed[id];
}
function questName(def){
  const names = {
    wins:{ru:'Победить в битвах',en:'Win battles'},spawns:{ru:'Призвать воинов',en:'Summon warriors'},
    kills:{ru:'Победить врагов',en:'Defeat enemies'},gold:{ru:'Заработать золота',en:'Earn gold'},
    mages:{ru:'Призвать магов',en:'Summon mages'},minutes:{ru:'Провести в игре минут',en:'Spend minutes'},
    knights:{ru:'Призвать рыцарей',en:'Summon knights'},archers:{ru:'Призвать лучников',en:'Summon archers'},
    builds:{ru:'Построить зданий',en:'Construct buildings'},caveWins:{ru:'Победить в пещере',en:'Win in cave'},
    auctionSales:{ru:'Продать на аукционе',en:'Sell on auction'}
  };
  const n = names[def.type];
  return n ? (n[LANG] || n.ru) : def.type;
}
function renderQuests(){
  const box = document.getElementById('quest-list');
  if(!box) return;
  if(!state.questList.length){ box.innerHTML = `<div class="muted center">${LANG==='ru'?'Задания обновятся завтра':'Quests refresh tomorrow'}</div>`; return; }
  let html = '';
  for(const id of state.questList){
    const def = QUEST_BY_ID[id];
    if(!def) continue;
    const cur = Math.min(state.quests[id]||0, def.target);
    const done = questReady(id);
    const claimed = !!state.questClaimed[id];
    const pct = Math.min(100, (cur/def.target)*100);
    html += `<div class="quest ${done?'done':''}">
      <div class="qi"><div class="qn">${questName(def)} — ${cur}/${def.target}</div><div class="qbar"><i style="width:${pct}%"></i></div></div>
      <div class="qr">+${def.reward}</div>
      ${done ? `<button class="btn" data-claim="${id}" style="padding:6px 10px;font-size:12px">${t('quest_claim')}</button>` : (claimed ? `<span class="muted" style="font-size:11px">${t('quest_done')}</span>` : '')}
    </div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('[data-claim]').forEach(b => {
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-claim');
      if(questReady(id)){
        state.questClaimed[id] = true;
        addGold(QUEST_BY_ID[id].reward);
        toast('+' + QUEST_BY_ID[id].reward + ' ' + t('gold'));
        renderQuests(); updateAlertDots(); refreshAllUI(); saveGame();
      }
    });
  });
}

const PLAYTIME = [{min:5,gold:60},{min:10,gold:120},{min:20,gold:260},{min:40,gold:520},{min:60,gold:800},{min:120,gold:1600}];
function renderPlaytime(){
  const box = document.getElementById('time-list');
  if(!box) return;
  let html = '';
  PLAYTIME.forEach((p,i)=>{
    const claimed = (state.playClaimed||[]).indexOf(i) >= 0;
    const ready = !claimed && (state.onlineMinutes||0) >= p.min;
    const left = Math.max(0, p.min - (state.onlineMinutes||0));
    html += `<div class="ptime-item ${ready?'ready':''} ${claimed?'done':''}">
      <div class="tl">${LANG==='ru'?'Онлайн':'Online'} ${p.min} ${LANG==='ru'?'мин':'min'} — <b style="color:var(--gold-l)">+${p.gold}</b></div>
      ${claimed ? `<span class="muted">${t('time_gone')}</span>` : ready ? `<button class="btn green" data-pt="${i}" style="padding:6px 12px;font-size:12px">${t('time_ready')}</button>` : `<span class="muted">${t('time_locked')} ${left}</span>`}
    </div>`;
  });
  box.innerHTML = html;
  box.querySelectorAll('[data-pt]').forEach(b => {
    b.addEventListener('click', ()=>{
      const i = parseInt(b.getAttribute('data-pt'),10);
      const p = PLAYTIME[i];
      if((state.playClaimed||[]).indexOf(i)<0 && (state.onlineMinutes||0) >= p.min){
        state.playClaimed.push(i);
        addGold(p.gold);
        toast('+' + p.gold + ' ' + t('gold'));
        renderPlaytime(); updateAlertDots(); refreshAllUI(); saveGame();
      }
    });
  });
}

   TUTORIAL
   ======================================================================== */
const TUT_STEPS = [
  { textKey:'tut_1', target:null,                 advance:'continue' },
  { textKey:'tut_2', target:'#btn-shop',           advance:'shop-open' },
  { textKey:'tut_3', target:'.bcard[data-key="farm"]', advance:'shop-place' },
  { textKey:'tut_4', target:'.bld.empty',          advance:'farm-placed' },
  { textKey:'tut_5', target:null,                  advance:'continue' },
  { textKey:'tut_6', target:'[data-slot="19"]',    advance:'ship-clicked' },
  { textKey:'tut_7', target:null,                  advance:'battle-won' },
  { textKey:'tut_8', target:null,                  advance:'continue' }
];
let tutIndex = 0;
let tutActive = false;
let tapIndEl = null;

function clearTapIndicator(){
  if(tapIndEl){ tapIndEl.remove(); tapIndEl = null; }
  document.querySelectorAll('.tut-tap-ind').forEach(e=>e.remove());
}
function placeTapIndicator(el){
  if(!el) return;
  clearTapIndicator();
  const rect = el.getBoundingClientRect();
  const ind = document.createElement('div');
  ind.className = 'tut-tap-ind';
  ind.textContent = LANG === 'ru' ? 'Нажмите здесь' : 'Tap here';
  let left = rect.left + rect.width / 2;
  let top = rect.top - 6;
  left = Math.max(70, Math.min(window.innerWidth - 70, left));
  top = Math.max(70, top);
  ind.style.left = left + 'px';
  ind.style.top = top + 'px';
  document.body.appendChild(ind);
  tapIndEl = ind;
}

function startTutorial(){
  tutActive = true;
  tutIndex = state.tutStep || 0;
  document.getElementById('tutbox').classList.add('show');
  showTutStep();
  setPause('tutorial', true);
}
function showTutStep(){
  if(tutIndex >= TUT_STEPS.length){ endTutorial(); return; }
  const step = TUT_STEPS[tutIndex];
  document.getElementById('tut-text').textContent = t(step.textKey);
  document.getElementById('tut-dots').innerHTML = TUT_STEPS.map((_,i)=>`<i class="${i<=tutIndex?'on':''}"></i>`).join('');

  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  clearTapIndicator();

  const tutbox = document.getElementById('tutbox');
  // Move box to top only for ship step so the ship at bottom is visible
  const isShipStep = step.target === '[data-slot="19"]';
  tutbox.classList.toggle('top', isShipStep);

  if(step.target){
    const el = document.querySelector(step.target);
    if(el){
      el.classList.add('tut-highlight');
      const isWorldEl = !!el.closest('#lobby-buildings');
      const rect = el.getBoundingClientRect();
      const offScreen =
        rect.bottom < 90 || rect.top > window.innerHeight - 90 ||
        rect.right < 40 || rect.left > window.innerWidth - 40;

      if(isWorldEl && VIEW === 'lobby' && offScreen){
        const wx = parseFloat(el.style.left) || 0;
        const wy = parseFloat(el.style.top) || 0;
        smoothPanToWorld(wx, wy, Math.max(cam.minZoom, 0.65), 750);
        const stepAtTime = tutIndex;
        setTimeout(()=>{
          if(tutActive && tutIndex === stepAtTime){
            const cur = document.querySelector(step.target);
            if(cur) placeTapIndicator(cur);
          }
        }, 800);
      } else {
        const stepAtTime = tutIndex;
        setTimeout(()=>{
          if(tutActive && tutIndex === stepAtTime){
            const cur = document.querySelector(step.target);
            if(cur) placeTapIndicator(cur);
          }
        }, 60);
      }
    }
  }

  const btn = document.getElementById('tut-next');
  if(step.advance === 'continue'){
    btn.style.display = 'block';
    btn.textContent = (tutIndex === TUT_STEPS.length-1) ? t('finish') : t('next');
  } else {
    btn.style.display = 'none';
  }
  state.tutStep = tutIndex;
  saveGame();
}
function tutTrigger(event){
  if(!tutActive) return;
  const step = TUT_STEPS[tutIndex];
  if(!step || step.advance !== event) return;
  advanceTutorial();
}
function advanceTutorial(){
  clearTapIndicator();
  tutIndex++;
  if(tutIndex >= TUT_STEPS.length){ endTutorial(); return; }
  showTutStep();
}
function endTutorial(){
  tutActive = false;
  document.getElementById('tutbox').classList.remove('show');
  document.getElementById('tutbox').classList.remove('top');
  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  clearTapIndicator();
  state.tutorial = 2;
  state.tutStep = 0;
  setPause('tutorial', false);
  syncPause();
  saveGame();
  toast(LANG==='ru'?'Обучение завершено!':'Tutorial completed!');
}
document.getElementById('tut-next').addEventListener('click', ()=>{
  const step = TUT_STEPS[tutIndex];
  if(step && step.advance === 'continue') advanceTutorial();
});

/* Block clicks during tutorial except allowed targets */
function tutAllowEvent(e){
  if(!tutActive) return true;
  if(e.target.closest('#tutbox')) return true;
  const step = TUT_STEPS[tutIndex];
  if(!step) return true;
  // During battle tutorial, allow all battle interaction
  if(step.advance === 'battle-won'){
    if(VIEW === 'battle' || VIEW === 'cave') return true;
    if(e.target.closest('#ov-result')) return true;
    if(e.target.closest('#pausebtn')) return true;
  }
  if(step.target && e.target.closest(step.target)) return true;
  return false;
}
document.addEventListener('click', (e)=>{
  if(tutAllowEvent(e)) return;
  e.stopPropagation(); e.preventDefault(); e.stopImmediatePropagation();
}, true);
document.addEventListener('pointerdown', (e)=>{
  if(tutAllowEvent(e)) return;
  e.stopPropagation(); e.preventDefault(); e.stopImmediatePropagation();
}, true);

/* ========================================================================
   TOAST / AD
   ======================================================================== */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}
const adov = document.getElementById('adov');
function showAdOverlay(){ adov.classList.add('show'); setPause('ad', true); }
function hideAdOverlay(){ adov.classList.remove('show'); setPause('ad', false); }
function showNativeAd(format){
  return new Promise(resolve=>{
    if(!HAS_VK){ setTimeout(()=>resolve({result:true}), 350); return; }
    showAdOverlay();
    const done = (res)=>{ hideAdOverlay(); resolve(res); };
    VK.send('VKWebAppShowNativeAds', {ad_format: format}).then(d=>done(d || {result:true})).catch(()=>done({result:false}));
    setTimeout(()=>{ if(adov.classList.contains('show')) done({result:false}); }, 25000);
  });
}

/* ========================================================================
   TICK
   ======================================================================== */
setInterval(()=>{
  if(VIEW !== 'lobby') return;
  let changed = false;
  for(const id in state.slots){
    const b = state.slots[id];
    if(!b) continue;
    if(b.buildEnd && b.buildEnd > 0 && Date.now() >= b.buildEnd){
      b.buildEnd = 0; b.buildStart = 0;
      if(BUILDINGS[b.key].resource) state.prod[id] = Date.now();
      changed = true;
      const nm = LANG==='ru' ? BUILDINGS[b.key].ru : BUILDINGS[b.key].en;
      toast(nm + ' — ' + t('ready'));
      questProgress('builds', 1);
    }
  }
  for(const key in state.heroes){
    const h = state.heroes[key];
    if(h.upgradeEnd && h.upgradeEnd > 0 && Date.now() >= h.upgradeEnd){
      h.upgradeEnd = 0; changed = true;
      toast((LANG==='ru'?HERO_DEFS[key].ru:HERO_DEFS[key].en) + ' — ' + t('ready'));
    }
  }
  if(changed){ refreshAllUI(); saveGame(); }
  else updateBuildingIndicators();
}, 1000);

/* ========================================================================
   MAIN LOOP
   ======================================================================== */
let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if(dt > 0.06) dt = 0.06;
  if(dt < 0) dt = 0;
  if((VIEW === 'battle' || VIEW === 'cave') && G.active && !anyPause()){
    updateGame(dt);
  }
  if(VIEW === 'lobby') drawLobbyScene();
  else renderBattle();
}

/* ========================================================================
   VISIBILITY
   ======================================================================== */
window.addEventListener('blur', ()=> setPause('hidden', true));
window.addEventListener('focus', ()=> setPause('hidden', false));
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) setPause('hidden', true);
  else setPause('hidden', false);
});
if(HAS_VK){
  try{
    vkBridge.subscribe((e)=>{
      const type = e && e.detail && e.detail.type;
      if(type === 'VKWebAppViewHide') setPause('hidden', true);
      else if(type === 'VKWebAppViewRestore') setPause('hidden', false);
    });
  }catch(err){}
}

function initBanner(){
  if(!HAS_VK) return;
  VK.send('VKWebAppGetLaunchParams')
    .then(()=> VK.send('VKWebAppShowBannerAd', {banner_location:'bottom'}))
    .then(()=>{ document.getElementById('banner').classList.add('on'); setTimeout(resizeCanvas, 320); })
    .catch(()=>{});
}

/* ========================================================================
   BOOT
   ======================================================================== */
async function boot(){
  resizeCanvas();
  await loadSprites();
  buildSailingOverlay();

  const saved = await loadGame();
  if(saved){
    state = Object.assign(defaultState(), saved);
    if(!state.slots){
      const s = {};
      SLOT_LAYOUT.forEach(sl => { s[sl.id] = sl.fixed ? {key: sl.fixed, level: 1, buildEnd: 0} : null; });
      state.slots = s;
    } else {
      SLOT_LAYOUT.forEach(sl => {
        if(sl.fixed && (!state.slots[sl.id] || !state.slots[sl.id].key)){
          state.slots[sl.id] = {key: sl.fixed, level: 1, buildEnd: 0};
        }
      });
      for(const id in state.slots){
        if(!SLOT_LAYOUT.find(s => s.id === parseInt(id,10))) delete state.slots[id];
      }
    }
    if(!state.heroes) state.heroes = {};
    HERO_ORDER.forEach(k => { if(!state.heroes[k]) state.heroes[k] = {level:0, upgradeEnd:0}; });
    if(!state.unitsOwned) state.unitsOwned = {sword: true};
    if(!state.prod) state.prod = {};
    if(!state.auction) state.auction = [];
    if(!state.questList) state.questList = [];
    if(!state.quests) state.quests = {};
    if(!state.questClaimed) state.questClaimed = {};
    if(!state.playClaimed) state.playClaimed = [];
    if(typeof state.tutStep !== 'number') state.tutStep = 0;
  } else {
    state = defaultState();
  }

  LANG = state.lang === 'en' ? 'en' : 'ru';
  state.lang = LANG;

  cam.zoom = Math.max(computeMinZoom(), 0.5);
  centerCamOnCastle();

  ensureDailyQuests();
  applyLang();
  refreshAllUI();
  renderLobbyBuildings();
  buildLobbyBottom();
  initBanner();
  resizeCanvas();

  const firstGesture = ()=>{ Music.ensure(); if(state.music) Music.play(); };
  window.addEventListener('pointerdown', firstGesture, {once: true});
  window.addEventListener('keydown', firstGesture, {once: true});

  if(state.tutorial !== 2){
    setTimeout(()=>{ startTutorial(); }, 600);
  }

  requestAnimationFrame(loop);
}

boot();
setInterval(()=>saveGame(), 20000);
window.addEventListener('beforeunload', ()=>saveGame(true));
</script>
