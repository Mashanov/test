<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0b14">
<title>Мистическое Средневековье</title>
<script src="https://vk.com/js/api/xd_connection.js?2"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
:root{
  --gold:#e8c26a; --gold-d:#a8813a; --gold-l:#ffe9a8;
  --bg:#0b0813; --text:#e9e2d0; --muted:#9d94ad;
  --accent:#7b5cff; --green:#5cd68a; --red:#ff5f6d;
  --wheat:#e8c460; --wood:#a07040; --stone:#9098a8; --essence:#c88aff;
  --border:rgba(232,194,106,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Georgia","Palatino Linotype",serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;position:relative;overflow:hidden}

#topbar{flex:0 0 auto;display:flex;align-items:center;gap:3px;padding:4px 5px;min-height:42px;background:linear-gradient(180deg,#1c1530,#120d20);border-bottom:1px solid rgba(232,194,106,.18);box-shadow:0 3px 12px rgba(0,0,0,.5);z-index:30;overflow-x:auto;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:3px;flex:0 0 auto;background:linear-gradient(180deg,#2c2140,#1c1530);border:1px solid var(--border);border-radius:14px;padding:3px 8px 3px 5px;font-size:11px;font-weight:bold;color:var(--gold-l);white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.chip svg{width:12px;height:12px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2}
.chip .cap{opacity:.55;font-size:9px;font-weight:normal;margin-left:1px}
.chip.wheat{color:#f0d97a;border-color:rgba(240,217,122,.35)}
.chip.wood{color:#c89060;border-color:rgba(200,144,96,.35)}
.chip.stone{color:#b0b8c8;border-color:rgba(176,184,200,.35)}
.chip.essence{color:#d8a8ff;border-color:rgba(216,168,255,.38)}
.chip.full{border-color:rgba(255,95,109,.5);animation:chipPulse 1.6s infinite}
@keyframes chipPulse{0%,100%{box-shadow:0 0 0 rgba(255,95,109,0)}50%{box-shadow:0 0 8px rgba(255,95,109,.4)}}
#spacer{flex:1;min-width:4px}
.tbtn{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1px solid var(--border);background:linear-gradient(180deg,#2a2140,#1a1428);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0;transition:transform .12s}
.tbtn:active{transform:scale(.9)}
.tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn .dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #120d20;display:none;animation:pulse 1.4s infinite}
.tbtn.alert .dot{display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#cv{display:block;width:100%;height:100%;position:absolute;inset:0;z-index:1;pointer-events:none}
#world{position:absolute;top:0;left:0;width:0;height:0;transform-origin:0 0;will-change:transform;z-index:5;pointer-events:none}
#lobby-buildings{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none}

.bld{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;padding:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .15s;width:90px;height:90px}
.bld.major{width:150px;height:150px}
.bld:active{filter:brightness(1.2)}
.bld .bicon{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
.bld .bicon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.75));display:block;pointer-events:none}
.bld .badge{position:absolute;bottom:2px;right:2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:linear-gradient(180deg,#c9a24a,#7d5a14);border:2px solid #1a1428;color:#241a04;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.bld .timer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:rgba(13,9,22,.96);border:1px solid var(--border);border-radius:8px;padding:2px 7px;font-size:10px;color:var(--gold-l);white-space:nowrap;font-family:monospace;pointer-events:none;font-weight:bold}
.bld .ready{position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--green);border:2px solid #1a1428;box-shadow:0 0 10px var(--green);animation:pulse 1.2s infinite;pointer-events:none}
.bld .bname{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text);white-space:nowrap;text-shadow:0 1px 3px #000,0 0 6px #000,0 0 10px #000;font-weight:bold;pointer-events:none;padding:0 4px}
.bld.building .bicon img{filter:grayscale(.55) brightness(.7) drop-shadow(0 4px 8px rgba(0,0,0,.7))}
.bld.empty .bicon{border:2px dashed rgba(232,194,106,.3);border-radius:14px;background:rgba(20,14,32,.35);display:flex;align-items:center;justify-content:center;font-size:32px;color:rgba(232,194,106,.4);font-weight:300;transition:all .2s}
.bld.empty .bname{display:none}
body.placing .bld.empty .bicon{border-color:var(--green);color:var(--green);background:rgba(92,214,138,.14);animation:placePulse 1.4s infinite;transform:scale(1.05)}
body.placing .bld.empty{cursor:pointer;z-index:10}
body.placing .bld:not(.empty){opacity:.35}
@keyframes placePulse{0%,100%{box-shadow:0 0 0 rgba(92,214,138,0)}50%{box-shadow:0 0 20px rgba(92,214,138,.6)}}
.bld.ship .bicon img{filter:drop-shadow(0 8px 16px rgba(0,0,0,.8)) drop-shadow(0 0 15px rgba(232,194,106,.45))}
.bld.ship .ship-glow{position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,rgba(232,194,106,.28),transparent 60%);animation:pulse 2s infinite;pointer-events:none}

#bottom{flex:0 0 auto;background:linear-gradient(180deg,#150f22,#0d0916);border-top:1px solid rgba(232,194,106,.18);z-index:20;min-height:60px;display:flex;align-items:stretch;gap:6px;padding:6px 7px}
#bottom .lbtn{flex:1 1 0;border-radius:11px;border:1px solid rgba(232,194,106,.28);background:linear-gradient(180deg,#2b2142,#191227);color:var(--text);cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s;font-family:inherit}
#bottom .lbtn:active{transform:scale(.96)}
#bottom .lbtn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bottom .lbtn span{font-size:11px;color:var(--muted);white-space:nowrap}
#bottom .lbtn.shop{flex:2;background:linear-gradient(180deg,#3a2b5e,#241a3d);border-color:var(--border)}
#bottom .lbtn.shop svg{width:26px;height:26px}
#bottom .lbtn.shop span{color:var(--gold-l);font-weight:bold;font-size:12px}
#bottom .ubtn{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;padding:2px 1px 3px;border-radius:11px;border:1px solid rgba(232,194,106,.28);background:linear-gradient(180deg,#2b2142,#191227);color:var(--text);cursor:pointer;overflow:hidden;transition:transform .1s}
#bottom .ubtn:active{transform:scale(.94)}
#bottom .ubtn img{width:auto;height:32px;max-width:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#bottom .ubtn .cost{font-size:11px;font-weight:bold;color:var(--gold-l);display:flex;align-items:center;gap:3px;line-height:1}
#bottom .ubtn .cost i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);display:inline-block}
#bottom .ubtn.disabled{opacity:.42;filter:grayscale(.7)}

#banner{flex:0 0 auto;min-height:0;height:0;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;transition:height .25s}
#banner.on{height:50px;min-height:50px}

.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(5,3,10,.82);backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:500px;max-height:90vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1e1730,#140f22);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;animation:pop .2s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.mhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(232,194,106,.2);background:linear-gradient(180deg,rgba(123,92,255,.14),transparent)}
.mhead h2{margin:0;font-size:17px;color:var(--gold-l);letter-spacing:.5px;flex:1;font-weight:normal}
.mclose{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--gold);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mclose:active{background:rgba(255,255,255,.12)}
.mbody{padding:12px 14px 16px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0}
.mbody,.scroll{scrollbar-width:thin;scrollbar-color:var(--gold-d) rgba(255,255,255,.05)}
.mbody::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:9px;height:9px}
.mbody::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.045);border-radius:9px;margin:4px 0}
.mbody::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--gold-d));border-radius:9px;border:2px solid #171226;background-clip:padding-box}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:11px;margin-bottom:9px}
.row .lab{font-size:14px;color:var(--text)}
.row .sub{font-size:11px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--border);border-radius:11px;padding:9px 16px;background:linear-gradient(180deg,#3a2b5e,#241a3d);color:var(--gold-l);font-family:inherit;font-size:14px;cursor:pointer;font-weight:bold;transition:transform .1s,filter .12s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.6)}
.btn.green{background:linear-gradient(180deg,#2c6b47,#1c4530);border-color:rgba(92,214,138,.5);color:#c9ffe0}
.btn.red{background:linear-gradient(180deg,#7a2b3e,#4a1830);border-color:rgba(255,95,109,.5);color:#ffd0d6}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn.full{width:100%;display:block;margin-top:8px}
.btn.sm{padding:6px 10px;font-size:12px}
.center{text-align:center}
.muted{color:var(--muted);font-size:12px;line-height:1.45}

.costrow{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.costitem{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:bold}
.costitem svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.costitem.miss{color:#ff5f6d}
.costitem.ok{color:var(--green)}

.bcard{display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:9px;align-items:center}
.bcard img{width:52px;height:52px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.bcard .binfo{flex:1;min-width:0}
.bcard .bnm{font-size:14px;color:var(--gold-l);font-weight:bold}
.bcard .bdesc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}
.bcard .bmeta{font-size:10px;color:var(--muted);margin-top:3px}
.bcard .bmeta .ok{color:var(--green)}
.bcard .bmeta .bad{color:var(--red)}
.bcard.maxed{opacity:.45;filter:grayscale(.6)}

.binfo{display:flex;align-items:center;gap:12px;padding:10px;background:rgba(0,0,0,.28);border-radius:12px;margin-bottom:10px}
.binfo img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.binfo .bl{flex:1;min-width:0}
.binfo .bnm{font-size:15px;color:var(--gold-l);font-weight:bold}
.binfo .blv{font-size:12px;color:var(--muted);margin-top:3px}
.binfo .bdesc{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}

.progress{height:9px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin:8px 0;border:1px solid rgba(255,255,255,.06)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#b48bff);transition:width .5s linear;border-radius:5px}

.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ucard{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.ucard img{width:52px;height:52px;object-fit:contain}
.ucard .un{font-size:12px;color:var(--text);font-weight:bold}
.ucard .us{font-size:10px;color:var(--muted)}
.ucard.locked{opacity:.55;filter:grayscale(.6)}
.ucard.owned{border-color:rgba(92,214,138,.5);background:rgba(92,214,138,.08)}
.ucard .ubuy{margin-top:4px;width:100%;padding:6px;font-size:11px;border-radius:8px}

.hcard{display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:9px;align-items:center}
.hcard img{width:54px;height:54px;object-fit:contain;flex:0 0 auto}
.hcard .hinfo{flex:1;min-width:0}
.hcard .hn{font-size:14px;color:var(--gold-l);font-weight:bold}
.hcard .hl{font-size:11px;color:var(--muted);margin-top:2px}
.hcard .hb{font-size:11px;color:var(--essence);margin-top:4px}
.hcard .hbtn{padding:6px 10px;font-size:11px}

.acard{padding:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:8px}
.acard .arow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.acard .anm{font-size:13px;color:var(--text)}
.acard .aprice{font-size:13px;color:var(--gold-l);font-weight:bold}
.acard .achance{font-size:11px;color:var(--muted);margin-top:4px}
.acard .abtns{display:flex;gap:6px;margin-top:8px}
.acard .abtns .btn{flex:1;font-size:11px;padding:6px}

.ccard{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:8px}
.ccard img{width:44px;height:44px;object-fit:contain;flex:0 0 auto}
.ccard .cinfo{flex:1;min-width:0}
.ccard .cn{font-size:13px;color:var(--text);font-weight:bold}
.ccard .cr{font-size:11px;color:var(--essence);margin-top:2px}
.ccard .btn{font-size:11px;padding:7px 12px}
.ccard.locked{opacity:.5;filter:grayscale(.6)}

input.fld,select.fld{flex:1;min-width:0;background:#0f0b1a;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;color-scheme:dark}
input.fld:focus,select.fld:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(123,92,255,.22)}

.switch{position:relative;width:52px;height:28px;border-radius:16px;flex:0 0 auto;background:#2a2238;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#8a8a9a,#5a5a6a);transition:.2s}
.switch.on{background:linear-gradient(180deg,#4b7bff,#2b4bc9);border-color:rgba(120,160,255,.6)}
.switch.on::after{left:26px;background:linear-gradient(180deg,#fff,#cfe0ff)}
.langrow{display:flex;gap:8px}
.langbtn{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer}
.langbtn.active{background:linear-gradient(180deg,#3a2b5e,#241a3d);color:var(--gold-l);border-color:var(--border);font-weight:bold}

.quest{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:8px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:11px}
.quest.done{border-color:rgba(92,214,138,.45);background:rgba(92,214,138,.08)}
.quest .qi{flex:1;min-width:0}
.quest .qn{font-size:12px;margin-bottom:5px;line-height:1.25}
.quest .qbar{height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.quest .qbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-d),var(--gold));transition:width .3s}
.quest .qr{font-size:12px;color:var(--gold-l);font-weight:bold;white-space:nowrap}

.rest-timer{font-size:34px;text-align:center;color:var(--gold-l);letter-spacing:2px;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.rest-bar{height:9px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin:10px 0}
.rest-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#b48bff);transition:width .5s linear}

.ptime-item{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:8px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.ptime-item.ready{border-color:rgba(92,214,138,.5);background:rgba(92,214,138,.1);animation:glowp 1.6s infinite}
@keyframes glowp{0%,100%{box-shadow:0 0 0 rgba(92,214,138,0)}50%{box-shadow:0 0 14px rgba(92,214,138,.4)}}
.ptime-item.done{opacity:.45}
.ptime-item .tl{flex:1;font-size:12px}

#adov{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(3,2,8,.94);backdrop-filter:blur(6px)}
#adov.show{display:flex}
.spinner{width:56px;height:56px;border-radius:50%;border:4px solid rgba(232,194,106,.18);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#adov .adtxt{color:var(--gold-l);font-size:15px;text-align:center;padding:0 30px;line-height:1.5;white-space:pre-line}

#sailing{position:fixed;inset:0;z-index:8000;display:none;overflow:hidden;background:linear-gradient(180deg,#0a0518 0%,#160a24 40%,#2a1438 100%)}
#sailing.show{display:block}
#sailing .sail-stars{position:absolute;inset:0}
#sailing .sail-star{position:absolute;border-radius:50%;background:#dfe6ff;animation:twinkle 2s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
#sailing .sail-moon{position:absolute;top:12%;right:15%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#dfd6ff 60%,#b8a8e0);box-shadow:0 0 40px rgba(220,200,255,.6),0 0 100px rgba(180,160,240,.3)}
#sailing .sail-water{position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(180deg,transparent 0%,rgba(40,60,120,.4) 30%,rgba(15,25,60,.95) 100%)}
#sailing .sail-waves{position:absolute;left:0;right:0;bottom:0;height:50%;overflow:hidden}
#sailing .wave{position:absolute;left:-50%;right:-50%;height:3px;background:linear-gradient(90deg,transparent,rgba(150,180,255,.35),transparent);border-radius:2px;animation:waveMove 3s linear infinite}
@keyframes waveMove{0%{transform:translateX(-10%)}100%{transform:translateX(10%)}}
#sailing .sail-ship{position:absolute;bottom:32%;left:0;width:130px;height:130px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.7));animation:sailAcross 3.4s cubic-bezier(.5,.1,.3,1) forwards,shipBob .9s ease-in-out infinite alternate}
@keyframes sailAcross{0%{left:-15%;opacity:0;transform:scale(.5)}10%{opacity:1;transform:scale(1)}100%{left:110%;transform:scale(1.15)}}
@keyframes shipBob{0%{margin-bottom:0}100%{margin-bottom:8px}}
#sailing .sail-txt{position:absolute;top:20%;left:50%;transform:translateX(-50%);color:var(--gold-l);font-size:clamp(16px,4vw,22px);letter-spacing:2px;text-align:center;text-shadow:0 0 20px rgba(232,194,106,.6),0 2px 4px #000;animation:fadeIn .8s .3s both;white-space:nowrap}
#sailing .sail-sub{position:absolute;top:calc(20% + 34px);left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;letter-spacing:1px;text-align:center;animation:fadeIn .8s .6s both;white-space:nowrap}

/* ============ TUTORIAL ============ */
#tutbox{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom,0px));
  top:auto;
  width:calc(100% - 24px);max-width:440px;
  z-index:9998;display:none;
  background:linear-gradient(180deg,#241b3a,#160f26);
  border:1px solid var(--gold);
  border-radius:14px;padding:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.85),0 0 20px rgba(232,194,106,.25);
}
#tutbox.top{top:calc(52px + env(safe-area-inset-top,0px));bottom:auto}
#tutbox.show{display:block;animation:pop .22s}
#tutbox .tt{font-size:13px;line-height:1.5;margin-bottom:11px;color:var(--text)}
#tutbox .tfoot{display:flex;gap:8px;align-items:center;justify-content:space-between}
#tutbox .dots{display:flex;gap:5px}
#tutbox .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}
#tutbox .dots i.on{background:var(--gold)}

/* Пульсирующая подсветка цели */
.tut-highlight{
  position:relative;z-index:9997!important;
  border-radius:12px!important;
  animation:tut-pulse 1.2s ease-in-out infinite;
  pointer-events:auto!important;
}
@keyframes tut-pulse{
  0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(232,194,106,.7)}
  50%{box-shadow:0 0 0 5px #ffe9a8,0 0 34px rgba(255,233,168,.95)}
}

/* Плавающая стрелка "Нажмите здесь" */
.tut-tap-ind{
  position:fixed;z-index:9999;
  padding:7px 14px;
  background:linear-gradient(180deg,#e8c26a,#a8813a);
  color:#1a1208;font-weight:bold;font-size:13px;
  border-radius:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.7),0 0 24px rgba(232,194,106,.6);
  pointer-events:none;white-space:nowrap;
  transform:translate(-50%,-100%);
  animation:tut-bounce 1.1s ease-in-out infinite;
}
@keyframes tut-bounce{
  0%,100%{transform:translate(-50%,-100%) scale(1)}
  50%{transform:translate(-50%,-118%) scale(1.05)}
}
.tut-tap-ind::after{
  content:'';position:absolute;bottom:-8px;left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:8px solid #e8c26a;
}

.res-big{font-size:26px;text-align:center;margin:4px 0 10px;color:var(--gold-l);letter-spacing:1px}
.res-line{display:flex;justify-content:space-between;padding:7px 4px;font-size:14px;border-bottom:1px dashed rgba(255,255,255,.08)}

#toast{position:fixed;left:50%;top:56px;transform:translate(-50%,-16px);z-index:9500;background:linear-gradient(180deg,#2c2247,#1a1330);border:1px solid var(--border);border-radius:11px;padding:10px 18px;color:var(--gold-l);font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.7)}
#toast.show{opacity:1;transform:translate(-50%,0)}

#battlehud{position:absolute;top:8px;left:0;right:0;z-index:25;display:none;padding:0 10px;pointer-events:none}
#battlehud.show{display:block}
.bhrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.bhrow .bhn{width:56px;color:var(--muted);text-align:right;flex:0 0 auto}
.bhrow .bhbar{flex:1;height:11px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.bhrow .bhbar i{display:block;height:100%;transition:width .2s;border-radius:5px}
.bhrow.enemy .bhn{text-align:left}
#pausebtn{position:absolute;top:8px;right:8px;z-index:26;width:34px;height:34px;display:none;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--border);background:rgba(20,14,34,.85);color:var(--gold);cursor:pointer}
#pausebtn.show{display:flex}
#pausebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{padding:14px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;font-size:12px;position:relative}

.mbtn.alert .bn{display:block}

let saveTimer = null;
function saveGame(now){
  if(!HAS_VK) return;
  if(now){
    VK.send('VKWebAppStorageSet', {key: SAVE_KEY, value: JSON.stringify(state)}).catch(()=>{});
    return;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    VK.send('VKWebAppStorageSet', {key: SAVE_KEY, value: JSON.stringify(state)}).catch(()=>{});
  }, 1200);
}
async function loadGame(){
  if(!HAS_VK) return null;
  try{
    const r = await VK.send('VKWebAppStorageGet', {keys:[SAVE_KEY]});
    const v = r && r.keys && r.keys[0] && r.keys[0].value;
    if(!v || v === '{}' || v === '') return null;
    const parsed = JSON.parse(v);
    if(!parsed || parsed.v !== 5) return null;
    return parsed;
  }catch(e){ return null; }
}
async function clearGameData(){
  state = defaultState();
  clearTimeout(saveTimer);
  saveTimer = null;
  if(HAS_VK){
    try { await VK.send('VKWebAppStorageSet', {key: SAVE_KEY, value: ''}); } catch(e){}
  }
  return true;
}

/* ========================================================================
   MUSIC
   ======================================================================== */
const Music = {
  ctx:null, master:null, timer:null, playing:false, pad:null, i:0,
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
  },
  play(){
    this.ensure(); if(!this.ctx) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    this.playing = true;
    const n = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(n);
    this.master.gain.setTargetAtTime(0.12, n, 0.8);
    if(!this.pad) this._startPad();
    if(!this.timer) this.timer = setInterval(()=>this._tick(), 400);
  },
  stop(){
    this.playing = false;
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    if(!this.ctx) return;
    const n = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(n);
    this.master.gain.setTargetAtTime(0, n, 0.25);
  },
  _startPad(){
    const c = this.ctx;
    const g = c.createGain(); g.gain.value = 0.16;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=620; f.Q.value=1.2;
    g.connect(f); f.connect(this.master);
    const freqs = [110, 164.81, 220, 277.18];
    const oscs = freqs.map(fr=>{
      const o = c.createOscillator();
      o.type='sawtooth'; o.frequency.value=fr; o.detune.value=(Math.random()*14-7);
      o.connect(g); o.start(); return o;
    });
    const lfo = c.createOscillator(); lfo.frequency.value=0.055;
    const lg = c.createGain(); lg.gain.value=260;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    this.pad = {g,f,oscs,lfo};
  },
  _tick(){
    if(!this.playing || !this.ctx) return;
    const scale = [220, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
    const step = [0,2,4,3,5,4,2,0,1,3,5,6];
    const n = scale[step[this.i % step.length] % scale.length];
    this.i++;
    const c = this.ctx, t0 = c.currentTime;
    const o = c.createOscillator(); o.type='triangle'; o.frequency.value = n;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.075, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.35);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 1.45);
  }
};
function refreshMusic(){
  if(state.music && !isPausedBy('hidden') && !isPausedBy('ad') && !isPausedBy('sailing')){
    Music.play();
  } else {
    Music.stop();
  }
}

const SPRITES = {};
function loadSprites(){
  return new Promise(resolve=>{
    let left = Object.keys(SVG_SRC).length;
    const done = ()=>{ if(--left<=0) resolve(); };
    Object.keys(SVG_SRC).forEach(k=>{
      const img = new Image();
      img.decoding = 'async';
      img.onload = done;
      img.onerror = done;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_SRC[k]);
      SPRITES[k] = img;
    });
  });
}
function getSprite(key){ return SPRITES[key]; }

/* ========================================================================
   CANVAS + CAMERA
   ======================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const worldEl = document.getElementById('world');
let W = 800, H = 500, DPR = 1;

const cam = { x: 0, y: 0, zoom: 1, minZoom: 0.3, maxZoom: 2.2 };
let camAnimFrame = null;

function computeMinZoom(){
  return Math.max(W / WORLD.w, H / WORLD.h);
}
function clampCam(){
  cam.minZoom = computeMinZoom();
  cam.maxZoom = Math.max(cam.minZoom + 0.4, 2.2);
  cam.zoom = Math.max(cam.minZoom, Math.min(cam.maxZoom, cam.zoom));
  const vw = W / cam.zoom;
  const vh = H / cam.zoom;
  if(vw >= WORLD.w) cam.x = (WORLD.w - vw) / 2;
  else cam.x = Math.max(0, Math.min(WORLD.w - vw, cam.x));
  if(vh >= WORLD.h) cam.y = (WORLD.h - vh) / 2;
  else cam.y = Math.max(0, Math.min(WORLD.h - vh, cam.y));
}
function applyCam(){
  worldEl.style.transform = `translate(${-cam.x * cam.zoom}px, ${-cam.y * cam.zoom}px) scale(${cam.zoom})`;
}
function centerCamOnCastle(){
  const castle = SLOT_LAYOUT.find(s => s.fixed === 'castle');
  if(!castle) return;
  const cx = castle.x/100 * WORLD.w;
  const cy = castle.y/100 * WORLD.h;
  cam.x = cx - W / cam.zoom / 2;
  cam.y = cy - H / cam.zoom * 0.32;
  clampCam();
  applyCam();
}
function cancelCamAnim(){
  if(camAnimFrame){ cancelAnimationFrame(camAnimFrame); camAnimFrame = null; }
}
function smoothPanToWorld(wx, wy, z, duration){
  cancelCamAnim();
  const startX = cam.x, startY = cam.y, startZ = cam.zoom;
  const endZ = Math.max(cam.minZoom, Math.min(cam.maxZoom, z || cam.zoom));
  const endX = wx - W / endZ / 2;
  const endY = wy - H / endZ * 0.55;
  const t0 = performance.now();
  function step(){
    const k = Math.min(1, (performance.now() - t0) / duration);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    cam.zoom = startZ + (endZ - startZ) * e;
    cam.x = startX + (endX - startX) * e;
    cam.y = startY + (endY - startY) * e;
    clampCam();
    applyCam();
    if(k < 1) camAnimFrame = requestAnimationFrame(step);
    else camAnimFrame = null;
  }
  camAnimFrame = requestAnimationFrame(step);
}

function resizeCanvas(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width);
  H = Math.max(160, r.height);
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  clampCam();
  applyCam();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas, 220));

/* ---------- Camera input ---------- */
const pointers = new Map();
let dragStart = null;
let pinchStart = null;

stage.addEventListener('pointerdown', (e)=>{
  if(VIEW !== 'lobby') return;
  if(tutActive) return;
  if(anyModalOpen()) return;
  if(e.target.closest('.bld')) return;
  cancelCamAnim();
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(pointers.size === 1){
    dragStart = {x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y};
    stage.classList.add('dragging');
  } else if(pointers.size === 2){
    dragStart = null;
    const ps = Array.from(pointers.values());
    pinchStart = {
      dist: Math.hypot(ps[1].x-ps[0].x, ps[1].y-ps[0].y),
      cx: (ps[0].x+ps[1].x)/2, cy: (ps[0].y+ps[1].y)/2,
      camX: cam.x, camY: cam.y, zoom: cam.zoom
    };
  }
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
});
stage.addEventListener('pointermove', (e)=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(pointers.size === 1 && dragStart){
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    cam.x = dragStart.camX - dx / cam.zoom;
    cam.y = dragStart.camY - dy / cam.zoom;
    clampCam();
    applyCam();
  } else if(pointers.size === 2 && pinchStart){
    const ps = Array.from(pointers.values());
    const dist = Math.hypot(ps[1].x-ps[0].x, ps[1].y-ps[0].y);
    const cx = (ps[0].x+ps[1].x)/2, cy = (ps[0].y+ps[1].y)/2;
    const r = stage.getBoundingClientRect();
    const sx = cx - r.left, sy = cy - r.top;
    const newZoom = Math.max(cam.minZoom, Math.min(cam.maxZoom, pinchStart.zoom * (dist / pinchStart.dist)));
    const worldX = pinchStart.camX + sx / pinchStart.zoom;
    const worldY = pinchStart.camY + sy / pinchStart.zoom;
    cam.zoom = newZoom;
    cam.x = worldX - sx / cam.zoom;
    cam.y = worldY - sy / cam.zoom;
    clampCam();
    applyCam();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size === 0){ dragStart = null; pinchStart = null; stage.classList.remove('dragging'); }
  else if(pointers.size === 1){
    const p = Array.from(pointers.values())[0];
    dragStart = {x: p.x, y: p.y, camX: cam.x, camY: cam.y};
    pinchStart = null;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('wheel', (e)=>{
  if(VIEW !== 'lobby' || tutActive || anyModalOpen()) return;
  e.preventDefault();
  cancelCamAnim();
  const r = stage.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const mult = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(cam.minZoom, Math.min(cam.maxZoom, cam.zoom * mult));
  const worldX = cam.x + sx / cam.zoom;
  const worldY = cam.y + sy / cam.zoom;
  cam.zoom = newZoom;
  cam.x = worldX - sx / cam.zoom;
  cam.y = worldY - sy / cam.zoom;
  clampCam();
  applyCam();
}, {passive: false});

/* ========================================================================
   SCENE RENDERING

let VIEW = 'lobby';

function drawStarsScreen(){
  const now = performance.now()/1000;
  let seed = 1337;
  const rnd = ()=>{ seed = (seed*16807)%2147483647; return seed/2147483647; };
  for(let i=0;i<70;i++){
    const sx = rnd()*W, sy = rnd()*H*0.5, sr = 0.4+rnd()*1.4;
    const a = (0.25+rnd()*0.55) * (0.55 + 0.45*Math.sin(now*0.9 + i));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dfe6ff';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawMoon(mx, my, mr){
  const mg = ctx.createRadialGradient(mx,my,mr*0.3,mx,my,mr*4);
  mg.addColorStop(0,'rgba(200,190,255,.30)');
  mg.addColorStop(1,'rgba(200,190,255,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx,my,mr*4,0,6.283); ctx.fill();
  ctx.fillStyle = '#e7e2ff';
  ctx.beginPath(); ctx.arc(mx,my,mr,0,6.283); ctx.fill();
  ctx.fillStyle = 'rgba(150,140,200,.35)';
  ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.25,mr*0.22,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.28,my+mr*0.18,mr*0.16,0,6.283); ctx.fill();
}
function drawBattleSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#070510'); g.addColorStop(0.45,'#151029');
  g.addColorStop(0.78,'#241739'); g.addColorStop(1,'#33204a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  drawStarsScreen();
  drawMoon(W*0.82, H*0.11, Math.min(W,H)*0.048);
}

function drawLobbyScene(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#070510');
  skyGrad.addColorStop(0.55, '#151029');
  skyGrad.addColorStop(1, '#241739');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  drawStarsScreen();
  drawMoon(W*0.82, H*0.09, Math.min(W,H)*0.045);

  // World coordinates
  ctx.setTransform(DPR * cam.zoom, 0, 0, DPR * cam.zoom, -cam.x * cam.zoom * DPR, -cam.y * cam.zoom * DPR);

  const landBottom = WORLD.h * 0.88;
  const g = ctx.createLinearGradient(0, 0, 0, landBottom);
  g.addColorStop(0, '#1e2a18'); g.addColorStop(0.55, '#2a3d22'); g.addColorStop(1, '#3a4d2e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, WORLD.w, landBottom);

  let seed = 42;
  const rnd = ()=>{ seed = (seed*16807)%2147483647; return seed/2147483647; };
  for(let i=0;i<500;i++){
    const gx = rnd()*WORLD.w, gy = rnd()*landBottom;
    ctx.fillStyle = rnd() > 0.5 ? 'rgba(120,160,90,.22)' : 'rgba(60,90,50,.30)';
    ctx.fillRect(gx, gy, 3, 3);
  }

  const castleSlot = SLOT_LAYOUT.find(s => s.fixed === 'castle');
  const cx = castleSlot.x/100 * WORLD.w;
  const cy = castleSlot.y/100 * WORLD.h;
  ctx.strokeStyle = 'rgba(160,140,100,.13)';
  ctx.lineWidth = 55; ctx.lineCap = 'round';
  SLOT_LAYOUT.forEach(s => {
    if(s.fixed === 'castle') return;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(s.x/100*WORLD.w, s.y/100*WORLD.h); ctx.stroke();
  });

  const isNearSlot = (tx, ty) => {
    for(const s of SLOT_LAYOUT){
      const dx = tx - s.x/100*WORLD.w, dy = ty - s.y/100*WORLD.h;
      const r = s.fixed ? 160 : 100;
      if(dx*dx + dy*dy < r*r) return true;
    }
    return false;
  };
  seed = 555;
  for(let i=0;i<60;i++){
    const tx = rnd()*WORLD.w, ty = rnd()*landBottom;
    if(isNearSlot(tx, ty) || ty > landBottom - 40) continue;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(tx, ty, 14, 4, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(tx-3, ty-16, 6, 16);
    ctx.fillStyle = '#1c3318';
    ctx.beginPath(); ctx.moveTo(tx-13, ty-12); ctx.lineTo(tx, ty-42); ctx.lineTo(tx+13, ty-12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a4a1f';
    ctx.beginPath(); ctx.moveTo(tx-11, ty-20); ctx.lineTo(tx, ty-48); ctx.lineTo(tx+11, ty-20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a5a2a';
    ctx.beginPath(); ctx.moveTo(tx-8, ty-28); ctx.lineTo(tx, ty-52); ctx.lineTo(tx+8, ty-28); ctx.closePath(); ctx.fill();
  }
  seed = 888;
  for(let i=0;i<40;i++){
    const tx = rnd()*WORLD.w, ty = 200 + rnd()*(landBottom - 250);
    if(isNearSlot(tx, ty)) continue;
    if(rnd() > 0.5){
      ctx.fillStyle = '#1a3018';
      ctx.beginPath(); ctx.ellipse(tx, ty, 9, 5, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#2a4a22';
      ctx.beginPath(); ctx.ellipse(tx-4, ty-2, 6, 4, 0, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse(tx+5, ty-1, 6, 4, 0, 0, 6.283); ctx.fill();
    } else {
      ctx.fillStyle = '#4a4a54';
      ctx.beginPath(); ctx.ellipse(tx, ty, 8, 5, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#5a5a68';
      ctx.beginPath(); ctx.ellipse(tx-2, ty-1, 5, 3, 0, 0, 6.283); ctx.fill();
    }
  }

  const wg = ctx.createLinearGradient(0, landBottom, 0, WORLD.h);
  wg.addColorStop(0, '#1a2a3a'); wg.addColorStop(0.4, '#102030'); wg.addColorStop(1, '#081420');
  ctx.fillStyle = wg;
  ctx.fillRect(0, landBottom, WORLD.w, WORLD.h - landBottom);
  ctx.fillStyle = '#3a3520';
  ctx.fillRect(0, landBottom - 4, WORLD.w, 4);

  const tt = performance.now()/1000;
  for(let i=0;i<10;i++){
    const y = landBottom + 15 + i * (WORLD.h - landBottom - 30) / 10;
    ctx.strokeStyle = `rgba(120,180,220,${0.16 - i*0.012})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x=0;x<=WORLD.w;x+=12){
      const wave = Math.sin(x*0.02 + tt*1.3 + i*1.1) * (4 + i*0.6);
      if(x === 0) ctx.moveTo(x, y + wave); else ctx.lineTo(x, y + wave);
    }
    ctx.stroke();
  }

  const now = performance.now()/1000;
  for(let i=0;i<20;i++){
    const fx = ((Math.sin(now*0.3 + i*1.7)*0.5+0.5)*0.9 + 0.05) * WORLD.w;
    const fy = ((Math.cos(now*0.4 + i*2.3)*0.5+0.5)*0.75 + 0.1) * landBottom;
    ctx.globalAlpha = 0.35 + 0.35*Math.sin(now*2 + i);
    ctx.fillStyle = '#a8e8a8';
    ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function renderLobbyBuildings(){
  const cont = document.getElementById('lobby-buildings');
  cont.innerHTML = '';
  SLOT_LAYOUT.forEach(slot => {
    const b = state.slots[slot.id];
    const btn = document.createElement('button');
    btn.className = 'bld';
    btn.style.left = (slot.x/100 * WORLD.w) + 'px';
    btn.style.top = (slot.y/100 * WORLD.h) + 'px';
    btn.dataset.slot = slot.id;

    const cfg = b ? BUILDINGS[b.key] : null;
    if(cfg && cfg.major) btn.classList.add('major');
    if(b && b.key === 'ship') btn.classList.add('ship');

    if(!b){
      btn.classList.add('empty');
      btn.innerHTML = `<div class="bicon">+</div>`;
    } else {
      const img = getSprite(cfg.icon);
      const building = b.buildEnd > Date.now();
      if(building) btn.classList.add('building');
      const showBadge = b.key !== 'ship' && b.key !== 'cave' && b.level > 0;
      btn.innerHTML = `
        <div class="bicon">
          <img src="${img.src}" alt="">
          ${showBadge ? `<div class="badge">${b.level}</div>` : ''}
          ${building ? `<div class="timer"></div>` : ''}
          ${b.key === 'ship' ? `<div class="ship-glow"></div>` : ''}
        </div>
        <div class="bname">${LANG === 'ru' ? cfg.ru : cfg.en}</div>
      `;
    }

    btn.addEventListener('click', ()=> onSlotClick(slot.id));
    cont.appendChild(btn);
  });
  updateBuildingIndicators();
}

function updateBuildingIndicators(){
  const cont = document.getElementById('lobby-buildings');
  if(!cont) return;
  SLOT_LAYOUT.forEach(slot => {
    const btn = cont.querySelector(`[data-slot="${slot.id}"]`);
    if(!btn) return;
    const b = state.slots[slot.id];
    if(!b) return;
    const cfg = BUILDINGS[b.key];
    const building = b.buildEnd > Date.now();
    const bicon = btn.querySelector('.bicon');
    if(!bicon) return;

    // Timer
    let timerEl = btn.querySelector('.timer');
    if(building){
      if(!timerEl){ timerEl = document.createElement('div'); timerEl.className = 'timer'; bicon.appendChild(timerEl); }
      timerEl.textContent = fmtTime(Math.max(0, Math.floor((b.buildEnd - Date.now())/1000)));
    } else if(timerEl){ timerEl.remove(); }

    // Badge
    let badgeEl = btn.querySelector('.badge');
    const shouldShow = b.level > 0 && b.key !== 'ship' && b.key !== 'cave';
    if(shouldShow){
      if(!badgeEl){ badgeEl = document.createElement('div'); badgeEl.className = 'badge'; bicon.appendChild(badgeEl); }
      if(badgeEl.textContent !== String(b.level)) badgeEl.textContent = b.level;
    } else if(badgeEl){ badgeEl.remove(); }

    // Ready indicator
    let readyEl = btn.querySelector('.ready');
    if(!building && cfg.resource){
      if(!readyEl){ readyEl = document.createElement('div'); readyEl.className = 'ready'; readyEl.style.display = 'none'; bicon.appendChild(readyEl); }
      const prod = getProduction(slot.id);
      readyEl.style.display = (prod.hasWorker && prod.stored >= prod.cap - 0.5) ? 'block' : 'none';
    } else if(readyEl){ readyEl.style.display = 'none'; }
  });
}

/* ========================================================================
   WORKERS / BUILDERS / STORAGE
   ======================================================================== */
function getTotalWorkers(){
  let w = 0;
  for(const id in state.slots){
    const b = state.slots[id];
    if(b && b.key === 'house' && b.buildEnd <= Date.now() && b.level > 0) w += BUILDINGS.house.workersPerLevel(b.level);
  }
  return w;
}
function getActiveProducerSlotIds(){
  const totalWorkers = getTotalWorkers();
  const active = new Set();
  let used = 0;
  const ids = Object.keys(state.slots).map(n=>parseInt(n,10)).sort((a,b)=>a-b);
  for(const id of ids){
    const b = state.slots[id];
    if(!b || b.buildEnd > Date.now()) continue;
    const cfg = BUILDINGS[b.key];
    if(!cfg.resource || b.level === 0) continue;
    const need = cfg.workersNeeded || 1;
    if(used + need <= totalWorkers){ active.add(id); used += need; }
  }
  return active;
}
function getProduction(slotId){
  const b = state.slots[slotId];
  if(!b) return {stored:0, cap:0, rate:0, hasWorker:false};
  const cfg = BUILDINGS[b.key];
  if(!cfg || !cfg.resource || b.level === 0) return {stored:0, cap:0, rate:0, hasWorker:false};
  const activeSet = getActiveProducerSlotIds();
  const hasWorker = activeSet.has(parseInt(slotId, 10));
  if(!hasWorker) return {stored:0, cap:cfg.cap(b.level), rate:0, hasWorker:false};
  const now = Date.now();
  const last = state.prod[slotId] || now;
  const hours = Math.max(0, (now - last)/3600000);
  const rate = cfg.rate(b.level);
  const cap = cfg.cap(b.level);
  return {stored: Math.min(cap, rate*hours), cap, rate, hasWorker:true};
}
function collectProduction(slotId){
  const b = state.slots[slotId];
  if(!b) return;
  const cfg = BUILDINGS[b.key];
  if(!cfg || !cfg.resource) return;
  const prod = getProduction(slotId);
  const amount = Math.floor(prod.stored);
  if(amount <= 0) return;
  addResource(cfg.resource, amount);
  state.prod[slotId] = Date.now();
  refreshAllUI();
  toast('+' + amount + ' ' + t(cfg.resource));
  saveGame();
}

function getBuilders(){
  let c = 0;
  for(const id in state.slots){
    const b = state.slots[id];
    if(b && b.key === 'builder' && b.buildEnd <= Date.now() && b.level > 0) c++;
  }
  return c;
}
function getActiveBuilds(){
  let c = 0;
  for(const id in state.slots){
    const b = state.slots[id];
    if(b && b.buildEnd > Date.now()) c++;
  }
  return c;
}
function getStorageCap(resource){
  if(resource === 'gold' || resource === 'essence') return Infinity;
  let cap = BASE_STORAGE;
  for(const id in state.slots){
    const b = state.slots[id];
    if(b && b.key === 'warehouse' && b.buildEnd <= Date.now()) cap += b.level * WAREHOUSE_BONUS;
  }
  return cap;
}
function addResource(k, n){
  const cap = getStorageCap(k);
  state[k] = Math.min(cap, (state[k]||0) + n);
}
function addGold(n){
  state.gold = (state.gold||0) + n;
  state.goldEarned = (state.goldEarned||0) + n;
}

/* ========================================================================
   HELPERS
   ======================================================================== */
function fmtTime(sec){
  if(sec <= 0) return '0';
  const d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  const parts = [];
  if(d) parts.push(d+'д');
  if(h) parts.push(h+'ч');
  if(m && !d) parts.push(m+'м');
  if(!d && !h && !m && s) parts.push(s+'с');
  return parts.join(' ') || '0с';
}
function fmtNum(n){
  n = Math.floor(n);
  if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if(n >= 10000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}
function resName(r){ return RES[r] ? (RES[r][LANG] || RES[r].ru) : r; }
function resColor(r){ return RES[r] ? RES[r].color : '#fff'; }
function resIcon(r){ return RES[r] ? RES[r].icon : ''; }
function canAfford(cost){
  for(const k in cost) if((state[k]||0) < cost[k]) return false;
  return true;
}
function spendCost(cost){
  for(const k in cost) state[k] = (state[k]||0) - cost[k];
}
function showCostHTML(cost){
  let html = '<div class="costrow">';
  for(const k in cost){
    const have = state[k]||0, need = cost[k];
    const cls = have >= need ? 'ok' : 'miss';
    html += `<span class="costitem ${cls}"><svg viewBox="0 0 24 24"><path d="${resIcon(k)}"/></svg>${fmtNum(need)}</span>`;
  }
  html += '</div>';
  return html;
}
function getCastleLevel(){
  for(const id in state.slots){
    const b = state.slots[id];
    if(b && b.key === 'castle') return b.level;
  }
  return 0;
}
function findBuildingSlot(key){
  for(const id in state.slots){
    const b = state.slots[id];
    if(b && b.key === key) return parseInt(id, 10);
  }
  return null;
}
function countBuilding(key){
  let c = 0;
  for(const id in state.slots){
    const b = state.slots[id];
    if(b && b.key === key) c++;
  }
  return c;
}

/* ========================================================================
   PLACEMENT
   ======================================================================== */
let placementMode = null;

function onSlotClick(slotId){
  const b = state.slots[slotId];
  if(placementMode){
    if(b){ toast(LANG==='ru'?'Клетка занята':'Occupied'); return; }
    tryPlace(slotId);
    return;
  }
  if(!b){
    if(tutActive) return;
    toast(LANG==='ru'?'Пустая клетка. Откройте магазин.':'Empty cell. Open shop.');
    return;
  }
  if(b.key === 'ship'){
    if(tutActive && tutIndex === 5){
      tutTrigger('ship-clicked');
      startTutorialBattle();
      return;
    }
    if(tutActive) return;
    sailToBattle();
    return;
  }
  if(b.key === 'cave'){
    if(tutActive) return;
    openCaveModal();
    return;
  }
  if(tutActive) return;
  openBuildingModal(slotId);
}
function startPlacement(key){
  if(placementMode) endPlacement();
  placementMode = {key};
  document.body.classList.add('placing');
  renderLobbyBuildings();
  // re-highlight current tutorial target if applicable
  if(tutActive){
    const step = TUT_STEPS[tutIndex];
    if(step && step.target === '.bld.empty'){
      const el = document.querySelector('.bld.empty');
      if(el) el.classList.add('tut-highlight');
    }
  }
}
function endPlacement(){
  placementMode = null;
  document.body.classList.remove('placing');
  renderLobbyBuildings();
}
function tryPlace(slotId){
  if(!placementMode) return;
  const b = state.slots[slotId];
  if(b){ toast(LANG==='ru'?'Занято':'Occupied'); return; }
  const key = placementMode.key;
  const cfg = BUILDINGS[key];
  if(countBuilding(key) >= cfg.max){ toast(LANG==='ru'?'Достигнут лимит':'Max reached'); return; }
  if(cfg.reqCastle && getCastleLevel() < cfg.reqCastle){ toast(t('req_castle') + ' ' + cfg.reqCastle); return; }

  const isTutorialFarm = tutActive && tutIndex === 3 && key === 'farm';
  const cost = cfg.cost(1);
  if(!isTutorialFarm){
    if(getActiveBuilds() >= getBuilders()){ toast(t('builders_busy')); return; }
    if(!canAfford(cost)){ toast(t('no_gold')); return; }
    spendCost(cost);
  }

  state.slots[slotId] = {
    key, level: 0,
    buildEnd: Date.now() + (isTutorialFarm ? 1500 : cfg.time(1)*1000),
    buildStart: Date.now()
  };
  if(cfg.resource) state.prod[slotId] = Date.now();
  endPlacement();
  refreshAllUI();
  saveGame();

  if(isTutorialFarm){
    setTimeout(()=>{
      const bb = state.slots[slotId];
      if(bb && bb.key === 'farm'){
        bb.level = 1; bb.buildEnd = 0; bb.buildStart = 0;
        refreshAllUI();
      }
    }, 1500);
    tutTrigger('farm-placed');
  }
}

        <div class="bnm">${name}</div>
        <div class="blv">${t('level')} ${lvl} / ${cfg.maxLevel}</div>
        <div class="bdesc">${desc}</div>
      </div>
    </div>
  `;
  const building = b.buildEnd > Date.now();
  const nextLvl = lvl + 1;

  if(building){
    const left = Math.max(0, Math.floor((b.buildEnd - Date.now())/1000));
    const total = Math.max(1, (b.buildEnd - b.buildStart) / 1000);
    const pct = 100 * (1 - left/total);
    html += `<div class="center muted" style="margin-bottom:6px">${t('building')}… ${fmtTime(left)}</div>`;
    html += `<div class="progress"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;
  } else if(lvl >= cfg.maxLevel){
    html += `<div class="center muted" style="margin:10px 0">${t('level_max')}</div>`;
  } else {
    let reqOK = true, reqMsg = '';
    if(cfg.reqCastle){
      const have = getCastleLevel();
      if(have < cfg.reqCastle){ reqOK = false; reqMsg = t('req_castle') + ' ' + cfg.reqCastle; }
    }
    const cost = cfg.cost(nextLvl);
    const time = cfg.time(nextLvl);
    const buildersBusy = getActiveBuilds() >= getBuilders();
    const ok = canAfford(cost) && reqOK && !buildersBusy;
    html += `<div style="margin-top:6px;font-size:12px;color:var(--muted)">${LANG==='ru'?'Стоимость:':'Cost:'}</div>`;
    html += showCostHTML(cost);
    html += `<div class="center muted" style="margin:6px 0">${LANG==='ru'?'Время:':'Time:'} ${fmtTime(time)}</div>`;
    if(!reqOK) html += `<div class="center" style="color:#ff8b8b;font-size:12px;margin:6px 0">${reqMsg}</div>`;
    if(buildersBusy) html += `<div class="center" style="color:#ff8b8b;font-size:12px;margin:6px 0">${t('builders_busy')} (${getActiveBuilds()}/${getBuilders()})</div>`;
    if(cfg.resource){
      html += `<div class="muted" style="margin:8px 0">${t('producing')}: +${cfg.rate(nextLvl)}/ч · ${t('storage')} ${cfg.cap(nextLvl)}</div>`;
    }
    if(cfg.workersPerLevel) html += `<div class="muted" style="margin:8px 0">${t('workers_give')}: ${cfg.workersPerLevel(nextLvl)}</div>`;
    if(b.key === 'warehouse') html += `<div class="muted" style="margin:8px 0">${t('cap_bonus')}: +${nextLvl * WAREHOUSE_BONUS}</div>`;
    html += `<button class="btn green full" id="bld-action" ${ok?'':'disabled'}>${t('upgrade')}</button>`;
  }
  if(cfg.resource && lvl > 0 && !building){
    const prod = getProduction(slotId);
    const stored = Math.floor(prod.stored);
    let statusHtml = '';
    if(!prod.hasWorker) statusHtml = `<div class="muted" style="color:#ff8b8b;font-size:11px">${t('no_worker')} — ${t('workers_need')} ${cfg.workersNeeded||1}</div>`;
    else statusHtml = `<div class="muted" style="color:var(--green);font-size:11px">${t('producing')} · +${prod.rate}/ч</div>`;
    html += `<div class="row" style="margin-top:10px">
      <div>
        <div class="lab">${t('storage')}: <b style="color:${resColor(cfg.resource)}">${stored}</b> / ${prod.cap}</div>
        ${statusHtml}
      </div>
      <button class="btn ${stored>0?'green':''}" id="bld-collect" ${stored>0?'':'disabled'}>${t('collect')}</button>
    </div>`;
  }
  if(b.key === 'barracks' && lvl > 0) html += `<button class="btn full" id="bld-units">${t('units')} →</button>`;
  if(b.key === 'lab' && lvl > 0) html += `<button class="btn full" id="bld-lab">${t('lab')} →</button>`;
  if(b.key === 'auction' && lvl > 0) html += `<button class="btn full" id="bld-auction">${t('auction')} →</button>`;
  if(b.key === 'builder'){
    html += `<div class="row" style="margin-top:10px">
      <div><div class="lab">${t('builders')}</div><div class="sub">${LANG==='ru'?'Заняты':'Busy'}: ${getActiveBuilds()} / ${getBuilders()}</div></div>
    </div>`;
  }
  body.innerHTML = html;

  const actionBtn = body.querySelector('#bld-action');
  if(actionBtn){
    actionBtn.addEventListener('click', ()=>{
      if(building) return;
      if(!canAfford(cfg.cost(nextLvl))){ toast(t('no_gold')); return; }
      if(cfg.reqCastle && getCastleLevel() < cfg.reqCastle){ toast(t('req_castle') + ' ' + cfg.reqCastle); return; }
      if(getActiveBuilds() >= getBuilders()){ toast(t('builders_busy')); return; }
      spendCost(cfg.cost(nextLvl));
      b.level = nextLvl;
      b.buildEnd = Date.now() + cfg.time(nextLvl)*1000;
      b.buildStart = Date.now();
      if(cfg.resource) state.prod[slotId] = Date.now();
      refreshAllUI();
      renderBuildingModal();
      saveGame();
    });
  }
  const collectBtn = body.querySelector('#bld-collect');
  if(collectBtn) collectBtn.addEventListener('click', ()=>{ collectProduction(slotId); renderBuildingModal(); });
  const btnUnits = body.querySelector('#bld-units');
  if(btnUnits) btnUnits.addEventListener('click', ()=>{ closeOverlay(document.getElementById('ov-building')); openUnitsModal(); });
  const btnLab = body.querySelector('#bld-lab');
  if(btnLab) btnLab.addEventListener('click', ()=>{ closeOverlay(document.getElementById('ov-building')); openLabModal(); });
  const btnAuc = body.querySelector('#bld-auction');
  if(btnAuc) btnAuc.addEventListener('click', ()=>{ closeOverlay(document.getElementById('ov-building')); openAuctionModal(); });
}

    if(owned) st = `<span style="color:var(--green);font-size:10px">${t('owned')}</span>`;

    else st = `<span style="color:var(--gold-l);font-size:10px">${t('buy')}: ${d.buyPrice} ${t('gold')}</span>`;

      state.gold -= d.buyPrice;
      state.unitsOwned[key] = true;

      toast('+ ' + (LANG==='ru'?d.ru:d.en));

  });

function renderAuctionModal(){

  ['wheat','wood','stone'].forEach(k=>{
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = resName(k) + ' (' + Math.floor(state[k]||0) + ')';

  let html = `<div class="muted" style="margin-bottom:6px">${LANG==='ru'?'Слоты':'Slots'}: ${state.auction.length}/${slots}</div>`;
  if(state.auction.length === 0){
    html += `<div class="muted center" style="padding:14px">${LANG==='ru'?'Нет активных лотов':'No active listings'}</div>`;
  } else {
    state.auction.forEach(a => {
      const chance = Math.min(0.8, Math.max(0.02, 0.4 / (a.price/(BASE_PRICES[a.resource]||1))));
      const age = Math.floor((Date.now() - a.createdAt)/60000);
      html += `<div class="acard">
        <div class="arow"><div class="anm">${resName(a.resource)} x${a.amount}</div><div class="aprice">${a.price} ${t('gold')}/${LANG==='ru'?'ед.':'u'}</div></div>
        <div class="achance">${LANG==='ru'?'Шанс':'Chance'}: ${Math.round(chance*100)}% · ${age} ${LANG==='ru'?'мин':'min'}</div>
        <div class="abtns"><button class="btn red" data-cancel="${a.id}">${t('cancel')}</button></div>
      </div>`;
    });
  }
  listEl.innerHTML = html;
  listEl.querySelectorAll('[data-cancel]').forEach(b => {
    b.addEventListener('click', ()=>{
      const id = parseInt(b.getAttribute('data-cancel'),10);
      const idx = state.auction.findIndex(a=>a.id===id);
      if(idx>=0){
        const a = state.auction[idx];
        state[a.resource] = (state[a.resource]||0) + a.amount;
        state.auction.splice(idx,1);
        refreshAllUI(); renderAuctionModal(); saveGame();
      }
    });
  });
}
document.getElementById('auc-add').addEventListener('click', ()=>{
  const res = document.getElementById('auc-res').value;
  const amt = parseInt(document.getElementById('auc-amt').value,10);
  const price = parseInt(document.getElementById('auc-price').value,10);
  const hint = document.getElementById('auc-hint');
  if(!res || !amt || !price || amt <= 0 || price <= 0){ hint.textContent = LANG==='ru'?'Заполните поля':'Fill fields'; return; }
  if((state[res]||0) < amt){ hint.textContent = LANG==='ru'?'Недостаточно ресурса':'Not enough resource'; return; }
  if(state.auction.length >= auctionSlotLimit()){ hint.textContent = LANG==='ru'?'Все слоты заняты':'All slots busy'; return; }
  if(price / (BASE_PRICES[res]||1) > 5){ hint.textContent = LANG==='ru'?'Слишком высокая цена':'Price too high'; return; }
  state[res] -= amt;
  state.auction.push({id: state.auctionSeq++, resource: res, amount: amt, price, createdAt: Date.now()});
  document.getElementById('auc-amt').value = ''; document.getElementById('auc-price').value = ''; hint.textContent = '';
  refreshAllUI(); renderAuctionModal(); saveGame();
});

setInterval(()=>{
  if(!state.auction || !state.auction.length) return;
  let changed = false;
  for(let i=state.auction.length-1;i>=0;i--){
    const a = state.auction[i];
    const chance = Math.min(0.8, Math.max(0.02, 0.4 / (a.price/(BASE_PRICES[a.resource]||1))));
    if(Math.random() < chance){
      addGold(a.price * a.amount);
      state.auction.splice(i,1);
      changed = true;
      toast('+' + (a.price*a.amount) + ' ' + t('gold'));
      questProgress('auctionSales', 1);
    }
  }
  if(changed){
    refreshAllUI();
    if(document.getElementById('ov-auction').classList.contains('show')) renderAuctionModal();
    saveGame();
  }
}, 60000);
