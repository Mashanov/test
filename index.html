<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<title>Бургерная Turbo</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#100823;font-family:'Segoe UI',Roboto,sans-serif;color:#fff;font-size:14px}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,#2a1850,#0a0518 70%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.screen.active{display:flex}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#ff6b35;border-radius:3px}

/* ==== SVG icons ==== */
.svg{display:inline-block;width:1em;height:1em;vertical-align:middle;flex-shrink:0;fill:currentColor}

/* ==== Buttons ==== */
.btn-primary,.btn-secondary,.btn-tertiary{
  font-family:inherit;font-weight:900;border:none;border-radius:14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s,box-shadow .2s,background .2s;
}
.btn-primary{
  padding:16px 28px;font-size:18px;letter-spacing:.5px;
  background:linear-gradient(135deg,#ff6b35,#ff8c42);
  color:#fff;box-shadow:0 6px 24px rgba(255,107,53,.5),inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-primary:active{transform:scale(.96)}
.btn-primary:disabled{opacity:.4;box-shadow:none}
.btn-secondary{
  padding:12px 20px;font-size:14px;background:rgba(255,255,255,.1);
  color:#fff;border:1px solid rgba(255,255,255,.25);
}
.btn-secondary:active{background:rgba(255,255,255,.2)}
.btn-tertiary{
  padding:10px 16px;font-size:12px;background:rgba(255,255,255,.06);
  color:#fff;border:1px solid rgba(255,255,255,.15);
}
.btn-tertiary:active{background:rgba(255,255,255,.15)}
.btn-danger{background:rgba(230,57,70,.6);border-color:rgba(230,57,70,.8)}

/* ==== LOBBY ==== */
#lobby{justify-content:center;gap:6px}
.lobby-hero{font-size:80px;filter:drop-shadow(0 10px 30px rgba(255,107,53,.6));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
#lobby h1{
  font-size:34px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#ffd166,#ff6b35,#ffd166);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% 50%}}
.subtitle{color:#888;font-size:12px;letter-spacing:4px;margin-bottom:28px}
.menu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.menu-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stats{margin-top:24px;color:#888;font-size:14px}
.stats span{color:#ffd166;font-weight:800}

/* ==== HUD ==== */
.hud{
  position:absolute;top:0;left:0;right:0;height:56px;z-index:10;
  display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  background:linear-gradient(180deg,rgba(20,10,40,.98),rgba(20,10,40,.85));
  border-bottom:1px solid rgba(255,200,100,.25);
}
.hud-left{display:flex;gap:8px;align-items:center}
.coins-hud,.hearts-hud,.level-badge{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  font-weight:800;font-size:14px;
}
.coins-hud{color:#ffd166}
.coins-hud .svg{font-size:16px}
.hearts-hud{letter-spacing:2px;font-size:16px}
.heart{transition:transform .2s,opacity .3s}
.heart.lost{opacity:.25;filter:grayscale(1);transform:scale(.8)}
.level-badge{color:#4ecdc4;font-size:12px}
.hud-quit{
  width:36px;height:36px;border-radius:50%;font-size:22px;font-weight:400;
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* ==== SCENE ==== */
.scene{
  position:absolute;top:56px;left:0;right:0;height:38vh;min-height:200px;max-height:280px;
  background:linear-gradient(180deg,#3d2f5e 0%,#2a1f3a 70%,#5a3a24 70%,#3d2419 100%);
  overflow:hidden;
}
.scene::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:30%;
  background:repeating-linear-gradient(90deg,#5a3a24 0 40px,#3d2419 40px 42px);
  opacity:.6;
}
.customer{
  position:absolute;bottom:22%;width:70px;height:110px;cursor:pointer;
  transition:transform .2s,filter .2s;
  z-index:2;
}
.customer.selected{transform:translateY(-8px) scale(1.08);filter:drop-shadow(0 0 14px #ffd166)}
.customer.leaving{animation:leaveOut .5s forwards}
@keyframes leaveOut{to{transform:translateY(40px) scale(.6);opacity:0}}
.customer .body-svg{width:100%;height:100%;display:block}
.order-bubble{
  position:absolute;top:-52px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:10px;padding:4px 6px;
  display:flex;gap:2px;align-items:center;white-space:nowrap;
  border:2px solid #ffd166;box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.order-bubble::after{
  content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:6px solid #ffd166;
}
.order-bubble .ing{width:18px;height:18px;display:inline-flex}
.order-bubble .ing svg{width:100%;height:100%}
.order-mod{
  position:absolute;top:-78px;left:50%;transform:translateX(-50%);
  background:#e63946;color:#fff;font-size:10px;font-weight:900;
  padding:2px 8px;border-radius:8px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(230,57,70,.6);animation:modPulse 1.5s infinite;
}
@keyframes modPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
.patience-bar{
  position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
  width:60px;height:6px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden;
  border:1px solid rgba(255,255,255,.2);
}
.patience-fill{height:100%;width:100%;background:#4ecdc4;border-radius:3px;transition:background .3s}
.patience-fill.warn{background:#ffa500}
.patience-fill.danger{background:#e63946;animation:dangerPulse .5s infinite}
@keyframes dangerPulse{50%{opacity:.6}}

/* ==== GAME PANEL ==== */
.game-panel{
  position:absolute;top:calc(56px + 38vh);left:0;right:0;bottom:0;
  display:flex;flex-direction:column;padding:8px;gap:6px;overflow-y:auto;
  background:linear-gradient(180deg,rgba(15,8,30,.5),rgba(10,5,25,.98));
}
.order-panel{
  background:linear-gradient(135deg,rgba(255,107,53,.22),rgba(255,140,66,.06));
  border:1px solid rgba(255,140,66,.5);border-radius:12px;padding:8px 10px;
  min-height:52px;display:flex;flex-direction:column;gap:6px;
}
.order-title{font-size:12px;color:#ffd166;font-weight:800;display:flex;justify-content:space-between}
.order-items{display:flex;flex-wrap:wrap;gap:4px}
.order-items .ing{width:28px;height:28px;background:rgba(255,255,255,.1);border-radius:6px;padding:3px;display:flex}
.order-items .ing svg{width:100%;height:100%}
.burger-stack{
  min-height:60px;max-height:110px;overflow-y:auto;padding:4px;
  display:flex;flex-direction:column-reverse;align-items:center;gap:1px;
  background:rgba(0,0,0,.4);border:2px dashed rgba(255,209,102,.3);border-radius:10px;
}
.burger-layer{
  width:88%;height:18px;border-radius:5px;display:flex;align-items:center;gap:4px;
  padding:0 6px;font-size:10px;font-weight:900;color:#1a0f2e;
  box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);
  animation:layerPop .2s ease-out;
}
.burger-layer .ing{width:14px;height:14px;display:flex}
.burger-layer .ing svg{width:100%;height:100%}
@keyframes layerPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.ingredients{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:4px;
}
.ing-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;
  border:1px solid rgba(255,255,255,.2);border-radius:10px;
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
  color:#fff;font-size:9px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:transform .1s,background .15s;
}
.ing-btn:active{transform:scale(.9);background:rgba(255,180,60,.3)}
.ing-btn .ing{width:24px;height:24px}
.ing-btn .ing svg{width:100%;height:100%}
.actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.actions button{flex:1}

/* ==== RESULT ==== */
#result{gap:16px;text-align:center}
.result-stars{font-size:64px;letter-spacing:8px;line-height:1}
.result-stars .star{opacity:.2;transition:all .4s;display:inline-block}
.result-stars .star.on{opacity:1;animation:starPop .5s backwards}
.result-stars .star.on:nth-child(2){animation-delay:.15s}
.result-stars .star.on:nth-child(3){animation-delay:.3s}
@keyframes starPop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
#result h2{font-size:26px;font-weight:900}
#result-coins{font-size:22px;color:#ffd166;font-weight:900}
.result-buttons{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px;margin-top:20px}

/* ==== LEVELS GRID ==== */
#levels-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;
  width:100%;max-width:480px;max-height:60vh;overflow-y:auto;padding:4px;
}
.lvl-btn{
  aspect-ratio:1;border-radius:10px;font-family:inherit;font-size:12px;font-weight:900;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;
  cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.lvl-btn.locked{opacity:.3;cursor:not-allowed}
.lvl-btn.done{border-color:#4ecdc4;background:rgba(78,205,196,.2)}
.lvl-btn.current{border-color:#ffd166;box-shadow:0 0 12px rgba(255,209,102,.7)}
.lvl-btn .stars{font-size:7px;color:#ffd166;letter-spacing:-1px}

/* ==== LEADERBOARD ==== */
#leaderboard-list{width:100%;max-width:400px;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto}
.lb-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
}
.lb-row.top{background:linear-gradient(135deg,rgba(255,209,102,.2),rgba(255,140,66,.06));border-color:rgba(255,209,102,.5)}
.lb-rank{font-size:18px;font-weight:900;color:#ffd166;width:28px}
.lb-info{flex:1;font-size:12px}
.lb-stars{color:#ffd166;font-weight:800}

/* ==== TOAST ==== */
#toast-area{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{
  padding:10px 20px;border-radius:12px;font-weight:800;font-size:13px;
  background:linear-gradient(135deg,rgba(255,107,53,.98),rgba(255,140,66,.98));
  box-shadow:0 6px 20px rgba(0,0,0,.5);animation:toastIn 2s forwards;
  max-width:80vw;text-align:center;
}
.toast.good{background:linear-gradient(135deg,#4ecdc4,#2a9d8f)}
.toast.bad{background:linear-gradient(135deg,#e63946,#8a1020)}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}15%,85%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}

/* ==== FX ==== */
body.shake #level{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fly-coin{
  position:fixed;pointer-events:none;z-index:1000;font-weight:900;font-size:22px;
  color:#ffd166;text-shadow:0 0 12px rgba(255,209,102,.9);animation:flyUp 1s ease-out forwards;
}
@keyframes flyUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(1.5)}}
.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:999;animation:burst .7s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.combo-flash{
  position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1000;
  font-size:42px;font-weight:900;color:#ffd166;
  text-shadow:0 0 24px rgba(255,209,102,.9),0 4px 12px rgba(0,0,0,.6);
  animation:comboAnim .8s ease-out forwards;
}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

/* ==== SPLASH ==== */
#splash{position:fixed;inset:0;background:#100823;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#splash.hidden{opacity:0;pointer-events:none;transition:opacity .4s}
.spinner{width:50px;height:50px;border:4px solid rgba(255,209,102,.2);border-top-color:#ff6b35;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.screen h2{font-size:22px;font-weight:900;margin-bottom:16px;color:#ffd166;text-align:center}
.screen label{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px;cursor:pointer}
.screen input[type=checkbox]{width:20px;height:20px;accent-color:#ff6b35}
</style>
</head>
<body>

</svg>

<div id="app">

<!-- SPLASH -->
<div id="splash"><div class="spinner"></div><div style="color:#ffd166;font-weight:800">Загрузка…</div></div>

<!-- LOBBY -->
<div id="lobby" class="screen active">
  <div class="lobby-hero">🍔</div>
  <h1>БУРГЕРНАЯ</h1>
  <p class="subtitle">TURBO EDITION</p>
  <div class="menu">
    <button class="btn-primary" id="play-btn">▶ ИГРАТЬ</button>
    <button class="btn-secondary" id="daily-btn">🎁 Ежедневный вызов</button>
    <div class="menu-row">
      <button class="btn-tertiary" id="levels-btn">📋 Уровни</button>
      <button class="btn-tertiary" id="leaderboard-btn">🏆 Рейтинг</button>
      <button class="btn-tertiary" id="settings-btn">⚙ Ещё</button>
    </div>
  </div>
  <div class="stats">⭐ <span id="total-stars">0</span> · 🏆 макс. ур. <span id="best-level">1</span></div>
</div>

<!-- LEVEL -->
<div id="level" class="screen">
  <div class="hud">
    <div class="hud-left">
      <div class="coins-hud"><svg class="svg"><use href="#i-coin"/></svg><span id="hud-coins">0</span></div>
      <div class="hearts-hud" id="hud-hearts"></div>
    </div>
    <div class="level-badge">Ур. <span id="hud-level">1</span> · <span id="hud-progress">0/0</span></div>
    <button class="hud-quit" id="quit-btn">×</button>
  </div>
  <div class="scene" id="scene"></div>
  <div class="game-panel">
    <div class="order-panel" id="order-panel">
      <div class="order-title"><span id="order-name">Выберите клиента</span><span id="order-mod-label"></span></div>
      <div class="order-items" id="order-items"></div>
    </div>
    <div class="burger-stack" id="burger-stack"></div>
    <div class="ingredients" id="ingredients"></div>
    <div class="actions">
      <button class="btn-secondary" id="clear-btn">Очистить</button>
      <button class="btn-primary" id="serve-btn">Подать</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-stars" id="result-stars"></div>
  <h2 id="result-title">Уровень пройден!</h2>
  <div id="result-coins"></div>
  <div class="result-buttons">
    <button class="btn-primary" id="next-btn">Следующий уровень</button>
    <button class="btn-secondary" id="retry-btn">Ещё раз</button>
    <button class="btn-tertiary" id="to-lobby-btn">В лобби</button>
  </div>
</div>

<!-- LEVELS -->
<div id="levels-screen" class="screen">
  <h2>Уровни</h2>
  <div id="levels-grid"></div>
  <button class="btn-secondary" id="levels-back" style="margin-top:16px">Назад</button>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard-screen" class="screen">
  <h2>Рейтинг</h2>
  <div id="leaderboard-list"></div>

  <p style="color:#888;font-size:12px;text-align:center;max-width:300px">Всего обслужено: <span id="total-served-stat" style="color:#ffd166;font-weight:800">0</span></p>

</div>

<script>
/* ====================== INGREDIENTS ====================== */
const ING = {
  bun_bottom: { name:'Нижняя булка', color:'#d4a574' },
  bun_top:    { name:'Верхняя булка', color:'#c89566' },
  patty:      { name:'Котлета',       color:'#8b4513' },
  cheese:     { name:'Сыр',           color:'#ffd93d' },
  lettuce:    { name:'Салат',         color:'#7bc043' },
  tomato:     { name:'Помидор',       color:'#e63946' },
  onion:      { name:'Лук',           color:'#c9a5e0' },
  pickle:     { name:'Огурец',        color:'#6b8e23' },
  bacon:      { name:'Бекон',         color:'#b22222' },
};
const UNLOCKS = [
  { level:1,  ids:['bun_bottom','bun_top','patty','cheese'] },
  { level:3,  ids:['lettuce','tomato'] },
  { level:6,  ids:['onion','pickle'] },
  { level:10, ids:['bacon'] },
];
function unlockedIngredients(n){
  return UNLOCKS.filter(u => u.level <= n).flatMap(u => u.ids);
}
function ingSvg(id){
  return `<svg class="svg" viewBox="0 0 32 32"><use href="#ing-${id}"/></svg>`;
}

/* ====================== SAVE ====================== */
const Save = {
  data: {
    coins:0, maxLevel:1, stars:{}, highScores:[],
    musicOn:true, totalServed:0, bestCombo:0,
    lastDaily:null, dailyBest:0
  },
  async load(){
    let raw = null;
    try{
      if(typeof vkBridge !== 'undefined'){
        const r = await vkBridge.send('VKWebAppStorageGet', { keys:['burger_v2'] });
        raw = r?.keys?.[0]?.value || null;
      }
    }catch(e){}
    if(!raw){ try{ raw = localStorage.getItem('burger_v2'); }catch(e){} }
    if(raw){ try{ Object.assign(this.data, JSON.parse(raw)); }catch(e){} }
  },
  async save(){
    const s = JSON.stringify(this.data);
    try{ localStorage.setItem('burger_v2', s); }catch(e){}
    try{
      if(typeof vkBridge !== 'undefined'){
        await vkBridge.send('VKWebAppStorageSet', { key:'burger_v2', value:s });
      }
    }catch(e){}
  }
};

/* ====================== AUDIO ====================== */
const Audio = {
  ctx:null, on:true, musicTimer:null,
  init(){
    const un = () => {
      if(!this.ctx){
        try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
      }
      if(this.ctx?.state === 'suspended') this.ctx.resume();
      document.removeEventListener('touchstart', un);
      document.removeEventListener('click', un);
    };
    document.addEventListener('touchstart', un, { once:true });
    document.addEventListener('click', un, { once:true });
  },
  beep(freq, dur=0.1, type='sine', vol=0.08){
    if(!this.on || !this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    const now = this.ctx.currentTime;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(now); o.stop(now + dur);
  },
  click(){ this.beep(600, 0.06, 'square', 0.05); },
  add(){ this.beep(500, 0.05, 'sine', 0.06); },
  success(){
    if(!this.on || !this.ctx) return;
    const now = this.ctx.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i*0.06);
      g.gain.linearRampToValueAtTime(0.09, now + i*0.06 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.06 + 0.25);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(now + i*0.06); o.stop(now + i*0.06 + 0.25);
    });
  },
  error(){
    if(!this.on || !this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(240, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.09, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.35);
  },
  coin(){
    if(!this.on || !this.ctx) return;
    const now = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(1200, now);
    o.frequency.linearRampToValueAtTime(1800, now + 0.08);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(now); o.stop(now + 0.15);
  },
  levelUp(){
    if(!this.on || !this.ctx) return;
    const now = this.ctx.currentTime;
    [262, 330, 392, 523, 659, 784].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i*0.08);
      g.gain.linearRampToValueAtTime(0.1, now + i*0.08 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.08 + 0.35);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(now + i*0.08); o.stop(now + i*0.08 + 0.35);
    });
  }
};

/* ====================== FX ====================== */
function shake(){ document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'), 320); }
function flyCoin(x, y, amount){
  const el = document.createElement('div');
  el.className = 'fly-coin';
  el.textContent = '+' + amount;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function burst(x, y, color, count=15){
  for(let i=0; i<count; i++){
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.background = color;
    const a = Math.random()*Math.PI*2;
    const d = 30 + Math.random()*70;
    el.style.setProperty('--dx', Math.cos(a)*d + 'px');
    el.style.setProperty('--dy', Math.sin(a)*d + 'px');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 700);
  }
}
function comboFlash(text){
  const el = document.createElement('div');
  el.className = 'combo-flash';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}
function toast(text, kind=''){
  const area = document.getElementById('toast-area');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = text;
  area.appendChild(el);
  setTimeout(()=>el.remove(), 2100);
}

/* ====================== LEVEL CONFIG ====================== */
function getConfig(n){
  const unlocked = unlockedIngredients(n);
  const fillings = unlocked.filter(id => id !== 'bun_bottom' && id !== 'bun_top');
  const totalCustomers = 4 + Math.floor(n * 0.5);
  const concurrent = n >= 4 ? 3 : 2;
  const basePatience = Math.max(18, 48 - n * 1.5);
  const specialChance = n >= 5 ? 0.25 : 0;
  const rushChance = n >= 8 ? 0.2 : 0;
  const vipChance = n >= 12 ? 0.15 : 0;
  return { n, unlocked, fillings, totalCustomers, concurrent, basePatience, specialChance, rushChance, vipChance };
}

/* ====================== CUSTOMER GEN ====================== */
function rand(a, b){ return a + Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ return [...a].sort(()=>Math.random()-0.5); }

function makeCustomer(cfg){
  let type = 'regular';
  const r = Math.random();
  if(r < cfg.vipChance) type = 'vip';
  else if(r < cfg.vipChance + cfg.rushChance) type = 'rush';
  
  let itemCount, patienceMult, rewardMult;
  if(type === 'vip'){ itemCount = rand(4,5); patienceMult = 1.6; rewardMult = 2.2; }
  else if(type === 'rush'){ itemCount = rand(1,2); patienceMult = 0.55; rewardMult = 1.6; }
  else { itemCount = rand(1,3); patienceMult = 1; rewardMult = 1; }
  
  const fillings = shuffle(cfg.fillings).slice(0, itemCount);
  let order = ['bun_bottom', 'patty', ...fillings, 'bun_top'];
  
  let modifier = null;
  if(Math.random() < cfg.specialChance){
    const candidates = [];
    if(order.includes('onion')) candidates.push('no_onion');
    if(order.includes('pickle')) candidates.push('no_pickle');
    if(order.includes('tomato')) candidates.push('no_tomato');
    candidates.push('double_cheese');
    candidates.push('double_patty');
    modifier = candidates[rand(0, candidates.length-1)];
  }
  
  if(modifier === 'no_onion') order = order.filter(x => x !== 'onion');
  else if(modifier === 'no_pickle') order = order.filter(x => x !== 'pickle');
  else if(modifier === 'no_tomato') order = order.filter(x => x !== 'tomato');
  else if(modifier === 'double_cheese'){
    const i = order.indexOf('cheese');
    if(i >= 0) order.splice(i+1, 0, 'cheese');
    else order.splice(2, 0, 'cheese', 'cheese');
  } else if(modifier === 'double_patty'){
    const i = order.indexOf('patty');
    order.splice(i+1, 0, 'patty');
  }
  
  const names = ['Аня','Ваня','Маша','Петя','Оля','Серёжа','Катя','Дима','Лена','Миша','Даша','Коля','Света','Гоша'];
  const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e84393'];
  const skins = ['#f5c6a0','#e0ac69','#c68642','#8d5524','#ffdbac'];
  const hairs = ['#2c1810','#000000','#ffd700','#8b4513','#a0522d','#c45a2d'];
  
  const patience = Math.round(cfg.basePatience * patienceMult * 1000);
  const reward = Math.round(15 * rewardMult * (1 + cfg.n * 0.12));
  
  return {
    type, order, modifier, reward,
    patience, maxPatience: patience,
    name: names[rand(0, names.length-1)],
    color: colors[rand(0, colors.length-1)],
    skin: skins[rand(0, skins.length-1)],
    hair: hairs[rand(0, hairs.length-1)],
    served: false
  };
}

const MOD_LABEL = {
  no_onion: '🚫 Без лука',
  no_pickle: '🚫 Без огурца',
  no_tomato: '🚫 Без помидора',
  double_cheese: '×2 Сыр',
  double_patty: '×2 Котлета'
};

/* ====================== GAME STATE ====================== */
const G = {
  mode: null,        // 'level' | 'daily'
  cfg: null,
  levelNum: 1,
  coins: 0,          // earned this session
  hearts: 3,
  totalNeeded: 0,
  totalServed: 0,
  customers: [],     // active customers
  selected: -1,
  burger: [],        // current stack for selected
  combo: 0,
  maxCombo: 0,
  lastFrame: 0,
  raf: null,
  active: false,
  paused: false,
  dailyModifier: null
};

/* ====================== UI REFS ====================== */
const $ = id => document.getElementById(id);
const sceneEl = $('scene');
const ingredientsEl = $('ingredients');
const burgerStackEl = $('burger-stack');
const orderItemsEl = $('order-items');
const orderNameEl = $('order-name');
const orderModEl = $('order-mod-label');
const heartsEl = $('hud-hearts');
const hudCoinsEl = $('hud-coins');
const hudProgressEl = $('hud-progress');

/* ====================== SCREENS ====================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = $(id);
  if(el) el.classList.add('active');
}

/* ====================== CUSTOMER RENDER ====================== */
function customerSvg(c, mood){
  const eyes = mood === 'angry' ? `
    <path d="M-8 -77 l4 -2 M8 -77 l-4 -2" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-5" cy="-76" r="1.5" fill="#222"/>
    <circle cx="5" cy="-76" r="1.5" fill="#222"/>
    <path d="M-5 -68 q5 4 10 0" stroke="#222" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  ` : mood === 'worried' ? `
    <circle cx="-5" cy="-77" r="2" fill="#222"/>
    <circle cx="5" cy="-77" r="2" fill="#222"/>
    <path d="M-4 -69 q4 2 8 0" stroke="#222" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  ` : `
    <circle cx="-5" cy="-77" r="1.8" fill="#222"/>
    <circle cx="5" cy="-77" r="1.8" fill="#222"/>
    <path d="M-5 -70 q5 4 10 0" stroke="#222" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  `;
  return `
    <svg class="body-svg" viewBox="-40 -110 80 120">
      <ellipse cx="0" cy="6" rx="24" ry="5" fill="rgba(0,0,0,.4)"/>
      <path d="M-20 0 Q-20 -52 0 -56 Q20 -52 20 0 Z" fill="${c.color}" stroke="rgba(0,0,0,.3)" stroke-width="1.2"/>
      <path d="M-17 -34 Q-28 -22 -25 -8" stroke="${c.color}" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M17 -34 Q28 -22 25 -8" stroke="${c.color}" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="-5" y="-60" width="10" height="6" fill="${c.skin}"/>
      <circle cx="0" cy="-76" r="15" fill="${c.skin}" stroke="rgba(0,0,0,.2)" stroke-width="1"/>
      <path d="M-15 -78 Q-15 -94 0 -94 Q15 -94 15 -78 Q10 -85 0 -85 Q-10 -85 -15 -78 Z" fill="${c.hair}"/>
      ${eyes}
      <circle cx="-9" cy="-71" r="2.5" fill="rgba(255,120,120,${mood === 'angry' ? 0.7 : 0.35})"/>
      <circle cx="9" cy="-71" r="2.5" fill="rgba(255,120,120,${mood === 'angry' ? 0.7 : 0.35})"/>
    </svg>
  `;
}

function customerMood(c){
  const pct = c.patience / c.maxPatience;
  if(pct < 0.15) return 'angry';
  if(pct < 0.4) return 'worried';
  return 'happy';
}

function renderScene(){
  sceneEl.innerHTML = '';
  const total = G.customers.length;
  const spacing = 100 / (total + 1);
  G.customers.forEach((c, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'customer' + (i === G.selected ? ' selected' : '');
    wrap.style.left = `calc(${spacing * (i+1)}% - 35px)`;
    wrap.dataset.idx = i;
    
    const mood = customerMood(c);
    let html = customerSvg(c, mood);
    
    // Order bubble
    html += `<div class="order-bubble">${c.order.map(id => `<span class="ing">${ingSvg(id)}</span>`).join('')}</div>`;
    // Modifier badge
    if(c.modifier) html += `<div class="order-mod">${MOD_LABEL[c.modifier]}</div>`;
    // Patience bar
    const pct = Math.max(0, c.patience / c.maxPatience);
    let barClass = '';
    if(pct < 0.25) barClass = 'danger';
    else if(pct < 0.5) barClass = 'warn';
    html += `<div class="patience-bar"><div class="patience-fill ${barClass}" style="width:${pct*100}%"></div></div>`;
    
    wrap.innerHTML = html;
    wrap.addEventListener('click', () => selectCustomer(i));
    sceneEl.appendChild(wrap);
  });
}

/* ====================== INGREDIENTS UI ====================== */
function renderIngredients(){
  ingredientsEl.innerHTML = '';
  const cfg = G.cfg;
  cfg.unlocked.forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'ing-btn';
    btn.innerHTML = `<span class="ing">${ingSvg(id)}</span><span>${ING[id].name.split(' ')[0]}</span>`;
    btn.addEventListener('click', () => addIngredient(id));
    ingredientsEl.appendChild(btn);
  });
}

/* ====================== ORDER PANEL ====================== */
function renderOrderPanel(){
  if(G.selected < 0 || !G.customers[G.selected]){
    orderNameEl.textContent = 'Выберите клиента';
    orderModEl.textContent = '';
    orderItemsEl.innerHTML = '';
    return;
  }
  const c = G.customers[G.selected];
  orderNameEl.textContent = `👤 ${c.name}`;
  orderModEl.innerHTML = c.modifier ? `<span style="color:#e63946">${MOD_LABEL[c.modifier]}</span>` : '';
  orderItemsEl.innerHTML = c.order.map(id => `<span class="ing">${ingSvg(id)}</span>`).join('');
}

function renderBurgerStack(){
  burgerStackEl.innerHTML = '';
  G.burger.forEach(id => {
    const layer = document.createElement('div');
    layer.className = 'burger-layer';
    layer.style.background = ING[id].color;
    layer.innerHTML = `<span class="ing">${ingSvg(id)}</span><span>${ING[id].name}</span>`;
    burgerStackEl.appendChild(layer);
  });
}

/* ====================== GAME LOGIC ====================== */
function selectCustomer(i){
  if(!G.active) return;
  if(i === G.selected) return;
  Audio.click();
  G.selected = i;
  G.burger = [];
  renderScene();
  renderOrderPanel();
  renderBurgerStack();
}

function addIngredient(id){
  if(!G.active) return;
  if(G.selected < 0){ toast('Сначала выберите клиента', 'bad'); return; }
  G.burger.push(id);
  Audio.add();
  renderBurgerStack();
}

function clearBurger(){
  G.burger = [];
  renderBurgerStack();
}

function serve(){
  if(!G.active) return;
  if(G.selected < 0 || !G.customers[G.selected]){ toast('Выберите клиента', 'bad'); return; }
  const c = G.customers[G.selected];
  
  const a = [...G.burger].sort().join('|');
  const b = [...c.order].sort().join('|');
  
  if(a === b){
    // SUCCESS
    Audio.success();
    c.served = true;
    
    G.combo++;
    if(G.combo > G.maxCombo) G.maxCombo = G.combo;
    const comboMult = 1 + Math.min(1, (G.combo - 1) * 0.15);
    const reward = Math.round(c.reward * comboMult);
    G.coins += reward;
    Save.data.coins += reward;
    Save.data.totalServed++;
    
    // FX
    const wrap = sceneEl.querySelector(`.customer[data-idx="${G.selected}"]`);
    if(wrap){
      const r = wrap.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      flyCoin(cx, cy, reward);
      burst(cx, cy, '#ffd166', 18);
    }
    if(G.combo >= 3) comboFlash('COMBO ×' + G.combo);
    Audio.coin();
    
    toast('✓ +' + reward, 'good');
    
    G.totalServed++;
    hudCoinsEl.textContent = Save.data.coins;
    hudProgressEl.textContent = G.totalServed + '/' + G.totalNeeded;
    
    // Remove customer
    G.customers.splice(G.selected, 1);
    G.selected = -1;
    G.burger = [];
    renderScene();
    renderOrderPanel();
    renderBurgerStack();
    
    // Win check
    if(G.totalServed >= G.totalNeeded){
      endLevel(true);
      return;
    }
    
    // Spawn
    setTimeout(() => {
      if(G.active && G.customers.length < G.cfg.concurrent){
        G.customers.push(makeCustomer(G.cfg));
        renderScene();
      }
    }, 400);
  } else {
    // FAIL
    Audio.error();
    shake();
    toast('✗ Не тот заказ', 'bad');
    G.combo = 0;
    loseHeart();
    // Remove customer
    const wrap = sceneEl.querySelector(`.customer[data-idx="${G.selected}"]`);
    if(wrap) wrap.classList.add('leaving');
    G.customers.splice(G.selected, 1);
    G.selected = -1;
    G.burger = [];
    setTimeout(() => {
      renderScene();
      renderOrderPanel();
      renderBurgerStack();
      if(G.active && G.hearts > 0 && G.totalServed < G.totalNeeded && G.customers.length < G.cfg.concurrent){
        G.customers.push(makeCustomer(G.cfg));
        renderScene();
      }
    }, 500);
  }
}

function loseHeart(){
  G.hearts--;
  updateHearts();
  if(G.hearts <= 0){
    endLevel(false);
  }
}

function updateHearts(){
  heartsEl.innerHTML = '';
  for(let i = 0; i < 3; i++){
    const s = document.createElement('span');
    s.className = 'heart' + (i >= G.hearts ? ' lost' : '');
    s.textContent = '❤';
    heartsEl.appendChild(s);
  }
}

function tick(dt){
  if(!G.active || G.paused) return;
  let expired = [];
  G.customers.forEach((c, i) => {
    c.patience -= dt * 1000;
    if(c.patience <= 0){
      c.patience = 0;
      expired.push(i);
    }
  });
  // Render scene if any patience changed significantly — do it every frame is fine
  renderScene();
  
  // Handle expired (in reverse to splice safely)
  expired.sort((a,b) => b-a).forEach(i => {
    const wasSelected = (i === G.selected);
    G.customers.splice(i, 1);
    if(wasSelected){ G.selected = -1; G.burger = []; }
    loseHeart();
    Audio.error();
    toast('😡 Клиент ушёл', 'bad');
    G.combo = 0;
  });
  if(expired.length){
    renderOrderPanel();
    renderBurgerStack();
    if(G.active && G.hearts > 0 && G.totalServed < G.totalNeeded && G.customers.length < G.cfg.concurrent){
      setTimeout(() => {
        if(G.active){
          G.customers.push(makeCustomer(G.cfg));
          renderScene();
        }
      }, 500);
    }
  }
}

/* ====================== LEVEL FLOW ====================== */
function startLevel(n, mode='level', dailyMod=null){
  Audio.init();
  Save.data.maxLevel = Math.max(Save.data.maxLevel, n);
  G.mode = mode;
  G.levelNum = n;
  G.dailyModifier = dailyMod;
  
  if(mode === 'daily'){
    // Harder config with modifiers
    G.cfg = getConfig(Math.max(5, Save.data.maxLevel));
    G.cfg.concurrent = 3;
    G.cfg.basePatience = 20;
    G.cfg.specialChance = 0.5;
    G.cfg.totalCustomers = 8;
  } else {
    G.cfg = getConfig(n);
  }
  
  G.coins = 0;
  G.hearts = 3;
  G.totalNeeded = G.cfg.totalCustomers;
  G.totalServed = 0;
  G.customers = [];
  G.selected = -1;
  G.burger = [];
  G.combo = 0;
  G.maxCombo = 0;
  G.paused = false;
  G.active = true;
  
  // Initial customers
  const initial = Math.min(G.cfg.concurrent, G.totalNeeded);
  for(let i=0; i<initial; i++){
    G.customers.push(makeCustomer(G.cfg));
  }
  
  $('hud-level').textContent = G.levelNum;
  hudCoinsEl.textContent = Save.data.coins;
  hudProgressEl.textContent = '0/' + G.totalNeeded;
  updateHearts();
  renderIngredients();
  renderScene();
  renderOrderPanel();
  renderBurgerStack();
  showScreen('level');
  
  G.lastFrame = performance.now();
  if(!G.raf) G.raf = requestAnimationFrame(loop);
}

function endLevel(win){
  G.active = false;
  if(G.raf){ cancelAnimationFrame(G.raf); G.raf = null; }
  
  const stars = win ? G.hearts : 0;
  const starsStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  
  if(win){
    Audio.levelUp();
    // Save stars
    const prev = Save.data.stars[G.levelNum] || 0;
    if(stars > prev) Save.data.stars[G.levelNum] = stars;
    
    if(G.mode === 'level'){
      Save.data.maxLevel = Math.max(Save.data.maxLevel, G.levelNum + 1);
    } else if(G.mode === 'daily'){
      Save.data.lastDaily = new Date().toDateString();
      Save.data.dailyBest = Math.max(Save.data.dailyBest, G.totalServed);
      // Bonus
      Save.data.coins += 500;
    }
    Save.data.bestCombo = Math.max(Save.data.bestCombo, G.maxCombo);
    
    // Highscore entry
    const totalStars = Object.values(Save.data.stars).reduce((a,b) => a+b, 0);
    Save.data.highScores.push({
      name: 'Игрок',
      stars: totalStars,
      level: Save.data.maxLevel,
      date: Date.now()
    });
    Save.data.highScores.sort((a,b) => b.stars - a.stars || b.level - a.level);
    Save.data.highScores = Save.data.highScores.slice(0, 20);
  }
  
  Save.save();
  
  // Show result
  $('result-stars').innerHTML = [1,2,3].map(i =>
    `<span class="star ${i <= stars ? 'on' : ''}">★</span>`
  ).join('');
  $('result-title').textContent = win
    ? (G.mode === 'daily' ? 'Ежедневный вызов пройден!' : 'Уровень пройден!')
    : 'Провал...';
  $('result-coins').innerHTML = win
    ? `+${G.coins} ${ingSvg('bun_top').replace('bun_top','')}💰` // simple text
    : 'Попробуйте снова';
  $('result-coins').textContent = win ? `Заработано: ${G.coins} монет` : 'Все сердца потеряны';
  
  $('next-btn').style.display = (win && G.mode === 'level') ? 'flex' : 'none';
  $('retry-btn').style.display = 'flex';
  
  showScreen('result');
}

function loop(ts){
  const dt = Math.min((ts - G.lastFrame) / 1000, 0.1);
  G.lastFrame = ts;
  tick(dt);
  if(G.active) G.raf = requestAnimationFrame(loop);
}

/* ====================== LEVELS GRID ====================== */
function renderLevelsGrid(){
  const grid = $('levels-grid');
  grid.innerHTML = '';
  const maxShow = Math.max(20, Save.data.maxLevel + 10);
  const limit = Math.min(maxShow, 100);
  for(let i = 1; i <= limit; i++){
    const btn = document.createElement('button');
    btn.className = 'lvl-btn';
    const unlocked = i <= Save.data.maxLevel;
    const stars = Save.data.stars[i] || 0;
    if(i === Save.data.maxLevel) btn.classList.add('current');
    if(!unlocked) btn.classList.add('locked');
    if(stars > 0) btn.classList.add('done');
    btn.innerHTML = `<span>${i}</span><span class="stars">${'★'.repeat(stars)}</span>`;
    if(unlocked) btn.addEventListener('click', () => startLevel(i, 'level'));
    grid.appendChild(btn);
  }
}

/* ====================== LEADERBOARD ====================== */
function renderLeaderboard(){
  const list = $('leaderboard-list');
  list.innerHTML = '';
  const scores = Save.data.highScores || [];
  if(scores.length === 0){
    list.innerHTML = '<div style="text-align:center;color:#888;padding:20px">Пока нет результатов.<br>Пройдите уровень, чтобы попасть в рейтинг.</div>';
    return;
  }
  scores.slice(0, 20).forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row' + (i < 3 ? ' top' : '');
    row.innerHTML = `
      <div class="lb-rank">${i+1}</div>
      <div class="lb-info">
        <div style="font-weight:800">Уровень ${s.level}</div>
        <div style="color:#888;font-size:10px">${new Date(s.date).toLocaleDateString()}</div>
      </div>
      <div class="lb-stars">⭐ ${s.stars}</div>
    `;
    list.appendChild(row);
  });
}

/* ====================== DAILY ====================== */
function renderDaily(){
  const content = $('daily-content');
  const today = new Date().toDateString();
  const done = Save.data.lastDaily === today;
  content.innerHTML = `
    <p style="margin-bottom:12px">Особый режим: <b>8 клиентов</b>, короткое терпение, много спецзаказов.</p>
    <p style="color:#4ecdc4;font-weight:800">Награда: +500 монет</p>
    <p style="color:#888;margin-top:12px;font-size:12px">Лучший результат: ${Save.data.dailyBest} обслужено</p>
    ${done ? '<p style="color:#ffd166;margin-top:16px;font-weight:800">✓ Уже пройдено сегодня</p>' : ''}
  `;
  $('daily-start').disabled = done;
  $('daily-start').textContent = done ? 'Пройдено' : 'Начать';
}

/* ====================== LOBBY REFRESH ====================== */
function refreshLobby(){
  const totalStars = Object.values(Save.data.stars).reduce((a,b) => a+b, 0);
  $('total-stars').textContent = totalStars;
  $('best-level').textContent = Save.data.maxLevel;
}

/* ====================== SETTINGS ====================== */
function refreshSettings(){
  $('music-toggle').checked = Save.data.musicOn;
  $('best-combo-stat').textContent = Save.data.bestCombo;
  $('total-served-stat').textContent = Save.data.totalServed;
}

/* ====================== EVENT BINDING ====================== */
function bind(){
  $('play-btn').addEventListener('click', () => { Audio.click(); startLevel(Save.data.maxLevel, 'level'); });
  $('levels-btn').addEventListener('click', () => { Audio.click(); renderLevelsGrid(); showScreen('levels-screen'); });
  $('leaderboard-btn').addEventListener('click', () => { Audio.click(); renderLeaderboard(); showScreen('leaderboard-screen'); });
  $('settings-btn').addEventListener('click', () => { Audio.click(); refreshSettings(); showScreen('settings-screen'); });
  $('daily-btn').addEventListener('click', () => { Audio.click(); renderDaily(); showScreen('daily-screen'); });
  
  $('levels-back').addEventListener('click', () => showScreen('lobby'));
  $('leaderboard-back').addEventListener('click', () => showScreen('lobby'));
  $('daily-back').addEventListener('click', () => showScreen('lobby'));
  $('settings-back').addEventListener('click', () => { refreshLobby(); showScreen('lobby'); });
  $('to-lobby-btn').addEventListener('click', () => { refreshLobby(); showScreen('lobby'); });
  
  $('next-btn').addEventListener('click', () => {
    Audio.click();
    startLevel(Math.min(G.levelNum + 1, 100), 'level');
  });
  $('retry-btn').addEventListener('click', () => {
    Audio.click();
    if(G.mode === 'daily') startLevel(Save.data.maxLevel, 'daily');
    else startLevel(G.levelNum, 'level');
  });
  
  $('daily-start').addEventListener('click', () => {
    if(Save.data.lastDaily === new Date().toDateString()) return;
    Audio.click();
    startLevel(Save.data.maxLevel, 'daily');
  });
  
  $('serve-btn').addEventListener('click', serve);
  $('clear-btn').addEventListener('click', () => { Audio.click(); clearBurger(); });
  $('quit-btn').addEventListener('click', () => {
    if(confirm('Выйти из уровня? Прогресс не сохранится.')){
      G.active = false;
      if(G.raf){ cancelAnimationFrame(G.raf); G.raf = null; }
      refreshLobby();
      showScreen('lobby');
    }
  });
  
  $('music-toggle').addEventListener('change', e => {
    Save.data.musicOn = e.target.checked;
    Audio.on = e.target.checked;
    Save.save();
  });
  
  $('reset-progress').addEventListener('click', () => {
    if(confirm('Точно сбросить весь прогресс?')){
      Save.data = { coins:0, maxLevel:1, stars:{}, highScores:[], musicOn:true, totalServed:0, bestCombo:0, lastDaily:null, dailyBest:0 };
      Save.save();
      refreshLobby();
      refreshSettings();
      showScreen('lobby');
      toast('Прогресс сброшен');
    }
  });
  
  // Keyboard shortcut (desktop)
  document.addEventListener('keydown', e => {
    if(!G.active) return;
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); serve(); }
    if(e.key === 'Escape'){ e.preventDefault(); clearBurger(); }
  });
}

/* ====================== INIT ====================== */
async function init(){
  Audio.init();
  Audio.on = true;
  
  try{
    if(typeof vkBridge !== 'undefined'){
      await vkBridge.send('VKWebAppInit');
    }
  }catch(e){}
  
  await Save.load();
  Audio.on = Save.data.musicOn;
  
  bind();
  refreshLobby();
  
  $('splash').classList.add('hidden');
  setTimeout(() => $('splash').remove(), 500);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
