<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<title>Магазин</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e1219;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#e8eef7}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#game.dragging{cursor:grabbing}

.modal-body::-webkit-scrollbar,
.tabs::-webkit-scrollbar,
.cat-sel::-webkit-scrollbar{width:8px;height:8px}
.modal-body::-webkit-scrollbar-track,
.tabs::-webkit-scrollbar-track,
.cat-sel::-webkit-scrollbar-track{background:#0f151d;border-radius:8px}
.modal-body::-webkit-scrollbar-thumb,
.tabs::-webkit-scrollbar-thumb,
.cat-sel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3b4d66,#2a3648);border-radius:8px;
  border:1px solid #1b2330}
.modal-body,.tabs,.cat-sel{scrollbar-width:thin;scrollbar-color:#3b4d66 #0f151d}

#topbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:6px;
  padding:0 8px;background:linear-gradient(180deg,rgba(14,18,25,.96),rgba(14,18,25,.72));
  backdrop-filter:blur(6px);z-index:20;pointer-events:auto}
.stat{display:flex;align-items:center;gap:5px;background:#1b2330;border:1px solid #2b3648;
  border-radius:12px;padding:5px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.stat svg{width:18px;height:18px;flex:none}
#moneyVal{color:#ffd257}
#lvlChip{background:linear-gradient(180deg,#6c4bd4,#4a2fa8);border-color:#8b6bff;color:#fff;
  padding:4px 8px;font-size:12px;gap:4px;flex-direction:column;align-items:stretch;min-width:70px}
#lvlChip .ln{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px}
#lvlChip .lvlXP{height:4px;border-radius:2px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:2px}
#lvlChip .lvlXP i{display:block;height:100%;background:linear-gradient(90deg,#ffd257,#ff9500);
  border-radius:2px;transition:width .3s}
#prestigeChip{background:linear-gradient(180deg,#c9a227,#8a6a10);border-color:#ffd257;color:#fff;
  font-size:11px;font-weight:800;display:none;gap:3px}
#bonusChip{background:linear-gradient(180deg,#e06b1c,#a8420c);border-color:#ffb070;color:#fff;
  font-size:12px;font-weight:800;display:none;gap:4px;animation:bonusPulse 1s ease-in-out infinite}
@keyframes bonusPulse{50%{box-shadow:0 0 14px rgba(255,150,60,.85)}}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid #2b3648;background:#1b2330;
  color:#cfe0f5;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  transition:.15s;padding:0;flex:none}
.iconbtn:active{transform:scale(.93);background:#243044}
.iconbtn svg{width:21px;height:21px}
.badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#ff4d5e;
  color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:700}

#bottombar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 8px 10px;
  background:linear-gradient(0deg,rgba(14,18,25,.98),rgba(14,18,25,.7));z-index:20}
.botbtn{flex:1;height:52px;border-radius:14px;border:1px solid #2b3648;background:#1b2330;color:#dce8f8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;
  font-weight:600;cursor:pointer;transition:.15s;padding:0;position:relative}
.botbtn svg{width:22px;height:22px}
.botbtn:active{transform:scale(.95);background:#243044}
.botbtn.primary{background:linear-gradient(180deg,#2e7d5b,#1f5f44);border-color:#3aa477;color:#eafff4}
.botbtn .dot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff4d5e;
  box-shadow:0 0 8px rgba(255,80,90,.9);display:none;animation:dotPulse 1.4s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(1.3)}}

/* --- Кнопки зума --- */
#zoomCtrl{position:absolute;right:10px;bottom:78px;z-index:25;display:flex;flex-direction:column;gap:6px}
.zoomb{width:38px;height:38px;border-radius:12px;border:1px solid #2b3648;background:rgba(27,35,48,.92);
  color:#cfe0f5;font-size:22px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:0;transition:.15s;line-height:1}
.zoomb:active{transform:scale(.93);background:#243044}

body.tutorial-on .botbtn,body.tutorial-on .iconbtn{pointer-events:none;opacity:.35;filter:grayscale(.4)}
body.tutorial-on .botbtn.tutorial-active,body.tutorial-on .iconbtn.tutorial-active{
  pointer-events:auto;opacity:1;filter:none;
  box-shadow:0 0 0 2px #4a89ff,0 0 16px rgba(74,137,255,.7);
  animation:pulseGlow 1.6s ease-in-out infinite}
@keyframes pulseGlow{50%{box-shadow:0 0 0 2px #4a89ff,0 0 24px rgba(74,137,255,1)}}

.levelup-overlay{position:fixed;inset:0;z-index:200;
  background:radial-gradient(circle at center,rgba(74,137,255,.35),rgba(0,0,0,.82));
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  animation:luFadeIn .4s ease-out}
@keyframes luFadeIn{from{opacity:0}}
.levelup-content{text-align:center;position:relative;padding:20px;
  animation:luPop .7s cubic-bezier(0.18,1.15,0.55,1)}
@keyframes luPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.levelup-burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,87,.75),transparent 65%);
  animation:luBurst 1.4s ease-out;pointer-events:none}
@keyframes luBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
.levelup-num{font-size:110px;font-weight:900;line-height:1;position:relative;
  background:linear-gradient(180deg,#fff5c8,#ffd257 45%,#ff9500);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,210,87,.9))}
.levelup-title{font-size:28px;font-weight:900;letter-spacing:3px;color:#fff;
  text-shadow:0 0 24px #4a89ff,0 0 8px #4a89ff;margin-top:4px;
  animation:luText 1.2s ease-in-out infinite alternate}
@keyframes luText{from{text-shadow:0 0 20px #4a89ff,0 0 6px #4a89ff}
  to{text-shadow:0 0 40px #4a89ff,0 0 14px #4a89ff,0 0 60px #8b6bff}}
.levelup-sub{margin-top:16px;font-size:14px;color:#dbe6f8;opacity:.9;font-weight:600}
.levelup-hint{margin-top:6px;font-size:12px;color:#8798ad}

#banner{position:absolute;left:0;right:0;bottom:0;height:0;z-index:19;pointer-events:none}

#modalRoot{position:absolute;inset:0;z-index:60;display:none}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,8,12,.72);backdrop-filter:blur(3px);padding:10px}
.modal-box{width:min(700px,96vw);max-height:86vh;background:#161d28;border:1px solid #2b3648;
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-bottom:1px solid #242e3d;background:#1b2330;flex:none}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.close-btn{width:34px;height:34px;border-radius:10px;border:none;background:#26313f;color:#cfe0f5;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.close-btn:active{background:#334052}
.modal-body{overflow-y:auto;padding:10px;flex:1;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;padding:8px 10px 0;flex:none;overflow-x:auto}
.tab{padding:8px 14px;border-radius:10px;background:#1b2330;border:1px solid #2b3648;color:#9fb0c5;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.active{background:#2d6cdf;border-color:#4a89ff;color:#fff}

.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#1a212c;
  border:1px solid #232d3b;margin-bottom:7px}
.row.locked{opacity:.55}
.row .ic{width:38px;height:38px;flex:none;border-radius:9px;background:#0f151d;display:flex;
  align-items:center;justify-content:center;overflow:hidden;position:relative}
.row .ic img{width:32px;height:32px;display:block}
.row .ic .lock{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;
  align-items:center;justify-content:center;color:#ffd257;font-size:11px;font-weight:800}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:11px;color:#8798ad}
.row .pr{font-size:13px;font-weight:700;color:#ffd257;white-space:nowrap}
.cat-header{font-size:11px;font-weight:800;color:#8bb4ff;text-transform:uppercase;letter-spacing:1px;
  padding:10px 4px 4px;border-top:1px solid #232d3b;margin-top:6px}
.cat-header:first-child{border-top:none;margin-top:0}
.btn{padding:8px 12px;border-radius:10px;border:none;background:#2d6cdf;color:#fff;font-weight:700;
  font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn.g{background:#2e8b57}
.btn.r{background:#c0392b}
.btn.y{background:#b8860b}
.btn.gold{background:linear-gradient(180deg,#c9a227,#8a6a10);color:#fff}
.btn.ghost{background:#26313f;color:#cfe0f5}
.btn.locked{background:#2b3648;color:#8798ad}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 9px;font-size:11.5px;border-radius:9px}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:60px;z-index:30;max-width:92vw;
  background:rgba(28,60,110,.96);border:1px solid #4a89ff;border-radius:14px;padding:10px 14px;
  font-size:13.5px;font-weight:600;text-align:center;display:none;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#hint .hintrow{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;z-index:80;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,26,36,.96);border:1px solid #3a4a61;border-radius:12px;padding:9px 16px;
  font-size:13px;font-weight:600;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.5)}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

#overlay{position:absolute;inset:0;z-index:100;background:rgba(6,9,14,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
.spinner{width:46px;height:46px;border:4px solid #2b3648;border-top-color:#4a89ff;border-radius:50%;
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sec-title{font-size:12px;color:#8798ad;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  margin:12px 4px 7px}
.empty{text-align:center;color:#6d7d92;font-size:13px;padding:26px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#1a212c;border:1px solid #232d3b;
  border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:600;color:#9fb0c5}
.progressbar{height:7px;border-radius:4px;background:#0f151d;overflow:hidden;margin-top:6px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,#2d6cdf,#4a89ff);border-radius:4px;
  transition:width .3s}
input[type=text]{width:100%;padding:11px 13px;border-radius:11px;border:1px solid #2b3648;background:#0f151d;
  color:#e8eef7;font-size:14px;outline:none;font-family:inherit}
input[type=text]:focus{border-color:#4a89ff}
.switch{width:46px;height:26px;border-radius:14px;background:#2b3648;position:relative;cursor:pointer;
  transition:.2s;flex:none}
.switch.on{background:#2e8b57}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:.2s;display:block}
.switch.on i{left:23px}
.place-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:78px;z-index:40;display:none;
  background:rgba(28,60,110,.96);border:1px solid #4a89ff;border-radius:14px;padding:8px 10px;
  gap:8px;align-items:center;font-size:12.5px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="topbar">
    <div class="stat">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffd257" stroke="#c9a227" stroke-width="1.6"/><path d="M12 7v10M9.5 9.2h4a1.9 1.9 0 010 3.8h-4" stroke="#8a6a10" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
      <span id="moneyVal">0</span>
    </div>
    <div class="stat" id="lvlChip">
      <div class="ln"><span data-i18n="lvlShort">Ур.</span><b id="lvlVal">1</b></div>
      <div class="lvlXP"><i id="lvlBar" style="width:0%"></i></div>
    </div>
    <div class="stat" id="prestigeChip"><span>★</span><b id="prestigeVal">0</b></div>
    <div class="stat" id="bonusChip">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z" fill="#ffd257" stroke="#8a6a10" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span id="bonusTime">x2</span>
    </div>
    <div class="stat" style="font-size:12px">
      <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11" fill="none" stroke="#7fd07f" stroke-width="1.8" stroke-linejoin="round"/><rect x="9" y="13" width="6" height="7" fill="#7fd07f" opacity=".55"/></svg>
      <span id="cellsVal">0</span>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnUpgrades" title="Улучшения">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 2l3 6 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z"/></svg>
    </button>
    <button class="iconbtn" id="btnTasks" title="Задания">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      <span class="badge" id="taskBadge" style="display:none">0</span>
    </button>
    <button class="iconbtn" id="btnDaily" title="Ежедневная награда">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18M12 8v12"/><path d="M12 8S9.5 3 7.5 4.5 9 8 12 8zM12 8s2.5-5 4.5-3.5S15 8 12 8z"/></svg>
      <span class="badge" id="dailyBadge" style="display:none">!</span>
    </button>
    <button class="iconbtn" id="btnSettings" title="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
    </button>
  </div>

  <div id="hint"></div>
  <div class="place-bar" id="placeBar"></div>

  <div id="zoomCtrl">
    <button class="zoomb" id="zoomIn" title="+">+</button>
    <button class="zoomb" id="zoomOut" title="−">−</button>
  </div>

  <div id="bottombar">
    <button class="botbtn primary" id="btnShop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 6h18l-1.5 12H4.5L3 6z"/><path d="M8 6V5a4 4 0 018 0v1"/></svg>
      <span data-i18n="shop">Магазин</span>
    </button>
    <button class="botbtn" id="btnStock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
      <span data-i18n="warehouse">Склад</span>
    </button>
    <button class="botbtn" id="btnTimeRewards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="rewards">Награды</span>
      <span class="dot" id="timeRewardDot"></span>
    </button>
    <button class="botbtn" id="btnInvite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M18 8v6M15 11h6"/></svg>
      <span data-i18n="friends">Друзья</span>
    </button>
  </div>

  <div id="banner"></div>
  <div id="modalRoot"></div>
  <div id="toast"></div>
  <div id="overlay">
    <div class="spinner"></div>
    <div style="font-size:15px;font-weight:700" id="overlayText">Загрузка рекламы...</div>
    <div style="font-size:12.5px;color:#8798ad;max-width:280px">Пожалуйста, подождите. Не нажимайте на экран.</div>
  </div>
</div>

<script src="https://vk.com/js/api/xd_connection.js?2"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
/* =========================================================================

'use strict';

/* ------------------------- 1. КОНСТАНТЫ ------------------------- */
const GW = 11, GH = 10;
const DOOR = {x: 0, y: 5};
const OUT_MARGIN = 100;
const TRUCK_CYCLE = 180;
const TRUCK_OFFER = 120;
const TRUCK_BONUS = 120;
const MARKUP = 1.04;

const CATS = {
  dairy:{ru:'Молочное',en:'Dairy',c:'#8fd3ff'},
  bakery:{ru:'Выпечка',en:'Bakery',c:'#e8c07d'},
  meat:{ru:'Мясо',en:'Meat',c:'#e07a7a'},
  fish:{ru:'Рыба',en:'Fish',c:'#7ac7e0'},
  fruits:{ru:'Фрукты',en:'Fruits',c:'#f6a23c'},
  veg:{ru:'Овощи',en:'Vegetables',c:'#7fd07f'},
  drinks:{ru:'Напитки',en:'Drinks',c:'#7a9ee0'},
  sweets:{ru:'Сладкое',en:'Sweets',c:'#e08fc0'},
  snacks:{ru:'Снеки',en:'Snacks',c:'#d9b25c'},
  grocery:{ru:'Бакалея',en:'Grocery',c:'#c2a37a'},
  canned:{ru:'Консервы',en:'Canned',c:'#a0a0b0'},
  frozen:{ru:'Заморозка',en:'Frozen',c:'#9fd8e8'},

};

const P_RAW = [
['Молоко','Milk','dairy','carton',20],['Кефир','Kefir','dairy','bottle',25],

const $ = s => document.querySelector(s);

const ctx = canvas.getContext('2d');
function rnd(a,b){ return a + Math.random() * (b - a); }
function randInt(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function hexToRgb(h){
  h = h.replace('#','');
  if(h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
}
function shade(hex,amt){ const [r,g,b] = hexToRgb(hex); return rgbToHex(r+amt,g+amt,b+amt); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function fmt(n){
  if(n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if(n >= 1e4) return (n/1e3).toFixed(1) + 'K';
  return String(Math.floor(n));
}
function lerpAngle(a,b,k){
  let d = ((b - a + Math.PI) % (Math.PI*2)) - Math.PI;
  if(d < -Math.PI) d += Math.PI*2;
  return a + d * k;
}
function fmtTime(sec){
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ' ' + t('minShort') + ' ' + s + ' ' + t('secShort');
}
function fmtStr(str, obj){
  return str.replace(/\{(\w+)\}/g, (m,k) => obj[k] !== undefined ? obj[k] : m);
}

/* --------------------- 2b. УРОВНИ/БОНУСЫ/ПРОКАЧКИ ------------------------ */
function cumulativeXP(level){ return 250 * level * (level - 1); }
function getLevel(){
  let lvl = 1;
  while(lvl < 40 && state.xp >= cumulativeXP(lvl + 1)) lvl++;
  return lvl;
}
function xpProgress(){
  const lvl = getLevel();
  const cur = state.xp - cumulativeXP(lvl);
  const next = cumulativeXP(lvl + 1) - cumulativeXP(lvl);
  return {cur, next, ratio: next > 0 ? cur / next : 0};
}
function maxCellsForLevel(lvl){ return Math.min(36 + (lvl - 1) * 6, GW * GH); }
function hasIncomeBonus(){ return state.bonusUntil > Date.now(); }
function upgradeLevel(key){ return (state.upgrades && state.upgrades[key]) || 0; }
function incomeMultiplier(){
  let m = 1;
  m *= (1 + 0.02 * upgradeLevel('income'));
  m *= (1 + PRESTIGE_BONUS * state.prestige);
  if(hasIncomeBonus()) m *= 2;
  return m;
}
function spawnRateMul(){ return 1 + 0.10 * upgradeLevel('spawn'); }
function speedMul(){ return 1 + 0.15 * upgradeLevel('speed'); }
function xpMul(){ return 1 + 0.10 * upgradeLevel('xp'); }
function extraCapacity(){ return upgradeLevel('cap'); }
function canPrestige(){ return getLevel() >= PRESTIGE_LEVEL; }

}

let state = null;
function newState(){
  return {
    money: 600, lang: 'ru', music: true, tutorialDone: false,
    xp: 0, prestige: 0,
    upgrades: {spawn:0, income:0, speed:0, xp:0, cap:0},
    grid: [], warehouse: {}, decor: {wall: 0, window: 0},
    owned: {wall: [0], window: [0]},
    lastDaily: 0, streak: 0,
    tasks: [], tasksDate: '',
    ds: {sell:0, earn:0, serve:0, buy:0, place:0, stock:0, expand:0},
    playtime: 0, claimedTimeRewards: [], notifiedTimeRewards: [],
    totalServed: 0, totalEarned: 0, adCount: 0, v: 8,
    dirt: [],
    truckTimer: TRUCK_CYCLE, truckState: 'away', truckOfferTimer: 0, bonusUntil: 0
  };
}
function initGrid(){
  state.grid = [];
  for(let y = 0; y < GH; y++){
    const row = [];
    for(let x = 0; x < GW; x++) row.push({u: false, t: null, stock: [], door: false});
    state.grid.push(row);
  }
  for(let y = 0; y < 6; y++) for(let x = 0; x < 6; x++) state.grid[y][x].u = true;
  state.grid[DOOR.y][DOOR.x].door = true;
  state.grid[1][1].t = 'shelf';
  state.grid[1][2].t = 'shelf';
  state.grid[1][3].t = 'shelf';
  state.grid[5][5].t = 'counter';
}
function cellAt(x, y){
  if(x < 0 || y < 0 || x >= GW || y >= GH) return null;
  return state.grid[y][x];
}
function walkable(x, y){
  const c = cellAt(x, y);
  if(!c || !c.u) return false;
  if(c.t) return false;
  return true;
}
function unlockedCount(){
  let n = 0;
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++) if(state.grid[y][x].u) n++;
  return n;
}
function expandPrice(){ return Math.round(120 * Math.pow(1.16, unlockedCount() - 36)); }
function isAdjacentToUnlocked(x, y){
  const d = [[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx, dy] of d){
    const c = cellAt(x + dx, y + dy);
    if(c && c.u) return true;
  }
  return false;
}
function shelfCells(){
  const out = [];
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(c.u && (c.t === 'shelf' || c.t === 'rack' || c.t === 'fridge')) out.push({x, y, c});
  }
  return out;
}
function counterCells(){
  const out = [];
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(c.u && c.t === 'counter') out.push({x, y, c});
  }
  return out;
}
function shelfQty(c){ let n = 0; for(const s of c.stock) n += s.n; return n; }
function shelfCapacity(c){ return FURNITURE[c.t].cap + extraCapacity(); }
function canAccept(c, pid){
  const prod = PROD_BY_ID[pid];
  const acc = FURNITURE[c.t].accepts;
  if(acc && acc.indexOf(prod.cat) < 0) return false;
  return true;
}
function addToShelf(c, pid, count){
  const cap = shelfCapacity(c);
  let space = cap - shelfQty(c);
  if(space <= 0) return 0;
  const add = Math.min(space, count);
  let s = c.stock.find(s => s.id === pid);
  if(!s){ s = {id: pid, n: 0}; c.stock.push(s); }
  s.n += add;
  return add;
}
function takeFromShelf(c, pid, count){
  const s = c.stock.find(s => s.id === pid);
  if(!s) return 0;
  const take = Math.min(s.n, count);
  s.n -= take;
  if(s.n <= 0) c.stock = c.stock.filter(x => x !== s);
  return take;
}
function warehouseTotal(){
  let n = 0;
  for(const k in state.warehouse) n += state.warehouse[k];
  return n;
}
function dropDirt(x, y){
  const cx = Math.floor(x), cy = Math.floor(y);
  const c = cellAt(cx, cy);
  if(!c || !c.u) return;
  if(state.dirt.find(d => d.x === cx && d.y === cy)) return;
  state.dirt.push({x: cx, y: cy, type: randInt(0, 2), t: Date.now()});
}
function dirtAtCell(x, y){ return state.dirt.find(d => d.x === x && d.y === y); }
function cleanDirtAt(x, y){
  const idx = state.dirt.findIndex(d => d.x === x && d.y === y);
  if(idx < 0) return false;
  state.dirt.splice(idx, 1);
  addXP(8);
  toast(t('dirtClean') + ' +8 XP', '#8fd3ff');
  scheduleSave();
  return true;
}

/* ------------------------- 5. СОХРАНЕНИЕ (VK) ----------------------------- */
const vk = (typeof window.vkBridge !== 'undefined') ? window.vkBridge : null;
let vkAvailable = !!vk;
function vkSend(method, params){
  if(!vk) return Promise.reject(new Error('no vk'));
  try { return vk.send(method, params || {}); }
  catch(e){ return Promise.reject(e); }
}
const memStore = {};
async function storageSet(key, value){
  if(vkAvailable){
    try { await vkSend('VKWebAppStorageSet', {key, value}); return; }
    catch(e){ vkAvailable = false; }
  }
  memStore[key] = value;
}
async function storageGet(keys){
  if(vkAvailable){
    try {
      const r = await vkSend('VKWebAppStorageGet', {keys});
      const out = {};
      (r.keys || []).forEach(k => out[k.key] = k.value);
      return out;
    } catch(e){ vkAvailable = false; }
  }
  const out = {};
  keys.forEach(k => out[k] = memStore[k] || '');
  return out;
}
function serialize(){
  let g = '';
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(!c.u) g += '.';
    else if(!c.t) g += '_';
    else g += {shelf:'S', rack:'R', fridge:'F', counter:'C'}[c.t];
  }
  const stocks = [];
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
    const c = state.grid[y][x];
    if(c.stock && c.stock.length) stocks.push(x + ',' + y + ':' + c.stock.map(s => s.id + '-' + s.n).join('.'));
  }
  const wh = Object.keys(state.warehouse).filter(k => state.warehouse[k] > 0)
    .map(k => k + '-' + state.warehouse[k]).join(',');
  const drt = state.dirt.map(d => d.x + ',' + d.y + ',' + d.type).join('|');
  return {
    m: Math.floor(state.money), l: state.lang, mu: state.music ? 1 : 0,
    td: state.tutorialDone ? 1 : 0, xp: Math.floor(state.xp), pr: state.prestige,
    up: state.upgrades, g, st: stocks.join('|'), wh, drt,
    dw: state.decor.wall, dn: state.decor.window,
    ow: state.owned.wall, on: state.owned.window,
    ld: state.lastDaily, sk: state.streak,
    tk: state.tasks, tkd: state.tasksDate, ds: state.ds,
    ts: state.totalServed, te: Math.floor(state.totalEarned), ac: state.adCount,
    tt: state.truckTimer, ts2: state.truckState, tot: state.truckOfferTimer,
    bu: state.bonusUntil
  };
}
function deserialize(o){
  state.money = o.m || 600;
  state.lang = o.l || 'ru';
  state.music = o.mu === 1;
  state.tutorialDone = !!o.td;
  state.xp = o.xp || 0;
  state.prestige = o.pr || 0;
  state.upgrades = o.up || {spawn:0, income:0, speed:0, xp:0, cap:0};
  Object.keys(UPGRADES).forEach(k => { if(typeof state.upgrades[k] !== 'number') state.upgrades[k] = 0; });
  state.decor.wall = o.dw || 0;
  state.decor.window = o.dn || 0;
  state.owned.wall = o.ow || [0];
  state.owned.window = o.on || [0];
  state.lastDaily = o.ld || 0;
  state.streak = o.sk || 0;
  state.tasks = o.tk || [];
  state.tasksDate = o.tkd || '';
  state.ds = o.ds || {sell:0, earn:0, serve:0, buy:0, place:0, stock:0, expand:0};
  state.totalServed = o.ts || 0;
  state.totalEarned = o.te || 0;
  state.adCount = o.ac || 0;
  state.truckTimer = o.tt !== undefined ? o.tt : TRUCK_CYCLE;
  state.truckState = o.ts2 || 'away';
  state.truckOfferTimer = o.tot || 0;
  state.bonusUntil = o.bu || 0;
  state.warehouse = {};
  state.dirt = [];
  state.playtime = 0;
  state.claimedTimeRewards = [];
  state.notifiedTimeRewards = [];
  initGrid();
  if(o.g && o.g.length === GW * GH){
    for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++){
      const ch = o.g[y * GW + x];
      const c = state.grid[y][x];
      c.u = ch !== '.';
      c.t = ch === 'S' ? 'shelf' : ch === 'R' ? 'rack' : ch === 'F' ? 'fridge' : ch === 'C' ? 'counter' : null;
      c.stock = [];
    }
  }
  if(o.st){
    o.st.split('|').forEach(part => {
      if(!part) return;
      const [pos, items] = part.split(':');
      const [x, y] = pos.split(',').map(Number);
      const c = cellAt(x, y);
      if(!c) return;
      (items || '').split('.').forEach(it => {
        const [id, n] = it.split('-').map(Number);
        if(PROD_BY_ID[id] && n > 0) c.stock.push({id, n});
      });
    });
  }
  if(o.wh){
    o.wh.split(',').forEach(part => {
      if(!part) return;
      const [id, n] = part.split('-').map(Number);
      if(PROD_BY_ID[id] && n > 0) state.warehouse[id] = n;
    });
  }
  if(o.drt){
    o.drt.split('|').forEach(part => {
      if(!part) return;
      const [x, y, type] = part.split(',').map(Number);
      if(!isNaN(x) && !isNaN(y)) state.dirt.push({x, y, type: type || 0, t: Date.now()});
    });
  }
  state.grid[DOOR.y][DOOR.x].door = true;
}
let saveTimer = null;
function scheduleSave(){
  if(saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; saveGame(); }, 1200);
}
async function saveGame(){
  try {
    const data = JSON.stringify(serialize());
    const chunks = data.match(/.{1,3000}/g) || [''];
    await storageSet('sn', String(chunks.length));
    for(let i = 0; i < chunks.length; i++) await storageSet('s' + i, chunks[i]);
  } catch(e){}
}
async function loadGame(){
  try {
    const head = await storageGet(['sn']);
    const n = parseInt(head.sn || '0', 10);
    if(!n) return false;
    const keys = [];
    for(let i = 0; i < n; i++) keys.push('s' + i);
    const data = await storageGet(keys);
    let s = '';
    for(let i = 0; i < n; i++) s += (data['s' + i] || '');
    if(!s) return false;
    deserialize(JSON.parse(s));
    return true;
  } catch(e){ return false; }
}
async function wipeSave(){
  await storageSet('sn', '0');
  await storageSet('s0', '');
  state = newState();
  initGrid();
  checkDailyReset();
  updateHUD();
}

/* ------------------------------ 6. КЛИЕНТЫ -------------------------------- */
const SHIRT = ['#4a89ff','#e0575b','#43b581','#f0a93b','#a56bd6','#20b2aa','#e06fa0','#7f8c9b','#5a6fd6','#d97742'];
const SKIN  = ['#f2c9a0','#e0aa7a','#c98d5c','#9c6b45','#7a5136','#f7dcc0'];
const HAIR  = ['#2b1d13','#4a2f1c','#7a4a22','#b07a35','#1a1a1a','#8b8b8b'];

class Customer {
  constructor(){
    this.x = DOOR.x + 0.5; this.y = DOOR.y + 0.5;
    this.alpha = 0;
    this.baseSpeed = rnd(0.6, 0.95);
    this.speed = this.baseSpeed * speedMul();
    this.shirt = pick(SHIRT); this.skin = pick(SKIN); this.hair = pick(HAIR);
    this.state = 'idle';
    this.path = []; this.cart = [];
    this.timer = 0; this.walk = 0;
    this.dir = Math.PI / 2; this.targetDir = Math.PI / 2;
    this.bob = 0; this.visited = [];
    this.wants = randInt(2, 4);
    this.bubble = null; this.bubbleT = 0;
    this.spot = null; this.dead = false;
    this.patience = 60;
    this.dirtDropped = false;
    this.willDropDirt = Math.random() < 0.2;
    this.returnNotified = false;
    this.emptyAttempts = 0;
  }
  returnCart(){
    if(!this.cart.length) return false;
    for(const it of this.cart) state.warehouse[it.id] = (state.warehouse[it.id] || 0) + 1;
    this.cart = [];
    if(!this.returnNotified){
      this.returnNotified = true;
      toast(t('returnedGoods'), '#8fd3ff');
    }
    scheduleSave();
    return true;
  }
  moveTo(gx, gy){
    const path = findPath(Math.floor(this.x), Math.floor(this.y), gx, gy);
    if(path && path.length){ this.path = path; return true; }
    if(Math.floor(this.x) === gx && Math.floor(this.y) === gy){ this.path = []; return true; }
    return false;
  }
  update(dt){
    if(this.alpha < 1 && this.state !== 'gone') this.alpha = Math.min(1, this.alpha + dt * 2.5);
    if(this.bubbleT > 0){ this.bubbleT -= dt; if(this.bubbleT <= 0) this.bubble = null; }
    if(this.state === 'gone'){
      this.returnCart();
      this.alpha -= dt * 1.3;
      this.x -= dt * 1.2;
      this.bob = Math.sin(this.walk) * 0.045;
      this.walk += dt * 7;
      this.targetDir = Math.PI;
      this.dir = lerpAngle(this.dir, this.targetDir, Math.min(1, dt * 8));
      if(this.willDropDirt && !this.dirtDropped && this.alpha < 0.85){
        this.dirtDropped = true;
        dropDirt(DOOR.x + 1 + Math.random() * 1.5, DOOR.y + (Math.random() - 0.5) * 1.2);
      }
      if(this.alpha <= 0) this.dead = true;
      return;
    }
    if(this.state === 'picking' || this.state === 'paying'){
      this.timer -= dt;
      if(this.timer <= 0) this.finishAction();
      return;
    }
    if(this.state === 'waiting'){
      this.timer -= dt; this.patience -= dt;
      if(this.patience <= 0){ this.leave(); return; }
      if(this.timer <= 0) this.tryCashier();
      return;
    }
    if(this.path.length){
      const tgt = this.path[0];
      const tx = tgt.x + 0.5, ty = tgt.y + 0.5;
      const dx = tx - this.x, dy = ty - this.y;
      const d = Math.hypot(dx, dy);
      const step = this.speed * dt;
      if(d <= step){ this.x = tx; this.y = ty; this.path.shift(); }
      else { this.x += dx / d * step; this.y += dy / d * step; }
      if(d > 0.01) this.targetDir = Math.atan2(dy, dx);
      this.dir = lerpAngle(this.dir, this.targetDir, Math.min(1, dt * 10));
      this.walk += dt * 8;
      this.bob = Math.sin(this.walk) * 0.045;
    } else {
      this.bob *= 0.85;
      this.dir = lerpAngle(this.dir, this.targetDir, Math.min(1, dt * 10));
      this.arrive();
    }
  }
  arrive(){
    if(this.state === 'toShelf'){
      const cell = this.targetCell;
      if(!cell || !cell.stock.length){
        this.emptyAttempts++;
        this.state = 'idle';
        if(this.emptyAttempts > 3){ this.goToCashierOrLeave(); return; }
        this.planShopping();
        return;
      }
      this.state = 'picking';
      this.timer = rnd(1.3, 2.6);
      const s = pick(cell.stock);
      this.bubble = s.id;
      this.bubbleT = this.timer + 0.3;
    } else if(this.state === 'toCashier'){
      this.state = 'paying'; this.timer = rnd(1.1, 1.8);
    } else if(this.state === 'leaving'){
      this.state = 'gone';
    } else if(this.state === 'idle'){
      this.planShopping();
    }
  }
  finishAction(){
    if(this.state === 'picking'){
      const cell = this.targetCell;
      let gotSomething = false;
      if(cell && cell.stock.length){
        const s = pick(cell.stock);
        if(takeFromShelf(cell, s.id, 1)){
          const p = PROD_BY_ID[s.id];
          this.cart.push({id: s.id, price: p.sell});
          gotSomething = true;
        }
      }
      if(this.targetX !== undefined) this.visited.push(this.targetX + ',' + this.targetY);
      if(!gotSomething){
        this.emptyAttempts++;
        if(this.emptyAttempts > 2){ this.goToCashierOrLeave(); return; }
        this.state = 'idle';
        this.planShopping();
        return;
      }
      this.state = 'idle';
      if(this.cart.length >= this.wants || this.visited.length > 4) this.goToCashier();
      else this.planShopping();
    } else if(this.state === 'paying'){
      let sum = 0;
      for(const it of this.cart) sum += it.price;
      const mult = incomeMultiplier();
      const total = Math.round(sum * mult);
      state.money += total;
      state.totalEarned += total;
      state.ds.earn += total;
      state.ds.serve += 1;
      state.ds.sell += this.cart.length;
      state.totalServed += 1;
      addXP(Math.max(1, Math.round(total * 0.5 * xpMul())));
      if(this.spot) busySpots.delete(this.spot);
      this.spot = null; this.cart = [];
      toast('+' + fmt(total) + ' \u20BF' + (mult > 1.05 ? ' x' + mult.toFixed(2) : ''), mult > 1.05 ? '#ffd257' : '#7fd07f');
      updateHUD(); scheduleSave();
      this.leave();
    }
  }
  planShopping(){
    const shelves = shelfCells().filter(s => s.c.stock.length > 0);
    if(!shelves.length){ this.goToCashierOrLeave(); return; }
    const fresh = shelves.filter(s => this.visited.indexOf(s.x + ',' + s.y) < 0);
    if(!fresh.length){ this.goToCashierOrLeave(); return; }
    const target = pick(fresh);
    const spots = adjacentWalkable(target.x, target.y);
    if(!spots.length){
      this.visited.push(target.x + ',' + target.y);
      if(this.visited.length > shelves.length + 3){ this.goToCashierOrLeave(); return; }
      this.planShopping();
      return;
    }
    const spot = pick(spots);
    this.targetCell = target.c;
    this.targetX = target.x; this.targetY = target.y;
    this.state = 'toShelf';
    if(!this.moveTo(spot.x, spot.y)){ this.goToCashierOrLeave(); }
  }
  goToCashierOrLeave(){
    if(this.cart.length > 0) this.goToCashier();
    else this.leave();
  }
  goToCashier(){
    if(!this.cart.length){ this.leave(); return; }
    if(!counterCells().length){
      toast(t('noCashierReturn'), '#e0575b');
      this.returnCart(); this.leave();
      return;
    }
    this.tryCashier();
  }
  tryCashier(){
    const spots = serviceSpots().filter(s => !busySpots.has(s.x + ',' + s.y));
    if(!spots.length){ this.state = 'waiting'; this.timer = rnd(0.8, 1.6); return; }
    let best = null, bd = 1e9;
    for(const s of spots){
      const d = Math.abs(s.x - this.x) + Math.abs(s.y - this.y);
      if(d < bd){ bd = d; best = s; }
    }
    busySpots.add(best.x + ',' + best.y);
    this.spot = best;
    this.state = 'toCashier';
    if(!this.moveTo(best.x, best.y)){
      busySpots.delete(best.x + ',' + best.y);
      this.spot = null;
      this.returnCart(); this.leave();
    }
  }
  leave(){
    if(this.spot){ busySpots.delete(this.spot); this.spot = null; }
    this.returnCart();
    this.state = 'leaving';
    if(!this.moveTo(DOOR.x, DOOR.y)){ this.state = 'gone'; }
  }
}
const busySpots = new Set();
function serviceSpots(){
  const out = [];
  for(const c of counterCells()){
    const adj = adjacentWalkable(c.x, c.y);
    for(const a of adj) out.push(a);
  }
  return out;
}
function adjacentWalkable(x, y){
  const out = [];
  const d = [[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx, dy] of d){
    const nx = x + dx, ny = y + dy;
    if(walkable(nx, ny)) out.push({x: nx, y: ny});
  }
  return out;
}
function findPath(sx, sy, gx, gy){
  if(sx === gx && sy === gy) return [];
  if(!walkable(gx, gy)) return null;
  const key = (x, y) => y * GW + x;
  const prev = new Int16Array(GW * GH).fill(-1);
  const seen = new Uint8Array(GW * GH);
  const q = [key(sx, sy)];
  seen[key(sx, sy)] = 1;
  const D = [[1,0],[-1,0],[0,1],[0,-1]];
  let found = false;
  while(q.length){
    const cur = q.shift();
    const cx = cur % GW, cy = (cur - cx) / GW;
    if(cx === gx && cy === gy){ found = true; break; }
    for(const [dx, dy] of D){
      const nx = cx + dx, ny = cy + dy;
      if(nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const k = key(nx, ny);
      if(seen[k]) continue;
      if(!walkable(nx, ny)) continue;
      seen[k] = 1; prev[k] = cur; q.push(k);
    }
  }
  if(!found) return null;
  const path = [];
  let cur = key(gx, gy);
  while(cur !== key(sx, sy)){
    const cx = cur % GW, cy = (cur - cx) / GW;
    path.unshift({x: cx, y: cy});
    cur = prev[cur];
    if(cur < 0) return null;
  }
  return path;
}

  x: 5.5, y: 5.15,
  skin: '#e0aa7a', hair: '#4a2f1c', shirt: '#2b5fae',
  bob: 0, walk: 0, anchorX: -1, anchorY: -1,
  update(dt){

    let best = counters[0], bd = 1e9;

      if(d < bd){ bd = d; best = c; }

    if(best.x !== this.anchorX || best.y !== this.anchorY){
      this.anchorX = best.x; this.anchorY = best.y;
      this.x = best.x + 0.5; this.y = best.y + 0.30;
    }
    this.walk += dt * 2.5;
    this.bob = Math.sin(this.walk) * 0.02;
  }
};

function genTasks(){
  const list = [];
  const shuffled = TASK_DEFS.slice().sort(() => Math.random() - 0.5);
  for(let i = 0; i < 10; i++){
    const def = shuffled[i % shuffled.length];
    const target = randInt(def.min, def.max);
    list.push({t: def.id, target, reward: def.rew(target), claimed: false});
  }
  state.tasks = list;
  state.ds = {sell:0, earn:0, serve:0, buy:0, place:0, stock:0, expand:0};
  state.tasksDate = todayStr();
}
function checkDailyReset(){ if(state.tasksDate !== todayStr() || !state.tasks.length) genTasks(); }
function taskText(task){
  const def = TASK_DEFS.find(d => d.id === task.t);
  if(!def) return '';
  return (state.lang === 'en' ? def.en : def.ru).replace('{n}', task.target);
}
function taskProgress(task){ return Math.min(task.target, state.ds[task.t] || 0); }
function tasksReadyCount(){
  let n = 0;
  for(const tk of state.tasks) if(!tk.claimed && taskProgress(tk) >= tk.target) n++;
  return n;
}

const Music = {
  ctx: null, gain: null, timer: null, playing: false, enabled: true, step: 0,
  scale: [261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25,587.33,659.25],
  bass: [65.41,73.42,82.41,98.00],
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = 0.12;
    this.gain.connect(this.ctx.destination);
  },
  start(){
    this.init();
    if(!this.ctx || this.playing || !this.enabled) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    this.playing = true; this.step = 0;
    this.tick();
    this.timer = setInterval(() => this.tick(), 420);
  },
  stop(){ this.playing = false; if(this.timer){ clearInterval(this.timer); this.timer = null; } },
  setEnabled(v){ this.enabled = v; if(v) this.start(); else this.stop(); },
  note(freq, dur, vol, type){
    if(!this.ctx || !this.playing) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(this.gain);
    osc.start(now); osc.stop(now + dur + 0.05);
  },
  tick(){
    if(!this.playing) return;
    const s = this.step++;
    const n = this.scale[(s * 3 + (s >> 2)) % this.scale.length];
    this.note(n, 0.45, 0.055, 'triangle');
    if(s % 4 === 0){
      const b = this.bass[(s >> 2) % this.bass.length];
      this.note(b, 1.2, 0.07, 'sine');
      this.note(b * 1.5, 1.0, 0.035, 'sine');
    }
    if(s % 8 === 0) this.note(n * 2, 0.3, 0.025, 'sine');
  }
};

let CS = 40;         // текущая клетка в пикселях (с учётом зума)
let baseCS = 40;     // базовая клетка без зума
let zoom = 1;        // коэффициент зума
const ZOOM_MIN = 0.5, ZOOM_MAX = 3;
let baseOX = 0, baseOY = 0;
let camX = 0, camY = 0;

let pinchStartZoom = 1;

function resize(){
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const topbarH = $('#topbar').offsetHeight || 52;
  const bottombarH = $('#bottombar').offsetHeight || 70;
  const availTop = topbarH + 6;
  const availBottom = h - bottombarH - 6;
  const availH = availBottom - availTop;
  const availW = w - 12;

  baseCS = Math.min((availW - 2 * 20) / GW, (availH - 2 * 20) / GH);
  baseCS = Math.max(12, baseCS);
  CS = baseCS * zoom;

  baseOX = (w - GW * CS) / 2;
  baseOY = availTop + (availH - GH * CS) / 2;
  clampCamera();
}
function setZoom(z){
  zoom = clamp(z, ZOOM_MIN, ZOOM_MAX);
  resize();
}
function clampCamera(){
  const maxPan = CS * 4;
  camX = clamp(camX, -maxPan, maxPan);
  camY = clamp(camY, -maxPan, maxPan);
}
function getOX(){ return baseOX + camX; }
function getOY(){ return baseOY + camY; }

function draw(){
  const w = canvas.clientWidth, h = canvas.clientHeight;

  const skyGrad = ctx.createLinearGradient(0, 0, 0, h);

function drawOutside(){
  const MB = OUT_MARGIN;

  const roadW = 46 * zoom;

  const ring1 = sidewalkW;
  const ring2 = sidewalkW + roadW;

  const bgPad = buildingStart + 120 * zoom;

  ctx.fillStyle = '#171d26';
  ctx.fillRect(-bgPad, -bgPad, totalW + bgPad * 2, totalH + bgPad * 2);

  drawBgSkyline(-bgPad, -bgPad, totalW + bgPad * 2, bgPad, true);
  drawBgSkyline(-bgPad, totalH + ring3, totalW + bgPad * 2, bgPad, false);
  drawSideBg(-bgPad, 0, bgPad, totalH);

  ctx.fillStyle = '#2b2f37';

  const midBotY = totalH + sidewalkW + roadW / 2;
  const midLeftX = -(sidewalkW + roadW / 2);
  const midRightX = totalW + sidewalkW + roadW / 2;
  ctx.beginPath(); ctx.moveTo(-ring2, midTopY); ctx.lineTo(totalW + ring2, midTopY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-ring2, midBotY); ctx.lineTo(totalW + ring2, midBotY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(midLeftX, -ring2); ctx.lineTo(midLeftX, totalH + ring2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(midRightX, -ring2); ctx.lineTo(midRightX, totalH + ring2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#5a6470';
  ctx.fillRect(-ring1, -ring1, totalW + ring1 * 2, totalH + ring1 * 2);

  ctx.fillStyle = '#4f5864';
  ctx.fillRect(-ring3, -ring3, totalW + ring3 * 2, ring3 - ring2);
  ctx.fillRect(-ring3, totalH + ring2, totalW + ring3 * 2, ring3 - ring2);
  ctx.fillRect(-ring3, -ring2, ring3 - ring2, totalH + ring2 * 2);
  ctx.fillRect(totalW + ring2, -ring2, ring3 - ring2, totalH + ring2 * 2);

  ctx.strokeStyle = 'rgba(0,0,0,.2)';
  ctx.lineWidth = 1;
  const tile = 16 * zoom;
  for(let x = -ring1; x <= totalW + ring1; x += tile){
    ctx.beginPath(); ctx.moveTo(x, -ring1); ctx.lineTo(x, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, totalH); ctx.lineTo(x, totalH + ring1); ctx.stroke();
  }
  for(let y = -ring1; y <= totalH + ring1; y += tile){
    ctx.beginPath(); ctx.moveTo(-ring1, y); ctx.lineTo(0, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(totalW, y); ctx.lineTo(totalW + ring1, y); ctx.stroke();
  }
  for(let x = -ring3; x <= totalW + ring3; x += tile){
    ctx.beginPath(); ctx.moveTo(x, -ring3); ctx.lineTo(x, -ring2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, totalH + ring2); ctx.lineTo(x, totalH + ring3); ctx.stroke();
  }
  for(let y = -ring3; y <= totalH + ring3; y += tile){
    ctx.beginPath(); ctx.moveTo(-ring3, y); ctx.lineTo(-ring2, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(totalW + ring2, y); ctx.lineTo(totalW + ring3, y); ctx.stroke();
  }

  const doorX = DOOR.x * CS;

  ctx.strokeStyle = 'rgba(255,255,255,.35)';

  ctx.moveTo(doorX + CS / 2, doorY + 2);
  ctx.lineTo(doorX + CS / 2, doorY + ring1 - 2);

  ctx.setLineDash([]);

  const bh = 70 * zoom;

function drawBuildingRow(x, y, w, h, isTop){
  const colors = ['#2a3a4d','#3a4a5d','#2f4050','#354a5c','#28425c'];
  const roofColors = ['#4a2f2f','#3d3d55','#4a3d2f','#2f4a3d'];
  let cx = x, idx = 0;
  const zf = zoom;
  while(cx < x + w){
    const bw = (55 + ((idx * 17) % 35)) * zf;
    const bh = h + ((idx * 13) % 25) * zf;
    const col = colors[idx % colors.length];
    const roofCol = roofColors[idx % roofColors.length];
    const yBase = isTop ? (y + (h - bh)) : y;
    ctx.fillStyle = col;
    ctx.fillRect(cx, yBase, bw, bh);
    ctx.fillStyle = roofCol;
    if(isTop) ctx.fillRect(cx - 3, yBase - 6 * zf, bw + 6, 7 * zf);
    else ctx.fillRect(cx - 3, yBase + bh - 1, bw + 6, 6 * zf);
    ctx.fillStyle = 'rgba(255,225,130,.6)';
    const cols = Math.max(2, Math.floor(bw / (18 * zf)));
    for(let i = 0; i < cols; i++){
      for(let j = 0; j < 2; j++){
        const wx = cx + 6 * zf + i * 16 * zf;
        const wy = yBase + 10 * zf + j * 20 * zf;
        if(wx + 9 * zf < cx + bw - 4 && wy + 12 * zf < yBase + bh - 4){
          ctx.fillRect(wx, wy, 9 * zf, 12 * zf);
        }
      }
    }
    cx += bw + 8 * zf; idx++;
  }
}
function drawBuildingColumn(x, y, w, h, isLeft){
  const colors = ['#2a3a4d','#3a4a5d','#354a5c'];
  const roofColors = ['#4a2f2f','#3d3d55','#4a3d2f'];
  let cy = y, idx = 0;
  const zf = zoom;
  while(cy < y + h){
    const bh = (60 + ((idx * 21) % 40)) * zf;
    const bw = w + ((idx * 11) % 20) * zf;
    const col = colors[idx % colors.length];
    const xBase = isLeft ? (x + (w - bw)) : x;
    ctx.fillStyle = col;
    ctx.fillRect(xBase, cy, bw, bh);
    ctx.fillStyle = roofColors[idx % roofColors.length];
    if(isLeft) ctx.fillRect(xBase - 6 * zf, cy - 3, 7 * zf, bh + 6);
    else ctx.fillRect(xBase + bw - 1, cy - 3, 6 * zf, bh + 6);
    ctx.fillStyle = 'rgba(255,225,130,.55)';
    for(let i = 0; i < 2; i++){
      for(let j = 0; j < 3; j++){
        const wx = xBase + 8 * zf + i * 20 * zf;
        const wy = cy + 12 * zf + j * 22 * zf;
        if(wx + 10 * zf < xBase + bw - 4 && wy + 12 * zf < cy + bh - 4){
          ctx.fillRect(wx, wy, 10 * zf, 12 * zf);
        }
      }
    }
    cy += bh + 10 * zf; idx++;
  }
}
function drawBgSkyline(x, y, w, h, isTop){
  ctx.fillStyle = '#20262f';
  let cx = x, idx = 0;
  const zf = zoom;
  while(cx < x + w){
    const bw = (40 + ((idx * 19) % 45)) * zf;
    const bh = h - 10 * zf - ((idx * 11) % 25) * zf;
    const yBase = isTop ? (y + h - bh) : y;
    ctx.fillRect(cx, yBase, bw, bh);
    ctx.fillStyle = 'rgba(255,220,120,.25)';

    }

    cx += bw + 6 * zf; idx++;

function drawSideBg(x, y, w, h){
  ctx.fillStyle = '#20262f';

function drawFloor(){

function drawWindows(){
  const w = state.decor.window;
  const topY = -CS * 0.16;
  const count = 4;
  const ww = (GW * CS) / count;
  for(let i = 0; i < count; i++){
    const px = i * ww + ww * 0.15;
    const py = topY;
    const pw = ww * 0.7;
    const ph = CS * 0.14;
    if(w === 0){
      ctx.fillStyle = '#8fd3ff'; ctx.fillRect(px, py, pw, ph);

    } else if(w === 1){

      ctx.beginPath(); ctx.moveTo(px + pw / 2, py); ctx.lineTo(px + pw / 2, py + ph * 1.3); ctx.stroke();
    } else {
      const cols = ['#ff6b6b','#ffd93d','#6bcB77','#4d96ff'];
      for(let j = 0; j < 4; j++){

function drawFurniture(gx, gy, c){

  }
  if(c.t !== 'counter' && c.stock && c.stock.length){
    const total = shelfQty(c);
    const cap = shelfCapacity(c);
    let idx = 0;
    const maxShow = 6;
    for(let i = 0; i < c.stock.length && idx < maxShow; i++){
      const s = c.stock[i];
      const p = PROD_BY_ID[s.id];
      if(!p) continue;
      const spr = prodSprite(p);
      const show = s.n > 1 ? 2 : 1;
      for(let k = 0; k < show && idx < maxShow; k++){
        const px = x + 0.14 + (idx % 3) * 0.26;

      ctx.beginPath(); ctx.arc(x + 0.86, y + 0.14, 0.06, 0, Math.PI * 2); ctx.fill();

function drawPerson(px, py, dir, bob, walking, walkPhase, skin, hair, shirt, opts){
  opts = opts || {};
  const scale = opts.scale || 1;
  ctx.save();
  ctx.translate(px, py + bob);
  ctx.rotate(dir - Math.PI / 2);
  ctx.scale(scale, scale);
  if(walking){
    const legPhase = Math.sin(walkPhase);
    ctx.fillStyle = '#2b3546';
    ctx.beginPath(); ctx.ellipse(-0.12, 0.18 + legPhase * 0.05, 0.09, 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.12, 0.18 - legPhase * 0.05, 0.09, 0.13, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#2b3546';
    ctx.beginPath(); ctx.ellipse(-0.1, 0.18, 0.08, 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.1, 0.18, 0.08, 0.12, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = shirt;
  ctx.beginPath(); ctx.ellipse(0, 0, 0.28, 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = shade(shirt, -50); ctx.lineWidth = 0.025; ctx.stroke();
  ctx.fillStyle = skin;
  const swing = walking ? Math.sin(walkPhase) * 0.03 : 0;
  ctx.beginPath(); ctx.arc(-0.27, swing, 0.075, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0.27, -swing, 0.075, 0, Math.PI * 2); ctx.fill();
  if(opts.badge){
    ctx.fillStyle = '#ffd257'; ctx.fillRect(-0.06, 0.02, 0.12, 0.06);
    ctx.fillStyle = '#8a6a10'; ctx.fillRect(-0.05, 0.04, 0.1, 0.02);
  }
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -0.13, 0.17, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = shade(skin, -45); ctx.lineWidth = 0.02; ctx.stroke();
  ctx.fillStyle = hair;
  ctx.beginPath(); ctx.arc(0, -0.17, 0.165, Math.PI, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -0.2, 0.16, 0.09, 0, 0, Math.PI * 2); ctx.fill();
  const faceY = -0.09;
  ctx.fillStyle = '#1b2330';
  ctx.beginPath(); ctx.arc(-0.06, faceY, 0.026, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0.06, faceY, 0.026, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(-0.052, faceY - 0.006, 0.008, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0.068, faceY - 0.006, 0.008, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 0.018;
  ctx.beginPath(); ctx.arc(0, -0.035, 0.045, 0.15, Math.PI - 0.15); ctx.stroke();
  if(opts.cart){
    ctx.fillStyle = '#c9a227'; ctx.fillRect(-0.1, -0.36, 0.2, 0.16);
    ctx.strokeStyle = '#8a6a10'; ctx.lineWidth = 0.02; ctx.strokeRect(-0.1, -0.36, 0.2, 0.16);
  }
  ctx.restore();
}
function drawCustomerBody(c){
  ctx.save();

/* === ПУЗЫРИ В ЭКРАННЫХ КООРДИНАТАХ — ВСЕГДА ПОВЕРХ === */
function drawCustomerBubbleScreen(c){
  if(!c.bubble || c.bubbleT <= 0) return;
  const p = PROD_BY_ID[c.bubble];
  if(!p) return;
  const topbarH = $('#topbar').offsetHeight || 52;
  const size = Math.max(30, CS * 0.44);

  let sx = getOX() + c.x * CS;
  let sy = getOY() + (c.y - 0.5) * CS - CS * 0.35;

  // Если пузырь уходит выше топбара — переносим под покупателя
  let tailUp = true;
  if(sy - size / 2 < topbarH + 4){
    sy = getOY() + (c.y + 0.5) * CS + CS * 0.6;
    tailUp = false;
  }

  ctx.save();
  ctx.globalAlpha = clamp(c.alpha, 0, 1);

  // тень
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  if(ctx.roundRect){
    ctx.beginPath();
    ctx.roundRect(sx - size/2 + 3, sy - size/2 + 4, size, size, size*0.22);
    ctx.fill();
  }

  // пузырь
  ctx.fillStyle = 'rgba(255,255,255,.98)';
  if(ctx.roundRect){
    ctx.beginPath();
    ctx.roundRect(sx - size/2, sy - size/2, size, size, size*0.22);
    ctx.fill();
  } else {
    ctx.fillRect(sx - size/2, sy - size/2, size, size);
  }
  ctx.strokeStyle = '#4a89ff';
  ctx.lineWidth = Math.max(2, CS * 0.04);
  ctx.stroke();

  // хвостик
  const tw = size * 0.18;
  const th = size * 0.24;
  ctx.beginPath();
  if(tailUp){
    ctx.moveTo(sx - tw, sy + size/2 - 1);
    ctx.lineTo(sx, sy + size/2 + th);
    ctx.lineTo(sx + tw, sy + size/2 - 1);
  } else {
    ctx.moveTo(sx - tw, sy - size/2 + 1);
    ctx.lineTo(sx, sy - size/2 - th);
    ctx.lineTo(sx + tw, sy - size/2 + 1);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.98)';
  ctx.fill();
  ctx.stroke();

  // иконка товара
  const spr = prodSprite(p);
  if(spr && spr.complete && spr.naturalWidth){
    ctx.drawImage(spr, sx - size*0.36, sy - size*0.36, size*0.72, size*0.72);
  }

  ctx.restore();
}

const customers = [];
let spawnTimer = 8;
function updateWorld(dt){
  cashier.update(dt);
  truck.update(dt);
  for(const c of customers) c.update(dt);
  for(let i = customers.length - 1; i >= 0; i--){
    if(customers[i].dead) customers.splice(i, 1);
  }
  const shelves = shelfCells().filter(s => s.c.stock.length > 0);
  const counters = counterCells();
  const maxCust = Math.min(8, 2 + Math.floor(shelves.length / 3));
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnTimer = Math.max(3, (18 - shelves.length * 0.6) / spawnRateMul());
    if(customers.length < maxCust && shelves.length > 0 && counters.length > 0){
      customers.push(new Customer());
    }
  }
  if(state.truckState === 'away'){
    state.truckTimer -= dt;
    if(state.truckTimer <= 0) startTruckCycle();
  } else if(state.truckState === 'offering'){
    state.truckOfferTimer -= dt;
    if(state.truckOfferTimer <= 0){ endTruckCycle(); toast(t('truckLeft')); }
  }
}
function addXP(amount){
  if(amount <= 0) return;
  const before = getLevel();
  state.xp += amount;
  const after = getLevel();
  if(after > before) showLevelUp(after);
  updateHUD();
}
function showLevelUp(newLevel){

/* Награды за время */
function checkTimeRewards(){
  const mins = state.playtime / 60;
  for(let i = 0; i < TIME_REWARDS.length; i++){
    if(state.claimedTimeRewards.indexOf(i) >= 0) continue;
    const r = TIME_REWARDS[i];
    if(mins >= r.min && state.notifiedTimeRewards.indexOf(i) < 0){
      state.notifiedTimeRewards.push(i);
      toast(t('rewardAvailable'), '#7fd07f');
      if(state.music) Music.note(660, 0.4, 0.12, 'triangle');
    }
  }
}
function hasClaimableTimeReward(){
  const mins = state.playtime / 60;
  for(let i = 0; i < TIME_REWARDS.length; i++){
    if(state.claimedTimeRewards.indexOf(i) >= 0) continue;
    if(mins >= TIME_REWARDS[i].min) return true;
  }
  return false;
}
function claimTimeReward(idx){
  if(state.claimedTimeRewards.indexOf(idx) >= 0) return;
  const r = TIME_REWARDS[idx];
  if(state.playtime / 60 < r.min) return;
  state.claimedTimeRewards.push(idx);
  state.money += r.amount;
  addXP(Math.max(1, Math.round(r.amount * 0.5 * xpMul())));
  scheduleSave();
  toast('+' + fmt(r.amount) + ' \u20BF', '#ffd257');
}

function screenToCell(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const gx = Math.floor((clientX - rect.left - getOX()) / CS);
  const gy = Math.floor((clientY - rect.top - getOY()) / CS);
  if(gx < 0 || gy < 0 || gx >= GW || gy >= GH) return null;
  return {x: gx, y: gy};
}
function screenToWorld(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left - getOX()) / CS,
    y: (clientY - rect.top - getOY()) / CS
  };
}
let placeMode = null;

function onCellClick(gx, gy){
  if(isTutorialBlocking() && tutorialStep <= 2) return;
  if(dirtAtCell(gx, gy)){ cleanDirtAt(gx, gy); return; }
  const c = cellAt(gx, gy);
  if(!c) return;
  if(placeMode && placeMode.kind === 'furniture'){
    if(!c.u){ toast(t('noMoney')); return; }
    if(c.t || c.door){ toast(t('occupied')); return; }
    c.t = placeMode.type; c.stock = [];
    state.ds.place++;
    scheduleSave();
    toast(t('placed') + ': ' + fname(placeMode.type), '#7fd07f');
    placeMode = null; updatePlaceBar(); updateHUD();
    return;
  }
  if(placeMode && placeMode.kind === 'stock'){
    if(!c.u || !c.t || c.t === 'counter'){ return; }
    if(!canAccept(c, placeMode.pid)){
      toast(catName(PROD_BY_ID[placeMode.pid].cat) + ' \u2260 ' + fname(c.t));
      return;
    }
    const avail = state.warehouse[placeMode.pid] || 0;
    if(avail <= 0){ toast(t('nothing')); return; }
    const added = addToShelf(c, placeMode.pid, avail);
        if(added > 0){
      state.warehouse[placeMode.pid] -= added;
      if(state.warehouse[placeMode.pid] <= 0) delete state.warehouse[placeMode.pid];
      state.ds.stock += added;
      scheduleSave(); updateHUD();
      checkTutorialStock();   // ← теперь через общую функцию
    } else { toast(t('shelfFull')); return; }
    if(!state.warehouse[placeMode.pid]){ placeMode = null; updatePlaceBar(); }
    return;
  }
  if(!c.u){
    if(!isAdjacentToUnlocked(gx, gy)){ toast(t('tooFar')); return; }
    const maxCells = maxCellsForLevel(getLevel());
    if(unlockedCount() >= maxCells){ toast(t('maxCells'), '#e0575b'); return; }
    const price = expandPrice();
    if(state.money < price){ toast(t('noMoney')); return; }
    state.money -= price; c.u = true;
    state.ds.expand++;
    scheduleSave(); updateHUD();
    toast(t('cellAdded'), '#7fd07f');
    return;
  }
  if(c.t && c.t !== 'counter'){ openShelfInfo(gx, gy); }
}

/* === Pointer events с поддержкой пинч-зума === */
canvas.addEventListener('pointerdown', e => {
  if($('#modalRoot').style.display === 'block') return;
  activePointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if(activePointers.size === 2){
    // Начинаем пинч
    dragging = false;
    dragMoved = false;
    canvas.classList.remove('dragging');
    const pts = [...activePointers.values()];
    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchStartZoom = zoom;
  } else if(activePointers.size === 1){
    // Обычное перетаскивание
    dragging = true;
    dragMoved = false;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragBaseCamX = camX; dragBaseCamY = camY;
    canvas.classList.add('dragging');
  }
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
});

canvas.addEventListener('pointermove', e => {
  if(activePointers.has(e.pointerId)){
    activePointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  }
  // Пинч-зум
  if(activePointers.size === 2){
    const pts = [...activePointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if(pinchStartDist > 0){
      const newZoom = pinchStartZoom * (d / pinchStartDist);
      setZoom(newZoom);
    }
    return;
  }
  // Панорамирование
  if(!dragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if(!dragMoved && Math.hypot(dx, dy) > 8) dragMoved = true;
  if(dragMoved){
    camX = dragBaseCamX + dx;
    camY = dragBaseCamY + dy;
    clampCamera();
  }
});

function pointerUpHandler(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size < 2) pinchStartDist = 0;

  if(activePointers.size === 0){
    if(dragging){
      const wasMoved = dragMoved;
      dragging = false; dragMoved = false;
      canvas.classList.remove('dragging');
      try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
      if(!wasMoved){
        const wld = screenToWorld(e.clientX, e.clientY);
        if(truck.hitTest(wld.x, wld.y)){ openTruckModal(); return; }
        const cell = screenToCell(e.clientX, e.clientY);
        if(cell) onCellClick(cell.x, cell.y);
      }
    }
  }
}
canvas.addEventListener('pointerup', pointerUpHandler);
canvas.addEventListener('pointercancel', e => {
  activePointers.delete(e.pointerId);
  if(activePointers.size < 2) pinchStartDist = 0;
  if(activePointers.size === 0){
    dragging = false; dragMoved = false;
    canvas.classList.remove('dragging');
  }
});
canvas.addEventListener('dblclick', () => { camX = 0; camY = 0; clampCamera(); });

/* Зум колесом мыши (в т.ч. Ctrl+wheel на тачпадах) */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  setZoom(zoom * k);
}, {passive: false});

/* Кнопки зума */
$('#zoomIn').onclick = () => setZoom(zoom * 1.25);
$('#zoomOut').onclick = () => setZoom(zoom / 1.25);

function autoStock(){
  const shelves = shelfCells();
  let moved = 0;
  const ids = Object.keys(state.warehouse).map(Number).sort((a, b) => PROD_BY_ID[b].cost - PROD_BY_ID[a].cost);
  for(const pid of ids){
    if(!state.warehouse[pid]) continue;
    for(const s of shelves){
      if(!state.warehouse[pid]) break;
      if(!canAccept(s.c, pid)) continue;
      const added = addToShelf(s.c, pid, state.warehouse[pid]);
      if(added > 0){
        state.warehouse[pid] -= added;
        moved += added;
        if(state.warehouse[pid] <= 0){ delete state.warehouse[pid]; }
      }
    }
  }
    if(moved > 0){
    state.ds.stock += moved;
    toast(t('stocked') + ': ' + moved, '#7fd07f');
    updateHUD(); scheduleSave();
    checkTutorialStock();   // ← добавлено: обучение тоже продвинется
  } else toast(t('noSlots'));
}

let paused = false;
let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if(dt > 0.1) dt = 0.1;
  if(dt < 0) dt = 0;
  if(!paused && state){
    updateWorld(dt);
    state.playtime += dt;
    checkTimeRewards();
    if(!window._saveAcc) window._saveAcc = 0;
    window._saveAcc += dt;
    if(window._saveAcc > 20){ window._saveAcc = 0; scheduleSave(); }
    if(state.tasksDate !== todayStr()){ checkDailyReset(); updateHUD(); }
  }
  if(state) draw();
}

}

window.addEventListener('resize', () => { if(state) resize(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if(state) resize(); }, 250));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => { if(state) resize(); });
}
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive: false});

/* ------------------------------- 17. ПОЛИФИЛЛ ----------------------------- */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    if(typeof r === 'number') r = [r, r, r, r];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
    return this;
  };
}
